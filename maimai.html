<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Maimai DX Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000; color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            touch-action: none; user-select: none;
        }
        #bgVideo {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; object-fit: cover;
            z-index: -2; display: none; opacity: 0.5;
        }
        #ui {
            position: absolute; z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px; border-radius: 15px;
            border: 2px solid #0ff; text-align: center;
            box-shadow: 0 0 20px #0ff;
        }
        #gameCanvas {
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
            display: none;
        }
        button, input[type="file"] {
            padding: 12px; font-size: 16px; margin: 10px;
            border-radius: 8px; border: none; cursor: pointer;
        }
        button { background: #0ff; color: #000; font-weight: bold; }
        button:disabled { background: #555; color: #888; }
        .setting { margin: 15px 0; }
        input[type="range"] { width: 80%; }
    </style>
</head>
<body>

    <video id="bgVideo" autoplay loop muted></video>

    <div id="ui">
        <h2>maimai Simulator</h2>
        <input type="file" id="adxUpload" accept=".adx,.zip" />
        
        <div class="setting">
            <label>Note Speed: <span id="speedVal">1.5</span></label><br>
            <input type="range" id="speedSlider" min="0.5" max="3.5" step="0.1" value="1.5">
            <p style="font-size: 12px; color: #aaa;">(Higher = Faster Approach)</p>
        </div>

        <button id="startBtn" disabled>Upload .adx to Start</button>
        <p id="statusText" style="color: #0ff;">Waiting for file...</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Responsive Scaling variables
        let CENTER = { x: 0, y: 0 };
        let RING_RADIUS = 0;
        let BUTTON_RADIUS = 0;
        let buttons = [];

        let notes = [];
        let activeNotes = [];
        let judgements = []; // Stores hit text (Perfect, Miss, etc.)
        let audio = new Audio();
        let isPlaying = false;
        
        // Speed & Timing
        let APPROACH_TIME = 1.5; 
        const speedSlider = document.getElementById('speedSlider');
        speedSlider.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            document.getElementById('speedVal').innerText = val.toFixed(1);
            APPROACH_TIME = 4.0 - val; // Invert so higher slider value = shorter time on screen
        });

        // --- RESIZE CANVAS TO FIT ANY SCREEN ---
        function resizeCanvas() {
            let size = Math.min(window.innerWidth, window.innerHeight) * 0.95;
            canvas.width = size;
            canvas.height = size;
            CENTER = { x: size / 2, y: size / 2 };
            RING_RADIUS = size * 0.38;
            BUTTON_RADIUS = size * 0.07;

            buttons = [];
            // 8 outer buttons
            for (let i = 0; i < 8; i++) {
                let angle = (i * 45 + 22.5) * (Math.PI / 180);
                buttons.push({
                    x: CENTER.x + Math.cos(angle) * RING_RADIUS,
                    y: CENTER.y + Math.sin(angle) * RING_RADIUS,
                    angle: angle, active: false, type: 'ring'
                });
            }
            // Center Touch button (Index 8 or 'C')
            buttons.push({
                x: CENTER.x, y: CENTER.y, angle: 0, active: false, type: 'center'
            });
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- 1. UNZIP & PARSE ---
        document.getElementById('adxUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('statusText').innerText = "Unzipping chart...";
            JSZip.loadAsync(file).then(async function(zip) {
                // Audio
                let audioFile = zip.file(/track\.(mp3|ogg|wav)/i)[0];
                if (audioFile) {
                    let blob = await audioFile.async("blob");
                    audio.src = URL.createObjectURL(blob);
                }

                // Background
                let pvFile = zip.file(/pv\.mp4/i)[0];
                let bgFile = zip.file(/bg\.(jpg|png)/i)[0];
                if (pvFile) {
                    let blob = await pvFile.async("blob");
                    document.getElementById('bgVideo').src = URL.createObjectURL(blob);
                    document.getElementById('bgVideo').style.display = 'block';
                } else if (bgFile) {
                    let blob = await bgFile.async("blob");
                    document.body.style.backgroundImage = `url(${URL.createObjectURL(blob)})`;
                    document.body.style.backgroundSize = "cover";
                    document.body.style.backgroundPosition = "center";
                }

                // Chart Data
                let maidataFile = zip.file(/maidata\.txt/i)[0];
                if (maidataFile) {
                    let text = await maidataFile.async("string");
                    notes = parseMaidata(text);
                    document.getElementById('statusText').innerText = `Chart Ready! (${notes.length} notes)`;
                    document.getElementById('startBtn').disabled = false;
                    document.getElementById('startBtn').innerText = "START GAME";
                }
            }).catch(err => {
                document.getElementById('statusText').innerText = "Error loading file!";
                console.error(err);
            });
        });

        // --- 2. ADVANCED SIMAI PARSER (Fixes Sync Bug) ---
        function parseDuration(str, bpm) {
            // Converts simai [8:1] notation into seconds
            let parts = str.replace(/[\[\]]/g, '').split(':');
            if (parts.length === 2) {
                let div = parseFloat(parts[0]);
                let ticks = parseFloat(parts[1]);
                return (240 / bpm) / div * ticks;
            }
            return 0;
        }

        function parseMaidata(text) {
            let parsedNotes = [];
            // Get hardest difficulty (usually 6, 5, or 4)
            let chartMatch = text.match(/&inote_6=([^&]+)/) || text.match(/&inote_5=([^&]+)/) || text.match(/&inote_4=([^&]+)/);
            if (!chartMatch) return [];

            // Get audio offset (vital for sync)
            let firstMatch = text.match(/&first=([\d\.\-]+)/);
            let currentTime = firstMatch ? parseFloat(firstMatch[1]) : 0.0;

            let chartStr = chartMatch[1].replace(/\s+/g, ''); // Remove all spaces/newlines
            let blocks = chartStr.split(',');

            let currentBPM = 120;
            let currentDivisor = 4;

            for (let block of blocks) {
                if (!block) {
                    currentTime += (240 / currentBPM) / currentDivisor;
                    continue;
                }

                // Extract BPM changes
                let bpmMatch = block.match(/\(([\d\.]+)\)/);
                if (bpmMatch) {
                    currentBPM = parseFloat(bpmMatch[1]);
                    block = block.replace(/\([\d\.]+\)/, '');
                }

                // Extract Divisor changes (e.g., {8})
                let divMatch = block.match(/\{([\d\.]+)\}/);
                if (divMatch) {
                    currentDivisor = parseFloat(divMatch[1]);
                    block = block.replace(/\{[\d\.]+\}/, '');
                }

                // Split chords on '/'
                let elements = block.split('/');
                for (let el of elements) {
                    if (!el) continue;

                    // Touch Note (C)
                    if (el.includes('C')) {
                        parsedNotes.push({ type: 'touch', time: currentTime, pos: 8 }); 
                        continue;
                    }

                    // Slide Note (e.g. 1-4)
                    let slideMatch = el.match(/^([1-8])[a-zA-Z\-\^\<\>]+([1-8])/);
                    if (slideMatch) {
                        parsedNotes.push({ type: 'slide', time: currentTime, pos: parseInt(slideMatch[1]) - 1 });
                        continue;
                    }

                    // Hold Note (e.g. 1h[4:1])
                    let holdMatch = el.match(/^([1-8])h\[(.*?)\]/);
                    if (holdMatch) {
                        let duration = parseDuration(holdMatch[2], currentBPM);
                        parsedNotes.push({ type: 'hold', time: currentTime, pos: parseInt(holdMatch[1]) - 1, duration: duration });
                        continue;
                    }

                    // Tap Note (Just a number)
                    let tapMatch = el.match(/^([1-8])/);
                    if (tapMatch) {
                        parsedNotes.push({ type: 'tap', time: currentTime, pos: parseInt(tapMatch[1]) - 1 });
                    }
                }
                // Advance rhythm by one tick
                currentTime += (240 / currentBPM) / currentDivisor;
            }
            return parsedNotes;
        }

        // --- 3. GAME ENGINE & DRAWING ---
        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('ui').style.display = 'none';
            canvas.style.display = 'block';
            activeNotes = JSON.parse(JSON.stringify(notes));
            
            if (document.getElementById('bgVideo').src) {
                document.getElementById('bgVideo').currentTime = 0;
            }
            audio.play();
            isPlaying = true;
            requestAnimationFrame(gameLoop);
        });

        function gameLoop() {
            if (!isPlaying) return;
            let elapsedTime = audio.currentTime;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawUI();
            updateAndDrawNotes(elapsedTime);
            drawJudgements(elapsedTime);
            
            requestAnimationFrame(gameLoop);
        }

        function drawUI() {
            // Main ring
            ctx.beginPath();
            ctx.arc(CENTER.x, CENTER.y, RING_RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Render hit buttons
            buttons.forEach((btn, index) => {
                if (btn.type === 'ring') {
                    ctx.beginPath();
                    ctx.arc(btn.x, btn.y, BUTTON_RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = btn.active ? '#0ff' : 'rgba(0, 0, 0, 0.5)';
                    ctx.fill();
                    ctx.strokeStyle = '#0ff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (btn.type === 'center') {
                    // Center touch zone
                    ctx.fillStyle = btn.active ? 'rgba(0, 255, 255, 0.4)' : 'rgba(0,0,0,0)';
                    ctx.fillRect(btn.x - BUTTON_RADIUS, btn.y - BUTTON_RADIUS, BUTTON_RADIUS*2, BUTTON_RADIUS*2);
                }
            });
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius, rotation) {
            let rot = Math.PI / 2 * 3;
            let x = cx, y = cy;
            let step = Math.PI / spikes;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot + rotation) * outerRadius;
                y = cy + Math.sin(rot + rotation) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;
                x = cx + Math.cos(rot + rotation) * innerRadius;
                y = cy + Math.sin(rot + rotation) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        function updateAndDrawNotes(elapsedTime) {
            for (let i = activeNotes.length - 1; i >= 0; i--) {
                let note = activeNotes[i];
                let timeUntilHit = note.time - elapsedTime;
                let target = buttons[note.pos];

                // Remove completely missed notes
                if (timeUntilHit < -0.16) {
                    spawnJudgement("Miss", "#888", target.angle);
                    activeNotes.splice(i, 1);
                    continue;
                }

                if (timeUntilHit <= APPROACH_TIME) {
                    let progress = 1 - (timeUntilHit / APPROACH_TIME);
                    let cx, cy;

                    if (note.type === 'touch') {
                        // Touch spawns in center
                        cx = CENTER.x; cy = CENTER.y;
                        ctx.fillStyle = `rgba(0, 150, 255, ${progress})`;
                        ctx.fillRect(cx - BUTTON_RADIUS, cy - BUTTON_RADIUS, BUTTON_RADIUS*2, BUTTON_RADIUS*2);
                    
                    } else {
                        // Normal ring approach
                        cx = CENTER.x + Math.cos(target.angle) * (RING_RADIUS * progress);
                        cy = CENTER.y + Math.sin(target.angle) * (RING_RADIUS * progress);

                        if (note.type === 'slide') {
                            // Slide: Rotating Blue Star
                            ctx.fillStyle = '#00aaff';
                            ctx.strokeStyle = '#fff';
                            ctx.lineWidth = 2;
                            drawStar(cx, cy, 5, BUTTON_RADIUS * 0.8, BUTTON_RADIUS * 0.4, elapsedTime * 4);
                        
                        } else if (note.type === 'hold') {
                            // Hold: Long trailing bar behind the note
                            let tailTimeUntil = (note.time + note.duration) - elapsedTime;
                            let tailProgress = Math.max(0, 1 - (tailTimeUntil / APPROACH_TIME));
                            let tX = CENTER.x + Math.cos(target.angle) * (RING_RADIUS * tailProgress);
                            let tY = CENTER.y + Math.sin(target.angle) * (RING_RADIUS * tailProgress);
                            
                            ctx.beginPath();
                            ctx.moveTo(cx, cy);
                            ctx.lineTo(tX, tY);
                            ctx.strokeStyle = 'rgba(255, 0, 255, 0.6)';
                            ctx.lineWidth = BUTTON_RADIUS;
                            ctx.stroke();

                            // Note Head
                            ctx.beginPath();
                            ctx.arc(cx, cy, BUTTON_RADIUS * 0.7, 0, Math.PI * 2);
                            ctx.fillStyle = '#ff00ff'; ctx.fill();
                        
                        } else {
                            // Tap: Pink Circle
                            ctx.beginPath();
                            ctx.arc(cx, cy, BUTTON_RADIUS * 0.7, 0, Math.PI * 2);
                            ctx.fillStyle = '#ff00ff'; ctx.fill();
                            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
                        }
                    }
                }
            }
        }

        // --- 4. HIT DETECTION & JUDGEMENT ---
        function spawnJudgement(text, color, angle) {
            let jX = CENTER.x + Math.cos(angle) * (RING_RADIUS * 0.65);
            let jY = CENTER.y + Math.sin(angle) * (RING_RADIUS * 0.65);
            if (angle === 0) { jX = CENTER.x; jY = CENTER.y - BUTTON_RADIUS * 2; } // For Center touch
            
            judgements.push({
                text: text, color: color, x: jX, y: jY, 
                spawnTime: audio.currentTime
            });
        }

        function drawJudgements(elapsedTime) {
            for (let i = judgements.length - 1; i >= 0; i--) {
                let j = judgements[i];
                let age = elapsedTime - j.spawnTime;
                
                if (age > 0.5) { // Fade out after 0.5 seconds
                    judgements.splice(i, 1);
                    continue;
                }

                ctx.fillStyle = j.color;
                ctx.font = `bold ${BUTTON_RADIUS * 0.8}px Arial`;
                ctx.textAlign = 'center';
                ctx.globalAlpha = 1 - (age / 0.5); // Fade effect
                // Float upwards slightly
                ctx.fillText(j.text, j.x, j.y - (age * 30)); 
                ctx.globalAlpha = 1.0;
            }
        }

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            let rect = canvas.getBoundingClientRect();
            
            for(let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                let tx = touch.clientX - rect.left;
                let ty = touch.clientY - rect.top;

                buttons.forEach((btn, index) => {
                    let dist = Math.hypot(tx - btn.x, ty - btn.y);
                    if (dist < BUTTON_RADIUS * 2.5) { // Hitbox size
                        btn.active = true;
                        checkHit(index);
                        setTimeout(() => btn.active = false, 100);
                    }
                });
            }
        }, {passive: false});

        function checkHit(posIndex) {
            let elapsedTime = audio.currentTime;
            for (let i = 0; i < activeNotes.length; i++) {
                let note = activeNotes[i];
                if (note.pos === posIndex) {
                    let diff = Math.abs(note.time - elapsedTime);
                    
                    if (diff <= 0.16) {
                        let target = buttons[note.pos];
                        // Assign judgement windows
                        if (diff <= 0.03) spawnJudgement("CRITICAL", "#ffd700", target.angle); // Gold
                        else if (diff <= 0.06) spawnJudgement("PERFECT", "#ffeb3b", target.angle); // Yellow
                        else if (diff <= 0.10) spawnJudgement("GREAT", "#ff8c00", target.angle); // Orange
                        else if (diff <= 0.15) spawnJudgement("GOOD", "#00ff00", target.angle); // Green
                        else spawnJudgement("MISS", "#888", target.angle);
                        
                        activeNotes.splice(i, 1);
                        break; // Only consume one note per tap
                    }
                }
            }
        }
    </script>
</body>
</html>
