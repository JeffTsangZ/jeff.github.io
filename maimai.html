<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Maimai DX Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000; color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            touch-action: none; user-select: none;
        }
        #bgVideo {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; object-fit: cover;
            z-index: -2; display: none; opacity: 0.5;
        }
        #ui {
            position: absolute; z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px; border-radius: 15px;
            border: 2px solid #0ff; text-align: center;
            box-shadow: 0 0 20px #0ff;
            min-width: 300px;
        }
        #fullscreenBtn {
            position: absolute;
            top: 15px; right: 15px; z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            color: #fff; border: 1px solid #0ff;
            border-radius: 8px; padding: 10px 15px;
            cursor: pointer; font-weight: bold;
        }
        #fullscreenBtn:hover { background: rgba(0, 255, 255, 0.2); }
        
        #gameCanvas {
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
            display: none;
        }
        button:not(#fullscreenBtn), input[type="file"], select {
            padding: 12px; font-size: 16px; margin: 10px;
            border-radius: 8px; border: none; cursor: pointer;
            width: 90%; box-sizing: border-box;
        }
        select { background: #222; color: #fff; border: 1px solid #0ff; outline: none; }
        button:not(#fullscreenBtn) { background: #0ff; color: #000; font-weight: bold; }
        button:disabled { background: #555; color: #888; }
        .setting { margin: 15px 0; }
        input[type="range"] { width: 90%; }
        
        #difficultyContainer {
            display: none;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <video id="bgVideo" autoplay loop muted></video>
    <button id="fullscreenBtn">⛶ Fullscreen</button>

    <div id="ui">
        <h2>maimai DX Simulator</h2>
        <input type="file" id="adxUpload" accept=".adx,.zip" />
        
        <div id="difficultyContainer">
            <label style="font-weight: bold; color: #0ff;">Select Difficulty:</label>
            <select id="diffSelect"></select>
        </div>

        <div class="setting">
            <label>Note Speed: <span id="speedVal">5.0</span></label><br>
            <input type="range" id="speedSlider" min="1" max="10" step="0.1" value="5">
        </div>

        <button id="startBtn" disabled>Upload .adx to Start</button>
        <p id="statusText" style="color: #0ff;">Waiting for file...</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let CENTER = { x: 0, y: 0 };
        let RING_RADIUS = 0;
        let BUTTON_RADIUS = 0;
        let NODE_POSITIONS = {};

        let availableCharts = {};
        let globalAudioOffset = 0;
        let initialBPM = 120;

        let notes = [];
        let activeNotes = [];
        let judgements = [];
        let clickEffects = [];
        let audio = new Audio();
        let isPlaying = false;
        let combo = 0;

        let gameStartTime = 0;
        let preRollTime = 2.0;
        let lastBeatIndex = -1;
        let audioStarted = false;
        let audioCtx = null;

        let APPROACH_TIME = 1.0; 
        const speedSlider = document.getElementById('speedSlider');
        speedSlider.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            document.getElementById('speedVal').innerText = val.toFixed(1);
            APPROACH_TIME = 5.0 / val;
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        });

        function resizeCanvas() {
            let size = Math.min(window.innerWidth, window.innerHeight) * 0.95;
            canvas.width = size; canvas.height = size;
            CENTER = { x: size / 2, y: size / 2 };
            RING_RADIUS = size * 0.38; BUTTON_RADIUS = size * 0.07;

            NODE_POSITIONS = {};
            NODE_POSITIONS['C'] = { x: CENTER.x, y: CENTER.y, type: 'C', active: false };

            for (let i = 1; i <= 8; i++) {
                let aAngle = -90 + (i - 1) * 45 + 22.5; 
                let dAngle = -90 + (i - 1) * 45; 
                let aRad = aAngle * (Math.PI / 180);
                let dRad = dAngle * (Math.PI / 180);

                NODE_POSITIONS[`A${i}`] = { x: CENTER.x + Math.cos(aRad) * RING_RADIUS, y: CENTER.y + Math.sin(aRad) * RING_RADIUS, type: 'A', active: false };
                NODE_POSITIONS[`B${i}`] = { x: CENTER.x + Math.cos(aRad) * (RING_RADIUS * 0.5), y: CENTER.y + Math.sin(aRad) * (RING_RADIUS * 0.5), type: 'B', active: false };
                NODE_POSITIONS[`D${i}`] = { x: CENTER.x + Math.cos(dRad) * (RING_RADIUS * 0.85), y: CENTER.y + Math.sin(dRad) * (RING_RADIUS * 0.85), type: 'D', active: false };
                NODE_POSITIONS[`E${i}`] = { x: CENTER.x + Math.cos(dRad) * (RING_RADIUS * 0.4), y: CENTER.y + Math.sin(dRad) * (RING_RADIUS * 0.4), type: 'E', active: false };
            }
        }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        document.getElementById('adxUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('statusText').innerText = "Unzipping chart...";
            document.getElementById('difficultyContainer').style.display = 'none';
            document.getElementById('startBtn').disabled = true;

            JSZip.loadAsync(file).then(async function(zip) {
                let audioFile = zip.file(/track\.(mp3|ogg|wav)/i)[0];
                if (audioFile) {
                    let blob = await audioFile.async("blob");
                    audio.src = URL.createObjectURL(blob);
                }

                let pvFile = zip.file(/pv\.mp4/i)[0];
                let bgFile = zip.file(/bg\.(jpg|png)/i)[0];
                if (pvFile) {
                    let blob = await pvFile.async("blob");
                    document.getElementById('bgVideo').src = URL.createObjectURL(blob);
                    document.getElementById('bgVideo').style.display = 'block';
                } else if (bgFile) {
                    let blob = await bgFile.async("blob");
                    document.body.style.backgroundImage = `url(${URL.createObjectURL(blob)})`;
                    document.body.style.backgroundSize = "cover";
                    document.body.style.backgroundPosition = "center";
                }

                let maidataFile = zip.file(/maidata\.txt/i)[0];
                if (maidataFile) {
                    let text = await maidataFile.async("string");
                    extractAvailableCharts(text);
                    
                    if (Object.keys(availableCharts).length > 0) {
                        populateDifficultyUI();
                        document.getElementById('statusText').innerText = "File loaded! Ready to play.";
                        document.getElementById('startBtn').disabled = false;
                        document.getElementById('startBtn').innerText = "START GAME";
                        document.getElementById('difficultyContainer').style.display = 'block';
                    } else {
                        document.getElementById('statusText').innerText = "Error: No playable charts found in maidata.txt.";
                    }
                }
            }).catch(err => {
                document.getElementById('statusText').innerText = "Error loading file!";
                console.error(err);
            });
        });

        function extractAvailableCharts(text) {
            availableCharts = {};
            let firstMatch = text.match(/&first=([\d\.\-]+)/);
            globalAudioOffset = firstMatch ? parseFloat(firstMatch[1]) : 0.0;
            const diffNames = { 1: "Basic", 2: "Advanced", 3: "Expert", 4: "Master", 5: "Re:Master", 6: "Utage" };

            for (let i = 1; i <= 6; i++) {
                let regex = new RegExp(`&inote_${i}=([^&]+)`);
                let match = text.match(regex);
                if (match) { availableCharts[i] = { name: diffNames[i], data: match[1] }; }
            }
        }

        function populateDifficultyUI() {
            const select = document.getElementById('diffSelect');
            select.innerHTML = ''; let highestDiff = 1;
            for (let key in availableCharts) {
                let option = document.createElement('option');
                option.value = key; option.text = availableCharts[key].name;
                select.appendChild(option); highestDiff = key;
            }
            select.value = highestDiff; 
        }

        function parseDuration(str, bpm) {
            let parts = str.replace(/[\[\]]/g, '').split(':');
            if (parts.length === 2) return (240 / bpm) / parseFloat(parts[0]) * parseFloat(parts[1]);
            return 0;
        }

        function parseChartString(chartStr, offsetTime) {
            let parsedNotes = [];
            let currentTime = offsetTime;
            let cleanStr = chartStr.replace(/\s+/g, ''); 
            let blocks = cleanStr.split(',');
            let currentBPM = 120, currentDivisor = 4;

            let firstBpmMatch = chartStr.match(/\(([\d\.]+)\)/);
            if (firstBpmMatch) initialBPM = parseFloat(firstBpmMatch[1]);

            for (let block of blocks) {
                if (!block) { currentTime += (240 / currentBPM) / currentDivisor; continue; }
                let bpmMatch = block.match(/\(([\d\.]+)\)/);
                if (bpmMatch) { currentBPM = parseFloat(bpmMatch[1]); block = block.replace(/\([\d\.]+\)/, ''); }
                let divMatch = block.match(/\{([\d\.]+)\}/);
                if (divMatch) { currentDivisor = parseFloat(divMatch[1]); block = block.replace(/\{[\d\.]+\}/, ''); }

                let elements = block.split('/');
                for (let el of elements) {
                    if (!el) continue;

                    let touchHoldMatch = el.match(/^([A-E][1-8]?|C)h\[(.*?)\]/);
                    if (touchHoldMatch) {
                        parsedNotes.push({ type: 'hold_touch', time: currentTime, pos: touchHoldMatch[1], duration: parseDuration(touchHoldMatch[2], currentBPM), isChord: false, state: 'waiting' }); continue;
                    }

                    let holdMatch = el.match(/^([1-8])(b?)h\[(.*?)\]/);
                    if (holdMatch) {
                        parsedNotes.push({ type: 'hold', time: currentTime, pos: `A${holdMatch[1]}`, isBreak: !!holdMatch[2], duration: parseDuration(holdMatch[3], currentBPM), isChord: false, state: 'waiting' }); continue;
                    }

                    let slideHeadMatch = el.match(/^([1-8])/);
                    if (slideHeadMatch && (el.includes('-') || el.includes('^') || el.includes('<') || el.includes('>') || el.includes('v') || /[pqszw]/.test(el))) {
                        let headPos = `A${slideHeadMatch[1]}`;
                        let slidesStr = el.substring(1);
                        if (slidesStr.startsWith('*')) slidesStr = slidesStr.substring(1);

                        let slideParts = slidesStr.split('*');
                        for (let part of slideParts) {
                            if (!part) continue;
                            let durMatch = part.match(/\[(.*?)\]$/);
                            let durStr = durMatch ? durMatch[1] : null;
                            let pathStr = durMatch ? part.replace(/\[.*?\]$/, '') : part;
                            let dur = durStr ? parseDuration(durStr, currentBPM) : (240 / currentBPM) / 2;
                            
                            parsedNotes.push({ 
                                type: 'slide_head', time: currentTime, pos: headPos, pathStr: pathStr, duration: dur, state: 'waiting', isChord: false,
                                slideData: calculateSlidePoints(pathStr, headPos)
                            });
                        }
                        continue;
                    }

                    let touchMatch = el.match(/^([A-E][1-8]?|C)$/);
                    if (touchMatch) { parsedNotes.push({ type: 'touch', time: currentTime, pos: touchMatch[1], isChord: false, state: 'waiting' }); continue; }

                    // Tap / Break / Chords parsing
                    let tapMatch = el.match(/^([1-8b\*]+)$/);
                    if (tapMatch) {
                        let subElements = el.split(/(?=[1-8])/);
                        for (let sub of subElements) {
                            if (!sub) continue;
                            let tNum = sub.match(/[1-8]/);
                            if (tNum) {
                                let isBreak = sub.includes('b');
                                parsedNotes.push({ type: 'tap', time: currentTime, pos: `A${tNum[0]}`, isBreak: isBreak, isChord: false, state: 'waiting' });
                            }
                        }
                        continue;
                    }
                }
                currentTime += (240 / currentBPM) / currentDivisor;
            }

            let timeGroups = {};
            parsedNotes.forEach(note => {
                let t = note.time.toFixed(4); 
                if (!timeGroups[t]) timeGroups[t] = [];
                timeGroups[t].push(note);
            });
            for (let t in timeGroups) { if (timeGroups[t].length > 1) { timeGroups[t].forEach(note => note.isChord = true); } }
            return parsedNotes;
        }

        // Strict geometric slide path processor ensuring correct clock orientations (< and >)
        function calculateSlidePoints(pathStr, startPosKey) {
            let cleaned = pathStr.trim();
            let segments = [];
            let regex = /([a-zA-Z\-\^\<\>]+)([A-E][1-8]?|C|[1-8])/g;
            let match;

            while((match = regex.exec(cleaned)) !== null) {
                let shape = match[1];
                let endKey = match[2];
                if (/^[1-8]$/.test(endKey)) endKey = `A${endKey}`;
                segments.push({shape, endKey});
            }

            if (segments.length === 0) {
                let fallbackMatch = cleaned.match(/([A-E][1-8]?|C|[1-8])/);
                if (fallbackMatch) {
                    let k = fallbackMatch[1];
                    if (/^[1-8]$/.test(k)) k = `A${k}`;
                    segments.push({shape: '-', endKey: k});
                } else {
                    segments.push({shape: '-', endKey: startPosKey});
                }
            }

            let detailedPoints = [NODE_POSITIONS[startPosKey] || {x: CENTER.x, y: CENTER.y}];
            let currentStart = startPosKey;

            for (let seg of segments) {
                let sNode = NODE_POSITIONS[currentStart] || CENTER;
                let eNode = NODE_POSITIONS[seg.endKey] || CENTER;
                let shape = seg.shape;
                
                if (shape.includes('<') || shape.includes('>')) {
                    let idx1 = parseInt(currentStart.replace(/[^0-9]/g, '')) - 1;
                    let idx2 = parseInt(seg.endKey.replace(/[^0-9]/g, '')) - 1;
                    if (isNaN(idx1)) idx1 = 0; if (isNaN(idx2)) idx2 = 0;
                    
                    let angle1 = -90 + idx1 * 45 + 22.5;
                    let angle2 = -90 + idx2 * 45 + 22.5;
                    let diff = angle2 - angle1;
                    
                    while(diff > 180) diff -= 360;
                    while(diff <= -180) diff += 360;

                    if (shape.includes('<')) { // Counter-clockwise
                        if (diff > 0) diff -= 360;
                        else if (diff === 0) diff = -360;
                    } else if (shape.includes('>')) { // Clockwise
                        if (diff < 0) diff += 360;
                        else if (diff === 0) diff = 360;
                    }
                    
                    let steps = Math.max(12, Math.floor(Math.abs(diff) / 8));
                    for (let s = 1; s <= steps; s++) {
                        let a = (angle1 + diff * (s / steps)) * (Math.PI / 180);
                        detailedPoints.push({
                            x: CENTER.x + Math.cos(a) * RING_RADIUS,
                            y: CENTER.y + Math.sin(a) * RING_RADIUS
                        });
                    }
                } else if (shape.includes('^') || shape.includes('v')) {
                    let steps = 25;
                    for (let s = 1; s <= steps; s++) {
                        let t = s / steps;
                        let bx = CENTER.x, by = CENTER.y;
                        let x = (1 - t) * (1 - t) * sNode.x + 2 * (1 - t) * t * bx + t * t * eNode.x;
                        let y = (1 - t) * (1 - t) * sNode.y + 2 * (1 - t) * t * by + t * t * eNode.y;
                        detailedPoints.push({ x: x, y: y });
                    }
                } else {
                    let steps = 15;
                    for (let s = 1; s <= steps; s++) {
                        let t = s / steps;
                        detailedPoints.push({
                            x: sNode.x + (eNode.x - sNode.x) * t,
                            y: sNode.y + (eNode.y - sNode.y) * t
                        });
                    }
                }
                currentStart = seg.endKey;
            }

            let finalSegments = [], totalLen = 0;
            for(let i=0; i<detailedPoints.length-1; i++) {
                let len = Math.hypot(detailedPoints[i+1].x - detailedPoints[i].x, detailedPoints[i+1].y - detailedPoints[i].y);
                finalSegments.push(len); totalLen += len;
            }
            return { points: detailedPoints, segments: finalSegments, totalLength: totalLen };
        }

        function playClick(isHigh) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = isHigh ? 880 : 440;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            let selectedDiff = document.getElementById('diffSelect').value;
            notes = parseChartString(availableCharts[selectedDiff].data, globalAudioOffset);

            document.getElementById('ui').style.display = 'none';
            canvas.style.display = 'block';
            
            activeNotes = JSON.parse(JSON.stringify(notes));
            activeNotes.forEach(n => {
                if (n.pathStr) n.slideData = calculateSlidePoints(n.pathStr, n.pos);
            });

            combo = 0; 
            preRollTime = 240 / initialBPM; 
            gameStartTime = performance.now();
            lastBeatIndex = -1;
            audioStarted = false;

            if (document.getElementById('bgVideo').src) document.getElementById('bgVideo').currentTime = 0;
            isPlaying = true; 
            requestAnimationFrame(gameLoop);
        });

        function gameLoop() {
            if (!isPlaying) return;
            let now = performance.now();
            let elapsedTime = (now - gameStartTime) / 1000 - preRollTime;

            if (elapsedTime < 0) {
                let beatInterval = 60 / initialBPM;
                let timeIntoPreRoll = preRollTime + elapsedTime;
                let beatIndex = Math.floor(timeIntoPreRoll / beatInterval);
                if (beatIndex > lastBeatIndex && beatIndex < 4) {
                    lastBeatIndex = beatIndex;
                    playClick(beatIndex === 0);
                }
            } else {
                if (!audioStarted) {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log(e));
                    audioStarted = true;
                }
                elapsedTime = audio.currentTime;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawUI(); drawCombo(); 
            updateAndDrawNotes(elapsedTime);
            drawClickEffects(); drawJudgements(elapsedTime);
            requestAnimationFrame(gameLoop);
        }

        function drawUI() {
            ctx.beginPath(); ctx.arc(CENTER.x, CENTER.y, RING_RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = 3; ctx.stroke();

            ctx.font = `bold ${BUTTON_RADIUS * 0.45}px Arial`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            Object.keys(NODE_POSITIONS).forEach(key => {
                let node = NODE_POSITIONS[key];
                if (node.type === 'A' || node.type === 'B') {
                    ctx.beginPath(); ctx.arc(node.x, node.y, BUTTON_RADIUS * (node.type === 'B' ? 0.7 : 1), 0, Math.PI * 2);
                    ctx.fillStyle = node.active ? '#0ff' : 'rgba(0, 0, 0, 0.5)'; ctx.fill();
                    ctx.strokeStyle = '#0ff'; ctx.lineWidth = 1; ctx.stroke();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)'; ctx.fillText(key, node.x, node.y);
                }
            });
        }

        function drawCombo() {
            if (combo > 0) {
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = `bold ${BUTTON_RADIUS * 1.5}px Arial`; ctx.lineWidth = 6;
                ctx.strokeStyle = '#111'; ctx.strokeText(combo, CENTER.x, CENTER.y - BUTTON_RADIUS * 0.2);
                ctx.fillStyle = '#ffcc00'; ctx.fillText(combo, CENTER.x, CENTER.y - BUTTON_RADIUS * 0.2);
            }
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius, rotation) {
            let rot = Math.PI / 2 * 3, x = cx, y = cy, step = Math.PI / spikes;
            ctx.beginPath(); ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot + rotation) * outerRadius; y = cy + Math.sin(rot + rotation) * outerRadius; ctx.lineTo(x, y); rot += step;
                x = cx + Math.cos(rot + rotation) * innerRadius; y = cy + Math.sin(rot + rotation) * innerRadius; ctx.lineTo(x, y); rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius); ctx.closePath(); ctx.fill(); ctx.stroke();
        }

        function drawHexagonBar(tx, ty, cx, cy, color) {
            let dx = cx - tx, dy = cy - ty;
            let L = Math.hypot(dx, dy);
            let w = BUTTON_RADIUS * 0.65; 
            ctx.fillStyle = color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
            if (L <= w) { ctx.beginPath(); ctx.arc(cx, cy, w, 0, Math.PI*2); ctx.fill(); ctx.stroke(); return; }
            let nx = dx / L, ny = dy / L, px = -ny, py = nx, p = w * 0.5; 
            ctx.beginPath();
            ctx.moveTo(cx, cy); 
            ctx.lineTo(cx - nx * p + px * w, cy - ny * p + py * w); 
            ctx.lineTo(tx + nx * p + px * w, ty + ny * p + py * w); 
            ctx.lineTo(tx, ty); 
            ctx.lineTo(tx + nx * p - px * w, ty + ny * p - py * w); 
            ctx.lineTo(cx - nx * p - px * w, cy - ny * p - py * w); 
            ctx.closePath();
            ctx.fill(); ctx.stroke();
        }

        function spawnClickEffect(x, y, color = '#0ff') { clickEffects.push({ x: x, y: y, radius: BUTTON_RADIUS * 0.5, maxRadius: BUTTON_RADIUS * 1.8, alpha: 1.0, color: color }); }
        
        function drawClickEffects() {
            for (let i = clickEffects.length - 1; i >= 0; i--) {
                let eff = clickEffects[i]; eff.radius += 3; eff.alpha -= 0.06;
                if (eff.alpha <= 0) { clickEffects.splice(i, 1); continue; }
                ctx.save(); ctx.beginPath(); ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
                ctx.strokeStyle = eff.color; ctx.lineWidth = 3; ctx.globalAlpha = eff.alpha; ctx.stroke(); ctx.restore();
            }
        }

        function updateAndDrawNotes(elapsedTime) {
            for (let i = activeNotes.length - 1; i >= 0; i--) {
                let note = activeNotes[i];
                let target = NODE_POSITIONS[note.pos];
                if (!target && note.type !== 'slide_travel') continue;

                let timeUntilHit = note.time - elapsedTime;

                // Render approaching slide track lines before star movement triggers
                if (note.slideData && timeUntilHit <= APPROACH_TIME && note.type === 'slide_head') {
                    let pData = note.slideData;
                    ctx.beginPath(); ctx.moveTo(pData.points[0].x, pData.points[0].y);
                    for(let p=1; p<pData.points.length; p++) ctx.lineTo(pData.points[p].x, pData.points[p].y);
                    ctx.strokeStyle = note.isChord ? 'rgba(255, 255, 0, 0.45)' : 'rgba(0, 150, 255, 0.45)';
                    ctx.lineWidth = 20; ctx.stroke();
                }

                if (note.type === 'slide_head' && note.state === 'waiting' && elapsedTime > note.time + 0.16) {
                    spawnJudgement("MISS", "#888", target.x, target.y);
                    combo = 0;
                    note.type = 'slide_travel';
                    note.state = 'sliding';
                    
                    let pData = note.slideData;
                    // Initialize block array for block-by-block track interaction
                    note.blocks = [];
                    let stepDist = BUTTON_RADIUS * 0.8;
                    let accum = 0;
                    for (let s = 0; s < pData.segments.length; s++) {
                        let segLen = pData.segments[s];
                        let segP1 = pData.points[s];
                        let segP2 = pData.points[s+1];
                        let count = Math.max(1, Math.floor(segLen / stepDist));
                        for (let c = 0; c < count; c++) {
                            let ratio = c / count;
                            note.blocks.push({
                                x: segP1.x + (segP2.x - segP1.x) * ratio,
                                y: segP1.y + (segP2.y - segP1.y) * ratio,
                                cleared: false
                            });
                        }
                    }
                    let lastNode = pData.points[pData.points.length-1];
                    note.finalX = lastNode.x; note.finalY = lastNode.y;
                    note.time = elapsedTime;
                }

                // Block-by-block interactive slide traversal loop
                if (note.type === 'slide_travel' && note.state === 'sliding') {
                    let travelProgress = (elapsedTime - note.time) / note.duration;
                    let pData = note.slideData;

                    // Evaluate player finger collision against active track blocks
                    if (note.blocks) {
                        let remainingBlocks = 0;
                        note.blocks.forEach(block => {
                            if (!block.cleared) {
                                remainingBlocks++;
                                Object.keys(activeTouches).forEach(id => {
                                    let tx = activeTouches[id].x;
                                    let ty = activeTouches[id].y;
                                    if (Math.hypot(tx - block.x, ty - block.y) < BUTTON_RADIUS * 1.2) {
                                        block.cleared = true;
                                    }
                                });
                            }
                        });

                        // Draw remaining uncleared blocks as blue arrow blocks
                        note.blocks.forEach(block => {
                            if (!block.cleared) {
                                ctx.beginPath();
                                ctx.arc(block.x, block.y, BUTTON_RADIUS * 0.55, 0, Math.PI * 2);
                                ctx.fillStyle = 'rgba(0, 150, 255, 0.75)';
                                ctx.fill();
                                ctx.strokeStyle = '#ffffff';
                                ctx.lineWidth = 2;
                                ctx.stroke();
                            }
                        });

                        if (travelProgress >= 1.0 || remainingBlocks === 0) {
                            let clearedCount = note.blocks.filter(b => b.cleared).length;
                            let ratio = clearedCount / note.blocks.length;
                            if (ratio > 0.85) {
                                spawnJudgement("PERFECT", "#ffeb3b", note.finalX, note.finalY);
                                combo++;
                            } else if (ratio > 0.4) {
                                spawnJudgement("GREAT", "#ff8c00", note.finalX, note.finalY);
                                combo++;
                            } else {
                                spawnJudgement("MISS", "#888", note.finalX, note.finalY);
                                combo = 0;
                            }
                            activeNotes.splice(i, 1);
                            continue;
                        }
                    }

                    // Render animated tracer star
                    let currentDist = travelProgress * pData.totalLength;
                    let accum = 0, starX = pData.points[0].x, starY = pData.points[0].y;
                    for(let s = 0; s < pData.segments.length; s++) {
                        if (currentDist <= accum + pData.segments[s]) {
                            let localP = (currentDist - accum) / pData.segments[s];
                            starX = pData.points[s].x + (pData.points[s+1].x - pData.points[s].x) * localP;
                            starY = pData.points[s].y + (pData.points[s+1].y - pData.points[s].y) * localP;
                            break;
                        }
                        accum += pData.segments[s];
                    }

                    ctx.fillStyle = note.isChord ? '#ffff00' : '#00aaff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                    drawStar(starX, starY, 5, BUTTON_RADIUS * 0.7, BUTTON_RADIUS * 0.35, elapsedTime * 4);
                    continue;
                }

                let missWindow = 0.16;
                let isHolding = (note.state === 'holding');

                if (!isHolding && note.type !== 'slide_head' && timeUntilHit < -missWindow) {
                    spawnJudgement("MISS", "#888", target.x, target.y);
                    combo = 0; activeNotes.splice(i, 1); continue;
                }

                if (isHolding && elapsedTime >= note.time + note.duration) {
                    spawnJudgement("CRITICAL", "#ffd700", target.x, target.y);
                    combo++; activeNotes.splice(i, 1); continue;
                }

                if (timeUntilHit <= APPROACH_TIME || isHolding) {
                    let progress = isHolding ? 1.0 : Math.max(0, 1 - (timeUntilHit / APPROACH_TIME));
                    let cx = target ? CENTER.x + (target.x - CENTER.x) * progress : note.finalX;
                    let cy = target ? CENTER.y + (target.y - CENTER.y) * progress : note.finalY;
                    let cYellow = '#ffff00';

                    if (note.type === 'hold') {
                        let tailTimeUntil = (note.time + note.duration) - elapsedTime;
                        let tailProgress = Math.max(0, 1 - (tailTimeUntil / APPROACH_TIME));
                        let headP = Math.min(1, progress); let tailP = Math.min(1, tailProgress);
                        let headX = CENTER.x + (target.x - CENTER.x) * headP;
                        let headY = CENTER.y + (target.y - CENTER.y) * headP;
                        let tailX = CENTER.x + (target.x - CENTER.x) * tailP;
                        let tailY = CENTER.y + (target.y - CENTER.y) * tailP;
                        let holdColor = note.isBreak ? 'rgba(255, 215, 0, 0.9)' : (note.isChord ? 'rgba(255, 255, 0, 0.85)' : 'rgba(255, 0, 0, 0.85)');
                        drawHexagonBar(tailX, tailY, headX, headY, holdColor);
                        
                    } else if (note.type === 'slide_head' && note.state === 'waiting') {
                        ctx.fillStyle = note.isChord ? cYellow : '#00aaff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                        drawStar(cx, cy, 5, BUTTON_RADIUS * 0.8, BUTTON_RADIUS * 0.4, elapsedTime * 4);
                    
                    } else if (note.type === 'tap') {
                        ctx.beginPath(); ctx.arc(cx, cy, BUTTON_RADIUS * 0.7, 0, Math.PI * 2);
                        ctx.fillStyle = note.isBreak ? '#ff3300' : (note.isChord ? cYellow : '#ff00ff'); 
                        ctx.fill(); ctx.strokeStyle = note.isBreak ? '#ffd700' : '#fff'; ctx.lineWidth = 3; ctx.stroke();
                    }
                }
            }
        }

        function spawnJudgement(text, color, jX, jY) { judgements.push({ text: text, color: color, x: jX, y: jY - 25, spawnTime: audio.currentTime }); }
        
        function drawJudgements(elapsedTime) {
            for (let i = judgements.length - 1; i >= 0; i--) {
                let j = judgements[i]; let age = elapsedTime - j.spawnTime;
                if (age > 0.5) { judgements.splice(i, 1); continue; }
                ctx.fillStyle = j.color; ctx.font = `bold ${BUTTON_RADIUS * 0.8}px Arial`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 2; ctx.strokeStyle = '#000';
                ctx.globalAlpha = 1 - (age / 0.5); 
                let dropY = j.y - (age * 30);
                ctx.strokeText(j.text, j.x, dropY); ctx.fillText(j.text, j.x, dropY); 
                ctx.globalAlpha = 1.0;
            }
        }

        let touchState = {}; 
        let activeTouches = {};

        function handleTouches(e) {
            e.preventDefault(); 
            let rect = canvas.getBoundingClientRect();
            
            for(let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                let tx = touch.clientX - rect.left, ty = touch.clientY - rect.top;

                if (e.type === 'touchend' || e.type === 'touchcancel') {
                    let releasedNodes = touchState[touch.identifier] || new Set();
                    releasedNodes.forEach(nodeKey => checkHoldRelease(nodeKey));
                    delete activeTouches[touch.identifier];
                    delete touchState[touch.identifier]; 
                    continue;
                }

                activeTouches[touch.identifier] = { x: tx, y: ty };

                let currentlyTouched = new Set();
                Object.keys(NODE_POSITIONS).forEach(key => {
                    let node = NODE_POSITIONS[key];
                    if (Math.hypot(tx - node.x, ty - node.y) < BUTTON_RADIUS * 1.5) currentlyTouched.add(key);
                });

                let previouslyTouched = touchState[touch.identifier] || new Set();
                currentlyTouched.forEach(key => {
                    if (!previouslyTouched.has(key)) {
                        NODE_POSITIONS[key].active = true;
                        spawnClickEffect(NODE_POSITIONS[key].x, NODE_POSITIONS[key].y, '#0ff');
                        checkHit(key);
                        setTimeout(() => NODE_POSITIONS[key].active = false, 100);
                    }
                });
                touchState[touch.identifier] = currentlyTouched;
            }
        }

        canvas.addEventListener('touchstart', handleTouches, {passive: false});
        canvas.addEventListener('touchmove', handleTouches, {passive: false});
        canvas.addEventListener('touchend', handleTouches, {passive: false});
        canvas.addEventListener('touchcancel', handleTouches, {passive: false});

        function checkHit(posKey) {
            let elapsedTime = audio.currentTime;
            for (let i = 0; i < activeNotes.length; i++) {
                let note = activeNotes[i];
                if (note.pos === posKey) {
                    let diff = Math.abs(note.time - elapsedTime);
                    let hitWindow = 0.16;
                    let target = NODE_POSITIONS[note.pos];

                    if (diff <= hitWindow) {
                        if (note.type === 'hold') {
                            note.state = 'holding'; spawnJudgement(note.isBreak ? "CRITICAL" : "PERFECT", "#ffeb3b", target.x, target.y);
                            combo++; return; 
                        } else if (note.type === 'slide_head' && note.state === 'waiting') {
                            note.type = 'slide_travel'; note.state = 'sliding';
                            note.time = elapsedTime; 
                            
                            let pData = note.slideData;
                            note.blocks = [];
                            let stepDist = BUTTON_RADIUS * 0.8;
                            for (let s = 0; s < pData.segments.length; s++) {
                                let segLen = pData.segments[s];
                                let segP1 = pData.points[s];
                                let segP2 = pData.points[s+1];
                                let count = Math.max(1, Math.floor(segLen / stepDist));
                                for (let c = 0; c < count; c++) {
                                    let ratio = c / count;
                                    note.blocks.push({
                                        x: segP1.x + (segP2.x - segP1.x) * ratio,
                                        y: segP1.y + (segP2.y - segP1.y) * ratio,
                                        cleared: false
                                    });
                                }
                            }
                            let lastNode = pData.points[pData.points.length-1];
                            note.finalX = lastNode.x; note.finalY = lastNode.y;
                            
                            spawnJudgement("CRITICAL", "#ffd700", target.x, target.y); combo++; return;
                        } else if (note.type === 'tap') {
                            let label = note.isBreak ? "BREAK" : "CRITICAL";
                            spawnJudgement(label, "#ffd700", target.x, target.y); 
                            combo++; 
                            activeNotes.splice(i, 1); 
                            break;
                        }
                    }
                }
            }
        }

        function checkHoldRelease(posKey) {
            let elapsedTime = audio.currentTime;
            for (let i = activeNotes.length - 1; i >= 0; i--) {
                let note = activeNotes[i];
                if (note.type === 'hold' && note.pos === posKey && note.state === 'holding') {
                    let target = NODE_POSITIONS[note.pos];
                    if (elapsedTime < note.time + note.duration - 0.15) {
                        spawnJudgement("MISS", "#888", target.x, target.y); combo = 0;
                    } else {
                        spawnJudgement("PERFECT", "#ffeb3b", target.x, target.y); combo++;
                    }
                    activeNotes.splice(i, 1); break;
                }
            }
        }
    </script>
