<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Maimai DX Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000; color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            touch-action: none; user-select: none;
        }
        #bgVideo {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; object-fit: cover;
            z-index: -2; display: none; opacity: 0.5;
        }
        #ui {
            position: absolute; z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px; border-radius: 15px;
            border: 2px solid #0ff; text-align: center;
            box-shadow: 0 0 20px #0ff;
            min-width: 320px;
            max-height: 90vh; overflow-y: auto;
        }

        /* Top Right Toolbar */
        #topBar {
            position: absolute;
            top: 15px; right: 15px; z-index: 100;
            display: flex; gap: 10px;
        }
        #topBar button {
            background: rgba(0, 0, 0, 0.6);
            color: #fff; border: 1px solid #0ff;
            border-radius: 8px; padding: 10px 15px;
            cursor: pointer; font-weight: bold;
            width: auto; margin: 0;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
        }
        #topBar button:hover { background: rgba(0, 255, 255, 0.3); }

        /* Pause Modal Overlay */
        #pauseOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .pause-box {
            background: rgba(15, 15, 25, 0.95);
            border: 2px solid #0ff;
            box-shadow: 0 0 25px #0ff;
            padding: 35px 40px;
            border-radius: 15px;
            text-align: center;
            min-width: 280px;
        }
        .pause-box h2 {
            margin-top: 0; margin-bottom: 20px;
            color: #0ff; font-size: 28px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #0ff;
        }
        .pause-box button {
            margin: 10px 0;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }
        .pause-box button:active { transform: scale(0.98); }
        #resumeBtn { background: #00ffcc; color: #000; }
        #resetBtn { background: #ffaa00; color: #000; }
        #exitBtn { background: #ff3366; color: #fff; }
        
        #gameCanvas {
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
            display: none;
        }
        button:not(#topBar button):not(.pause-box button), input[type="file"], select {
            padding: 12px; font-size: 16px; margin: 10px 0;
            border-radius: 8px; border: none; cursor: pointer;
            width: 100%; box-sizing: border-box;
        }
        select { background: #222; color: #fff; border: 1px solid #0ff; outline: none; }
        button:not(#topBar button):not(.pause-box button) { background: #0ff; color: #000; font-weight: bold; }
        button:disabled { background: #555; color: #888; }
        .setting { margin: 15px 0; }
        input[type="range"] { width: 100%; }
        
        #difficultyContainer {
            display: none;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .controls-info {
            font-size: 12px; color: #aaa; text-align: left;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px; border-radius: 6px; margin-top: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <video id="bgVideo" autoplay loop muted></video>

    <div id="topBar">
        <button id="pauseBtn">⏸ Pause (x2)</button>
        <button id="fullscreenBtn">⛶ Fullscreen</button>
    </div>

    <!-- Pause Modal -->
    <div id="pauseOverlay">
        <div class="pause-box">
            <h2>GAME PAUSED</h2>
            <button id="resumeBtn">Resume</button>
            <button id="resetBtn">Reset</button>
            <button id="exitBtn">Exit (Song Selection)</button>
        </div>
    </div>

    <div id="ui">
        <h2>maimai DX Simulator</h2>
        <input type="file" id="adxUpload" accept=".adx,.zip" />
        
        <div id="difficultyContainer">
            <label style="font-weight: bold; color: #0ff;">Select Difficulty:</label>
            <select id="diffSelect"></select>
        </div>

        <div class="setting">
            <label>Note Speed: <span id="speedVal">5.0</span></label><br>
            <input type="range" id="speedSlider" min="1" max="10" step="0.1" value="5">
            <p style="font-size: 12px; color: #aaa;">(1 = Slow, 10 = Ultra Fast)</p>
        </div>

        <div class="controls-info">
            <strong style="color: #0ff;">Controls:</strong><br>
            • <strong>Touch / Mouse:</strong> Tap or drag across buttons<br>
            • <strong>Keyboard (1-8):</strong> Keys <code>1</code> to <code>8</code> or Ring Keys <code>E D C X Z A Q W</code><br>
            • <strong>Center (C):</strong> <code>Space</code> or <code>S</code><br>
            • <strong>Pause:</strong> Double Press <code>⏸ Pause</code> Button
        </div>

        <button id="startBtn" disabled>Upload .adx to Start</button>
        <p id="statusText" style="color: #0ff;">Waiting for file...</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let CENTER = { x: 0, y: 0 };
        let RING_RADIUS = 0;
        let BUTTON_RADIUS = 0;
        let NODE_POSITIONS = {};

        let availableCharts = {};
        let globalAudioOffset = 0;
        let initialBPM = 120;

        let notes = [];
        let activeNotes = [];
        let judgements = [];
        let clickEffects = [];
        let fireworks = [];
        let audio = new Audio();
        let isPlaying = false;
        let isPaused = false;
        let pauseStartTime = 0;
        let combo = 0;

        let gameStartTime = 0;
        let preRollTime = 2.0;
        let lastBeatIndex = -1;
        let audioStarted = false;
        let audioCtx = null;

        let APPROACH_TIME = 1.0; 
        const speedSlider = document.getElementById('speedSlider');
        speedSlider.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            document.getElementById('speedVal').innerText = val.toFixed(1);
            APPROACH_TIME = 5.0 / val;
        });

        // Top Bar Controls
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        });

        // Double Click Pause Logic
        let lastPauseClick = 0;
        document.getElementById('pauseBtn').addEventListener('click', (e) => {
            e.preventDefault();
            const now = performance.now();
            if (now - lastPauseClick < 400) {
                if (isPlaying && !isPaused) {
                    pauseGame();
                }
            }
            lastPauseClick = now;
        });

        // Pause Menu Actions
        document.getElementById('resumeBtn').addEventListener('click', resumeGame);
        document.getElementById('resetBtn').addEventListener('click', resetGame);
        document.getElementById('exitBtn').addEventListener('click', exitGame);

        function pauseGame() {
            if (!isPlaying || isPaused) return;
            isPaused = true;
            pauseStartTime = performance.now();
            
            if (audioStarted) audio.pause();
            let bgVid = document.getElementById('bgVideo');
            if (bgVid && bgVid.src) bgVid.pause();

            document.getElementById('pauseOverlay').style.display = 'flex';
        }

        function resumeGame() {
            if (!isPaused) return;
            let pauseDuration = (performance.now() - pauseStartTime);
            gameStartTime += pauseDuration;

            if (audioStarted) audio.play().catch(e => console.log(e));
            let bgVid = document.getElementById('bgVideo');
            if (bgVid && bgVid.src) bgVid.play().catch(e => console.log(e));

            document.getElementById('pauseOverlay').style.display = 'none';
            isPaused = false;
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            document.getElementById('pauseOverlay').style.display = 'none';
            isPaused = false;
            
            let selectedDiff = document.getElementById('diffSelect').value;
            activeNotes = JSON.parse(JSON.stringify(notes));
            activeNotes.forEach(n => {
                if (n.pathStr) n.slideData = calculateSlidePoints(n.pathStr, n.pos);
            });

            combo = 0;
            judgements = [];
            clickEffects = [];
            fireworks = [];
            preRollTime = 240 / initialBPM;
            gameStartTime = performance.now();
            lastBeatIndex = -1;
            audioStarted = false;

            audio.pause();
            audio.currentTime = 0;

            let bgVid = document.getElementById('bgVideo');
            if (bgVid && bgVid.src) {
                bgVid.currentTime = 0;
            }

            if (!isPlaying) {
                isPlaying = true;
            }
            requestAnimationFrame(gameLoop);
        }

        function exitGame() {
            isPaused = false;
            isPlaying = false;

            audio.pause();
            audio.currentTime = 0;

            let bgVid = document.getElementById('bgVideo');
            if (bgVid) bgVid.pause();

            document.getElementById('pauseOverlay').style.display = 'none';
            canvas.style.display = 'none';
            document.getElementById('ui').style.display = 'block';
        }

        function resizeCanvas() {
            let size = Math.min(window.innerWidth, window.innerHeight) * 0.95;
            canvas.width = size; canvas.height = size;
            CENTER = { x: size / 2, y: size / 2 };
            RING_RADIUS = size * 0.38; BUTTON_RADIUS = size * 0.07;

            NODE_POSITIONS = {};
            NODE_POSITIONS['C'] = { x: CENTER.x, y: CENTER.y, type: 'C', active: false };

            for (let i = 1; i <= 8; i++) {
                let aAngle = -90 + (i - 1) * 45 + 22.5; 
                let dAngle = -90 + (i - 1) * 45; 
                let aRad = aAngle * (Math.PI / 180);
                let dRad = dAngle * (Math.PI / 180);

                NODE_POSITIONS[`A${i}`] = { x: CENTER.x + Math.cos(aRad) * RING_RADIUS, y: CENTER.y + Math.sin(aRad) * RING_RADIUS, type: 'A', active: false };
                NODE_POSITIONS[`B${i}`] = { x: CENTER.x + Math.cos(aRad) * (RING_RADIUS * 0.5), y: CENTER.y + Math.sin(aRad) * (RING_RADIUS * 0.5), type: 'B', active: false };
                NODE_POSITIONS[`D${i}`] = { x: CENTER.x + Math.cos(dRad) * (RING_RADIUS * 0.85), y: CENTER.y + Math.sin(dRad) * (RING_RADIUS * 0.85), type: 'D', active: false };
                NODE_POSITIONS[`E${i}`] = { x: CENTER.x + Math.cos(dRad) * (RING_RADIUS * 0.4), y: CENTER.y + Math.sin(dRad) * (RING_RADIUS * 0.4), type: 'E', active: false };
            }
        }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        document.getElementById('adxUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('statusText').innerText = "Unzipping chart...";
            document.getElementById('difficultyContainer').style.display = 'none';
            document.getElementById('startBtn').disabled = true;

            JSZip.loadAsync(file).then(async function(zip) {
                let audioFile = zip.file(/track\.(mp3|ogg|wav)/i)[0];
                if (audioFile) {
                    let blob = await audioFile.async("blob");
                    audio.src = URL.createObjectURL(blob);
                }

                let pvFile = zip.file(/pv\.mp4/i)[0];
                let bgFile = zip.file(/bg\.(jpg|png)/i)[0];
                if (pvFile) {
                    let blob = await pvFile.async("blob");
                    document.getElementById('bgVideo').src = URL.createObjectURL(blob);
                    document.getElementById('bgVideo').style.display = 'block';
                } else if (bgFile) {
                    let blob = await bgFile.async("blob");
                    document.body.style.backgroundImage = `url(${URL.createObjectURL(blob)})`;
                    document.body.style.backgroundSize = "cover";
                    document.body.style.backgroundPosition = "center";
                }

                let maidataFile = zip.file(/maidata\.txt/i)[0];
                if (maidataFile) {
                    let text = await maidataFile.async("string");
                    extractAvailableCharts(text);
                    
                    if (Object.keys(availableCharts).length > 0) {
                        populateDifficultyUI();
                        document.getElementById('statusText').innerText = "File loaded! Ready to play.";
                        document.getElementById('startBtn').disabled = false;
                        document.getElementById('startBtn').innerText = "START GAME";
                        document.getElementById('difficultyContainer').style.display = 'block';
                    } else {
                        document.getElementById('statusText').innerText = "Error: No playable charts found in maidata.txt.";
                    }
                }
            }).catch(err => {
                document.getElementById('statusText').innerText = "Error loading file!";
                console.error(err);
            });
        });

        function extractAvailableCharts(text) {
            availableCharts = {};
            let firstMatch = text.match(/&first=([\d\.\-]+)/);
            globalAudioOffset = firstMatch ? parseFloat(firstMatch[1]) : 0.0;
            const diffNames = { 1: "Basic", 2: "Advanced", 3: "Expert", 4: "Master", 5: "Re:Master", 6: "Utage" };

            for (let i = 1; i <= 6; i++) {
                let regex = new RegExp(`&inote_${i}=([^&]+)`);
                let match = text.match(regex);
                if (match) { availableCharts[i] = { name: diffNames[i], data: match[1] }; }
            }
        }

        function populateDifficultyUI() {
            const select = document.getElementById('diffSelect');
            select.innerHTML = ''; let highestDiff = 1;
            for (let key in availableCharts) {
                let option = document.createElement('option');
                option.value = key; option.text = availableCharts[key].name;
                select.appendChild(option); highestDiff = key;
            }
            select.value = highestDiff; 
        }

        function parseDuration(str, bpm) {
            let parts = str.replace(/[\[\]]/g, '').split(':');
            if (parts.length === 2) return (240 / bpm) / parseFloat(parts[0]) * parseFloat(parts[1]);
            return 0;
        }

        function parseChartString(chartStr, offsetTime) {
            let parsedNotes = [];
            let currentTime = offsetTime;
            let cleanStr = chartStr.replace(/\s+/g, ''); 
            let blocks = cleanStr.split(',');
            let currentBPM = 120, currentDivisor = 4;

            let firstBpmMatch = chartStr.match(/\(([\d\.]+)\)/);
            if (firstBpmMatch) initialBPM = parseFloat(firstBpmMatch[1]);

            for (let block of blocks) {
                if (!block) { currentTime += (240 / currentBPM) / currentDivisor; continue; }
                let bpmMatch = block.match(/\(([\d\.]+)\)/);
                if (bpmMatch) { currentBPM = parseFloat(bpmMatch[1]); block = block.replace(/\([\d\.]+\)/, ''); }
                let divMatch = block.match(/\{([\d\.]+)\}/);
                if (divMatch) { currentDivisor = parseFloat(divMatch[1]); block = block.replace(/\{[\d\.]+\}/, ''); }

                let elements = block.split('/');
                for (let el of elements) {
                    if (!el) continue;

                    let isBonus = el.includes('x');
                    let isFirework = el.includes('f');

                    // Touch Hold Note
                    let touchHoldMatch = el.match(/^([A-E][1-8]?|C)h\[(.*?)\]/);
                    if (touchHoldMatch) {
                        parsedNotes.push({ 
                            type: 'hold_touch', time: currentTime, pos: touchHoldMatch[1], 
                            duration: parseDuration(touchHoldMatch[2], currentBPM), 
                            isChord: false, isBonus: isBonus, isFirework: isFirework, state: 'waiting' 
                        }); continue;
                    }

                    // Standard Hold Note
                    let holdMatch = el.match(/^([1-8])h\[(.*?)\]/);
                    if (holdMatch) {
                        parsedNotes.push({ 
                            type: 'hold', time: currentTime, pos: `A${holdMatch[1]}`, 
                            duration: parseDuration(holdMatch[2], currentBPM), 
                            isChord: false, isBonus: isBonus, isFirework: isFirework, state: 'waiting' 
                        }); continue;
                    }

                    // Slide Head / Track Note
                    let slideHeadMatch = el.match(/^([1-8])/);
                    if (slideHeadMatch && (el.includes('-') || el.includes('^') || el.includes('<') || el.includes('>') || el.includes('v') || /[pqszw]/.test(el))) {
                        let headPos = `A${slideHeadMatch[1]}`;
                        let slidesStr = el.substring(1);
                        if (slidesStr.startsWith('*')) slidesStr = slidesStr.substring(1);

                        let slideParts = slidesStr.split('*');
                        
                        for (let part of slideParts) {
                            if (!part) continue;
                            let durMatch = part.match(/\[(.*?)\]$/);
                            let durStr = durMatch ? durMatch[1] : null;
                            let pathStr = durMatch ? part.replace(/\[.*?\]$/, '') : part;
                            let dur = durStr ? parseDuration(durStr, currentBPM) : (240 / currentBPM) / 2;
                            
                            parsedNotes.push({ 
                                type: 'slide_head', time: currentTime, pos: headPos, pathStr: pathStr, 
                                duration: dur, state: 'waiting', isChord: false, isBonus: isBonus, isFirework: isFirework,
                                slideData: calculateSlidePoints(pathStr, headPos)
                            });
                        }
                        continue;
                    }

                    // Touch Note (Letter First, e.g. E2f, Cf)
                    let touchMatch = el.match(/^([A-E][1-8]?|C)([bxf]*)$/i);
                    if (touchMatch) {
                        let mods = touchMatch[2] || '';
                        parsedNotes.push({ 
                            type: 'touch', time: currentTime, pos: touchMatch[1], 
                            isChord: false, isBonus: mods.includes('x'), isFirework: mods.includes('f'), state: 'waiting' 
                        }); continue;
                    }

                    // Tap Note (Number First, e.g. 3x, 8x, 2bx, 1bx, 21)
                    let tapMatches = [...el.matchAll(/([1-8])([bxf]*)/gi)];
                    if (tapMatches.length > 0) {
                        for (let m of tapMatches) {
                            let posNum = m[1];
                            let mods = m[2] || '';
                            parsedNotes.push({ 
                                type: 'tap', time: currentTime, pos: `A${posNum}`, 
                                isChord: false, isBonus: mods.includes('x'), isFirework: mods.includes('f'), state: 'waiting' 
                            });
                        }
                        continue;
                    }
                }
                currentTime += (240 / currentBPM) / currentDivisor;
            }

            let timeGroups = {};
            parsedNotes.forEach(note => {
                let t = note.time.toFixed(4); 
                if (!timeGroups[t]) timeGroups[t] = [];
                timeGroups[t].push(note);
            });
            for (let t in timeGroups) { if (timeGroups[t].length > 1) { timeGroups[t].forEach(note => note.isChord = true); } }
            return parsedNotes;
        }

        function calculateSlidePoints(pathStr, startPosKey) {
            let cleaned = pathStr.trim();
            let segments = [];
            let regex = /([a-zA-Z\-\^\<\>]+)([A-E][1-8]?|C|[1-8])/g;
            let match;

            while((match = regex.exec(cleaned)) !== null) {
                let shape = match[1];
                let endKey = match[2];
                if (/^[1-8]$/.test(endKey)) endKey = `A${endKey}`;
                segments.push({shape, endKey});
            }

            if (segments.length === 0) {
                let fallbackMatch = cleaned.match(/([A-E][1-8]?|C|[1-8])/);
                if (fallbackMatch) {
                    let k = fallbackMatch[1];
                    if (/^[1-8]$/.test(k)) k = `A${k}`;
                    segments.push({shape: '-', endKey: k});
                } else {
                    segments.push({shape: '-', endKey: startPosKey});
                }
            }

            let detailedPoints = [NODE_POSITIONS[startPosKey] || {x: CENTER.x, y: CENTER.y}];
            let currentStart = startPosKey;

            for (let seg of segments) {
                let sNode = NODE_POSITIONS[currentStart] || CENTER;
                let eNode = NODE_POSITIONS[seg.endKey] || CENTER;
                let shape = seg.shape;
                
                let idx1 = parseInt(currentStart.replace(/[^0-9]/g, '')) - 1;
                let idx2 = parseInt(seg.endKey.replace(/[^0-9]/g, '')) - 1;
                if (isNaN(idx1)) idx1 = 0; if (isNaN(idx2)) idx2 = 0;

                if (shape.includes('<') || shape.includes('>') || shape.includes('^')) {
                    let angle1 = -90 + idx1 * 45 + 22.5;
                    let angle2 = -90 + idx2 * 45 + 22.5;
                    
                    let diff = angle2 - angle1;
                    while (diff <= -180) diff += 360;
                    while (diff > 180) diff -= 360; 
                    
                    let startNodeNum = parseInt(currentStart.replace(/[^0-9]/g, ''));
                    if (isNaN(startNodeNum)) startNodeNum = 1;
                    let isTopHalf = [7, 8, 1, 2].includes(startNodeNum);

                    if (shape.includes('>')) {
                        let isCW = isTopHalf ? true : false;
                        if (isCW) { while (diff <= 0) diff += 360; }
                        else { while (diff >= 0) diff -= 360; }
                    } else if (shape.includes('<')) {
                        let isCW = isTopHalf ? false : true;
                        if (isCW) { while (diff <= 0) diff += 360; }
                        else { while (diff >= 0) diff -= 360; }
                    }

                    let steps = Math.max(12, Math.floor(Math.abs(diff) / 10));
                    for (let s = 1; s <= steps; s++) {
                        let a = (angle1 + diff * (s / steps)) * (Math.PI / 180);
                        detailedPoints.push({
                            x: CENTER.x + Math.cos(a) * RING_RADIUS,
                            y: CENTER.y + Math.sin(a) * RING_RADIUS
                        });
                    }

                } else if (shape.includes('pp') || shape.includes('qq')) {
                    let isCW = shape.includes('qq');
                    let rLoop = RING_RADIUS * 0.5;

                    let A_in = Math.atan2(CENTER.y - sNode.y, CENTER.x - sNode.x);
                    let O_angle = isCW ? A_in + Math.PI/2 : A_in - Math.PI/2;
                    let O = { x: CENTER.x + Math.cos(O_angle) * rLoop, y: CENTER.y + Math.sin(O_angle) * rLoop };

                    for (let i = 1; i <= 10; i++) {
                        let t = i / 10;
                        detailedPoints.push({ x: sNode.x + (CENTER.x - sNode.x) * t, y: sNode.y + (CENTER.y - sNode.y) * t });
                    }

                    let arc_start = Math.atan2(CENTER.y - O.y, CENTER.x - O.x);
                    let phi = Math.atan2(eNode.y - O.y, eNode.x - O.x);
                    let D = Math.hypot(eNode.x - O.x, eNode.y - O.y);
                    
                    let arc_end = phi;
                    if (D >= rLoop) {
                        let theta = Math.acos(Math.max(-1, Math.min(1, rLoop / D)));
                        arc_end = isCW ? phi - theta : phi + theta;
                    }

                    let aDiff = arc_end - arc_start;
                    if (isCW) {
                        while (aDiff <= 0) aDiff += Math.PI * 2;
                        while (aDiff > Math.PI * 2) aDiff -= Math.PI * 2;
                    } else {
                        while (aDiff >= 0) aDiff -= Math.PI * 2;
                        while (aDiff < -Math.PI * 2) aDiff += Math.PI * 2;
                    }

                    let steps = Math.max(20, Math.floor(Math.abs(aDiff) * (180 / Math.PI) / 10));
                    for (let i = 1; i <= steps; i++) {
                        let ang = arc_start + aDiff * (i / steps);
                        detailedPoints.push({ x: O.x + Math.cos(ang) * rLoop, y: O.y + Math.sin(ang) * rLoop });
                    }

                    let T_end = detailedPoints[detailedPoints.length - 1];
                    for (let i = 1; i <= 10; i++) {
                        let t = i / 10;
                        detailedPoints.push({ x: T_end.x + (eNode.x - T_end.x) * t, y: T_end.y + (eNode.y - T_end.y) * t });
                    }

                } else if (shape.includes('p') || shape.includes('q')) {
                    let rInner = RING_RADIUS * 0.5;
                    let dx1 = sNode.x - CENTER.x, dy1 = sNode.y - CENTER.y;
                    let dx2 = eNode.x - CENTER.x, dy2 = eNode.y - CENTER.y;
                    let R1 = Math.hypot(dx1, dy1) || 1;
                    let R2 = Math.hypot(dx2, dy2) || 1;
                    
                    let As = Math.atan2(dy1, dx1);
                    let Ae = Math.atan2(dy2, dx2);

                    let r1_safe = Math.min(rInner, R1 * 0.99);
                    let r2_safe = Math.min(rInner, R2 * 0.99);

                    let alpha1 = Math.acos(r1_safe / R1);
                    let alpha2 = Math.acos(r2_safe / R2);

                    let isCW = shape.includes('q');
                    
                    let t1_angle = isCW ? As + alpha1 : As - alpha1;
                    let t2_angle = isCW ? Ae - alpha2 : Ae + alpha2;

                    let T1 = { x: CENTER.x + Math.cos(t1_angle) * r1_safe, y: CENTER.y + Math.sin(t1_angle) * r1_safe };
                    let T2 = { x: CENTER.x + Math.cos(t2_angle) * r2_safe, y: CENTER.y + Math.sin(t2_angle) * r2_safe };

                    for (let i = 1; i <= 10; i++) {
                        let t = i / 10;
                        detailedPoints.push({ x: sNode.x + (T1.x - sNode.x) * t, y: sNode.y + (T1.y - sNode.y) * t });
                    }
                    
                    let aDiff = t2_angle - t1_angle;
                    if (isCW) {
                        while (aDiff <= 0) aDiff += Math.PI * 2;
                        while (aDiff > Math.PI * 2) aDiff -= Math.PI * 2;
                    } else {
                        while (aDiff >= 0) aDiff -= Math.PI * 2;
                        while (aDiff < -Math.PI * 2) aDiff += Math.PI * 2;
                    }
                    
                    let steps = Math.max(10, Math.floor(Math.abs(aDiff) * (180 / Math.PI) / 10));
                    for (let i = 1; i <= steps; i++) {
                        let ang = t1_angle + aDiff * (i / steps);
                        detailedPoints.push({ x: CENTER.x + Math.cos(ang) * rInner, y: CENTER.y + Math.sin(ang) * rInner });
                    }

                    for (let i = 1; i <= 10; i++) {
                        let t = i / 10;
                        detailedPoints.push({ x: T2.x + (eNode.x - T2.x) * t, y: T2.y + (eNode.y - T2.y) * t });
                    }
                    
                } else if (shape.includes('s') || shape.includes('z')) {
                    let dx = eNode.x - sNode.x, dy = eNode.y - sNode.y;
                    let dist = Math.hypot(dx, dy) || 1;
                    let ux = dx / dist, uy = dy / dist;
                    let px = -uy, py = ux;

                    let offsetDist = RING_RADIUS * 0.35;
                    let side = shape.includes('s') ? 1 : -1;

                    let P1 = {
                        x: sNode.x + ux * (dist * 0.3) + px * (offsetDist * side),
                        y: sNode.y + uy * (dist * 0.3) + py * (offsetDist * side)
                    };
                    let P2 = {
                        x: sNode.x + ux * (dist * 0.7) - px * (offsetDist * side),
                        y: sNode.y + uy * (dist * 0.7) - py * (offsetDist * side)
                    };

                    for (let i = 1; i <= 10; i++) {
                        let t = i / 10;
                        detailedPoints.push({ x: sNode.x + (P1.x - sNode.x) * t, y: sNode.y + (P1.y - sNode.y) * t });
                    }
                    for (let i = 1; i <= 10; i++) {
                        let t = i / 10;
                        detailedPoints.push({ x: P1.x + (P2.x - P1.x) * t, y: P1.y + (P2.y - P1.y) * t });
                    }
                    for (let i = 1; i <= 10; i++) {
                        let t = i / 10;
                        detailedPoints.push({ x: P2.x + (eNode.x - P2.x) * t, y: P2.y + (eNode.y - P2.y) * t });
                    }
                } else if (shape.includes('v')) {
                    let steps = 15;
                    for (let i = 1; i <= steps; i++) {
                        let t = i / steps;
                        detailedPoints.push({ x: sNode.x + (CENTER.x - sNode.x) * t, y: sNode.y + (CENTER.y - sNode.y) * t });
                    }
                    for (let i = 1; i <= steps; i++) {
                        let t = i / steps;
                        detailedPoints.push({ x: CENTER.x + (eNode.x - CENTER.x) * t, y: CENTER.y + (eNode.y - CENTER.y) * t });
                    }
                } else {
                    let steps = 20;
                    for (let i = 1; i <= steps; i++) {
                        let t = i / steps;
                        detailedPoints.push({ x: sNode.x + (eNode.x - sNode.x) * t, y: sNode.y + (eNode.y - sNode.y) * t });
                    }
                }
                
                currentStart = seg.endKey;
            }

            let finalSegments = [], totalLen = 0;
            for(let i=0; i<detailedPoints.length-1; i++) {
                let len = Math.hypot(detailedPoints[i+1].x - detailedPoints[i].x, detailedPoints[i+1].y - detailedPoints[i].y);
                finalSegments.push(len); totalLen += len;
            }
            return { points: detailedPoints, segments: finalSegments, totalLength: totalLen };
        }

        function playClick(isHigh) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = isHigh ? 880 : 440;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        function playHitSFX(judgement) {
            if (judgement === 'MISS') return;

            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();

                if (judgement === 'CRITICAL' || judgement === 'PERFECT') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1056, audioCtx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(1584, audioCtx.currentTime + 0.06);

                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
                } else {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(392, audioCtx.currentTime + 0.07);

                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.07);
                }

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.07);
            } catch(e) {}
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            let selectedDiff = document.getElementById('diffSelect').value;
            notes = parseChartString(availableCharts[selectedDiff].data, globalAudioOffset);

            document.getElementById('ui').style.display = 'none';
            canvas.style.display = 'block';
            
            activeNotes = JSON.parse(JSON.stringify(notes));
            activeNotes.forEach(n => {
                if (n.pathStr) n.slideData = calculateSlidePoints(n.pathStr, n.pos);
            });

            combo = 0; 
            preRollTime = 240 / initialBPM; 
            gameStartTime = performance.now();
            lastBeatIndex = -1;
            audioStarted = false;
            isPaused = false;

            if (document.getElementById('bgVideo').src) document.getElementById('bgVideo').currentTime = 0;
            isPlaying = true; 
            requestAnimationFrame(gameLoop);
        });

        function gameLoop() {
            if (!isPlaying || isPaused) return;
            let now = performance.now();
            let elapsedTime = (now - gameStartTime) / 1000 - preRollTime;

            if (elapsedTime < 0) {
                let beatInterval = 60 / initialBPM;
                let timeIntoPreRoll = preRollTime + elapsedTime;
                let beatIndex = Math.floor(timeIntoPreRoll / beatInterval);
                if (beatIndex > lastBeatIndex && beatIndex < 4) {
                    lastBeatIndex = beatIndex;
                    playClick(beatIndex === 0);
                }
            } else {
                if (!audioStarted) {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log(e));
                    audioStarted = true;
                }
                elapsedTime = audio.currentTime;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawUI(); drawCombo(); 
            updateAndDrawNotes(elapsedTime);
            drawClickEffects(); drawFireworks(); drawJudgements(elapsedTime);
            requestAnimationFrame(gameLoop);
        }

        function drawUI() {
            ctx.beginPath(); ctx.arc(CENTER.x, CENTER.y, RING_RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = 3; ctx.stroke();

            ctx.save(); ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
            for (let i = 1; i <= 8; i++) {
                let angle = -90 + (i - 1) * 45; 
                let innerX = CENTER.x + Math.cos(angle * Math.PI / 180) * (RING_RADIUS * 0.35);
                let innerY = CENTER.y + Math.sin(angle * Math.PI / 180) * (RING_RADIUS * 0.35);
                let outerX = CENTER.x + Math.cos(angle * Math.PI / 180) * RING_RADIUS;
                let outerY = CENTER.y + Math.sin(angle * Math.PI / 180) * RING_RADIUS;
                ctx.beginPath(); ctx.moveTo(innerX, innerY); ctx.lineTo(outerX, outerY); ctx.stroke();
            }
            ctx.restore();

            ctx.font = `bold ${BUTTON_RADIUS * 0.45}px Arial`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            Object.keys(NODE_POSITIONS).forEach(key => {
                let node = NODE_POSITIONS[key];
                if (node.type === 'A' || node.type === 'B') {
                    ctx.beginPath(); ctx.arc(node.x, node.y, BUTTON_RADIUS * (node.type === 'B' ? 0.7 : 1), 0, Math.PI * 2);
                    ctx.fillStyle = node.active ? '#0ff' : 'rgba(0, 0, 0, 0.5)'; ctx.fill();
                    ctx.strokeStyle = '#0ff'; ctx.lineWidth = 1; ctx.stroke();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)'; ctx.fillText(key, node.x, node.y);
                } else if (node.type === 'C') {
                    ctx.fillStyle = node.active ? 'rgba(0, 255, 255, 0.4)' : 'rgba(0,0,0,0)';
                    ctx.fillRect(node.x - BUTTON_RADIUS, node.y - BUTTON_RADIUS, BUTTON_RADIUS*2, BUTTON_RADIUS*2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)'; ctx.fillText('C', node.x, node.y - BUTTON_RADIUS * 1.5);
                } else if (node.type === 'D' || node.type === 'E') {
                    ctx.fillStyle = node.active ? 'rgba(0, 255, 255, 0.4)' : 'rgba(255, 255, 255, 0.3)';
                    ctx.fillText(key, node.x, node.y);
                }
            });
        }

        function drawCombo() {
            if (combo > 0) {
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = `bold ${BUTTON_RADIUS * 1.5}px Arial`; ctx.lineWidth = 6;
                ctx.strokeStyle = '#111'; ctx.strokeText(combo, CENTER.x, CENTER.y - BUTTON_RADIUS * 0.2);
                ctx.fillStyle = '#ffcc00'; ctx.fillText(combo, CENTER.x, CENTER.y - BUTTON_RADIUS * 0.2);
            }
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius, rotation) {
            let rot = Math.PI / 2 * 3, x = cx, y = cy, step = Math.PI / spikes;
            ctx.beginPath(); ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot + rotation) * outerRadius; y = cy + Math.sin(rot + rotation) * outerRadius; ctx.lineTo(x, y); rot += step;
                x = cx + Math.cos(rot + rotation) * innerRadius; y = cy + Math.sin(rot + rotation) * innerRadius; ctx.lineTo(x, y); rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius); ctx.closePath(); ctx.fill(); ctx.stroke();
        }

        function drawHexagonBar(tx, ty, cx, cy, color) {
            let dx = cx - tx, dy = cy - ty;
            let L = Math.hypot(dx, dy);
            let w = BUTTON_RADIUS * 0.65; 
            
            ctx.fillStyle = color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
            if (L <= w) { 
                ctx.beginPath(); ctx.arc(cx, cy, w, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                return;
            }
            
            let nx = dx / L, ny = dy / L, px = -ny, py = nx;
            let p = w * 0.5; 
            
            ctx.beginPath();
            ctx.moveTo(cx, cy); 
            ctx.lineTo(cx - nx * p + px * w, cy - ny * p + py * w); 
            ctx.lineTo(tx + nx * p + px * w, ty + ny * p + py * w); 
            ctx.lineTo(tx, ty); 
            ctx.lineTo(tx + nx * p - px * w, ty + ny * p - py * w); 
            ctx.lineTo(cx - nx * p - px * w, cy - ny * p - py * w); 
            ctx.closePath();
            ctx.fill(); ctx.stroke();
        }

        function spawnClickEffect(x, y, color = '#0ff') { clickEffects.push({ x: x, y: y, radius: BUTTON_RADIUS * 0.5, maxRadius: BUTTON_RADIUS * 1.8, alpha: 1.0, color: color }); }
        
        function drawClickEffects() {
            for (let i = clickEffects.length - 1; i >= 0; i--) {
                let eff = clickEffects[i]; eff.radius += 3; eff.alpha -= 0.06;
                if (eff.alpha <= 0) { clickEffects.splice(i, 1); continue; }
                ctx.save(); ctx.beginPath(); ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
                ctx.strokeStyle = eff.color; ctx.lineWidth = 3; ctx.globalAlpha = eff.alpha; ctx.stroke(); ctx.restore();
            }
        }

        // Firework Particle Generator
        function spawnFireworkEffect(x, y) {
            const count = 28;
            const colors = ['#ff0055', '#00ffff', '#ffcc00', '#ff3399', '#00ff66', '#ffffff', '#ff9900'];
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = 2 + Math.random() * 6;
                fireworks.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1.0,
                    size: 3 + Math.random() * 4,
                    decay: 0.02 + Math.random() * 0.02
                });
            }
        }

        function drawFireworks() {
            for (let i = fireworks.length - 1; i >= 0; i--) {
                let p = fireworks[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.96; p.vy *= 0.96;
                p.alpha -= p.decay;

                if (p.alpha <= 0) { fireworks.splice(i, 1); continue; }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function updateAndDrawNotes(elapsedTime) {
            for (let i = activeNotes.length - 1; i >= 0; i--) {
                let note = activeNotes[i];
                let target = NODE_POSITIONS[note.pos];
                if (!target && note.type !== 'slide_travel') continue;

                let timeUntilHit = note.time - elapsedTime;

                if (note.slideData && timeUntilHit <= APPROACH_TIME && note.type === 'slide_head') {
                    let pData = note.slideData;
                    ctx.beginPath(); ctx.moveTo(pData.points[0].x, pData.points[0].y);
                    for(let p=1; p<pData.points.length; p++) ctx.lineTo(pData.points[p].x, pData.points[p].y);
                    ctx.strokeStyle = note.isChord ? 'rgba(255, 255, 0, 0.45)' : 'rgba(0, 150, 255, 0.45)';
                    ctx.lineWidth = 22; ctx.stroke();

                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
                    ctx.stroke(); ctx.setLineDash([]);
                }

                if (note.type === 'slide_head' && note.state === 'waiting' && elapsedTime > note.time + 0.16) {
                    spawnJudgement("MISS", "#888", target.x, target.y);
                    combo = 0;
                    note.type = 'slide_travel';
                    note.state = 'sliding';
                    
                    let lastNode = note.slideData.points[note.slideData.points.length-1];
                    note.finalX = lastNode.x; note.finalY = lastNode.y;
                    note.time = elapsedTime;
                }

                if (note.type === 'slide_travel' && note.state === 'sliding') {
                    let travelProgress = (elapsedTime - note.time) / note.duration;
                    let pData = note.slideData;
                    
                    ctx.beginPath(); ctx.moveTo(pData.points[0].x, pData.points[0].y);
                    for(let p=1; p<pData.points.length; p++) ctx.lineTo(pData.points[p].x, pData.points[p].y);
                    ctx.strokeStyle = note.isChord ? 'rgba(255, 255, 0, 0.8)' : 'rgba(0, 180, 255, 0.8)';
                    ctx.lineWidth = 24; ctx.stroke();

                    let currentDist = travelProgress * pData.totalLength;
                    let accum = 0, starX = pData.points[0].x, starY = pData.points[0].y;
                    
                    for(let s = 0; s < pData.segments.length; s++) {
                        if (currentDist <= accum + pData.segments[s]) {
                            let localP = (currentDist - accum) / pData.segments[s];
                            starX = pData.points[s].x + (pData.points[s+1].x - pData.points[s].x) * localP;
                            starY = pData.points[s].y + (pData.points[s+1].y - pData.points[s].y) * localP;
                            break;
                        }
                        accum += pData.segments[s];
                    }

                    Object.keys(activeTouches).forEach(id => {
                        let tx = activeTouches[id].x;
                        let ty = activeTouches[id].y;
                        
                        if (Math.hypot(tx - note.finalX, ty - note.finalY) < BUTTON_RADIUS * 2.5) {
                            note.reachedEnd = true;
                        }
                        if (Math.hypot(tx - starX, ty - starY) < BUTTON_RADIUS * 2.5) {
                            note.traced = true;
                        }
                    });

                    if (travelProgress >= 1.0) {
                        if (note.isFirework) spawnFireworkEffect(note.finalX, note.finalY);
                        if (note.reachedEnd || note.isBonus) {
                            spawnJudgement("CRITICAL", "#ffd700", note.finalX, note.finalY);
                            combo++;
                        } else if (note.traced) {
                            spawnJudgement("GREAT", "#ff8c00", note.finalX, note.finalY);
                            combo++;
                        } else {
                            spawnJudgement("MISS", "#888", note.finalX, note.finalY);
                            combo = 0;
                        }
                        activeNotes.splice(i, 1);
                        continue;
                    }

                    ctx.fillStyle = note.isChord ? '#ffff00' : '#00aaff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                    drawStar(starX, starY, 5, BUTTON_RADIUS * 0.7, BUTTON_RADIUS * 0.35, elapsedTime * 4);
                    continue;
                }

                let missWindow = 0.16;
                let isHolding = (note.state === 'holding');

                if (!isHolding && note.type !== 'slide_head' && timeUntilHit < -missWindow) {
                    spawnJudgement("MISS", "#888", target.x, target.y);
                    combo = 0; activeNotes.splice(i, 1); continue;
                }

                if (isHolding && elapsedTime >= note.time + note.duration) {
                    if (note.isFirework) spawnFireworkEffect(target.x, target.y);
                    spawnJudgement("CRITICAL", "#ffd700", target.x, target.y);
                    combo++; activeNotes.splice(i, 1); continue;
                }

                if (timeUntilHit <= APPROACH_TIME || isHolding) {
                    let progress = isHolding ? 1.0 : Math.max(0, 1 - (timeUntilHit / APPROACH_TIME));
                    let cx = target ? CENTER.x + (target.x - CENTER.x) * progress : note.finalX;
                    let cy = target ? CENTER.y + (target.y - CENTER.y) * progress : note.finalY;
                    let cYellow = '#ffff00';

                    if (note.type === 'touch' || note.type === 'hold_touch') {
                        let size = BUTTON_RADIUS * 2 + (BUTTON_RADIUS * (1 - progress) * 4);
                        let tOutline = note.isBonus ? '#ffd700' : (note.isChord ? '#ffff00' : '#00ffff');
                        let tFill = note.isChord ? 'rgba(255, 255, 0, 0.4)' : 'rgba(0, 255, 255, 0.4)';
                        
                        ctx.save();
                        ctx.translate(target.x, target.y);
                        ctx.rotate(Math.PI / 4);

                        if (note.isBonus) {
                            ctx.shadowColor = '#ffe600';
                            ctx.shadowBlur = 15;
                        }
                        
                        if (note.type === 'hold_touch') {
                            let holdProgress = isHolding ? Math.min(1.0, (elapsedTime - note.time) / note.duration) : 0;
                            let baseSquareSize = BUTTON_RADIUS * 1.5;
                            let currentRadius = (baseSquareSize / Math.SQRT2) * (1 - holdProgress) + (baseSquareSize / 2) * holdProgress;

                            let quadColors = ['#ff0055', '#00ffcc', '#ffcc00', '#9900ff'];
                            let angles = [0, Math.PI/2, Math.PI, Math.PI*3/2];
                            for(let q = 0; q < 4; q++) {
                                ctx.beginPath();
                                ctx.arc(0, 0, currentRadius, angles[q], angles[q] + Math.PI/2);
                                ctx.strokeStyle = quadColors[q];
                                ctx.lineWidth = 6;
                                ctx.stroke();
                            }

                            ctx.fillStyle = tFill;
                            ctx.fillRect(-baseSquareSize/2, -baseSquareSize/2, baseSquareSize, baseSquareSize);
                            ctx.strokeStyle = tOutline;
                            ctx.lineWidth = 4;
                            ctx.strokeRect(-baseSquareSize/2, -baseSquareSize/2, baseSquareSize, baseSquareSize);
                        } else {
                            ctx.strokeStyle = tOutline; ctx.lineWidth = 4;
                            ctx.strokeRect(-size/2, -size/2, size, size);
                            ctx.fillStyle = tFill;
                            ctx.fillRect(-BUTTON_RADIUS/1.2, -BUTTON_RADIUS/1.2, BUTTON_RADIUS*1.5, BUTTON_RADIUS*1.5);
                        }
                        ctx.restore();

                    } else if (note.type === 'hold') {
                        let tailTimeUntil = (note.time + note.duration) - elapsedTime;
                        let tailProgress = Math.max(0, 1 - (tailTimeUntil / APPROACH_TIME));
                        let headP = Math.min(1, progress); let tailP = Math.min(1, tailProgress);
                        
                        let headX = CENTER.x + (target.x - CENTER.x) * headP;
                        let headY = CENTER.y + (target.y - CENTER.y) * headP;
                        let tailX = CENTER.x + (target.x - CENTER.x) * tailP;
                        let tailY = CENTER.y + (target.y - CENTER.y) * tailP;
                        
                        let holdColor = note.isBonus ? 'rgba(255, 215, 0, 0.9)' : (note.isChord ? 'rgba(255, 255, 0, 0.85)' : 'rgba(255, 0, 0, 0.85)');
                        drawHexagonBar(tailX, tailY, headX, headY, holdColor);
                        
                    } else if (note.type === 'slide_head' && note.state === 'waiting') {
                        ctx.fillStyle = note.isBonus ? '#ffe600' : (note.isChord ? cYellow : '#00aaff'); 
                        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                        drawStar(cx, cy, 5, BUTTON_RADIUS * 0.8, BUTTON_RADIUS * 0.4, elapsedTime * 4);
                    
                    } else if (note.type === 'tap') {
                        if (note.isBonus) { // Bonus Note Visuals
                            ctx.save();
                            ctx.beginPath(); ctx.arc(cx, cy, BUTTON_RADIUS * 0.85, 0, Math.PI * 2);
                            ctx.fillStyle = '#ffe600';
                            ctx.shadowColor = '#ffea00'; ctx.shadowBlur = 12;
                            ctx.fill();

                            ctx.beginPath(); ctx.arc(cx, cy, BUTTON_RADIUS * 0.65, 0, Math.PI * 2);
                            ctx.fillStyle = note.isChord ? cYellow : '#ff00ff';
                            ctx.fill();
                            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();

                            ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ffe600'; ctx.lineWidth = 1;
                            drawStar(cx, cy, 5, BUTTON_RADIUS * 0.35, BUTTON_RADIUS * 0.18, elapsedTime * 3);
                            ctx.restore();
                        } else {
                            ctx.beginPath(); ctx.arc(cx, cy, BUTTON_RADIUS * 0.7, 0, Math.PI * 2);
                            ctx.fillStyle = note.isChord ? cYellow : '#ff00ff'; ctx.fill(); 
                            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
                        }
                    }
                }
            }
        }

        function spawnJudgement(text, color, jX, jY) { 
            judgements.push({ text: text, color: color, x: jX, y: jY - 25, spawnTime: audio.currentTime }); 
            playHitSFX(text);
        }
        
        function drawJudgements(elapsedTime) {
            for (let i = judgements.length - 1; i >= 0; i--) {
                let j = judgements[i]; let age = elapsedTime - j.spawnTime;
                if (age > 0.5) { judgements.splice(i, 1); continue; }
                ctx.fillStyle = j.color; ctx.font = `bold ${BUTTON_RADIUS * 0.8}px Arial`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 2; ctx.strokeStyle = '#000';
                ctx.globalAlpha = 1 - (age / 0.5); 
                let dropY = j.y - (age * 30);
                ctx.strokeText(j.text, j.x, dropY); ctx.fillText(j.text, j.x, dropY); 
                ctx.globalAlpha = 1.0;
            }
        }

        // ================= INPUT HANDLING =================
        let touchState = {}; 
        let activeTouches = {};
        let isMouseDown = false;
        let mouseTouchSet = new Set();

        // 1. TOUCH CONTROLS
        function handleTouches(e) {
            if (isPaused) return;
            e.preventDefault(); 
            let rect = canvas.getBoundingClientRect();
            
            for(let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                let tx = touch.clientX - rect.left, ty = touch.clientY - rect.top;

                if (e.type === 'touchend' || e.type === 'touchcancel') {
                    let releasedNodes = touchState[touch.identifier] || new Set();
                    releasedNodes.forEach(nodeKey => checkHoldRelease(nodeKey));
                    
                    delete activeTouches[touch.identifier];
                    delete touchState[touch.identifier]; 
                    continue;
                }

                activeTouches[touch.identifier] = { x: tx, y: ty };

                let currentlyTouched = new Set();
                Object.keys(NODE_POSITIONS).forEach(key => {
                    let node = NODE_POSITIONS[key];
                    let radius = (node.type === 'C') ? BUTTON_RADIUS * 1.5 : BUTTON_RADIUS * 1.5;
                    if (Math.hypot(tx - node.x, ty - node.y) < radius) currentlyTouched.add(key);
                });

                let previouslyTouched = touchState[touch.identifier] || new Set();
                currentlyTouched.forEach(key => {
                    if (!previouslyTouched.has(key)) {
                        NODE_POSITIONS[key].active = true;
                        spawnClickEffect(NODE_POSITIONS[key].x, NODE_POSITIONS[key].y, '#0ff');
                        checkHit(key);
                        setTimeout(() => NODE_POSITIONS[key].active = false, 100);
                    }
                });
                touchState[touch.identifier] = currentlyTouched;
            }
        }

        canvas.addEventListener('touchstart', handleTouches, {passive: false});
        canvas.addEventListener('touchmove', handleTouches, {passive: false});
        canvas.addEventListener('touchend', handleTouches, {passive: false});
        canvas.addEventListener('touchcancel', handleTouches, {passive: false});

        // 2. MOUSE CONTROLS
        function handleMousePos(x, y) {
            if (isPaused) return;
            activeTouches['mouse'] = { x: x, y: y };
            let currentlyTouched = new Set();

            Object.keys(NODE_POSITIONS).forEach(key => {
                let node = NODE_POSITIONS[key];
                let radius = (node.type === 'C') ? BUTTON_RADIUS * 1.5 : BUTTON_RADIUS * 1.5;
                if (Math.hypot(x - node.x, y - node.y) < radius) {
                    currentlyTouched.add(key);
                }
            });

            currentlyTouched.forEach(key => {
                if (!mouseTouchSet.has(key)) {
                    NODE_POSITIONS[key].active = true;
                    spawnClickEffect(NODE_POSITIONS[key].x, NODE_POSITIONS[key].y, '#0ff');
                    checkHit(key);
                    setTimeout(() => NODE_POSITIONS[key].active = false, 100);
                }
            });

            mouseTouchSet = currentlyTouched;
        }

        canvas.addEventListener('mousedown', (e) => {
            if (isPaused) return;
            isMouseDown = true;
            let rect = canvas.getBoundingClientRect();
            handleMousePos(e.clientX - rect.left, e.clientY - rect.top);
        });

        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown || isPaused) return;
            let rect = canvas.getBoundingClientRect();
            handleMousePos(e.clientX - rect.left, e.clientY - rect.top);
        });

        window.addEventListener('mouseup', () => {
            if (!isMouseDown) return;
            isMouseDown = false;
            mouseTouchSet.forEach(nodeKey => checkHoldRelease(nodeKey));
            mouseTouchSet.clear();
            delete activeTouches['mouse'];
        });

        // 3. KEYBOARD CONTROLS
        const KEY_MAP = {
            'Digit1': 'A1', 'Digit2': 'A2', 'Digit3': 'A3', 'Digit4': 'A4',
            'Digit5': 'A5', 'Digit6': 'A6', 'Digit7': 'A7', 'Digit8': 'A8',
            'KeyE': 'A1', 'KeyD': 'A2', 'KeyC': 'A3', 'KeyX': 'A4',
            'KeyZ': 'A5', 'KeyA': 'A6', 'KeyQ': 'A7', 'KeyW': 'A8',
            'Space': 'C', 'KeyS': 'C', 'Numpad5': 'C'
        };

        const activeKeys = {};

        window.addEventListener('keydown', (e) => {
            if (e.repeat || isPaused) return;
            let posKey = KEY_MAP[e.code];
            if (posKey && NODE_POSITIONS[posKey]) {
                activeKeys[e.code] = posKey;
                
                NODE_POSITIONS[posKey].active = true;
                spawnClickEffect(NODE_POSITIONS[posKey].x, NODE_POSITIONS[posKey].y, '#0ff');
                checkHit(posKey);

                activeTouches[`key_${e.code}`] = { x: NODE_POSITIONS[posKey].x, y: NODE_POSITIONS[posKey].y };
            }
        });

        window.addEventListener('keyup', (e) => {
            let posKey = activeKeys[e.code];
            if (posKey) {
                NODE_POSITIONS[posKey].active = false;
                checkHoldRelease(posKey);
                delete activeTouches[`key_${e.code}`];
                delete activeKeys[e.code];
            }
        });

        // HIT LOGIC
        function checkHit(posKey) {
            let elapsedTime = audio.currentTime;
            for (let i = 0; i < activeNotes.length; i++) {
                let note = activeNotes[i];
                if (note.pos === posKey) {
                    let diff = Math.abs(note.time - elapsedTime);
                    let hitWindow = 0.16;
                    let target = NODE_POSITIONS[note.pos];

                    if (diff <= hitWindow) {
                        if (note.isFirework) {
                            spawnFireworkEffect(target.x, target.y);
                        }

                        if (note.isBonus) {
                            spawnJudgement("CRITICAL", "#ffd700", target.x, target.y);
                            combo++; activeNotes.splice(i, 1); break;
                        } else if (note.type === 'hold' || note.type === 'hold_touch') {
                            note.state = 'holding'; spawnJudgement("PERFECT", "#ffeb3b", target.x, target.y);
                            combo++; return; 
                        } else if (note.type === 'slide_head' && note.state === 'waiting') {
                            note.type = 'slide_travel'; note.state = 'sliding';
                            note.time = elapsedTime; 
                            
                            let lastNode = note.slideData.points[note.slideData.points.length-1];
                            note.finalX = lastNode.x; note.finalY = lastNode.y;
                            
                            spawnJudgement("CRITICAL", "#ffd700", target.x, target.y); combo++; return;
                        } else if (note.type === 'tap' || note.type === 'touch') {
                            if (diff <= 0.03) { spawnJudgement("CRITICAL", "#ffd700", target.x, target.y); combo++; }
                            else if (diff <= 0.06) { spawnJudgement("PERFECT", "#ffeb3b", target.x, target.y); combo++; }
                            else if (diff <= 0.10) { spawnJudgement("GREAT", "#ff8c00", target.x, target.y); combo++; }
                            else { spawnJudgement("GOOD", "#00ff00", target.x, target.y); combo++; }
                            activeNotes.splice(i, 1); break;
                        }
                    }
                }
            }
        }

        function checkHoldRelease(posKey) {
            let elapsedTime = audio.currentTime;
            for (let i = activeNotes.length - 1; i >= 0; i--) {
                let note = activeNotes[i];
                if ((note.type === 'hold' || note.type === 'hold_touch') && note.pos === posKey && note.state === 'holding') {
                    let target = NODE_POSITIONS[note.pos];
                    if (elapsedTime < note.time + note.duration - 0.15) {
                        spawnJudgement("MISS", "#888", target.x, target.y); combo = 0;
                    } else {
                        if (note.isFirework) spawnFireworkEffect(target.x, target.y);
                        spawnJudgement("CRITICAL", "#ffd700", target.x, target.y); combo++;
                    }
                    activeNotes.splice(i, 1); break;
                }
            }
        }
    </script>
