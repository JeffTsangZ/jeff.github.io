<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Maimai DX Simulator - Architecture Redo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000; color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            touch-action: none; user-select: none;
        }
        #bgVideo {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; object-fit: cover;
            z-index: -2; display: none; opacity: 0.5;
        }
        #ui {
            position: absolute; z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px; border-radius: 15px;
            border: 2px solid #0ff; text-align: center;
            box-shadow: 0 0 20px #0ff;
            min-width: 300px;
        }
        #fullscreenBtn {
            position: absolute;
            top: 15px; right: 15px; z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            color: #fff; border: 1px solid #0ff;
            border-radius: 8px; padding: 10px 15px;
            cursor: pointer; font-weight: bold;
        }
        #fullscreenBtn:hover { background: rgba(0, 255, 255, 0.2); }
        
        #gameCanvas {
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
            display: none;
        }
        button:not(#fullscreenBtn), input[type="file"], select {
            padding: 12px; font-size: 16px; margin: 10px;
            border-radius: 8px; border: none; cursor: pointer;
            width: 90%; box-sizing: border-box;
        }
        select { background: #222; color: #fff; border: 1px solid #0ff; outline: none; }
        button:not(#fullscreenBtn) { background: #0ff; color: #000; font-weight: bold; }
        button:disabled { background: #555; color: #888; }
        .setting { margin: 15px 0; }
        input[type="range"] { width: 90%; }
        
        #difficultyContainer {
            display: none;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <video id="bgVideo" autoplay loop muted></video>
    <button id="fullscreenBtn">⛶ Fullscreen</button>

    <div id="ui">
        <h2>maimai DX Simulator</h2>
        <input type="file" id="adxUpload" accept=".adx,.zip" />
        
        <div id="difficultyContainer">
            <label style="font-weight: bold; color: #0ff;">Select Difficulty:</label>
            <select id="diffSelect"></select>
        </div>

        <div class="setting">
            <label>Note Speed: <span id="speedVal">5.0</span></label><br>
            <input type="range" id="speedSlider" min="1" max="10" step="0.1" value="5">
        </div>

        <button id="startBtn" disabled>Upload .adx to Start</button>
        <p id="statusText" style="color: #0ff;">Waiting for file...</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let CENTER = { x: 0, y: 0 };
        let RING_RADIUS = 0;
        let BUTTON_RADIUS = 0;
        let NODE_POSITIONS = {};

        let availableCharts = {};
        let globalAudioOffset = 0;
        let initialBPM = 120;

        let notes = [];
        let activeSlideBehaviours = [];
        let judgements = [];
        let clickEffects = [];
        let audio = new Audio();
        let isPlaying = false;
        let combo = 0;

        let gameStartTime = 0;
        let preRollTime = 2.0;
        let lastBeatIndex = -1;
        let audioStarted = false;
        let audioCtx = null;

        let APPROACH_TIME = 1.0; 
        const speedSlider = document.getElementById('speedSlider');
        speedSlider.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            document.getElementById('speedVal').innerText = val.toFixed(1);
            APPROACH_TIME = 5.0 / val;
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        });

        function resizeCanvas() {
            let size = Math.min(window.innerWidth, window.innerHeight) * 0.95;
            canvas.width = size; canvas.height = size;
            CENTER = { x: size / 2, y: size / 2 };
            RING_RADIUS = size * 0.38; BUTTON_RADIUS = size * 0.07;

            NODE_POSITIONS = {};
            NODE_POSITIONS['C'] = { x: CENTER.x, y: CENTER.y, type: 'C', active: false };

            for (let i = 1; i <= 8; i++) {
                let aAngle = (-90 + (i - 1) * 45 + 22.5) * (Math.PI / 180);
                let dAngle = (-90 + (i - 1) * 45) * (Math.PI / 180);

                NODE_POSITIONS[`A${i}`] = { x: CENTER.x + Math.cos(aAngle) * RING_RADIUS, y: CENTER.y + Math.sin(aAngle) * RING_RADIUS, type: 'A', active: false, index: i };
                NODE_POSITIONS[`B${i}`] = { x: CENTER.x + Math.cos(aAngle) * (RING_RADIUS * 0.5), y: CENTER.y + Math.sin(aAngle) * (RING_RADIUS * 0.5), type: 'B', active: false, index: i };
                NODE_POSITIONS[`D${i}`] = { x: CENTER.x + Math.cos(dAngle) * (RING_RADIUS * 0.85), y: CENTER.y + Math.sin(dAngle) * (RING_RADIUS * 0.85), type: 'D', active: false, index: i };
                NODE_POSITIONS[`E${i}`] = { x: CENTER.x + Math.cos(dAngle) * (RING_RADIUS * 0.4), y: CENTER.y + Math.sin(dAngle) * (RING_RADIUS * 0.4), type: 'E', active: false, index: i };
            }
        }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        // --- Trigonometry & Slide Generators Architecture ---
        const Tau = Math.PI * 2;
        class Trigonometry {
            static getAngleSpan(startRotation, endRotation, clockwise, wrapThreshold = Tau / 32) {
                let span = clockwise
                    ? (startRotation - endRotation + 2 * Tau) % Tau
                    : (endRotation - startRotation + 2 * Tau) % Tau;

                if (span <= wrapThreshold) {
                    span += Tau;
                }
                return span;
            }
        }

        class StraightGenerator {
            constructor(vertices, getPositionFunc) {
                this.startPoint = getPositionFunc(vertices[0]);
                this.endPoint = getPositionFunc(vertices[1]);
                const dx = this.endPoint.x - this.startPoint.x;
                const dy = this.endPoint.y - this.startPoint.y;
                this.length = Math.hypot(dx, dy);
                this.rotation = Math.atan2(dy, dx);
            }
            GetLength() { return this.length; }
            GetPoint(t) {
                const x = this.startPoint.x + (this.endPoint.x - this.startPoint.x) * t;
                const y = this.startPoint.y + (this.endPoint.y - this.startPoint.y) * t;
                return { position: { x, y }, rotation: this.rotation };
            }
        }

        class CurveGenerator {
            constructor(startVertex, endVertex, clockwise, getPositionFunc) {
                this.startPos = getPositionFunc(startVertex);
                this.endPos = getPositionFunc(endVertex);
                this.clockwise = clockwise;
                this.startAngle = Math.atan2(this.startPos.y - CENTER.y, this.startPos.x - CENTER.x);
                this.endAngle = Math.atan2(this.endPos.y - CENTER.y, this.endPos.x - CENTER.x);
                this.angleSpan = Trigonometry.getAngleSpan(this.startAngle, this.endAngle, this.clockwise);
                this.length = this.angleSpan * RING_RADIUS;
            }
            GetLength() { return this.length; }
            GetPoint(t) {
                const currentAngle = this.startAngle + (this.clockwise ? -1 : 1) * (this.angleSpan * t);
                const x = CENTER.x + Math.cos(currentAngle) * RING_RADIUS;
                const y = CENTER.y + Math.sin(currentAngle) * RING_RADIUS;
                return { position: { x, y }, rotation: currentAngle + (this.clockwise ? -Math.PI/2 : Math.PI/2) };
            }
        }

        // --- Regular Slide Segment Handler ---
        class RegularSlideSegmentHandler {
            constructor(slideBehaviour, segment, startLocation, generator) {
                this.slideBehaviour = slideBehaviour;
                this.segment = segment;
                this.generator = generator;
                this.totalLength = generator.GetLength();
                this.interactionPath = [];
                this.initialSensorCount = 0;
                this.lastCheckedClearIndex = 0;
                this.cleared = false;
                this.generateArrows();
            }

            generateArrows() {
                const arrowDistance = 15;
                const arrowCount = Math.max(5, Math.floor(this.totalLength / arrowDistance));
                let relevantArrows = [];
                let relevantSensor = null;

                for (let i = 0; i <= arrowCount; i++) {
                    const t = i / arrowCount;
                    const pointData = this.generator.GetPoint(t);
                    const sensor = this.getClosestSensor(pointData.position);

                    if (relevantSensor !== sensor) {
                        if (relevantSensor !== null) {
                            this.interactionPath.push({ relevantSensor, relevantArrows });
                        }
                        relevantArrows = [];
                        relevantSensor = sensor;
                    }
                    relevantArrows.push({ index: i, position: pointData.position });
                }
                if (relevantArrows.length > 0) {
                    this.interactionPath.push({ relevantSensor, relevantArrows });
                }
                this.initialSensorCount = this.interactionPath.length;
                if (this.initialSensorCount === 0) this.initialSensorCount = 1;
            }

            getClosestSensor(position) {
                let closestKey = 'A1';
                let minDist = Infinity;
                Object.keys(NODE_POSITIONS).forEach(k => {
                    if (k.startsWith('A') || k.startsWith('B')) {
                        let node = NODE_POSITIONS[k];
                        let dist = Math.hypot(node.x - position.x, node.y - position.y);
                        if (dist < minDist) { minDist = dist; closestKey = k; }
                    }
                });
                return {
                    key: closestKey,
                    getSlideJudgement: () => {
                        let node = NODE_POSITIONS[closestKey];
                        return node && node.active;
                    }
                };
            }

            GetClearCount(segmentT, isAuto, slideTolerance) {
                if (isAuto && segmentT >= 0) {
                    const clearCount = Math.floor(segmentT * this.initialSensorCount);
                    if (this.lastCheckedClearIndex >= clearCount) return 0;
                    const diff = clearCount - this.lastCheckedClearIndex;
                    this.lastCheckedClearIndex = clearCount;
                    return diff;
                } else {
                    let clearCount = 0;
                    let scanIndex = 0;
                    let tolerance = slideTolerance;

                    while (tolerance >= 0 && scanIndex < this.interactionPath.length) {
                        if (this.interactionPath[scanIndex].relevantSensor.getSlideJudgement()) {
                            tolerance = slideTolerance;
                            clearCount = scanIndex + 1;
                        } else {
                            tolerance--;
                        }
                        scanIndex++;
                    }
                    return clearCount;
                }
            }

            OnUpdate(segmentT, isAuto, slideTolerance) {
                const clearCount = this.GetClearCount(segmentT, isAuto, slideTolerance);
                for (let i = 0; i < clearCount && this.interactionPath.length > 0; i++) {
                    this.interactionPath.shift();
                }
                this.cleared = this.interactionPath.length === 0;
            }
        }

        // --- Main Slide Behaviour ---
        class SlideBehaviour {
            constructor(path, parentNote, getPositionFunc) {
                this.path = path;
                this.parentNote = parentNote;
                this.getPositionFunc = getPositionFunc;
                this.segments = [];
                this.judgedSegmentCount = 0;
                this.judged = false;
                this.length = 0;
                this.initHandlers();
            }

            initHandlers() {
                let totalDistance = 0;
                for (let i = 0; i < this.path.segments.length; i++) {
                    const segment = this.path.segments[i];
                    const startLoc = i > 0 ? this.path.segments[i - 1].endKey : this.parentNote.pos;
                    
                    let generator;
                    if (segment.shape === '-') {
                        generator = new StraightGenerator([startLoc, segment.endKey], this.getPositionFunc);
                    } else if (segment.shape === '>') {
                        generator = new CurveGenerator(startLoc, segment.endKey, true, this.getPositionFunc);
                    } else if (segment.shape === '<') {
                        generator = new CurveGenerator(startLoc, segment.endKey, false, this.getPositionFunc);
                    } else {
                        generator = new StraightGenerator([startLoc, segment.endKey], this.getPositionFunc);
                    }

                    const handler = new RegularSlideSegmentHandler(this, segment, startLoc, generator);
                    this.segments.push({ distance: totalDistance, handler, generator });
                    totalDistance += generator.GetLength();
                }
                this.length = totalDistance > 0 ? totalDistance : 1;
            }

            UpdateSegments(timeSinceStart, isAuto, slideTolerance) {
                const t = Math.max(0, (timeSinceStart / this.path.duration) * this.length);
                let isJudgementTarget = timeSinceStart + this.path.delay >= 0;

                for (let i = 0; i < this.segments.length; i++) {
                    const seg = this.segments[i];
                    const segmentEndT = i + 1 < this.segments.length ? this.segments[i + 1].distance : this.length;
                    const segmentLen = segmentEndT - seg.distance;
                    const segmentT = segmentLen > 0 ? Math.min(1.0, (t - seg.distance) / segmentLen) : 1.0;

                    if (isJudgementTarget) {
                        seg.handler.OnUpdate(segmentT, isAuto, slideTolerance);
                    }

                    if (!seg.handler.cleared) {
                        isJudgementTarget = false;
                    }
                }
                this.CheckInteraction();
            }

            CheckInteraction() {
                while (this.judgedSegmentCount < this.segments.length) {
                    const currentHandler = this.segments[this.judgedSegmentCount].handler;
                    if (!currentHandler.cleared) return;
                    this.judgedSegmentCount++;
                }
                this.Judge();
            }

            Judge() {
                if (this.judged) return;
                this.judged = true;
                let targetPos = NODE_POSITIONS[this.parentNote.pos] || { x: CENTER.x, y: CENTER.y };
                spawnJudgement("PERFECT", "#ffeb3b", targetPos.x, targetPos.y);
                combo++;
            }
        }

        // --- File & Chart Loading ---
        document.getElementById('adxUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('statusText').innerText = "Unzipping chart...";
            document.getElementById('difficultyContainer').style.display = 'none';
            document.getElementById('startBtn').disabled = true;

            JSZip.loadAsync(file).then(async function(zip) {
                let audioFile = zip.file(/track\.(mp3|ogg|wav)/i)[0];
                if (audioFile) {
                    let blob = await audioFile.async("blob");
                    audio.src = URL.createObjectURL(blob);
                }

                let pvFile = zip.file(/pv\.mp4/i)[0];
                let bgFile = zip.file(/bg\.(jpg|png)/i)[0];
                if (pvFile) {
                    let blob = await pvFile.async("blob");
                    document.getElementById('bgVideo').src = URL.createObjectURL(blob);
                    document.getElementById('bgVideo').style.display = 'block';
                } else if (bgFile) {
                    let blob = await bgFile.async("blob");
                    document.body.style.backgroundImage = `url(${URL.createObjectURL(blob)})`;
                    document.body.style.backgroundSize = "cover";
                    document.body.style.backgroundPosition = "center";
                }

                let maidataFile = zip.file(/maidata\.txt/i)[0];
                if (maidataFile) {
                    let text = await maidataFile.async("string");
                    extractAvailableCharts(text);
                    
                    if (Object.keys(availableCharts).length > 0) {
                        populateDifficultyUI();
                        document.getElementById('statusText').innerText = "File loaded! Ready to play.";
                        document.getElementById('startBtn').disabled = false;
                        document.getElementById('startBtn').innerText = "START GAME";
                        document.getElementById('difficultyContainer').style.display = 'block';
                    } else {
                        document.getElementById('statusText').innerText = "Error: No playable charts found in maidata.txt.";
                    }
                }
            }).catch(err => {
                document.getElementById('statusText').innerText = "Error loading file!";
                console.error(err);
            });
        });

        function extractAvailableCharts(text) {
            availableCharts = {};
            let firstMatch = text.match(/&first=([\d\.\-]+)/);
            globalAudioOffset = firstMatch ? parseFloat(firstMatch[1]) : 0.0;
            const diffNames = { 1: "Basic", 2: "Advanced", 3: "Expert", 4: "Master", 5: "Re:Master", 6: "Utage" };

            for (let i = 1; i <= 6; i++) {
                let regex = new RegExp(`&inote_${i}=([^&]+)`);
                let match = text.match(regex);
                if (match) { availableCharts[i] = { name: diffNames[i], data: match[1] }; }
            }
        }

        function populateDifficultyUI() {
            const select = document.getElementById('diffSelect');
            select.innerHTML = ''; let highestDiff = 1;
            for (let key in availableCharts) {
                let option = document.createElement('option');
                option.value = key; option.text = availableCharts[key].name;
                select.appendChild(option); highestDiff = key;
            }
            select.value = highestDiff; 
        }

        function parseDuration(str, bpm) {
            let parts = str.replace(/[\[\]]/g, '').split(':');
            if (parts.length === 2) return (240 / bpm) / parseFloat(parts[0]) * parseFloat(parts[1]);
            return 0;
        }

        function parseChartString(chartStr, offsetTime) {
            let parsedNotes = [];
            let currentTime = offsetTime;
            let cleanStr = chartStr.replace(/\s+/g, ''); 
            let blocks = cleanStr.split(',');
            let currentBPM = 120, currentDivisor = 4;

            let firstBpmMatch = chartStr.match(/\(([\d\.]+)\)/);
            if (firstBpmMatch) initialBPM = parseFloat(firstBpmMatch[1]);

            for (let block of blocks) {
                if (!block) { currentTime += (240 / currentBPM) / currentDivisor; continue; }
                let bpmMatch = block.match(/\(([\d\.]+)\)/);
                if (bpmMatch) { currentBPM = parseFloat(bpmMatch[1]); block = block.replace(/\([\d\.]+\)/, ''); }
                let divMatch = block.match(/\{([\d\.]+)\}/);
                if (divMatch) { currentDivisor = parseFloat(divMatch[1]); block = block.replace(/\{[\d\.]+\}/, ''); }

                let elements = block.split('/');
                for (let el of elements) {
                    if (!el) continue;

                    let slideHeadMatch = el.match(/^([1-8])/);
                    if (slideHeadMatch && (el.includes('-') || el.includes('^') || el.includes('<') || el.includes('>') || el.includes('v') || /[pqszw]/.test(el))) {
                        let headPos = `A${slideHeadMatch[1]}`;
                        let slidesStr = el.substring(1);
                        if (slidesStr.startsWith('*')) slidesStr = slidesStr.substring(1);

                        let slideParts = slidesStr.split('*');
                        for (let part of slideParts) {
                            if (!part) continue;
                            let durMatch = part.match(/\[(.*?)\]$/);
                            let durStr = durMatch ? durMatch[1] : null;
                            let pathStr = durMatch ? part.replace(/\[.*?\]$/, '') : part;
                            let dur = durStr ? parseDuration(durStr, currentBPM) : (240 / currentBPM) / 2;
                            
                            let segments = parseSlidePathSegments(pathStr);
                            parsedNotes.push({ 
                                type: 'slide', time: currentTime, pos: headPos, pathStr: pathStr, duration: dur, delay: 0,
                                segments: segments, state: 'waiting', isChord: false
                            });
                        }
                        continue;
                    }

                    let tapMatch = el.match(/^([1-8\*]+)$/);
                    if (tapMatch) {
                        let taps = el.replace(/\*/g, '').split('');
                        for (let t of taps) {
                            if (/[1-8]/.test(t)) {
                                parsedNotes.push({ type: 'tap', time: currentTime, pos: `A${t}`, isChord: false, state: 'waiting' });
                            }
                        }
                        continue;
                    }
                }
                currentTime += (240 / currentBPM) / currentDivisor;
            }
            return parsedNotes;
        }

        function parseSlidePathSegments(pathStr) {
            let segments = [];
            let regex = /([a-zA-Z\-\^\<\>]+)([A-E][1-8]?|C|[1-8])/g;
            let match;
            while((match = regex.exec(pathStr)) !== null) {
                let shape = match[1];
                let endKey = match[2];
                if (/^[1-8]$/.test(endKey)) endKey = `A${endKey}`;
                segments.push({ shape, endKey });
            }
            if (segments.length === 0) {
                segments.push({ shape: '-', endKey: 'A1' });
            }
            return segments;
        }

        function playClick(isHigh) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = isHigh ? 880 : 440;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            let selectedDiff = document.getElementById('diffSelect').value;
            notes = parseChartString(availableCharts[selectedDiff].data, globalAudioOffset);

            document.getElementById('ui').style.display = 'none';
            canvas.style.display = 'block';
            
            activeSlideBehaviours = [];
            combo = 0; 
            preRollTime = 240 / initialBPM; 
            gameStartTime = performance.now();
            lastBeatIndex = -1;
            audioStarted = false;

            if (document.getElementById('bgVideo').src) document.getElementById('bgVideo').currentTime = 0;
            isPlaying = true; 
            requestAnimationFrame(gameLoop);
        });

        function gameLoop() {
            if (!isPlaying) return;
            let now = performance.now();
            let elapsedTime = (now - gameStartTime) / 1000 - preRollTime;

            if (elapsedTime < 0) {
                let beatInterval = 60 / initialBPM;
                let timeIntoPreRoll = preRollTime + elapsedTime;
                let beatIndex = Math.floor(timeIntoPreRoll / beatInterval);
                if (beatIndex > lastBeatIndex && beatIndex < 4) {
                    lastBeatIndex = beatIndex;
                    playClick(beatIndex === 0);
                }
            } else {
                if (!audioStarted) {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log(e));
                    audioStarted = true;
                }
                elapsedTime = audio.currentTime;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawUI(); drawCombo(); 

            // Spawn notes whose time has come
            for (let i = notes.length - 1; i >= 0; i--) {
                let note = notes[i];
                if (elapsedTime >= note.time - APPROACH_TIME) {
                    if (note.type === 'slide') {
                        let getPosFunc = (key) => NODE_POSITIONS[key] || { x: CENTER.x, y: CENTER.y };
                        let behaviour = new SlideBehaviour(note, note, getPosFunc);
                        activeSlideBehaviours.push({ note, behaviour });
                    }
                    notes.splice(i, 1);
                }
            }

            // Update active slide behaviours
            for (let i = activeSlideBehaviours.length - 1; i >= 0; i--) {
                let item = activeSlideBehaviours[i];
                let timeSinceStart = elapsedTime - item.note.time;
                
                item.behaviour.UpdateSegments(timeSinceStart, false, 3); // slideTolerance = 3

                // Draw slide tracks & star/arrows
                drawSlidePath(item.behaviour);

                if (item.behaviour.judged || timeSinceStart > item.note.duration + 0.5) {
                    if (!item.behaviour.judged) {
                        let targetPos = NODE_POSITIONS[item.note.pos] || { x: CENTER.x, y: CENTER.y };
                        spawnJudgement("MISS", "#888", targetPos.x, targetPos.y);
                        combo = 0;
                    }
                    activeSlideBehaviours.splice(i, 1);
                }
            }

            drawClickEffects(); drawJudgements(elapsedTime);
            requestAnimationFrame(gameLoop);
        }

        function drawSlidePath(behaviour) {
            for (let segData of behaviour.segments) {
                let gen = segData.generator;
                ctx.beginPath();
                let p0 = gen.GetPoint(0).position;
                ctx.moveTo(p0.x, p0.y);
                let steps = 20;
                for (let s = 1; s <= steps; s++) {
                    let pt = gen.GetPoint(s / steps).position;
                    ctx.lineTo(pt.x, pt.y);
                }
                ctx.strokeStyle = 'rgba(0, 180, 255, 0.5)';
                ctx.lineWidth = 20;
                ctx.stroke();

                // Draw Star at current progress
                let totalProgress = Math.min(1.0, (audio.currentTime - behaviour.path.time) / behaviour.path.duration);
                let currentPt = gen.GetPoint(totalProgress).position;
                drawStar(currentPt.x, currentPt.y, 5, BUTTON_RADIUS * 0.7, BUTTON_RADIUS * 0.35, audio.currentTime * 4);
            }
        }

        function drawUI() {
            ctx.beginPath(); ctx.arc(CENTER.x, CENTER.y, RING_RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = 3; ctx.stroke();

            ctx.font = `bold ${BUTTON_RADIUS * 0.45}px Arial`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            Object.keys(NODE_POSITIONS).forEach(key => {
                let node = NODE_POSITIONS[key];
                if (node.type === 'A') {
                    ctx.beginPath(); ctx.arc(node.x, node.y, BUTTON_RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = node.active ? '#0ff' : 'rgba(0, 0, 0, 0.5)'; ctx.fill();
                    ctx.strokeStyle = '#0ff'; ctx.lineWidth = 1; ctx.stroke();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)'; ctx.fillText(key, node.x, node.y);
                }
            });
        }

        function drawCombo() {
            if (combo > 0) {
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = `bold ${BUTTON_RADIUS * 1.5}px Arial`; ctx.lineWidth = 6;
                ctx.strokeStyle = '#111'; ctx.strokeText(combo, CENTER.x, CENTER.y - BUTTON_RADIUS * 0.2);
                ctx.fillStyle = '#ffcc00'; ctx.fillText(combo, CENTER.x, CENTER.y - BUTTON_RADIUS * 0.2);
            }
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius, rotation) {
            let rot = Math.PI / 2 * 3, x = cx, y = cy, step = Math.PI / spikes;
            ctx.beginPath(); ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot + rotation) * outerRadius; y = cy + Math.sin(rot + rotation) * outerRadius; ctx.lineTo(x, y); rot += step;
                x = cx + Math.cos(rot + rotation) * innerRadius; y = cy + Math.sin(rot + rotation) * innerRadius; ctx.lineTo(x, y); rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius); ctx.closePath(); ctx.fillStyle = '#00aaff'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        }

        function spawnClickEffect(x, y, color = '#0ff') { clickEffects.push({ x: x, y: y, radius: BUTTON_RADIUS * 0.5, alpha: 1.0, color: color }); }
        
        function drawClickEffects() {
            for (let i = clickEffects.length - 1; i >= 0; i--) {
                let eff = clickEffects[i]; eff.radius += 3; eff.alpha -= 0.06;
                if (eff.alpha <= 0) { clickEffects.splice(i, 1); continue; }
                ctx.save(); ctx.beginPath(); ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
                ctx.strokeStyle = eff.color; ctx.lineWidth = 3; ctx.globalAlpha = eff.alpha; ctx.stroke(); ctx.restore();
            }
        }

        function spawnJudgement(text, color, jX, jY) { judgements.push({ text: text, color: color, x: jX, y: jY - 25, spawnTime: audio.currentTime }); }
        
        function drawJudgements(elapsedTime) {
            for (let i = judgements.length - 1; i >= 0; i--) {
                let j = judgements[i]; let age = elapsedTime - j.spawnTime;
                if (age > 0.5) { judgements.splice(i, 1); continue; }
                ctx.fillStyle = j.color; ctx.font = `bold ${BUTTON_RADIUS * 0.8}px Arial`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 2; ctx.strokeStyle = '#000';
                ctx.globalAlpha = 1 - (age / 0.5); 
                let dropY = j.y - (age * 30);
                ctx.strokeText(j.text, j.x, dropY); ctx.fillText(j.text, j.x, dropY); 
                ctx.globalAlpha = 1.0;
            }
        }

        let touchState = {};
        function handleTouches(e) {
            e.preventDefault(); 
            let rect = canvas.getBoundingClientRect();
            
            for(let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                let tx = touch.clientX - rect.left, ty = touch.clientY - rect.top;

                if (e.type === 'touchend' || e.type === 'touchcancel') {
                    delete touchState[touch.identifier];
                    continue;
                }

                let currentlyTouched = new Set();
                Object.keys(NODE_POSITIONS).forEach(key => {
                    let node = NODE_POSITIONS[key];
                    if (Math.hypot(tx - node.x, ty - node.y) < BUTTON_RADIUS * 1.5) currentlyTouched.add(key);
                });

                let previouslyTouched = touchState[touch.identifier] || new Set();
                currentlyTouched.forEach(key => {
                    if (!previouslyTouched.has(key)) {
                        NODE_POSITIONS[key].active = true;
                        spawnClickEffect(NODE_POSITIONS[key].x, NODE_POSITIONS[key].y, '#0ff');
                        setTimeout(() => NODE_POSITIONS[key].active = false, 100);
                    }
                });
                touchState[touch.identifier] = currentlyTouched;
            }
        }

        canvas.addEventListener('touchstart', handleTouches, {passive: false});
        canvas.addEventListener('touchmove', handleTouches, {passive: false});
        canvas.addEventListener('touchend', handleTouches, {passive: false});
        canvas.addEventListener('touchcancel', handleTouches, {passive: false});
    </script>
</body>
</html>
