<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Maimai DX Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000; color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            touch-action: none; user-select: none;
        }
        #bgVideo {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; object-fit: cover;
            z-index: -2; display: none; opacity: 0.5;
        }
        #ui {
            position: absolute; z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px; border-radius: 15px;
            border: 2px solid #0ff; text-align: center;
            box-shadow: 0 0 20px #0ff;
            min-width: 300px;
        }
        #fullscreenBtn {
            position: absolute;
            top: 15px; right: 15px; z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            color: #fff; border: 1px solid #0ff;
            border-radius: 8px; padding: 10px 15px;
            cursor: pointer; font-weight: bold;
        }
        #fullscreenBtn:hover { background: rgba(0, 255, 255, 0.2); }
        
        #gameCanvas {
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
            display: none;
        }
        button:not(#fullscreenBtn), input[type="file"], select {
            padding: 12px; font-size: 16px; margin: 10px;
            border-radius: 8px; border: none; cursor: pointer;
            width: 90%; box-sizing: border-box;
        }
        select { background: #222; color: #fff; border: 1px solid #0ff; outline: none; }
        button:not(#fullscreenBtn) { background: #0ff; color: #000; font-weight: bold; }
        button:disabled { background: #555; color: #888; }
        .setting { margin: 15px 0; }
        input[type="range"] { width: 90%; }
        
        #difficultyContainer {
            display: none;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <video id="bgVideo" autoplay loop muted></video>
    <button id="fullscreenBtn">⛶ Fullscreen</button>

    <div id="ui">
        <h2>maimai DX Simulator</h2>
        <input type="file" id="adxUpload" accept=".adx,.zip" />
        
        <div id="difficultyContainer">
            <label style="font-weight: bold; color: #0ff;">Select Difficulty:</label>
            <select id="diffSelect"></select>
        </div>

        <div class="setting">
            <label>Note Speed: <span id="speedVal">1.5</span></label><br>
            <input type="range" id="speedSlider" min="0.5" max="3.5" step="0.1" value="1.5">
            <p style="font-size: 12px; color: #aaa;">(Higher = Faster Approach)</p>
        </div>

        <button id="startBtn" disabled>Upload .adx to Start</button>
        <p id="statusText" style="color: #0ff;">Waiting for file...</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let CENTER = { x: 0, y: 0 };
        let RING_RADIUS = 0;
        let BUTTON_RADIUS = 0;
        
        // Master node dictionary (A1-A8, B1-B8, C, D1-D8, E1-E8)
        let NODE_POSITIONS = {};

        let availableCharts = {};
        let globalAudioOffset = 0;

        let notes = [];
        let activeNotes = [];
        let judgements = [];
        let clickEffects = [];
        let audio = new Audio();
        let isPlaying = false;
        let combo = 0;

        let APPROACH_TIME = 3.0; 
        const speedSlider = document.getElementById('speedSlider');
        speedSlider.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            document.getElementById('speedVal').innerText = val.toFixed(1);
            APPROACH_TIME = 4.5 - val;
        });

        // --- FULLSCREEN TOGGLE ---
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        });

        // --- RESIZE CANVAS TO FIT ANY SCREEN & GENERATE NODES ---
        function resizeCanvas() {
            let size = Math.min(window.innerWidth, window.innerHeight) * 0.95;
            canvas.width = size;
            canvas.height = size;
            CENTER = { x: size / 2, y: size / 2 };
            RING_RADIUS = size * 0.38;
            BUTTON_RADIUS = size * 0.07;

            NODE_POSITIONS = {};
            NODE_POSITIONS['C'] = { x: CENTER.x, y: CENTER.y, type: 'C', active: false };

            for (let i = 1; i <= 8; i++) {
                // Top is -90 degrees in Canvas. Maimai A1 is clockwise from top (22.5 deg shift)
                let aAngle = -90 + (i - 1) * 45 + 22.5; 
                let dAngle = -90 + (i - 1) * 45; 

                let aRad = aAngle * (Math.PI / 180);
                let dRad = dAngle * (Math.PI / 180);

                NODE_POSITIONS[`A${i}`] = { x: CENTER.x + Math.cos(aRad) * RING_RADIUS, y: CENTER.y + Math.sin(aRad) * RING_RADIUS, type: 'A', active: false };
                NODE_POSITIONS[`B${i}`] = { x: CENTER.x + Math.cos(aRad) * (RING_RADIUS * 0.5), y: CENTER.y + Math.sin(aRad) * (RING_RADIUS * 0.5), type: 'B', active: false };
                NODE_POSITIONS[`D${i}`] = { x: CENTER.x + Math.cos(dRad) * (RING_RADIUS * 0.85), y: CENTER.y + Math.sin(dRad) * (RING_RADIUS * 0.85), type: 'D', active: false };
                NODE_POSITIONS[`E${i}`] = { x: CENTER.x + Math.cos(dRad) * (RING_RADIUS * 0.4), y: CENTER.y + Math.sin(dRad) * (RING_RADIUS * 0.4), type: 'E', active: false };
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- 1. UNZIP & EXTRACT DIFFICULTIES ---
        document.getElementById('adxUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('statusText').innerText = "Unzipping chart...";
            document.getElementById('difficultyContainer').style.display = 'none';
            document.getElementById('startBtn').disabled = true;

            JSZip.loadAsync(file).then(async function(zip) {
                let audioFile = zip.file(/track\.(mp3|ogg|wav)/i)[0];
                if (audioFile) {
                    let blob = await audioFile.async("blob");
                    audio.src = URL.createObjectURL(blob);
                }

                let pvFile = zip.file(/pv\.mp4/i)[0];
                let bgFile = zip.file(/bg\.(jpg|png)/i)[0];
                if (pvFile) {
                    let blob = await pvFile.async("blob");
                    document.getElementById('bgVideo').src = URL.createObjectURL(blob);
                    document.getElementById('bgVideo').style.display = 'block';
                } else if (bgFile) {
                    let blob = await bgFile.async("blob");
                    document.body.style.backgroundImage = `url(${URL.createObjectURL(blob)})`;
                    document.body.style.backgroundSize = "cover";
                    document.body.style.backgroundPosition = "center";
                }

                let maidataFile = zip.file(/maidata\.txt/i)[0];
                if (maidataFile) {
                    let text = await maidataFile.async("string");
                    extractAvailableCharts(text);
                    
                    if (Object.keys(availableCharts).length > 0) {
                        populateDifficultyUI();
                        document.getElementById('statusText').innerText = "File loaded! Ready to play.";
                        document.getElementById('startBtn').disabled = false;
                        document.getElementById('startBtn').innerText = "START GAME";
                        document.getElementById('difficultyContainer').style.display = 'block';
                    } else {
                        document.getElementById('statusText').innerText = "Error: No playable charts found in maidata.txt.";
                    }
                }
            }).catch(err => {
                document.getElementById('statusText').innerText = "Error loading file!";
                console.error(err);
            });
        });

        function extractAvailableCharts(text) {
            availableCharts = {};
            let firstMatch = text.match(/&first=([\d\.\-]+)/);
            globalAudioOffset = firstMatch ? parseFloat(firstMatch[1]) : 0.0;

            const difficultyNames = { 1: "Basic", 2: "Advanced", 3: "Expert", 4: "Master", 5: "Re:Master", 6: "Utage" };

            for (let i = 1; i <= 6; i++) {
                let regex = new RegExp(`&inote_${i}=([^&]+)`);
                let match = text.match(regex);
                if (match) { availableCharts[i] = { name: difficultyNames[i], data: match[1] }; }
            }
        }

        function populateDifficultyUI() {
            const select = document.getElementById('diffSelect');
            select.innerHTML = ''; 
            let highestDiff = 1;
            for (let key in availableCharts) {
                let option = document.createElement('option');
                option.value = key; option.text = availableCharts[key].name;
                select.appendChild(option);
                highestDiff = key;
            }
            select.value = highestDiff; 
        }

        // --- 2. ADVANCED SIMAI PARSER & SLIDE PATHING ---
        function parseDuration(str, bpm) {
            let parts = str.replace(/[\[\]]/g, '').split(':');
            if (parts.length === 2) {
                let div = parseFloat(parts[0]);
                let ticks = parseFloat(parts[1]);
                return (240 / bpm) / div * ticks;
            }
            return 0;
        }

        function parseChartString(chartStr, offsetTime) {
            let parsedNotes = [];
            let currentTime = offsetTime;
            
            let cleanStr = chartStr.replace(/\s+/g, ''); 
            let blocks = cleanStr.split(',');
            let currentBPM = 120;
            let currentDivisor = 4;

            for (let block of blocks) {
                if (!block) {
                    currentTime += (240 / currentBPM) / currentDivisor;
                    continue;
                }

                let bpmMatch = block.match(/\(([\d\.]+)\)/);
                if (bpmMatch) {
                    currentBPM = parseFloat(bpmMatch[1]);
                    block = block.replace(/\([\d\.]+\)/, '');
                }

                let divMatch = block.match(/\{([\d\.]+)\}/);
                if (divMatch) {
                    currentDivisor = parseFloat(divMatch[1]);
                    block = block.replace(/\{[\d\.]+\}/, '');
                }

                let elements = block.split('/');
                for (let el of elements) {
                    if (!el) continue;

                    // 1. Touch Hold: A1h[...], B2h[...], Ch[...]
                    let touchHoldMatch = el.match(/^([A-E][1-8]?|C)h\[(.*?)\]/);
                    if (touchHoldMatch) {
                        let duration = parseDuration(touchHoldMatch[2], currentBPM);
                        parsedNotes.push({ type: 'hold_touch', time: currentTime, pos: touchHoldMatch[1], duration: duration, isChord: false, state: 'waiting' });
                        continue;
                    }

                    // 2. Standard Hold: 1h[...] -> mapped to A1
                    let holdMatch = el.match(/^([1-8])h\[(.*?)\]/);
                    if (holdMatch) {
                        let duration = parseDuration(holdMatch[2], currentBPM);
                        parsedNotes.push({ type: 'hold', time: currentTime, pos: `A${holdMatch[1]}`, duration: duration, isChord: false, state: 'waiting' });
                        continue;
                    }

                    // 3. Slides (Waypoints & Arcs): 1-5[...], 1-B1-C-B5[...], 1v5[...]
                    let slideMatch = el.match(/^([1-8])([a-zA-Z\-\^\<\>]+[A-E1-8C]+)(?:\[(.*?)\])?/);
                    if (slideMatch) {
                        let startNode = `A${slideMatch[1]}`;
                        let pathStr = slideMatch[2]; // e.g., "-B1-C", "v4", "^5"
                        let slideDur = slideMatch[3] ? parseDuration(slideMatch[3], currentBPM) : (240 / currentBPM) / 2;
                        
                        parsedNotes.push({ 
                            type: 'slide_head', time: currentTime, pos: startNode, pathStr: pathStr, duration: slideDur, state: 'waiting', isChord: false 
                        });
                        continue;
                    }

                    // 4. Touch Tap: A1, B5, C
                    let touchMatch = el.match(/^([A-E][1-8]?|C)$/);
                    if (touchMatch) {
                        parsedNotes.push({ type: 'touch', time: currentTime, pos: touchMatch[1], isChord: false, state: 'waiting' });
                        continue;
                    }

                    // 5. Standard Tap: 1-8 -> mapped to A1-A8
                    let tapMatch = el.match(/^([1-8])$/);
                    if (tapMatch) {
                        parsedNotes.push({ type: 'tap', time: currentTime, pos: `A${tapMatch[1]}`, isChord: false, state: 'waiting' });
                    }
                }
                currentTime += (240 / currentBPM) / currentDivisor;
            }

            // Flag Chords
            let timeGroups = {};
            parsedNotes.forEach(note => {
                let t = note.time.toFixed(4); 
                if (!timeGroups[t]) timeGroups[t] = [];
                timeGroups[t].push(note);
            });
            for (let t in timeGroups) {
                if (timeGroups[t].length > 1) { timeGroups[t].forEach(note => note.isChord = true); }
            }

            return parsedNotes;
        }

        // --- PATH GENERATOR ---
        function calculateSlidePoints(pathStr, startPosKey) {
            let nodes = [NODE_POSITIONS[startPosKey]];
            let normalizedStr = pathStr.replace(/v/g, '-C-'); // Convert v-shape to center waypoint

            let regex = /([A-E][1-8]?|C|[1-8])/g;
            let match;
            while ((match = regex.exec(normalizedStr)) !== null) {
                let key = match[1];
                if (/^[1-8]$/.test(key)) key = `A${key}`; // Map legacy 1-8 to outer ring
                if (NODE_POSITIONS[key]) nodes.push(NODE_POSITIONS[key]);
            }

            if (nodes.length === 1) nodes.push(NODE_POSITIONS['C']); // Safe fallback

            let segments = [];
            let totalLen = 0;
            for(let i=0; i<nodes.length-1; i++) {
                let dx = nodes[i+1].x - nodes[i].x;
                let dy = nodes[i+1].y - nodes[i].y;
                let len = Math.hypot(dx, dy);
                segments.push(len);
                totalLen += len;
            }
            return { points: nodes, segments: segments, totalLength: totalLen };
        }

        // --- 3. GAME ENGINE & DRAWING ---
        document.getElementById('startBtn').addEventListener('click', () => {
            let selectedDiff = document.getElementById('diffSelect').value;
            notes = parseChartString(availableCharts[selectedDiff].data, globalAudioOffset);

            document.getElementById('ui').style.display = 'none';
            canvas.style.display = 'block';
            
            activeNotes = JSON.parse(JSON.stringify(notes));
            combo = 0; 
            
            if (document.getElementById('bgVideo').src) document.getElementById('bgVideo').currentTime = 0;
            audio.play();
            isPlaying = true;
            requestAnimationFrame(gameLoop);
        });

        function gameLoop() {
            if (!isPlaying) return;
            let elapsedTime = audio.currentTime;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawUI();
            drawCombo(); 
            updateAndDrawNotes(elapsedTime);
            drawClickEffects();
            drawJudgements(elapsedTime);
            
            requestAnimationFrame(gameLoop);
        }

        function drawUI() {
            // Draw Outer Ring
            ctx.beginPath();
            ctx.arc(CENTER.x, CENTER.y, RING_RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Draw Sector Dividers (D1-D8 format based on image)
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            for (let i = 1; i <= 8; i++) {
                let angle = -90 + (i - 1) * 45; 
                let innerX = CENTER.x + Math.cos(angle * Math.PI / 180) * (RING_RADIUS * 0.35);
                let innerY = CENTER.y + Math.sin(angle * Math.PI / 180) * (RING_RADIUS * 0.35);
                let outerX = CENTER.x + Math.cos(angle * Math.PI / 180) * RING_RADIUS;
                let outerY = CENTER.y + Math.sin(angle * Math.PI / 180) * RING_RADIUS;
                ctx.beginPath(); ctx.moveTo(innerX, innerY); ctx.lineTo(outerX, outerY); ctx.stroke();
            }
            ctx.restore();

            // Draw Nodes
            ctx.font = `bold ${BUTTON_RADIUS * 0.45}px Arial`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

            Object.keys(NODE_POSITIONS).forEach(key => {
                let node = NODE_POSITIONS[key];
                if (node.type === 'A' || node.type === 'B') {
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, BUTTON_RADIUS * (node.type === 'B' ? 0.7 : 1), 0, Math.PI * 2);
                    ctx.fillStyle = node.active ? '#0ff' : 'rgba(0, 0, 0, 0.5)'; ctx.fill();
                    ctx.strokeStyle = '#0ff'; ctx.lineWidth = 1; ctx.stroke();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.fillText(key, node.x, node.y);
                } else if (node.type === 'C') {
                    ctx.fillStyle = node.active ? 'rgba(0, 255, 255, 0.4)' : 'rgba(0,0,0,0)';
                    ctx.fillRect(node.x - BUTTON_RADIUS, node.y - BUTTON_RADIUS, BUTTON_RADIUS*2, BUTTON_RADIUS*2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)'; ctx.fillText('C', node.x, node.y - BUTTON_RADIUS * 1.5);
                } else if (node.type === 'D' || node.type === 'E') {
                    ctx.fillStyle = node.active ? 'rgba(0, 255, 255, 0.4)' : 'rgba(255, 255, 255, 0.3)';
                    ctx.fillText(key, node.x, node.y);
                }
            });
        }

        function drawCombo() {
            if (combo > 0) {
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = `bold ${BUTTON_RADIUS * 1.5}px Arial`; ctx.lineWidth = 6;
                ctx.strokeStyle = '#111'; ctx.strokeText(combo, CENTER.x, CENTER.y - BUTTON_RADIUS * 0.2);
                ctx.fillStyle = '#ffcc00'; ctx.fillText(combo, CENTER.x, CENTER.y - BUTTON_RADIUS * 0.2);
                ctx.font = `bold ${BUTTON_RADIUS * 0.4}px Arial`; ctx.lineWidth = 4;
                ctx.strokeText("COMBO", CENTER.x, CENTER.y + BUTTON_RADIUS * 0.8);
                ctx.fillText("COMBO", CENTER.x, CENTER.y + BUTTON_RADIUS * 0.8);
            }
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius, rotation) {
            let rot = Math.PI / 2 * 3, x = cx, y = cy, step = Math.PI / spikes;
            ctx.beginPath(); ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot + rotation) * outerRadius; y = cy + Math.sin(rot + rotation) * outerRadius; ctx.lineTo(x, y); rot += step;
                x = cx + Math.cos(rot + rotation) * innerRadius; y = cy + Math.sin(rot + rotation) * innerRadius; ctx.lineTo(x, y); rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius); ctx.closePath(); ctx.fill(); ctx.stroke();
        }

        function spawnClickEffect(x, y, color = '#0ff') {
            clickEffects.push({ x: x, y: y, radius: BUTTON_RADIUS * 0.5, maxRadius: BUTTON_RADIUS * 1.8, alpha: 1.0, color: color });
        }

        function drawClickEffects() {
            for (let i = clickEffects.length - 1; i >= 0; i--) {
                let eff = clickEffects[i];
                eff.radius += 3; eff.alpha -= 0.06;
                if (eff.alpha <= 0) { clickEffects.splice(i, 1); continue; }
                ctx.save(); ctx.beginPath(); ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
                ctx.strokeStyle = eff.color; ctx.lineWidth = 3; ctx.globalAlpha = eff.alpha; ctx.stroke(); ctx.restore();
            }
        }

        function updateAndDrawNotes(elapsedTime) {
            for (let i = activeNotes.length - 1; i >= 0; i--) {
                let note = activeNotes[i];
                let target = NODE_POSITIONS[note.pos];
                if (!target) continue;

                // Processing ongoing Holds
                if ((note.type === 'hold' || note.type === 'hold_touch') && note.state === 'holding') {
                    if (elapsedTime >= note.time + note.duration) {
                        spawnJudgement("CRITICAL", "#ffd700", target.x, target.y);
                        combo++; activeNotes.splice(i, 1); continue;
                    }
                    let holdProgress = (elapsedTime - note.time) / note.duration;
                    
                    if (note.type === 'hold') {
                        let tailDist = RING_RADIUS * (1 - Math.min(1, holdProgress));
                        let tX = CENTER.x + (target.x - CENTER.x) * (tailDist / RING_RADIUS);
                        let tY = CENTER.y + (target.y - CENTER.y) * (tailDist / RING_RADIUS);
                        ctx.beginPath(); ctx.moveTo(target.x, target.y); ctx.lineTo(tX, tY);
                        ctx.strokeStyle = note.isChord ? 'rgba(255, 255, 0, 0.8)' : 'rgba(255, 0, 255, 0.8)';
                        ctx.lineWidth = BUTTON_RADIUS; ctx.stroke();
                    }

                    ctx.beginPath(); ctx.arc(target.x, target.y, BUTTON_RADIUS * 0.7, 0, Math.PI * 2);
                    ctx.fillStyle = note.isChord ? '#ffff00' : '#ff00ff'; ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                    continue;
                }

                // Processing Multi-node Slide Path
                if (note.type === 'slide_travel' && note.state === 'sliding') {
                    let travelProgress = (elapsedTime - note.time) / note.duration;
                    if (travelProgress >= 1.0) {
                        note.type = 'slide_destination';
                        note.pos = 'end_placeholder';
                        let lastNode = note.slideData.points[note.slideData.points.length-1];
                        note.finalX = lastNode.x; note.finalY = lastNode.y;
                        note.time = elapsedTime; 
                        continue;
                    }

                    let pData = note.slideData;
                    
                    // Draw entire track ahead
                    ctx.beginPath();
                    ctx.moveTo(pData.points[0].x, pData.points[0].y);
                    for(let p=1; p<pData.points.length; p++) ctx.lineTo(pData.points[p].x, pData.points[p].y);
                    ctx.strokeStyle = 'rgba(0, 170, 255, 0.3)'; ctx.lineWidth = 10; ctx.stroke();

                    // Calculate interpolated position
                    let currentDist = travelProgress * pData.totalLength;
                    let accum = 0, starX = pData.points[0].x, starY = pData.points[0].y;
                    
                    for(let s = 0; s < pData.segments.length; s++) {
                        if (currentDist <= accum + pData.segments[s]) {
                            let localP = (currentDist - accum) / pData.segments[s];
                            starX = pData.points[s].x + (pData.points[s+1].x - pData.points[s].x) * localP;
                            starY = pData.points[s].y + (pData.points[s+1].y - pData.points[s].y) * localP;
                            break;
                        }
                        accum += pData.segments[s];
                    }

                    ctx.fillStyle = '#00aaff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                    drawStar(starX, starY, 5, BUTTON_RADIUS * 0.7, BUTTON_RADIUS * 0.35, elapsedTime * 4);
                    continue;
                }

                let timeUntilHit = note.time - elapsedTime;
                let missWindow = (note.type === 'slide_destination') ? 0.3 : 0.16;
                if (timeUntilHit < -missWindow) {
                    spawnJudgement("MISS", "#888", note.finalX || target.x, note.finalY || target.y);
                    combo = 0; activeNotes.splice(i, 1); continue;
                }

                // Initial Approach Rendering
                if (timeUntilHit <= APPROACH_TIME) {
                    let progress = 1 - (timeUntilHit / APPROACH_TIME);
                    let tapColor = note.isChord ? '#ffff00' : '#ff00ff';

                    if (note.type === 'slide_destination') {
                        ctx.beginPath(); ctx.arc(note.finalX, note.finalY, BUTTON_RADIUS * 0.8, 0, Math.PI * 2);
                        ctx.fillStyle = '#00aaff'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
                    
                    } else if (note.type === 'touch' || note.type === 'hold_touch') {
                        // In-place shrinking ring for DX touch notes
                        let size = BUTTON_RADIUS * 2 + (BUTTON_RADIUS * (1 - progress) * 4);
                        ctx.strokeStyle = `rgba(0, 200, 255, ${progress})`; ctx.lineWidth = 4;
                        ctx.strokeRect(target.x - size/2, target.y - size/2, size, size);
                        
                        ctx.fillStyle = `rgba(0, 150, 255, ${progress * 0.8})`;
                        ctx.fillRect(target.x - BUTTON_RADIUS/1.5, target.y - BUTTON_RADIUS/1.5, BUTTON_RADIUS*1.3, BUTTON_RADIUS*1.3);
                        if(note.type === 'hold_touch') {
                            ctx.strokeStyle = '#ff00ff'; ctx.strokeRect(target.x - BUTTON_RADIUS/1.5, target.y - BUTTON_RADIUS/1.5, BUTTON_RADIUS*1.3, BUTTON_RADIUS*1.3);
                        }

                    } else {
                        // Standard notes approaching from center
                        let cx = CENTER.x + (target.x - CENTER.x) * progress;
                        let cy = CENTER.y + (target.y - CENTER.y) * progress;

                        if (note.type === 'slide_head') {
                            ctx.fillStyle = note.isChord ? '#ffff00' : '#00aaff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                            drawStar(cx, cy, 5, BUTTON_RADIUS * 0.8, BUTTON_RADIUS * 0.4, elapsedTime * 4);
                        
                        } else if (note.type === 'hold') {
                            let tailTimeUntil = (note.time + note.duration) - elapsedTime;
                            let tailProgress = Math.max(0, 1 - (tailTimeUntil / APPROACH_TIME));
                            let tX = CENTER.x + (target.x - CENTER.x) * tailProgress;
                            let tY = CENTER.y + (target.y - CENTER.y) * tailProgress;
                            
                            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(tX, tY);
                            ctx.strokeStyle = note.isChord ? 'rgba(255, 255, 0, 0.6)' : 'rgba(255, 0, 255, 0.6)';
                            ctx.lineWidth = BUTTON_RADIUS; ctx.stroke();

                            ctx.beginPath(); ctx.arc(cx, cy, BUTTON_RADIUS * 0.7, 0, Math.PI * 2);
                            ctx.fillStyle = tapColor; ctx.fill();
                        } else {
                            ctx.beginPath(); ctx.arc(cx, cy, BUTTON_RADIUS * 0.7, 0, Math.PI * 2);
                            ctx.fillStyle = tapColor; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
                        }
                    }
                }
            }
        }

        // --- 4. JUDGEMENTS ---
        function spawnJudgement(text, color, jX, jY) {
            // Push text up slightly so it doesn't block the button
            judgements.push({ text: text, color: color, x: jX, y: jY - 25, spawnTime: audio.currentTime });
        }

        function drawJudgements(elapsedTime) {
            for (let i = judgements.length - 1; i >= 0; i--) {
                let j = judgements[i];
                let age = elapsedTime - j.spawnTime;
                if (age > 0.5) { judgements.splice(i, 1); continue; }

                ctx.fillStyle = j.color; ctx.font = `bold ${BUTTON_RADIUS * 0.8}px Arial`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.lineWidth = 2; ctx.strokeStyle = '#000';
                ctx.globalAlpha = 1 - (age / 0.5); 
                
                let dropY = j.y - (age * 30);
                ctx.strokeText(j.text, j.x, dropY); ctx.fillText(j.text, j.x, dropY); 
                ctx.globalAlpha = 1.0;
            }
        }

        // --- 5. TOUCH COLLISION ---
        let touchState = {}; 

        function handleTouches(e) {
            e.preventDefault(); 
            let rect = canvas.getBoundingClientRect();
            
            for(let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                let tx = touch.clientX - rect.left;
                let ty = touch.clientY - rect.top;

                if (e.type === 'touchend' || e.type === 'touchcancel') {
                    let releasedNodes = touchState[touch.identifier] || new Set();
                    releasedNodes.forEach(nodeKey => checkHoldRelease(nodeKey));
                    delete touchState[touch.identifier];
                    continue;
                }

                let currentlyTouched = new Set();
                Object.keys(NODE_POSITIONS).forEach(key => {
                    let node = NODE_POSITIONS[key];
                    if (Math.hypot(tx - node.x, ty - node.y) < BUTTON_RADIUS * 1.5) {
                        currentlyTouched.add(key);
                    }
                });

                let previouslyTouched = touchState[touch.identifier] || new Set();
                currentlyTouched.forEach(key => {
                    if (!previouslyTouched.has(key)) {
                        NODE_POSITIONS[key].active = true;
                        spawnClickEffect(NODE_POSITIONS[key].x, NODE_POSITIONS[key].y, '#0ff');
                        checkHit(key);
                        setTimeout(() => NODE_POSITIONS[key].active = false, 100);
                    }
                });

                touchState[touch.identifier] = currentlyTouched;
            }
        }

        canvas.addEventListener('touchstart', handleTouches, {passive: false});
        canvas.addEventListener('touchmove', handleTouches, {passive: false});
        canvas.addEventListener('touchend', handleTouches, {passive: false});
        canvas.addEventListener('touchcancel', handleTouches, {passive: false});

        function checkHit(posKey) {
            let elapsedTime = audio.currentTime;
            for (let i = 0; i < activeNotes.length; i++) {
                let note = activeNotes[i];
                if (note.pos === posKey) {
                    let diff = Math.abs(note.time - elapsedTime);
                    let hitWindow = (note.type === 'slide_destination') ? 0.3 : 0.16;
                    let target = NODE_POSITIONS[note.pos] || {x: note.finalX, y: note.finalY};

                    if (diff <= hitWindow) {
                        if (note.type === 'hold' || note.type === 'hold_touch') {
                            note.state = 'holding';
                            spawnJudgement("PERFECT", "#ffeb3b", target.x, target.y);
                            combo++; return; 
                        } 
                        else if (note.type === 'slide_head') {
                            note.type = 'slide_travel'; note.state = 'sliding';
                            note.slideData = calculateSlidePoints(note.pathStr, note.pos);
                            note.time = elapsedTime; 
                            spawnJudgement("GREAT", "#ff8c00", target.x, target.y);
                            combo++; return;
                        } 
                        else if (note.type === 'slide_destination') {
                            spawnJudgement("CRITICAL", "#ffd700", target.x, target.y);
                            combo++; activeNotes.splice(i, 1); break;
                        }
                        else {
                            if (diff <= 0.03) { spawnJudgement("CRITICAL", "#ffd700", target.x, target.y); combo++; }
                            else if (diff <= 0.06) { spawnJudgement("PERFECT", "#ffeb3b", target.x, target.y); combo++; }
                            else if (diff <= 0.10) { spawnJudgement("GREAT", "#ff8c00", target.x, target.y); combo++; }
                            else { spawnJudgement("GOOD", "#00ff00", target.x, target.y); combo++; }
                            
                            activeNotes.splice(i, 1); break;
                        }
                    }
                }
            }
        }

        function checkHoldRelease(posKey) {
            let elapsedTime = audio.currentTime;
            for (let i = activeNotes.length - 1; i >= 0; i--) {
                let note = activeNotes[i];
                if ((note.type === 'hold' || note.type === 'hold_touch') && note.pos === posKey && note.state === 'holding') {
                    let target = NODE_POSITIONS[note.pos];
                    if (elapsedTime < note.time + note.duration - 0.15) {
                        spawnJudgement("MISS", "#888", target.x, target.y); combo = 0;
                    } else {
                        spawnJudgement("PERFECT", "#ffeb3b", target.x, target.y); combo++;
                    }
                    activeNotes.splice(i, 1); break;
                }
            }
        }
    </script>
