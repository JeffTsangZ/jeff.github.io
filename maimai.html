<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Maimai (.adx Simulator)</title>
    <!-- Include JSZip to extract the .adx file in the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* Prevent scrolling on mobile */
            touch-action: none; /* Crucial for touch screens */
        }
        #bgVideo {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: -2;
            display: none;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6); /* Darken BG so notes are visible */
            z-index: -1;
        }
        #ui {
            margin-top: 10px;
            text-align: center;
            z-index: 10;
        }
        #gameCanvas {
            border-radius: 50%;
            margin-top: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            background: rgba(0,0,0,0.4);
        }
        button, input {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <video id="bgVideo" autoplay loop muted></video>
    <div id="overlay"></div>

    <div id="ui">
        <h2>Web Maimai Prototype</h2>
        <input type="file" id="adxUpload" accept=".adx,.zip" />
        <br>
        <button id="startBtn" disabled>Loading Data... (Upload File First)</button>
        <p id="statusText">Waiting for .adx file...</p>
    </div>

    <!-- Canvas sized for most screens (can be adjusted) -->
    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const CENTER = { x: canvas.width / 2, y: canvas.height / 2 };
        const RING_RADIUS = 250;
        const BUTTON_RADIUS = 35; // Larger for touch screens
        
        let buttons = [];
        for (let i = 0; i < 8; i++) {
            let angle = (i * 45 + 22.5) * (Math.PI / 180); // Maimai starting angle
            buttons.push({
                x: CENTER.x + Math.cos(angle) * RING_RADIUS,
                y: CENTER.y + Math.sin(angle) * RING_RADIUS,
                angle: angle,
                active: false
            });
        }

        let notes = [];
        let activeNotes = [];
        let audio = new Audio();
        let isPlaying = false;
        let startTime = 0;
        const APPROACH_TIME = 1.5; // How fast notes travel (seconds)
        const GLOBAL_OFFSET = 0; // Adjust if audio and notes are out of sync

        // --- 1. FILE UPLOAD & UNZIPPING ---
        document.getElementById('adxUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('statusText').innerText = "Unzipping file...";

            JSZip.loadAsync(file).then(function(zip) {
                // 1. Load Audio
                let audioFile = zip.file(/track\.(mp3|ogg)/i)[0];
                if (audioFile) {
                    audioFile.async("blob").then(blob => {
                        audio.src = URL.createObjectURL(blob);
                    });
                }

                // 2. Load Background Video or Image
                let pvFile = zip.file(/pv\.mp4/i)[0];
                let bgFile = zip.file(/bg\.(jpg|png)/i)[0];
                
                if (pvFile) {
                    pvFile.async("blob").then(blob => {
                        const vid = document.getElementById('bgVideo');
                        vid.src = URL.createObjectURL(blob);
                        vid.style.display = 'block';
                    });
                } else if (bgFile) {
                    bgFile.async("blob").then(blob => {
                        document.body.style.backgroundImage = `url(${URL.createObjectURL(blob)})`;
                        document.body.style.backgroundSize = "cover";
                        document.body.style.backgroundPosition = "center";
                    });
                }

                // 3. Load and Parse Chart (maidata.txt)
                let maidataFile = zip.file(/maidata\.txt/i)[0];
                if (maidataFile) {
                    maidataFile.async("string").then(text => {
                        notes = parseMaidata(text);
                        document.getElementById('statusText').innerText = `Chart loaded! Found ${notes.length} notes.`;
                        document.getElementById('startBtn').disabled = false;
                        document.getElementById('startBtn').innerText = "START GAME";
                    });
                }
            }).catch(err => {
                document.getElementById('statusText').innerText = "Error reading zip file!";
                console.error(err);
            });
        });

        // --- 2. MAIDATA (SIMAI) PARSER ---
        function parseMaidata(text) {
            // Find the hardest difficulty available (usually inote_5 or inote_6)
            let chartMatch = text.match(/&inote_6=([^&]+)/) || text.match(/&inote_5=([^&]+)/) || text.match(/&inote_4=([^&]+)/);
            if (!chartMatch) return [];

            let chartStr = chartMatch[1].replace(/\s|\n|\r/g, ''); // Clean whitespace
            let parsedNotes = [];
            let currentBPM = 120;
            let currentDivisor = 4; // Default quarter notes
            let currentTime = GLOBAL_OFFSET;

            let elements = chartStr.split(',');

            for (let el of elements) {
                if (el === '') {
                    currentTime += (60 / currentBPM) * (4 / currentDivisor);
                    continue;
                }

                // Check for BPM changes: (150)
                let bpmMatch = el.match(/\(([\d\.]+)\)/);
                if (bpmMatch) {
                    currentBPM = parseFloat(bpmMatch[1]);
                    el = el.replace(/\([\d\.]+\)/, ''); // Remove from string
                }

                // Check for Divisor changes: {8}
                let divMatch = el.match(/\{([\d\.]+)\}/);
                if (divMatch) {
                    currentDivisor = parseFloat(divMatch[1]);
                    el = el.replace(/\{[\d\.]+\}/, '');
                }

                // Extract note positions (1 to 8). 
                // NOTE: This is a basic parser. It converts holds (1h) and slides (1-4) into basic taps.
                let taps = el.match(/[1-8]/g);
                if (taps) {
                    taps.forEach(t => {
                        parsedNotes.push({ time: currentTime, pos: parseInt(t) - 1 });
                    });
                }
                
                // Advance time by one beat
                currentTime += (60 / currentBPM) * (4 / currentDivisor);
            }
            return parsedNotes;
        }

        // --- 3. GAME ENGINE & TOUCH CONTROLS ---
        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('ui').style.display = 'none'; // Hide UI
            activeNotes = JSON.parse(JSON.stringify(notes)); // Clone notes
            
            // Try to sync video if it exists
            const vid = document.getElementById('bgVideo');
            if (vid.src) vid.currentTime = 0;
            
            audio.play();
            startTime = performance.now();
            isPlaying = true;
            requestAnimationFrame(gameLoop);
        });

        function gameLoop() {
            if (!isPlaying) return;
            // Use audio time to prevent desync
            let elapsedTime = audio.currentTime;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawUI();
            updateAndDrawNotes(elapsedTime);
            
            requestAnimationFrame(gameLoop);
        }

        function drawUI() {
            ctx.beginPath();
            ctx.arc(CENTER.x, CENTER.y, RING_RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 4;
            ctx.stroke();

            buttons.forEach((btn, index) => {
                ctx.beginPath();
                ctx.arc(btn.x, btn.y, BUTTON_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = btn.active ? '#0ff' : 'rgba(0, 0, 0, 0.5)';
                ctx.fill();
                ctx.strokeStyle = '#0ff';
                ctx.lineWidth = 3;
                ctx.stroke();
            });
        }

        function updateAndDrawNotes(elapsedTime) {
            for (let i = activeNotes.length - 1; i >= 0; i--) {
                let note = activeNotes[i];
                let timeUntilHit = note.time - elapsedTime;

                // Draw note if it's on screen
                if (timeUntilHit <= APPROACH_TIME && timeUntilHit >= -0.15) {
                    let progress = 1 - (timeUntilHit / APPROACH_TIME);
                    let targetBtn = buttons[note.pos];
                    
                    let currentX = CENTER.x + Math.cos(targetBtn.angle) * (RING_RADIUS * progress);
                    let currentY = CENTER.y + Math.sin(targetBtn.angle) * (RING_RADIUS * progress);

                    ctx.beginPath();
                    ctx.arc(currentX, currentY, 20, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff00ff';
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                // Remove notes you missed
                if (timeUntilHit < -0.15) {
                    activeNotes.splice(i, 1);
                }
            }
        }

        // TOUCH CONTROLS
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Stop screen from scrolling
            let rect = canvas.getBoundingClientRect();
            
            // Handle multiple fingers at once
            for(let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                // Scale coordinates to canvas size
                let scaleX = canvas.width / rect.width;
                let scaleY = canvas.height / rect.height;
                let tx = (touch.clientX - rect.left) * scaleX;
                let ty = (touch.clientY - rect.top) * scaleY;

                // Check which button was tapped
                buttons.forEach((btn, index) => {
                    let dist = Math.hypot(tx - btn.x, ty - btn.y);
                    if (dist < BUTTON_RADIUS * 2.5) { // Generous hitbox for fingers
                        btn.active = true;
                        checkHit(index);
                        setTimeout(() => btn.active = false, 100); // Visual flash
                    }
                });
            }
        }, {passive: false});

        function checkHit(posIndex) {
            let elapsedTime = audio.currentTime;
            for (let i = 0; i < activeNotes.length; i++) {
                let note = activeNotes[i];
                if (note.pos === posIndex) {
                    let diff = Math.abs(note.time - elapsedTime);
                    // 150ms hit window
                    if (diff < 0.15) {
                        activeNotes.splice(i, 1); // Note hit, remove from screen
                        break; // Only hit one note per tap
                    }
                }
            }
        }
    </script>
</body>
</html>
