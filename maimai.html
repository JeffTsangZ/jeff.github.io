<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroDX Slide Track Simulation Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0d0f12;
            color: #eceff4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        canvas {
            background: #12151c;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.15), inset 0 0 15px rgba(0, 0, 0, 0.8);
            cursor: crosshair;
            touch-action: none;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            background: #1a1d24;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid #2e3440;
            max-width: 600px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #88c0d0;
            font-weight: 600;
        }
        select, button, input[type="range"] {
            background: #2e3440;
            color: #eceff4;
            border: 1px solid #4c566a;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        select:hover, button:hover {
            background: #434c5e;
            border-color: #88c0d0;
        }
        button.active {
            background: #5e81ac;
            border-color: #81a1c1;
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 24px;
            pointer-events: none;
            font-family: monospace;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 0 0 6px rgba(0,0,0,0.8);
        }
        .hud-val {
            color: #a3be8c;
        }
        .hud-judgement {
            position: absolute;
            font-size: 24px;
            font-weight: 900;
            text-shadow: 0 0 10px currentColor;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="hud">
        <div>STATE: <span id="hud-state" class="hud-val">READY</span></div>
        <div>PROGRESS: <span id="hud-progress" class="hud-val">0%</span></div>
        <div>JUDGEMENT: <span id="hud-judge" class="hud-val">-</span></div>
    </div>
    
    <canvas id="stage" width="500" height="500"></canvas>

    <div class="controls">
        <div class="control-group">
            <label for="slide-type">Slide Pattern</label>
            <select id="slide-type">
                <option value="Straight">Straight (-)</option>
                <option value="RingCw">Ring Clockwise (v)</option>
                <option value="RingCcw">Ring Counter-CW (p)</option>
                <option value="Fold">Center Fold (v-shape)</option>
                <option value="CurveCw">Inner Curve CW</option>
                <option value="Fan">Fan Split (3-Way)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="auto-mode">Autoplay Mode</label>
            <select id="auto-mode">
                <option value="off">Manual Touch / Mouse</option>
                <option value="on" selected>Auto Playback</option>
            </select>
        </div>
        <div class="control-group">
            <label for="tolerance">Slide Tolerance</label>
            <input type="range" id="tolerance" min="0" max="3" value="1" step="1">
        </div>
        <div class="control-group" style="justify-content: flex-end;">
            <button id="btn-trigger">Trigger Slide</button>
        </div>
    </div>
</div>

<script>
/**
 * AstroDX Engine Mathematics & Constants
 * Ported from AstroDX.Utilities.Trigonometry and RenderManager[cite: 1]
 */
const TAU = Math.PI * 2;
const PLAYFIELD_RADIUS = 200;
const CENTER_RADIUS = 200 * 0.375; // CenterRadius from AstroDX[cite: 1]
const AREA_A_RADIUS = 200 * 0.65;
const AREA_B_RADIUS = 200 * 0.85;
const ARROW_DISTANCE = 24;

class Trigonometry {
    static rotate(v, angleRad) {
        const mag = Math.hypot(v.x, v.y);
        const orig = Math.atan2(v.y, v.x);
        const nAngle = orig + angleRad;
        return { x: Math.cos(nAngle) * mag, y: Math.sin(nAngle) * mag };
    }

    static toPolarAngle(pos, offset = null) {
        const dx = pos.x - (offset ? offset.x : 0);
        const dy = pos.y - (offset ? offset.y : 0);
        return Math.atan2(dy, dx);
    }

    static getTangentAngleDelta(adjacent, hypotenuse, clockwise) {
        const angleDiff = Math.acos(Math.min(1, Math.max(-1, adjacent / hypotenuse)));
        return clockwise ? -angleDiff : angleDiff;
    }

    static getAngleSpan(startRotation, endRotation, clockwise, wrapThreshold = TAU / 32) {
        let span = clockwise
            ? (startRotation - endRotation + 2 * TAU) % TAU
            : (endRotation - startRotation + 2 * TAU) % TAU;

        if (span <= wrapThreshold) span += TAU;
        return span;
    }
}

function getRotation(location) {
    const initialAngle = TAU / 4 - TAU / 16;
    let angle = initialAngle - (TAU / 8) * location.index;
    if (location.group === 'DSensor' || location.group === 'ESensor') {
        angle += TAU / 16;
    }
    return angle;
}

function getRadiusFromCenter(location) {
    switch (location.group) {
        case 'Tap': return PLAYFIELD_RADIUS;
        case 'ASensor': return AREA_A_RADIUS;
        case 'BSensor': return AREA_B_RADIUS;
        case 'CSensor': return 0;
        default: return PLAYFIELD_RADIUS;
    }
}

function getPositionRadial(rotationRadians, radius = PLAYFIELD_RADIUS) {
    return {
        x: Math.cos(rotationRadians) * radius,
        y: Math.sin(rotationRadians) * radius
    };
}

function getPosition(location) {
    const radius = getRadiusFromCenter(location);
    return getPositionRadial(getRotation(location), radius);
}

/**
 * Slide Generators
 * Ported from AstroDX.Contexts.Gameplay.SlideGenerators[cite: 1]
 */
class SlideGenerator {
    getLength() { return 0; }
    getPoint(t) { return { position: { x: 0, y: 0 }, rotation: 0 }; }
}

class StraightGenerator extends SlideGenerator {
    constructor(vertices) {
        super();
        this.startPoint = getPosition(vertices[0]);
        this.endPoint = getPosition(vertices[1]);
        const dx = this.endPoint.x - this.startPoint.x;
        const dy = this.endPoint.y - this.startPoint.y;
        this.length = Math.hypot(dx, dy);
        this.rotation = Math.atan2(dy, dx);
    }

    getLength() { return this.length; }

    getPoint(t) {
        const position = {
            x: this.startPoint.x + (this.endPoint.x - this.startPoint.x) * t,
            y: this.startPoint.y + (this.endPoint.y - this.startPoint.y) * t
        };
        return { position, rotation: this.rotation };
    }
}

class RingGenerator extends SlideGenerator {
    constructor(vertices, clockwise) {
        super();
        this.clockwise = clockwise;
        const inPos = getPosition(vertices[0]);
        const outPos = getPosition(vertices[1]);
        
        this.startRotation = Trigonometry.toPolarAngle(inPos);
        const outRadians = Trigonometry.toPolarAngle(outPos);

        this.angleSpan = Trigonometry.getAngleSpan(this.startRotation, outRadians, clockwise);
        this.startRadius = getRadiusFromCenter(vertices[0]);
        this.endRadius = getRadiusFromCenter(vertices[1]);
        this.length = this.angleSpan * (this.startRadius + this.endRadius) / 2;
    }

    getLength() { return this.length; }

    getPoint(t) {
        const radiusAtT = this.startRadius + (this.endRadius - this.startRadius) * t;
        const rotationAtT = this.clockwise
            ? this.startRotation - this.angleSpan * t
            : this.startRotation + this.angleSpan * t;

        const position = {
            x: Math.cos(rotationAtT) * radiusAtT,
            y: Math.sin(rotationAtT) * radiusAtT
        };
        const rotation = rotationAtT + (this.clockwise ? -TAU / 4 : TAU / 4);
        return { position, rotation };
    }
}

class FoldGenerator extends SlideGenerator {
    constructor(vertices) {
        super();
        this.startPoint = getPosition(vertices[0]);
        this.endPoint = getPosition(vertices[1]);
        this.midPoint = { x: 0, y: 0 };

        const startSeg = Math.hypot(this.midPoint.x - this.startPoint.x, this.midPoint.y - this.startPoint.y);
        const endSeg = Math.hypot(this.endPoint.x - this.midPoint.x, this.endPoint.y - this.midPoint.y);

        this.startSegmentLength = startSeg;
        this.totalLength = startSeg + endSeg;
        this.startRotation = Math.atan2(this.midPoint.y - this.startPoint.y, this.midPoint.x - this.startPoint.x);
        this.endRotation = Math.atan2(this.endPoint.y - this.midPoint.y, this.endPoint.x - this.midPoint.x);
    }

    getLength() { return this.totalLength; }

    getPoint(t) {
        const distanceFromStart = t * this.totalLength;
        if (distanceFromStart < this.startSegmentLength) {
            const localT = distanceFromStart / this.startSegmentLength;
            return {
                position: {
                    x: this.startPoint.x + (this.midPoint.x - this.startPoint.x) * localT,
                    y: this.startPoint.y + (this.midPoint.y - this.startPoint.y) * localT
                },
                rotation: this.startRotation
            };
        } else {
            const localT = (distanceFromStart - this.startSegmentLength) / (this.totalLength - this.startSegmentLength);
            return {
                position: {
                    x: this.midPoint.x + (this.endPoint.x - this.midPoint.x) * localT,
                    y: this.midPoint.y + (this.endPoint.y - this.midPoint.y) * localT
                },
                rotation: this.endRotation
            };
        }
    }
}

class CurveCwGenerator extends SlideGenerator {
    constructor(vertices) {
        super();
        const startRotation = getRotation(vertices[0]);
        const endRotation = getRotation(vertices[1]);

        this.tangentInRotation = startRotation + Trigonometry.getTangentAngleDelta(CENTER_RADIUS, PLAYFIELD_RADIUS, true);
        const tangentOutRotation = endRotation + Trigonometry.getTangentAngleDelta(CENTER_RADIUS, PLAYFIELD_RADIUS, false);

        this.startPoint = getPositionRadial(startRotation, PLAYFIELD_RADIUS);
        this.tangentInPoint = getPositionRadial(this.tangentInRotation, CENTER_RADIUS);
        this.tangentOutPoint = getPositionRadial(tangentOutRotation, CENTER_RADIUS);
        this.endPoint = getPositionRadial(endRotation, PLAYFIELD_RADIUS);

        this.startLength = Math.hypot(this.tangentInPoint.x - this.startPoint.x, this.tangentInPoint.y - this.startPoint.y);
        this.startForward = Math.atan2(this.tangentInPoint.y - this.startPoint.y, this.tangentInPoint.x - this.startPoint.x);

        this.curveLength = Trigonometry.getAngleSpan(this.tangentInRotation, tangentOutRotation, true) * CENTER_RADIUS;
        const endLength = Math.hypot(this.endPoint.x - this.tangentOutPoint.x, this.endPoint.y - this.tangentOutPoint.y);
        this.endForward = Math.atan2(this.endPoint.y - this.tangentOutPoint.y, this.endPoint.x - this.tangentOutPoint.x);

        this.totalLength = this.startLength + this.curveLength + endLength;
    }

    getLength() { return this.totalLength; }

    getPoint(t) {
        const dist = t * this.totalLength;
        if (dist < this.startLength) {
            const localT = dist / this.startLength;
            return {
                position: {
                    x: this.startPoint.x + (this.tangentInPoint.x - this.startPoint.x) * localT,
                    y: this.startPoint.y + (this.tangentInPoint.y - this.startPoint.y) * localT
                },
                rotation: this.startForward
            };
        } else if (dist < this.startLength + this.curveLength) {
            const localT = (dist - this.startLength) / this.curveLength;
            const angle = this.tangentInRotation - (this.curveLength / CENTER_RADIUS) * localT;
            const position = { x: Math.cos(angle) * CENTER_RADIUS, y: Math.sin(angle) * CENTER_RADIUS };
            const forward = Trigonometry.rotate(position, -TAU / 4);
            return { position, rotation: Math.atan2(forward.y, forward.x) };
        } else {
            const localT = (dist - this.startLength - this.curveLength) / (this.totalLength - this.startLength - this.curveLength);
            return {
                position: {
                    x: this.tangentOutPoint.x + (this.endPoint.x - this.tangentOutPoint.x) * localT,
                    y: this.tangentOutPoint.y + (this.endPoint.y - this.tangentOutPoint.y) * localT
                },
                rotation: this.endForward
            };
        }
    }
}

/**
 * Slide Handlers & Judgement Logic
 * Ported from AstroDX.Contexts.Gameplay.Behaviours.Slide.Handlers[cite: 1]
 */
class RegularSlideSegmentHandler {
    constructor(slideBehaviour, generator, startLocation) {
        this.parentSlide = slideBehaviour;
        this.generator = generator;
        this.cleared = false;
        this.isJudgementTarget = false;
        this.interactionPath = [];
        this.lastCheckedClearIndex = 0;

        this.generateArrows();
        this.initialSensorCount = this.interactionPath.length;
    }

    getLength() { return this.generator.getLength(); }

    generateArrows() {
        const totalLength = this.getLength();
        const arrowCount = Math.floor(totalLength / ARROW_DISTANCE);
        let relevantArrows = [];
        let relevantSensor = null;

        let index = 0;
        for (let distance = ARROW_DISTANCE; distance <= totalLength; distance += ARROW_DISTANCE) {
            const t = distance / totalLength;
            const pt = this.generator.getPoint(t);
            const sensor = this.getClosestSensor(pt.position);

            if (relevantSensor !== sensor) {
                if (relevantSensor !== null) {
                    this.interactionPath.push({ sensor: relevantSensor, arrows: relevantArrows });
                }
                relevantArrows = [];
                relevantSensor = sensor;
            }

            relevantArrows.push({ position: pt.position, rotation: pt.rotation, alpha: 0.8 });
            index++;
        }

        if (relevantArrows.length > 0) {
            this.interactionPath.push({ sensor: relevantSensor, arrows: relevantArrows });
        }
    }

    getClosestSensor(position) {
        let minDist = Infinity;
        let closest = null;
        for (let i = 0; i < 8; i++) {
            const aPos = getPosition({ group: 'ASensor', index: i });
            const bPos = getPosition({ group: 'BSensor', index: i });
            
            const dA = Math.hypot(position.x - aPos.x, position.y - aPos.y);
            const dB = Math.hypot(position.x - bPos.x, position.y - bPos.y);

            if (dA < minDist) { minDist = dA; closest = { group: 'ASensor', index: i }; }
            if (dB < minDist) { minDist = dB; closest = { group: 'BSensor', index: i }; }
        }
        return closest;
    }

    onUpdate(segmentT, isAuto, activeTouches, slideTolerance) {
        if (this.isJudgementTarget) {
            this.checkInteraction(segmentT, isAuto, activeTouches, slideTolerance);
        }
    }

    checkInteraction(segmentT, isAuto, activeTouches, slideTolerance) {
        let clearCount = this.getClearCount(segmentT, isAuto, activeTouches, slideTolerance);

        while (clearCount > 0 && this.interactionPath.length > 0) {
            this.interactionPath.shift();
            clearCount--;
        }

        this.cleared = this.interactionPath.length === 0;
    }

    getClearCount(segmentT, isAuto, activeTouches, slideTolerance) {
        if (isAuto && segmentT >= 0) {
            const clearCount = Math.floor(segmentT * this.initialSensorCount);
            if (this.lastCheckedClearIndex >= clearCount) return 0;
            const delta = clearCount - this.lastCheckedClearIndex;
            this.lastCheckedClearIndex = clearCount;
            return delta;
        } else {
            let clearCount = 0;
            let scanIndex = 0;
            let tolerance = slideTolerance;

            while (tolerance >= 0 && scanIndex < this.interactionPath.length) {
                const targetSensor = this.interactionPath[scanIndex].sensor;
                const isTouched = activeTouches.some(t => t.group === targetSensor.group && t.index === targetSensor.index);

                if (isTouched) {
                    tolerance = slideTolerance;
                    clearCount = scanIndex + 1;
                } else {
                    tolerance--;
                }
                scanIndex++;
            }
            return clearCount;
        }
    }

    getRemainingLength() {
        if (this.initialSensorCount === 0) return 0;
        return (this.interactionPath.length / this.initialSensorCount) * this.getLength();
    }

    render(ctx, segmentT) {
        // Draw track arrows
        for (const group of this.interactionPath) {
            for (const arrow of group.arrows) {
                ctx.save();
                ctx.translate(arrow.position.x, arrow.position.y);
                ctx.rotate(arrow.rotation);
                ctx.fillStyle = `rgba(235, 203, 139, ${arrow.alpha})`;
                ctx.beginPath();
                ctx.moveTo(8, 0);
                ctx.lineTo(-6, -6);
                ctx.lineTo(-2, 0);
                ctx.lineTo(-6, 6);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        // Draw Slide Star[cite: 1]
        if (segmentT >= 0 && segmentT <= 1) {
            const pt = this.generator.getPoint(Math.min(1, Math.max(0, segmentT)));
            ctx.save();
            ctx.translate(pt.position.x, pt.position.y);
            ctx.rotate(pt.rotation + Math.PI / 2);
            ctx.fillStyle = "#ebcb8b";
            ctx.strokeStyle = "#d08770";
            ctx.lineWidth = 3;

            // Draw 5-pointed star
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * 16, -Math.sin((18 + i * 72) * Math.PI / 180) * 16);
                ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * 7, -Math.sin((54 + i * 72) * Math.PI / 180) * 7);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }
    }
}

class FanSlideSegmentHandler {
    constructor(slideBehaviour, startLocation) {
        this.parentSlide = slideBehaviour;
        this.cleared = false;
        this.isJudgementTarget = false;
        this.startPosition = getPosition(startLocation);
        
        const ccwLoc = { group: 'Tap', index: (startLocation.index + 3) % 8 };
        const centerLoc = { group: 'Tap', index: (startLocation.index + 4) % 8 };
        const cwLoc = { group: 'Tap', index: (startLocation.index + 5) % 8 };

        this.endPositions = [
            getPosition(ccwLoc),
            getPosition(centerLoc),
            getPosition(cwLoc)
        ];

        this.interactionReceivedState = 0;
        this.interactableGroups = [
            [{ group: 'ASensor', index: startLocation.index }],
            [
                { group: 'BSensor', index: (startLocation.index + 2) % 8 },
                { group: 'BSensor', index: (startLocation.index + 6) % 8 }
            ],
            [
                { group: 'ASensor', index: (startLocation.index + 3) % 8 },
                { group: 'ASensor', index: (startLocation.index + 4) % 8 },
                { group: 'ASensor', index: (startLocation.index + 5) % 8 }
            ]
        ];
    }

    getLength() { return PLAYFIELD_RADIUS * 2; }

    onUpdate(segmentT, isAuto, activeTouches) {
        if (this.isJudgementTarget) {
            this.checkInteraction(segmentT, isAuto, activeTouches);
        }
    }

    checkInteraction(segmentT, isAuto, activeTouches) {
        if (isAuto) {
            this.interactionReceivedState = Math.min(3, Math.floor(segmentT * 3));
        } else {
            for (let g = this.interactionReceivedState; g < 3; g++) {
                const group = this.interactableGroups[g];
                const hit = group.some(sensor => activeTouches.some(t => t.group === sensor.group && t.index === sensor.index));
                if (hit && g === this.interactionReceivedState) {
                    this.interactionReceivedState++;
                }
            }
        }

        if (this.interactionReceivedState >= 3) {
            this.cleared = true;
        }
    }

    getRemainingLength() {
        return ((3 - this.interactionReceivedState) / 3) * this.getLength();
    }

    render(ctx, segmentT) {
        // Render 3 diverging paths
        for (let i = 0; i < 3; i++) {
            ctx.save();
            ctx.strokeStyle = `rgba(180, 142, 173, ${0.4 + i * 0.2})`;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(this.startPosition.x, this.startPosition.y);
            ctx.lineTo(this.endPositions[i].x, this.endPositions[i].y);
            ctx.stroke();

            // Render Stars
            if (segmentT >= 0 && segmentT <= 1) {
                const curX = this.startPosition.x + (this.endPositions[i].x - this.startPosition.x) * segmentT;
                const curY = this.startPosition.y + (this.endPositions[i].y - this.startPosition.y) * segmentT;

                ctx.translate(curX, curY);
                ctx.fillStyle = "#b48ead";
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, TAU);
                ctx.fill();
            }
            ctx.restore();
        }
    }
}

/**
 * Main Controller: SlideBehaviour
 * Managing lifetime, timing, auto-play, and scoring[cite: 1]
 */
class SlideBehaviour {
    constructor(type, startLocation, endLocation) {
        this.duration = 1.2; // Seconds
        this.delay = 0.2;
        this.timeSinceStart = -this.delay;
        this.judged = false;
        this.cleared = false;

        const vertices = [startLocation, endLocation];
        let generator;

        if (type === 'Straight') generator = new StraightGenerator(vertices);
        else if (type === 'RingCw') generator = new RingGenerator(vertices, true);
        else if (type === 'RingCcw') generator = new RingGenerator(vertices, false);
        else if (type === 'Fold') generator = new FoldGenerator(vertices);
        else if (type === 'CurveCw') generator = new CurveCwGenerator(vertices);

        if (type === 'Fan') {
            this.handler = new FanSlideSegmentHandler(this, startLocation);
        } else {
            this.handler = new RegularSlideSegmentHandler(this, generator, startLocation);
        }

        this.length = this.handler.getLength();
    }

    update(dt, isAuto, activeTouches, slideTolerance) {
        if (this.judged) return;

        this.timeSinceStart += dt;
        const segmentT = Math.max(0, this.timeSinceStart / this.duration);

        this.handler.isJudgementTarget = this.timeSinceStart >= 0;
        this.handler.onUpdate(segmentT, isAuto, activeTouches, slideTolerance);

        if (this.handler.cleared) {
            this.judge(true);
        } else if (this.timeSinceStart > this.duration + 0.2) {
            this.judge(false);
        }
    }

    judge(success) {
        if (this.judged) return;
        this.judged = true;
        this.cleared = success;

        const remLength = this.handler.getRemainingLength();
        const ratio = remLength / this.length;

        let result = "CRITICAL PERFECT";
        if (!success) {
            if (ratio < 0.2) result = "GREAT";
            else if (ratio < 0.5) result = "GOOD";
            else result = "MISS";
        }

        document.getElementById('hud-judge').innerText = result;
        document.getElementById('hud-state').innerText = "FINISHED";
    }

    render(ctx) {
        const segmentT = this.timeSinceStart / this.duration;
        this.handler.render(ctx, segmentT);
    }
}

/**
 * Application Engine & Canvas Renderer
 */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const center = { x: 250, y: 250 };

let slide = null;
let lastTime = performance.now();
let activeTouches = [];

function initSlide() {
    const type = document.getElementById('slide-type').value;
    const startLoc = { group: 'Tap', index: 0 };
    const endLoc = { group: 'Tap', index: 4 };

    slide = new SlideBehaviour(type, startLoc, endLoc);
    document.getElementById('hud-state').innerText = "RUNNING";
    document.getElementById('hud-judge').innerText = "-";
}

function drawPlayfield() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(center.x, center.y);

    // Outer Ring
    ctx.strokeStyle = "#4c566a";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, 0, PLAYFIELD_RADIUS, 0, TAU);
    ctx.stroke();

    // Inner Center Area
    ctx.strokeStyle = "#3b4252";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, CENTER_RADIUS, 0, TAU);
    ctx.stroke();

    // 8 Touch Sensors (A/B Nodes)
    for (let i = 0; i < 8; i++) {
        const aPos = getPosition({ group: 'ASensor', index: i });
        const bPos = getPosition({ group: 'BSensor', index: i });

        const isATouched = activeTouches.some(t => t.group === 'ASensor' && t.index === i);
        const isBTouched = activeTouches.some(t => t.group === 'BSensor' && t.index === i);

        ctx.fillStyle = isATouched ? "#88c0d0" : "rgba(76, 86, 106, 0.3)";
        ctx.beginPath();
        ctx.arc(aPos.x, aPos.y, 12, 0, TAU);
        ctx.fill();

        ctx.fillStyle = isBTouched ? "#81a1c1" : "rgba(76, 86, 106, 0.2)";
        ctx.beginPath();
        ctx.arc(bPos.x, bPos.y, 10, 0, TAU);
        ctx.fill();
    }
    ctx.restore();
}

function loop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    drawPlayfield();

    if (slide) {
        const isAuto = document.getElementById('auto-mode').value === 'on';
        const tolerance = parseInt(document.getElementById('tolerance').value, 10);

        slide.update(dt, isAuto, activeTouches, tolerance);

        ctx.save();
        ctx.translate(center.x, center.y);
        slide.render(ctx);
        ctx.restore();

        const progress = Math.min(100, Math.max(0, (slide.timeSinceStart / slide.duration) * 100));
        document.getElementById('hud-progress').innerText = `${Math.floor(progress)}%`;
    }

    requestAnimationFrame(loop);
}

// Interactive Touch Engine
function handlePointer(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left - center.x;
    const y = e.clientY - rect.top - center.y;

    activeTouches = [];
    for (let i = 0; i < 8; i++) {
        const aPos = getPosition({ group: 'ASensor', index: i });
        const bPos = getPosition({ group: 'BSensor', index: i });

        if (Math.hypot(x - aPos.x, y - aPos.y) < 25) activeTouches.push({ group: 'ASensor', index: i });
        if (Math.hypot(x - bPos.x, y - bPos.y) < 25) activeTouches.push({ group: 'BSensor', index: i });
    }
}

canvas.addEventListener('pointerdown', handlePointer);
canvas.addEventListener('pointermove', (e) => { if (e.buttons > 0) handlePointer(e); });
canvas.addEventListener('pointerup', () => { activeTouches = []; });

document.getElementById('btn-trigger').addEventListener('click', initSlide);
document.getElementById('slide-type').addEventListener('change', initSlide);

// Bootstrap
initSlide();
requestAnimationFrame(loop);
</script>
</body>
</html>
