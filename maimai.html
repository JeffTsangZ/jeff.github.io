<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Maimai DX Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000; color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            touch-action: none; user-select: none;
        }
        #bgVideo {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; object-fit: cover;
            z-index: -2; display: none; opacity: 0.5;
        }
        #ui {
            position: absolute; z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px; border-radius: 15px;
            border: 2px solid #0ff; text-align: center;
            box-shadow: 0 0 20px #0ff;
            min-width: 300px;
        }
        #fullscreenBtn {
            position: absolute;
            top: 15px; right: 15px; z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            color: #fff; border: 1px solid #0ff;
            border-radius: 8px; padding: 10px 15px;
            cursor: pointer; font-weight: bold;
        }
        #fullscreenBtn:hover { background: rgba(0, 255, 255, 0.2); }
        
        #gameCanvas {
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
            display: none;
        }
        button:not(#fullscreenBtn), input[type="file"], select {
            padding: 12px; font-size: 16px; margin: 10px;
            border-radius: 8px; border: none; cursor: pointer;
            width: 90%; box-sizing: border-box;
        }
        select { background: #222; color: #fff; border: 1px solid #0ff; outline: none; }
        button:not(#fullscreenBtn) { background: #0ff; color: #000; font-weight: bold; }
        button:disabled { background: #555; color: #888; }
        .setting { margin: 15px 0; }
        input[type="range"] { width: 90%; }
        
        #difficultyContainer {
            display: none;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <video id="bgVideo" autoplay loop muted></video>
    <button id="fullscreenBtn">⛶ Fullscreen</button>

    <div id="ui">
        <h2>maimai Simulator</h2>
        <input type="file" id="adxUpload" accept=".adx,.zip" />
        
        <div id="difficultyContainer">
            <label style="font-weight: bold; color: #0ff;">Select Difficulty:</label>
            <select id="diffSelect"></select>
        </div>

        <div class="setting">
            <label>Note Speed: <span id="speedVal">1.5</span></label><br>
            <input type="range" id="speedSlider" min="0.5" max="3.5" step="0.1" value="1.5">
            <p style="font-size: 12px; color: #aaa;">(Higher = Faster Approach)</p>
        </div>

        <button id="startBtn" disabled>Upload .adx to Start</button>
        <p id="statusText" style="color: #0ff;">Waiting for file...</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let CENTER = { x: 0, y: 0 };
        let RING_RADIUS = 0;
        let BUTTON_RADIUS = 0;
        let buttons = [];

        let availableCharts = {};
        let globalAudioOffset = 0;

        let notes = [];
        let activeNotes = [];
        let judgements = [];
        let clickEffects = [];
        let audio = new Audio();
        let isPlaying = false;
        let combo = 0;

        let APPROACH_TIME = 3.0; // Increased base display time to show tracks earlier
        const speedSlider = document.getElementById('speedSlider');
        speedSlider.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            document.getElementById('speedVal').innerText = val.toFixed(1);
            APPROACH_TIME = 4.5 - val;
        });

        // --- FULLSCREEN TOGGLE ---
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        });

        // --- RESIZE CANVAS TO FIT ANY SCREEN ---
        function resizeCanvas() {
            let size = Math.min(window.innerWidth, window.innerHeight) * 0.95;
            canvas.width = size;
            canvas.height = size;
            CENTER = { x: size / 2, y: size / 2 };
            RING_RADIUS = size * 0.38;
            BUTTON_RADIUS = size * 0.07;

            buttons = [];
            for (let i = 0; i < 8; i++) {
                let angle = (i * 45 + 22.5) * (Math.PI / 180);
                buttons.push({
                    x: CENTER.x + Math.cos(angle) * RING_RADIUS,
                    y: CENTER.y + Math.sin(angle) * RING_RADIUS,
                    angle: angle, active: false, type: 'ring'
                });
            }
            buttons.push({ x: CENTER.x, y: CENTER.y, angle: 0, active: false, type: 'center' });
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- 1. UNZIP & EXTRACT DIFFICULTIES ---
        document.getElementById('adxUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('statusText').innerText = "Unzipping chart...";
            document.getElementById('difficultyContainer').style.display = 'none';
            document.getElementById('startBtn').disabled = true;

            JSZip.loadAsync(file).then(async function(zip) {
                let audioFile = zip.file(/track\.(mp3|ogg|wav)/i)[0];
                if (audioFile) {
                    let blob = await audioFile.async("blob");
                    audio.src = URL.createObjectURL(blob);
                }

                let pvFile = zip.file(/pv\.mp4/i)[0];
                let bgFile = zip.file(/bg\.(jpg|png)/i)[0];
                if (pvFile) {
                    let blob = await pvFile.async("blob");
                    document.getElementById('bgVideo').src = URL.createObjectURL(blob);
                    document.getElementById('bgVideo').style.display = 'block';
                } else if (bgFile) {
                    let blob = await bgFile.async("blob");
                    document.body.style.backgroundImage = `url(${URL.createObjectURL(blob)})`;
                    document.body.style.backgroundSize = "cover";
                    document.body.style.backgroundPosition = "center";
                }

                let maidataFile = zip.file(/maidata\.txt/i)[0];
                if (maidataFile) {
                    let text = await maidataFile.async("string");
                    extractAvailableCharts(text);
                    
                    if (Object.keys(availableCharts).length > 0) {
                        populateDifficultyUI();
                        document.getElementById('statusText').innerText = "File loaded! Ready to play.";
                        document.getElementById('startBtn').disabled = false;
                        document.getElementById('startBtn').innerText = "START GAME";
                        document.getElementById('difficultyContainer').style.display = 'block';
                    } else {
                        document.getElementById('statusText').innerText = "Error: No playable charts found in maidata.txt.";
                    }
                }
            }).catch(err => {
                document.getElementById('statusText').innerText = "Error loading file!";
                console.error(err);
            });
        });

        function extractAvailableCharts(text) {
            availableCharts = {};
            let firstMatch = text.match(/&first=([\d\.\-]+)/);
            globalAudioOffset = firstMatch ? parseFloat(firstMatch[1]) : 0.0;

            const difficultyNames = {
                1: "Basic (Green)",
                2: "Advanced (Orange)",
                3: "Expert (Red)",
                4: "Master (Purple)",
                5: "Re:Master (White)",
                6: "Utage"
            };

            for (let i = 1; i <= 6; i++) {
                let regex = new RegExp(`&inote_${i}=([^&]+)`);
                let match = text.match(regex);
                if (match) {
                    availableCharts[i] = {
                        name: difficultyNames[i],
                        data: match[1]
                    };
                }
            }
        }

        function populateDifficultyUI() {
            const select = document.getElementById('diffSelect');
            select.innerHTML = ''; 
            
            let highestDiff = 1;
            for (let key in availableCharts) {
                let option = document.createElement('option');
                option.value = key;
                option.text = availableCharts[key].name;
                select.appendChild(option);
                highestDiff = key;
            }
            select.value = highestDiff; 
        }

        // --- 2. ADVANCED SIMAI PARSER ---
        function parseDuration(str, bpm) {
            let parts = str.replace(/[\[\]]/g, '').split(':');
            if (parts.length === 2) {
                let div = parseFloat(parts[0]);
                let ticks = parseFloat(parts[1]);
                return (240 / bpm) / div * ticks;
            }
            return 0;
        }

        function parseChartString(chartStr, offsetTime) {
            let parsedNotes = [];
            let currentTime = offsetTime;
            
            let cleanStr = chartStr.replace(/\s+/g, ''); 
            let blocks = cleanStr.split(',');
            let currentBPM = 120;
            let currentDivisor = 4;

            for (let block of blocks) {
                if (!block) {
                    currentTime += (240 / currentBPM) / currentDivisor;
                    continue;
                }

                let bpmMatch = block.match(/\(([\d\.]+)\)/);
                if (bpmMatch) {
                    currentBPM = parseFloat(bpmMatch[1]);
                    block = block.replace(/\([\d\.]+\)/, '');
                }

                let divMatch = block.match(/\{([\d\.]+)\}/);
                if (divMatch) {
                    currentDivisor = parseFloat(divMatch[1]);
                    block = block.replace(/\{[\d\.]+\}/, '');
                }

                let elements = block.split('/');
                for (let el of elements) {
                    if (!el) continue;

                    if (el.includes('C')) {
                        parsedNotes.push({ type: 'touch', time: currentTime, pos: 8, isChord: false, state: 'waiting' }); 
                        continue;
                    }

                    let slideMatch = el.match(/^([1-8])([a-zA-Z\-\^\<\>]+)([1-8])(?:\[(.*?)\])?/);
                    if (slideMatch) {
                        let startPos = parseInt(slideMatch[1]) - 1;
                        let endPos = parseInt(slideMatch[3]) - 1;
                        let slideDur = slideMatch[4] ? parseDuration(slideMatch[4], currentBPM) : (240 / currentBPM) / 2;
                        
                        parsedNotes.push({ 
                            type: 'slide_head', 
                            time: currentTime, 
                            pos: startPos, 
                            endPos: endPos, 
                            duration: slideDur,
                            state: 'waiting', 
                            isChord: false 
                        });
                        continue;
                    }

                    let holdMatch = el.match(/^([1-8])h\[(.*?)\]/);
                    if (holdMatch) {
                        let duration = parseDuration(holdMatch[2], currentBPM);
                        parsedNotes.push({ type: 'hold', time: currentTime, pos: parseInt(holdMatch[1]) - 1, duration: duration, isChord: false, state: 'waiting' });
                        continue;
                    }

                    let tapMatch = el.match(/^([1-8])/);
                    if (tapMatch) {
                        parsedNotes.push({ type: 'tap', time: currentTime, pos: parseInt(tapMatch[1]) - 1, isChord: false, state: 'waiting' });
                    }
                }
                currentTime += (240 / currentBPM) / currentDivisor;
            }

            let timeGroups = {};
            parsedNotes.forEach(note => {
                let t = note.time.toFixed(4); 
                if (!timeGroups[t]) timeGroups[t] = [];
                timeGroups[t].push(note);
            });
            for (let t in timeGroups) {
                if (timeGroups[t].length > 1) {
                    timeGroups[t].forEach(note => note.isChord = true);
                }
            }

            return parsedNotes;
        }

        // --- 3. GAME ENGINE & DRAWING ---
        document.getElementById('startBtn').addEventListener('click', () => {
            let selectedDiff = document.getElementById('diffSelect').value;
            let chartData = availableCharts[selectedDiff].data;
            notes = parseChartString(chartData, globalAudioOffset);

            document.getElementById('ui').style.display = 'none';
            canvas.style.display = 'block';
            
            activeNotes = JSON.parse(JSON.stringify(notes));
            combo = 0; 
            
            if (document.getElementById('bgVideo').src) {
                document.getElementById('bgVideo').currentTime = 0;
            }
            audio.play();
            isPlaying = true;
            requestAnimationFrame(gameLoop);
        });

        function gameLoop() {
            if (!isPlaying) return;
            let elapsedTime = audio.currentTime;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawUI();
            drawCombo(); 
            updateAndDrawNotes(elapsedTime);
            drawClickEffects();
            drawJudgements(elapsedTime);
            
            requestAnimationFrame(gameLoop);
        }

        function drawUI() {
            // Draw Outer Ring
            ctx.beginPath();
            ctx.arc(CENTER.x, CENTER.y, RING_RADIUS, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Draw Judgment Area Sector Lines (D1-D8 Slices)
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            for (let i = 0; i < 8; i++) {
                let angle = (i * 45) * (Math.PI / 180);
                let innerX = CENTER.x + Math.cos(angle) * (RING_RADIUS * 0.35);
                let innerY = CENTER.y + Math.sin(angle) * (RING_RADIUS * 0.35);
                let outerX = CENTER.x + Math.cos(angle) * RING_RADIUS;
                let outerY = CENTER.y + Math.sin(angle) * RING_RADIUS;

                ctx.beginPath();
                ctx.moveTo(innerX, innerY);
                ctx.lineTo(outerX, outerY);
                ctx.stroke();
            }
            ctx.restore();

            // Draw Zone Labels (D1-D8) near the outer rim
            ctx.font = `bold ${BUTTON_RADIUS * 0.35}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let i = 0; i < 8; i++) {
                let dAngle = (i * 45 + 22.5) * (Math.PI / 180);
                let dX = CENTER.x + Math.cos(dAngle) * (RING_RADIUS * 0.88);
                let dY = CENTER.y + Math.sin(dAngle) * (RING_RADIUS * 0.88);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.fillText(`D${i + 1}`, dX, dY);
            }

            // Draw Buttons (A1-A8 and Center C)
            buttons.forEach((btn, index) => {
                if (btn.type === 'ring') {
                    ctx.beginPath();
                    ctx.arc(btn.x, btn.y, BUTTON_RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = btn.active ? '#0ff' : 'rgba(0, 0, 0, 0.5)';
                    ctx.fill();
                    ctx.strokeStyle = '#0ff';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Button Label (A1-A8)
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.font = `bold ${BUTTON_RADIUS * 0.45}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(`A${index + 1}`, btn.x, btn.y);

                } else if (btn.type === 'center') {
                    ctx.fillStyle = btn.active ? 'rgba(0, 255, 255, 0.4)' : 'rgba(0,0,0,0)';
                    ctx.fillRect(btn.x - BUTTON_RADIUS, btn.y - BUTTON_RADIUS, BUTTON_RADIUS*2, BUTTON_RADIUS*2);
                }
            });
        }

        function drawCombo() {
            if (combo > 0) {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.font = `bold ${BUTTON_RADIUS * 1.5}px Arial`;
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#111'; 
                ctx.strokeText(combo, CENTER.x, CENTER.y - BUTTON_RADIUS * 0.2);
                ctx.fillStyle = '#ffcc00'; 
                ctx.fillText(combo, CENTER.x, CENTER.y - BUTTON_RADIUS * 0.2);
                
                ctx.font = `bold ${BUTTON_RADIUS * 0.4}px Arial`;
                ctx.lineWidth = 4;
                ctx.strokeText("COMBO", CENTER.x, CENTER.y + BUTTON_RADIUS * 0.8);
                ctx.fillText("COMBO", CENTER.x, CENTER.y + BUTTON_RADIUS * 0.8);
            }
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius, rotation) {
            let rot = Math.PI / 2 * 3;
            let x = cx, y = cy;
            let step = Math.PI / spikes;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot + rotation) * outerRadius;
                y = cy + Math.sin(rot + rotation) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;
                x = cx + Math.cos(rot + rotation) * innerRadius;
                y = cy + Math.sin(rot + rotation) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        function spawnClickEffect(x, y, color = '#0ff') {
            clickEffects.push({
                x: x, y: y,
                radius: BUTTON_RADIUS * 0.5,
                maxRadius: BUTTON_RADIUS * 1.8,
                alpha: 1.0,
                color: color
            });
        }

        function drawClickEffects() {
            for (let i = clickEffects.length - 1; i >= 0; i--) {
                let eff = clickEffects[i];
                eff.radius += 3;
                eff.alpha -= 0.06;
                if (eff.alpha <= 0) {
                    clickEffects.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.beginPath();
                ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
                ctx.strokeStyle = eff.color;
                ctx.lineWidth = 3;
                ctx.globalAlpha = eff.alpha;
                ctx.stroke();
                ctx.restore();
            }
        }

        function updateAndDrawNotes(elapsedTime) {
            for (let i = activeNotes.length - 1; i >= 0; i--) {
                let note = activeNotes[i];
                let target = buttons[note.pos];

                // Hold body stays visible until tail is reached
                if (note.type === 'hold' && note.state === 'holding') {
                    if (elapsedTime >= note.time + note.duration) {
                        spawnJudgement("CRITICAL", "#ffd700", target.angle);
                        combo++;
                        activeNotes.splice(i, 1);
                        continue;
                    }
                    let startBtn = buttons[note.pos];
                    let holdProgress = (elapsedTime - note.time) / note.duration;
                    let tailDist = RING_RADIUS * (1 - Math.min(1, holdProgress));
                    let tX = CENTER.x + Math.cos(target.angle) * tailDist;
                    let tY = CENTER.y + Math.sin(target.angle) * tailDist;

                    ctx.beginPath();
                    ctx.moveTo(startBtn.x, startBtn.y);
                    ctx.lineTo(tX, tY);
                    ctx.strokeStyle = note.isChord ? 'rgba(255, 255, 0, 0.8)' : 'rgba(255, 0, 255, 0.8)';
                    ctx.lineWidth = BUTTON_RADIUS;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(startBtn.x, startBtn.y, BUTTON_RADIUS * 0.7, 0, Math.PI * 2);
                    ctx.fillStyle = note.isChord ? '#ffff00' : '#ff00ff';
                    ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                    continue;
                }

                if (note.type === 'slide_travel' && note.state === 'sliding') {
                    let travelProgress = (elapsedTime - note.time) / note.duration;
                    if (travelProgress >= 1.0) {
                        note.type = 'slide_destination';
                        note.pos = note.endPos; 
                        note.time = elapsedTime; 
                        continue;
                    }

                    let startB = buttons[note.pos];
                    let endB = buttons[note.endPos];
                    ctx.beginPath();
                    ctx.moveTo(startB.x, startB.y);
                    ctx.lineTo(endB.x, endB.y);
                    ctx.strokeStyle = 'rgba(0, 170, 255, 0.4)';
                    ctx.lineWidth = 10;
                    ctx.stroke();

                    let starX = startB.x + (endB.x - startB.x) * travelProgress;
                    let starY = startB.y + (endB.y - startB.y) * travelProgress;
                    ctx.fillStyle = '#00aaff';
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    drawStar(starX, starY, 5, BUTTON_RADIUS * 0.7, BUTTON_RADIUS * 0.35, elapsedTime * 4);
                    continue;
                }

                let timeUntilHit = note.time - elapsedTime;
                let missWindow = (note.type === 'slide_destination') ? 0.3 : 0.16;
                if (timeUntilHit < -missWindow) {
                    spawnJudgement("MISS", "#888", target.angle);
                    combo = 0; 
                    activeNotes.splice(i, 1);
                    continue;
                }

                if (timeUntilHit <= APPROACH_TIME) {
                    let progress = 1 - (timeUntilHit / APPROACH_TIME);
                    let cx, cy;
                    
                    let tapColor = note.isChord ? '#ffff00' : '#ff00ff';
                    let slideColor = note.isChord ? '#ffff00' : '#00aaff';
                    let holdTailColor = note.isChord ? 'rgba(255, 255, 0, 0.6)' : 'rgba(255, 0, 255, 0.6)';

                    if (note.type === 'touch') {
                        cx = CENTER.x; cy = CENTER.y;
                        ctx.fillStyle = note.isChord ? `rgba(255, 255, 0, ${progress})` : `rgba(0, 150, 255, ${progress})`;
                        ctx.fillRect(cx - BUTTON_RADIUS, cy - BUTTON_RADIUS, BUTTON_RADIUS*2, BUTTON_RADIUS*2);
                    
                    } else {
                        cx = CENTER.x + Math.cos(target.angle) * (RING_RADIUS * progress);
                        cy = CENTER.y + Math.sin(target.angle) * (RING_RADIUS * progress);

                        if (note.type === 'slide_head') {
                            ctx.fillStyle = slideColor;
                            ctx.strokeStyle = '#fff';
                            ctx.lineWidth = 2;
                            drawStar(cx, cy, 5, BUTTON_RADIUS * 0.8, BUTTON_RADIUS * 0.4, elapsedTime * 4);
                        
                        } else if (note.type === 'slide_destination') {
                            ctx.beginPath();
                            ctx.arc(cx, cy, BUTTON_RADIUS * 0.8, 0, Math.PI * 2);
                            ctx.fillStyle = '#00aaff'; ctx.fill();
                            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();

                        } else if (note.type === 'hold') {
                            let tailTimeUntil = (note.time + note.duration) - elapsedTime;
                            let tailProgress = Math.max(0, 1 - (tailTimeUntil / APPROACH_TIME));
                            let tX = CENTER.x + Math.cos(target.angle) * (RING_RADIUS * tailProgress);
                            let tY = CENTER.y + Math.sin(target.angle) * (RING_RADIUS * tailProgress);
                            
                            ctx.beginPath();
                            ctx.moveTo(cx, cy);
                            ctx.lineTo(tX, tY);
                            ctx.strokeStyle = holdTailColor;
                            ctx.lineWidth = BUTTON_RADIUS;
                            ctx.stroke();

                            ctx.beginPath();
                            ctx.arc(cx, cy, BUTTON_RADIUS * 0.7, 0, Math.PI * 2);
                            ctx.fillStyle = tapColor; ctx.fill();
                        
                        } else {
                            ctx.beginPath();
                            ctx.arc(cx, cy, BUTTON_RADIUS * 0.7, 0, Math.PI * 2);
                            ctx.fillStyle = tapColor; ctx.fill();
                            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
                        }
                    }
                }
            }
        }

        // --- 4. JUDGEMENTS ---
        function spawnJudgement(text, color, angle) {
            let jX = CENTER.x + Math.cos(angle) * (RING_RADIUS * 0.65);
            let jY = CENTER.y + Math.sin(angle) * (RING_RADIUS * 0.65);
            if (angle === 0) { jX = CENTER.x; jY = CENTER.y - BUTTON_RADIUS * 2; }
            
            judgements.push({
                text: text, color: color, x: jX, y: jY, 
                spawnTime: audio.currentTime
            });
        }

        function drawJudgements(elapsedTime) {
            for (let i = judgements.length - 1; i >= 0; i--) {
                let j = judgements[i];
                let age = elapsedTime - j.spawnTime;
                
                if (age > 0.5) { 
                    judgements.splice(i, 1);
                    continue;
                }

                ctx.fillStyle = j.color;
                ctx.font = `bold ${BUTTON_RADIUS * 0.8}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.globalAlpha = 1 - (age / 0.5); 
                
                let dropY = j.y - (age * 30);
                ctx.strokeText(j.text, j.x, dropY); 
                ctx.fillText(j.text, j.x, dropY); 
                
                ctx.globalAlpha = 1.0;
            }
        }

        // --- 5. TOUCH & HOLD / SLIDE LOGIC ---
        let touchState = {}; 

        function handleTouches(e) {
            e.preventDefault(); 
            let rect = canvas.getBoundingClientRect();
            
            for(let i = 0; i < e.changedTouches.length; i++) {
                let touch = e.changedTouches[i];
                let tx = touch.clientX - rect.left;
                let ty = touch.clientY - rect.top;

                if (e.type === 'touchend' || e.type === 'touchcancel') {
                    let releasedButtons = touchState[touch.identifier] || new Set();
                    releasedButtons.forEach(posIndex => {
                        checkHoldRelease(posIndex);
                    });
                    delete touchState[touch.identifier];
                    continue;
                }

                let currentlyTouched = new Set();
                buttons.forEach((btn, index) => {
                    let dist = Math.hypot(tx - btn.x, ty - btn.y);
                    if (dist < BUTTON_RADIUS * 2.5) {
                        currentlyTouched.add(index);
                    }
                });

                let previouslyTouched = touchState[touch.identifier] || new Set();

                currentlyTouched.forEach(index => {
                    if (!previouslyTouched.has(index)) {
                        buttons[index].active = true;
                        spawnClickEffect(buttons[index].x, buttons[index].y, '#0ff');
                        checkHit(index);
                        setTimeout(() => buttons[index].active = false, 100);
                    }
                });

                touchState[touch.identifier] = currentlyTouched;
            }
        }

        canvas.addEventListener('touchstart', handleTouches, {passive: false});
        canvas.addEventListener('touchmove', handleTouches, {passive: false});
        canvas.addEventListener('touchend', handleTouches, {passive: false});
        canvas.addEventListener('touchcancel', handleTouches, {passive: false});

        function checkHit(posIndex) {
            let elapsedTime = audio.currentTime;
            for (let i = 0; i < activeNotes.length; i++) {
                let note = activeNotes[i];
                if (note.pos === posIndex) {
                    let diff = Math.abs(note.time - elapsedTime);
                    let hitWindow = (note.type === 'slide_destination') ? 0.3 : 0.16;

                    if (diff <= hitWindow) {
                        let target = buttons[note.pos];

                        if (note.type === 'hold') {
                            note.state = 'holding';
                            spawnJudgement("PERFECT", "#ffeb3b", target.angle);
                            combo++;
                            return; 
                        } 
                        else if (note.type === 'slide_head') {
                            note.type = 'slide_travel';
                            note.state = 'sliding';
                            note.time = elapsedTime; 
                            spawnJudgement("GREAT", "#ff8c00", target.angle);
                            combo++;
                            return;
                        } 
                        else if (note.type === 'slide_destination') {
                            spawnJudgement("CRITICAL", "#ffd700", target.angle);
                            combo++;
                            activeNotes.splice(i, 1);
                            break;
                        }
                        else {
                            if (diff <= 0.03) { spawnJudgement("CRITICAL", "#ffd700", target.angle); combo++; }
                            else if (diff <= 0.06) { spawnJudgement("PERFECT", "#ffeb3b", target.angle); combo++; }
                            else if (diff <= 0.10) { spawnJudgement("GREAT", "#ff8c00", target.angle); combo++; }
                            else { spawnJudgement("GOOD", "#00ff00", target.angle); combo++; }
                            
                            activeNotes.splice(i, 1);
                            break;
                        }
                    }
                }
            }
        }

        function checkHoldRelease(posIndex) {
            let elapsedTime = audio.currentTime;
            for (let i = activeNotes.length - 1; i >= 0; i--) {
                let note = activeNotes[i];
                if (note.type === 'hold' && note.pos === posIndex && note.state === 'holding') {
                    let target = buttons[note.pos];
                    if (elapsedTime < note.time + note.duration - 0.15) {
                        spawnJudgement("MISS", "#888", target.angle);
                        combo = 0;
                    } else {
                        spawnJudgement("PERFECT", "#ffeb3b", target.angle);
                        combo++;
                    }
                    activeNotes.splice(i, 1);
                    break;
                }
            }
        }
    </script>
