<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>8-Lane Landscape Rhythm Game</title>
    <style>
        :root {
            --bg-color: #060709;
            --accent-cyan: #00f2fe;
            --accent-magenta: #ff007f;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Fullscreen Layout Container */
        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Minimal HUD Overlay */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
            pointer-events: none;
        }

        .hud-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .hud-label {
            font-size: 0.7rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 1.4rem;
            font-weight: 900;
            font-family: monospace;
        }

        #score { color: var(--accent-cyan); }
        #combo { color: #fff; }

        /* Game Canvas Container */
        .game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        /* Floating Controls */
        .controls {
            position: absolute;
            bottom: 6px;
            right: 12px;
            display: flex;
            gap: 8px;
            z-index: 15;
        }

        button {
            padding: 6px 12px;
            background: rgba(31, 40, 51, 0.7);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        button:active {
            background: rgba(102, 252, 241, 0.4);
        }

        /* Start Overlay */
        .start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(6, 7, 9, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            gap: 12px;
        }

        .start-overlay h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .start-overlay p {
            font-size: 0.85rem;
            color: #aaa;
            max-width: 80%;
            text-align: center;
        }

        /* Orientation Warning */
        @media screen and (orientation: portrait) {
            .start-overlay::before {
                content: "⚠️ Please rotate device to Landscape";
                color: #ff3333;
                font-weight: bold;
                font-size: 1rem;
                padding: 6px 12px;
                border: 1px solid #ff3333;
                border-radius: 4px;
                background: rgba(255,0,0,0.1);
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="hud">
            <div class="hud-item">
                <span class="hud-label">Score</span>
                <span id="score" class="hud-value">000000</span>
            </div>
            <div class="hud-item">
                <span id="combo" class="hud-value">0 COMBO</span>
            </div>
        </div>

        <div class="game-container" id="gameContainer">
            <canvas id="gameCanvas"></canvas>
            <div id="startOverlay" class="start-overlay">
                <h1>BEAT STRIKE (8-LANES)</h1>
                <p>Hold phone horizontally with both thumbs. Tap the 8 bottom target zones as notes reach the judgment line.</p>
                <button id="startBtn" style="padding: 10px 24px; font-size: 1rem; background: var(--accent-cyan); color: #000; border: none; font-weight: 800; border-radius: 20px;">PLAY GAME</button>
            </div>
        </div>

        <div class="controls">
            <button id="fullscreenBtn">Full Screen</button>
            <button id="restartBtn">Restart</button>
        </div>
    </div>

    <script>
        const LANES = 8;
        // 4 Left Hand Lanes (Cyan Tone), 4 Right Hand Lanes (Magenta Tone)
        const LANE_COLORS = [
            '#00f2fe', '#00c3ff', '#0099ff', '#0066ff',
            '#ff00aa', '#ff007f', '#ff0055', '#ff2a2a'
        ];
        
        let canvas, ctx;
        let score = 0;
        let combo = 0;
        let isPlaying = false;
        let lastTime = 0;
        let audioCtx = null;

        let notes = [];
        let hitEffects = [];

        let spawnTimer = 0;
        const SPAWN_INTERVAL = 0.32; // Note frequency
        const NOTE_SPEED = 1.1; // Speed factor

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTapSound(lane) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            
            // Pitch scales across the 8 lanes
            const freq = 300 + (lane * 65);
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.05);
            
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function toggleFullscreen() {
            const container = document.body;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        function spawnNotes(dt) {
            spawnTimer += dt;
            if (spawnTimer >= SPAWN_INTERVAL) {
                spawnTimer = 0;
                
                // Spawn 1 or 2 notes across 8 lanes
                const lane1 = Math.floor(Math.random() * LANES);
                notes.push({ lane: lane1, progress: 0, hit: false });
                
                if (Math.random() > 0.6) {
                    let lane2 = (lane1 + Math.floor(Math.random() * (LANES - 1)) + 1) % LANES;
                    notes.push({ lane: lane2, progress: 0, hit: false });
                }
            }
        }

        function update(dt) {
            if (!isPlaying) return;

            spawnNotes(dt);

            for (let n of notes) {
                if (!n.hit) {
                    n.progress += NOTE_SPEED * dt;

                    // Miss detection (past judgment line at 0.85 progress)
                    if (n.progress > 0.98) {
                        n.hit = true;
                        combo = 0;
                        updateHUD();
                        addHitEffect(n.lane, "MISS", "#ff3333");
                    }
                }
            }

            notes = notes.filter(n => !n.hit);
            for (let e of hitEffects) e.life -= dt;
            hitEffects = hitEffects.filter(e => e.life > 0);
        }

        function checkLaneHit(laneIndex) {
            playTapSound(laneIndex);
            
            let hitFound = false;

            for (let n of notes) {
                if (n.lane === laneIndex && !n.hit) {
                    // Target judgment is around progress = 0.85
                    const diff = Math.abs(n.progress - 0.85);
                    if (diff <= 0.12) {
                        n.hit = true;
                        hitFound = true;

                        if (diff < 0.04) {
                            score += 1000;
                            combo++;
                            addHitEffect(laneIndex, "PERFECT", "#00f2fe");
                        } else {
                            score += 500;
                            combo++;
                            addHitEffect(laneIndex, "GREAT", "#ff007f");
                        }
                        updateHUD();
                        break;
                    }
                }
            }

            if (!hitFound) {
                addHitEffect(laneIndex, "", "rgba(255,255,255,0.15)");
            }
        }

        function addHitEffect(lane, text, color) {
            hitEffects.push({
                lane: lane,
                text: text,
                color: color,
                life: 0.25
            });
        }

        function updateHUD() {
            document.getElementById('score').textContent = score.toString().padStart(6, '0');
            document.getElementById('combo').textContent = `${combo} COMBO`;
        }

        // Perspective projection helper for CHUNITHM / Sekai 3D Track look
        function getTrackCoords(lane, progress) {
            const topY = canvas.height * 0.15;
            const bottomY = canvas.height * 0.88;

            const currentY = topY + (bottomY - topY) * progress;

            // Track width narrows at top (0.35 width) and expands at bottom (0.95 width)
            const topTrackWidth = canvas.width * 0.35;
            const bottomTrackWidth = canvas.width * 0.95;

            const currentTrackWidth = topTrackWidth + (bottomTrackWidth - topTrackWidth) * progress;
            const trackLeft = (canvas.width - currentTrackWidth) / 2;

            const laneWidth = currentTrackWidth / LANES;
            const laneLeft = trackLeft + laneWidth * lane;

            return {
                x: laneLeft,
                y: currentY,
                width: laneWidth
            };
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const topY = canvas.height * 0.15;
            const judgeY = canvas.height * 0.88;

            // Draw Perspective Lane Lines
            for (let i = 0; i <= LANES; i++) {
                const pTop = getTrackCoords(0, 0);
                const pBottom = getTrackCoords(0, 1);

                const topTrackWidth = canvas.width * 0.35;
                const bottomTrackWidth = canvas.width * 0.95;

                const xTop = ((canvas.width - topTrackWidth) / 2) + (topTrackWidth / LANES) * i;
                const xBottom = ((canvas.width - bottomTrackWidth) / 2) + (bottomTrackWidth / LANES) * i;

                ctx.strokeStyle = i === 4 ? '#ffffff' : '#1f2833'; // Center divider is bright
                ctx.lineWidth = i === 4 ? 2 : 1;
                ctx.beginPath();
                ctx.moveTo(xTop, topY);
                ctx.lineTo(xBottom, canvas.height);
                ctx.stroke();
            }

            // Draw Target Judgment Line
            const pLeft = getTrackCoords(0, 0.85);
            const pRight = getTrackCoords(7, 0.85);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#66fcf1';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(pLeft.x, pLeft.y);
            ctx.lineTo(pRight.x + pRight.width, pRight.y);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Draw Target Touch Zones at Bottom
            for (let i = 0; i < LANES; i++) {
                const coords = getTrackCoords(i, 0.85);
                const bottomCoords = getTrackCoords(i, 1.0);

                ctx.fillStyle = LANE_COLORS[i] + '22';
                ctx.beginPath();
                ctx.moveTo(coords.x, coords.y);
                ctx.lineTo(coords.x + coords.width, coords.y);
                ctx.lineTo(bottomCoords.x + bottomCoords.width, canvas.height);
                ctx.lineTo(bottomCoords.x, canvas.height);
                ctx.closePath();
                ctx.fill();
            }

            // Draw Falling 3D Notes
            for (let n of notes) {
                if (!n.hit) {
                    const c = getTrackCoords(n.lane, n.progress);
                    const noteHeight = 10 + n.progress * 8; // Notes grow bigger as they get closer

                    ctx.fillStyle = LANE_COLORS[n.lane];
                    ctx.shadowColor = LANE_COLORS[n.lane];
                    ctx.shadowBlur = 10;

                    ctx.fillRect(c.x + 2, c.y - noteHeight / 2, c.width - 4, noteHeight);
                    ctx.shadowBlur = 0;
                }
            }

            // Draw Hit Visual Effects
            for (let e of hitEffects) {
                const c = getTrackCoords(e.lane, 0.85);

                ctx.fillStyle = e.color;
                ctx.globalAlpha = (e.life / 0.25) * 0.5;
                ctx.fillRect(c.x, c.y - 10, c.width, 30);
                ctx.globalAlpha = 1.0;

                if (e.text) {
                    ctx.fillStyle = e.color;
                    ctx.font = 'bold 16px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(e.text, c.x + c.width / 2, c.y - 25);
                }
            }
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        function handleTouch(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touches = e.changedTouches;

            for (let i = 0; i < touches.length; i++) {
                const touch = touches[i];
                const x = touch.clientX - rect.left;
                
                // Map screen X to the 8 perspective track zones
                const topTrackWidth = canvas.width * 0.95;
                const trackLeft = (canvas.width - topTrackWidth) / 2;
                const laneWidth = topTrackWidth / LANES;
                
                const laneIndex = Math.floor((x - trackLeft) / laneWidth);

                if (laneIndex >= 0 && laneIndex < LANES) {
                    checkLaneHit(laneIndex);
                }
            }
        }

        function startGame() {
            initAudio();
            score = 0;
            combo = 0;
            notes = [];
            hitEffects = [];
            isPlaying = true;
            updateHUD();
            document.getElementById('startOverlay').style.display = 'none';
        }

        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', resizeCanvas);
            resizeCanvas();

            document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
            canvas.addEventListener('touchstart', handleTouch, { passive: false });

            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', startGame);
            document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);

            requestAnimationFrame(gameLoop);
        }

        window.onload = init;
    </script>
</body>
</html>
