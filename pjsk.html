<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>8-Lane Landscape Rhythm Game</title>
    <style>
        :root {
            --bg-color: #060709;
            --accent-cyan: #00f2fe;
            --accent-magenta: #ff007f;
            --accent-pink: #ff00ff;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
            pointer-events: none;
        }

        .hud-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .hud-label {
            font-size: 0.7rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 1.4rem;
            font-weight: 900;
            font-family: monospace;
        }

        #score { color: var(--accent-cyan); }
        #combo { color: #fff; }

        .game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .controls {
            position: absolute;
            bottom: 6px;
            right: 12px;
            display: flex;
            gap: 8px;
            z-index: 15;
        }

        button {
            padding: 6px 12px;
            background: rgba(31, 40, 51, 0.7);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        button:active {
            background: rgba(102, 252, 241, 0.4);
        }

        .start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(6, 7, 9, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            gap: 16px;
        }

        .start-overlay h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .start-overlay p {
            font-size: 0.85rem;
            color: #aaa;
            max-width: 80%;
            text-align: center;
        }

        .title-btn-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-play {
            padding: 10px 28px;
            font-size: 1rem;
            background: var(--accent-cyan);
            color: #000;
            border: none;
            font-weight: 800;
            border-radius: 20px;
        }

        .btn-fullscreen-title {
            padding: 10px 20px;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid var(--accent-cyan);
            font-weight: 700;
            border-radius: 20px;
        }

        @media screen and (orientation: portrait) {
            .start-overlay::before {
                content: "⚠️ Please rotate device to Landscape";
                color: #ff3333;
                font-weight: bold;
                font-size: 1rem;
                padding: 6px 12px;
                border: 1px solid #ff3333;
                border-radius: 4px;
                background: rgba(255,0,0,0.1);
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="hud">
            <div class="hud-item">
                <span class="hud-label">Score</span>
                <span id="score" class="hud-value">000000</span>
            </div>
            <div class="hud-item">
                <span id="combo" class="hud-value">0 COMBO</span>
            </div>
        </div>

        <div class="game-container" id="gameContainer">
            <canvas id="gameCanvas"></canvas>
            
            <div id="startOverlay" class="start-overlay">
                <h1>BEAT STRIKE (8-LANES)</h1>
                <p>Tap Blue, Flick Pink, and Hold Green notes! Max 2 simultaneous notes.</p>
                
                <div class="title-btn-group">
                    <button id="startBtn" class="btn-play">PLAY GAME</button>
                    <button id="titleFullscreenBtn" class="btn-fullscreen-title">Toggle Full Screen</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="restartBtn">Restart</button>
        </div>
    </div>

    <script>
        const LANES = 8;
        
        // Color definitions
        const TAP_COLOR = '#00f2fe';    // Light Blue
        const HOLD_COLOR = '#2ecc71';   // Green
        const FLICK_COLOR = '#ff00ff';  // Pink
        const MISS_COLOR = '#aaaaaa';   // Light Gray
        
        // Settings
        const NOTE_SPEED_FACTOR = 0.85; // Velocity per second
        const HIT_WINDOW_PX = 65;
        const FLICK_THRESHOLD_PX = 25;
        const MAX_SIMULTANEOUS_NOTES = 2; // Strict limit: max 2 simultaneous notes
        
        let canvas, ctx;
        let score = 0;
        let combo = 0;
        let isPlaying = false;
        let lastTime = 0;
        let audioCtx = null;

        let notes = [];
        let hitEffects = [];
        let particles = [];

        let activeTouches = new Map();
        let laneHoldStatus = new Array(LANES).fill(false);

        let spawnTimer = 0;
        const SPAWN_INTERVAL = 0.8; // Decreased spawn frequency (was 0.4)
        
        let laneOccupiedUntil = new Array(LANES).fill(0);

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTapSound(lane, pitchOffset = 0) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            
            const freq = 300 + (lane * 60) + pitchOffset;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.05);
            
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function toggleFullscreen() {
            const container = document.body;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        // Returns Normalized Y screen pixel coordinate given progress p (0 = top horizon, 1 = judgment line)
        function progressToY(p) {
            const topY = canvas.height * 0.15;
            const judgeY = canvas.height * 0.85;
            return topY + p * (judgeY - topY);
        }

        function spawnNotes(dt) {
            spawnTimer += dt;
            const now = performance.now();

            if (spawnTimer >= SPAWN_INTERVAL) {
                spawnTimer = 0;
                
                // 1. Find available lanes that aren't on cooldown
                let availableLanes = [];
                for (let i = 0; i < LANES; i++) {
                    if (now > laneOccupiedUntil[i]) {
                        availableLanes.push(i);
                    }
                }

                if (availableLanes.length === 0) return;

                // 2. Count active concurrent beats currently at the top horizon spawn point (progress < 0.15)
                const activeSpawnsAtHorizon = notes.filter(n => {
                    const headP = n.type === 'hold' ? n.headProgress : n.progress;
                    return headP < 0.15 && !n.missed;
                }).length;

                // Determine max allowable notes to spawn right now (at most 2 total simultaneous)
                let allowedToSpawn = Math.min(
                    MAX_SIMULTANEOUS_NOTES - activeSpawnsAtHorizon,
                    Math.random() < 0.2 ? 2 : 1 // 20% chance to attempt double note spawn
                );

                if (allowedToSpawn <= 0) return;

                // Pick random lanes and spawn
                for (let s = 0; s < allowedToSpawn && availableLanes.length > 0; s++) {
                    const laneIndex = Math.floor(Math.random() * availableLanes.length);
                    const lane1 = availableLanes.splice(laneIndex, 1)[0];
                    const randType = Math.random();

                    if (randType < 0.35) {
                        // FIXED HOLD LENGTH: progress length (0.35 of total track)
                        const holdProgressLen = 0.35; 
                        const endIsFlick = Math.random() < 0.4;

                        notes.push({
                            type: 'hold',
                            lane: lane1,
                            progress: -holdProgressLen,  // Tail progress starts behind head
                            headProgress: 0,             // Head progress starts at 0
                            length: holdProgressLen,     // Fixed length
                            holding: false,
                            headHit: false,
                            missed: false,
                            endIsFlick: endIsFlick
                        });
                        laneOccupiedUntil[lane1] = now + ((holdProgressLen + 0.8) / NOTE_SPEED_FACTOR) * 1000;
                    } else if (randType < 0.65) {
                        notes.push({
                            type: 'flick',
                            lane: lane1,
                            progress: 0,
                            missed: false
                        });
                        laneOccupiedUntil[lane1] = now + (0.4 / NOTE_SPEED_FACTOR) * 1000;
                    } else {
                        notes.push({
                            type: 'tap',
                            lane: lane1,
                            progress: 0,
                            missed: false
                        });
                        laneOccupiedUntil[lane1] = now + (0.4 / NOTE_SPEED_FACTOR) * 1000;
                    }
                }
            }
        }

        function update(dt) {
            if (!isPlaying) return;

            spawnNotes(dt);

            const judgeY = canvas.height * 0.85;

            // Sync active lane holds from touch state
            laneHoldStatus.fill(false);
            for (let t of activeTouches.values()) {
                if (t.lane >= 0 && t.lane < LANES) {
                    laneHoldStatus[t.lane] = true;
                }
            }

            for (let n of notes) {
                if (n.missed) continue;

                if (n.type === 'tap' || n.type === 'flick') {
                    n.progress += NOTE_SPEED_FACTOR * dt;
                    const curY = progressToY(n.progress);

                    if (curY > judgeY + HIT_WINDOW_PX) {
                        n.missed = true;
                        combo = 0;
                        updateHUD();
                        addHitEffect(n.lane, judgeY, "MISS", MISS_COLOR);
                    }
                } else if (n.type === 'hold') {
                    // BEFORE head is hit: head and tail move in locked step maintaining exact length
                    if (!n.headHit) {
                        n.headProgress += NOTE_SPEED_FACTOR * dt;
                        n.progress = n.headProgress - n.length; 
                    } else {
                        // WHILE holding: tail advances towards judgment line
                        n.progress += NOTE_SPEED_FACTOR * dt;
                        n.headProgress = Math.min(1.0, n.headProgress); // Anchor head at judgment line
                    }

                    const headY = progressToY(n.headProgress);
                    const tailY = progressToY(n.progress);

                    if (!n.headHit && headY > judgeY + HIT_WINDOW_PX) {
                        n.missed = true;
                        combo = 0;
                        updateHUD();
                        addHitEffect(n.lane, judgeY, "MISS", MISS_COLOR);
                        continue;
                    }

                    if (n.holding) {
                        score += Math.round(150 * dt);
                        updateHUD();

                        if (!laneHoldStatus[n.lane] && tailY < judgeY - HIT_WINDOW_PX) {
                            n.holding = false;
                            n.missed = true;
                            combo = 0;
                            updateHUD();
                            addHitEffect(n.lane, judgeY, "EARLY RELEASE", MISS_COLOR);
                        }
                    }

                    if (n.headHit && n.holding && tailY > judgeY + HIT_WINDOW_PX) {
                        n.holding = false;
                        n.missed = true;
                        combo = 0;
                        updateHUD();
                        addHitEffect(n.lane, judgeY, n.endIsFlick ? "MISS FLICK" : "LATE RELEASE", MISS_COLOR);
                    }
                }
            }

            notes = notes.filter(n => !n.missed);
            
            for (let e of hitEffects) {
                e.life -= dt;
            }
            hitEffects = hitEffects.filter(e => e.life > 0);

            for (let p of particles) {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += p.gravity * dt;
                p.life -= dt;
            }
            particles = particles.filter(p => p.life > 0);
        }

        function handlePressLane(laneIndex, touchData) {
            const judgeY = canvas.height * 0.85;
            let hitFound = false;

            for (let n of notes) {
                if (n.lane === laneIndex && !n.missed) {
                    if (n.type === 'tap') {
                        const curY = progressToY(n.progress);
                        const diff = Math.abs(curY - judgeY);
                        if (diff <= HIT_WINDOW_PX) {
                            n.missed = true;
                            hitFound = true;
                            playTapSound(laneIndex);

                            if (diff < HIT_WINDOW_PX * 0.4) {
                                score += 1000;
                                combo++;
                                addHitEffect(laneIndex, curY, "PERFECT", TAP_COLOR);
                            } else {
                                score += 500;
                                combo++;
                                addHitEffect(laneIndex, curY, "GREAT", "#ff007f");
                            }
                            updateHUD();
                            break;
                        }
                    } else if (n.type === 'hold' && !n.headHit) {
                        const headY = progressToY(n.headProgress);
                        const diff = Math.abs(headY - judgeY);
                        if (diff <= HIT_WINDOW_PX) {
                            n.headHit = true;
                            n.holding = true;
                            hitFound = true;
                            playTapSound(laneIndex, 100);

                            combo++;
                            addHitEffect(laneIndex, headY, "HOLD!", HOLD_COLOR);
                            updateHUD();
                            break;
                        }
                    }
                }
            }

            if (!hitFound) {
                addHitEffect(laneIndex, judgeY, "", "rgba(255,255,255,0.15)");
            }
        }

        function handleFlickLane(laneIndex, flickDistance) {
            const judgeY = canvas.height * 0.85;

            for (let n of notes) {
                if (n.lane === laneIndex && !n.missed) {
                    if (n.type === 'flick') {
                        const curY = progressToY(n.progress);
                        const diff = Math.abs(curY - judgeY);
                        if (diff <= HIT_WINDOW_PX) {
                            n.missed = true;
                            playTapSound(laneIndex, 250);

                            if (diff < HIT_WINDOW_PX * 0.4) {
                                score += 1200;
                                combo++;
                                addHitEffect(laneIndex, curY, "FLICK PERFECT!", FLICK_COLOR);
                            } else {
                                score += 700;
                                combo++;
                                addHitEffect(laneIndex, curY, "FLICK GREAT!", FLICK_COLOR);
                            }
                            updateHUD();
                            break;
                        }
                    } 
                    else if (n.type === 'hold' && n.headHit && n.holding && n.endIsFlick) {
                        const tailY = progressToY(n.progress);
                        const diff = Math.abs(tailY - judgeY);
                        if (diff <= HIT_WINDOW_PX) {
                            n.holding = false;
                            n.missed = true;
                            playTapSound(laneIndex, 300);

                            score += 1200;
                            combo++;
                            addHitEffect(laneIndex, judgeY, "FLICK END!", FLICK_COLOR);
                            updateHUD();
                            break;
                        }
                    }
                }
            }
        }

        function handleReleaseLane(laneIndex) {
            const judgeY = canvas.height * 0.85;

            for (let n of notes) {
                if (n.lane === laneIndex && n.type === 'hold' && n.headHit && n.holding && !n.missed) {
                    if (n.endIsFlick) continue;

                    const tailY = progressToY(n.progress);
                    const diff = Math.abs(tailY - judgeY);
                    if (diff <= HIT_WINDOW_PX) {
                        n.holding = false;
                        n.missed = true;
                        playTapSound(laneIndex, 200);

                        score += 1000;
                        combo++;
                        updateHUD();
                        addHitEffect(laneIndex, judgeY, "PERFECT RELEASE!", HOLD_COLOR);
                    }
                }
            }
        }

        function addHitEffect(lane, y, text, color) {
            const maxLife = 0.35;
            hitEffects.push({
                lane: lane,
                y: y,
                text: text,
                color: color,
                life: maxLife,
                maxLife: maxLife
            });

            if (text && text !== "MISS" && text !== "EARLY RELEASE" && text !== "LATE RELEASE") {
                const coords = getTrackCoords(lane, y);
                const cx = coords.x + coords.width / 2;
                const particleCount = 12 + Math.floor(Math.random() * 8);

                for (let i = 0; i < particleCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 120 + Math.random() * 260;
                    particles.push({
                        x: cx,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 60,
                        size: 3 + Math.random() * 5,
                        color: color,
                        life: 0.25 + Math.random() * 0.2,
                        maxLife: 0.45,
                        gravity: 300
                    });
                }
            }
        }

        function updateHUD() {
            document.getElementById('score').textContent = score.toString().padStart(6, '0');
            document.getElementById('combo').textContent = `${combo} COMBO`;
        }

        function getTrackCoords(lane, currentY) {
            const topY = canvas.height * 0.15;
            const bottomY = canvas.height * 0.95;

            const progress = (currentY - topY) / (bottomY - topY);

            const topTrackWidth = canvas.width * 0.35;
            const bottomTrackWidth = canvas.width * 0.95;

            const currentTrackWidth = topTrackWidth + (bottomTrackWidth - topTrackWidth) * progress;
            const trackLeft = (canvas.width - currentTrackWidth) / 2;

            const laneWidth = currentTrackWidth / LANES;
            const laneLeft = trackLeft + laneWidth * lane;

            return {
                x: laneLeft,
                y: currentY,
                width: laneWidth
            };
        }

        function drawTrapezoid(topY, bottomY, lane, color, inset = 2) {
            const top = getTrackCoords(lane, topY);
            const bot = getTrackCoords(lane, bottomY);

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(top.x + inset, top.y);
            ctx.lineTo(top.x + top.width - inset, top.y);
            ctx.lineTo(bot.x + bot.width - inset, bot.y);
            ctx.lineTo(bot.x + inset, bot.y);
            ctx.closePath();
            ctx.fill();
        }

        function drawFlickArrow(lane, y, color) {
            const coords = getTrackCoords(lane, y);
            const cx = coords.x + coords.width / 2;
            
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(cx - 10, y + 2);
            ctx.lineTo(cx, y - 10);
            ctx.lineTo(cx + 10, y + 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cx - 10, y + 8);
            ctx.lineTo(cx, y - 4);
            ctx.lineTo(cx + 10, y + 8);
            ctx.stroke();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const topY = canvas.height * 0.15;
            const judgeY = canvas.height * 0.85;

            // Perspective Lane Dividers
            for (let i = 0; i <= LANES; i++) {
                const topTrackWidth = canvas.width * 0.35;
                const bottomTrackWidth = canvas.width * 0.95;

                const xTop = ((canvas.width - topTrackWidth) / 2) + (topTrackWidth / LANES) * i;
                const xBottom = ((canvas.width - bottomTrackWidth) / 2) + (bottomTrackWidth / LANES) * i;

                ctx.strokeStyle = i === 4 ? '#ffffff' : '#1f2833';
                ctx.lineWidth = i === 4 ? 2 : 1;
                ctx.beginPath();
                ctx.moveTo(xTop, topY);
                ctx.lineTo(xBottom, canvas.height);
                ctx.stroke();
            }

            // Hit Area Zone Box
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.fillRect(0, judgeY - HIT_WINDOW_PX, canvas.width, HIT_WINDOW_PX * 2);

            // Judgment Target Line
            const pLeft = getTrackCoords(0, judgeY);
            const pRight = getTrackCoords(7, judgeY);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#66fcf1';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(pLeft.x, judgeY);
            ctx.lineTo(pRight.x + pRight.width, judgeY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Lane Touch Highlights
            for (let i = 0; i < LANES; i++) {
                if (laneHoldStatus[i]) {
                    drawTrapezoid(topY, canvas.height, i, 'rgba(255, 255, 255, 0.2)', 0);
                }
            }

            // Draw Falling Notes
            for (let n of notes) {
                if (n.missed) continue;

                if (n.type === 'tap') {
                    const curY = progressToY(n.progress);
                    const noteHeight = 16;
                    ctx.shadowColor = TAP_COLOR;
                    ctx.shadowBlur = 8;
                    drawTrapezoid(curY - noteHeight / 2, curY + noteHeight / 2, n.lane, TAP_COLOR, 2);
                    ctx.shadowBlur = 0;
                } else if (n.type === 'flick') {
                    const curY = progressToY(n.progress);
                    const noteHeight = 18;
                    ctx.shadowColor = FLICK_COLOR;
                    ctx.shadowBlur = 10;
                    drawTrapezoid(curY - noteHeight / 2, curY + noteHeight / 2, n.lane, FLICK_COLOR, 2);
                    drawFlickArrow(n.lane, curY, '#ffffff');
                    ctx.shadowBlur = 0;
                } else if (n.type === 'hold') {
                    // Only render visible portion above horizon (progress > 0)
                    const renderTailProgress = Math.max(0, n.progress);
                    const renderHeadProgress = Math.max(0, n.headProgress);

                    if (renderHeadProgress > 0) {
                        const tailY = progressToY(renderTailProgress);
                        const headY = progressToY(renderHeadProgress);

                        drawTrapezoid(tailY, headY, n.lane, HOLD_COLOR + '77', 4);

                        ctx.shadowColor = HOLD_COLOR;
                        ctx.shadowBlur = 8;
                        drawTrapezoid(headY - 8, headY + 8, n.lane, HOLD_COLOR, 2);
                        ctx.shadowBlur = 0;
                        
                        if (renderTailProgress > 0) {
                            const tailColor = n.endIsFlick ? FLICK_COLOR : '#ffffff';
                            ctx.shadowColor = tailColor;
                            ctx.shadowBlur = n.endIsFlick ? 10 : 0;
                            drawTrapezoid(tailY - 8, tailY + 8, n.lane, tailColor, 2);
                            if (n.endIsFlick) {
                                drawFlickArrow(n.lane, tailY, '#ffffff');
                            }
                            ctx.shadowBlur = 0;
                        }
                    }
                }
            }

            // Visual Effects
            for (let e of hitEffects) {
                const c = getTrackCoords(e.lane, e.y);
                const progress = 1 - (e.life / e.maxLife);
                const cx = c.x + c.width / 2;

                if (e.text && e.text !== "MISS") {
                    const beamAlpha = (1 - progress) * 0.35;
                    drawTrapezoid(topY, canvas.height, e.lane, e.color.slice(0, 7) + Math.floor(beamAlpha * 255).toString(16).padStart(2, '0'), 0);
                }

                const rx = (c.width / 2 + progress * 45);
                const ry = (12 + progress * 20);

                ctx.save();
                ctx.translate(cx, e.y);
                
                ctx.strokeStyle = e.color;
                ctx.lineWidth = 4 * (1 - progress);
                ctx.globalAlpha = (1 - progress);
                ctx.beginPath();
                ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = e.color;
                ctx.globalAlpha = (1 - progress) * 0.25;
                ctx.beginPath();
                ctx.ellipse(0, 0, rx * 0.7, ry * 0.7, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (e.text) {
                    const textY = e.y - 15 - (progress * 25);
                    const scale = 1 + Math.sin(progress * Math.PI) * 0.3;

                    ctx.save();
                    ctx.translate(cx, textY);
                    ctx.scale(scale, scale);
                    ctx.fillStyle = e.color;
                    ctx.globalAlpha = (1 - progress);
                    ctx.font = '900 16px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = e.color;
                    ctx.shadowBlur = 10;
                    ctx.fillText(e.text, 0, 0);
                    ctx.restore();
                }
            }

            for (let p of particles) {
                const alpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = alpha;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        function handleTouchStart(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touches = e.changedTouches;

            for (let i = 0; i < touches.length; i++) {
                const touch = touches[i];
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                
                const topTrackWidth = canvas.width * 0.95;
                const trackLeft = (canvas.width - topTrackWidth) / 2;
                const laneWidth = topTrackWidth / LANES;
                const laneIndex = Math.floor((x - trackLeft) / laneWidth);

                if (laneIndex >= 0 && laneIndex < LANES) {
                    activeTouches.set(touch.identifier, {
                        lane: laneIndex,
                        startX: x,
                        startY: y,
                        currentX: x,
                        currentY: y,
                        flicked: false
                    });
                    handlePressLane(laneIndex, activeTouches.get(touch.identifier));
                }
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touches = e.changedTouches;

            for (let i = 0; i < touches.length; i++) {
                const touch = touches[i];
                const tData = activeTouches.get(touch.identifier);

                if (tData) {
                    const x = touch.clientX - rect.left;
                    const y = touch.clientY - rect.top;

                    const dx = x - tData.startX;
                    const dy = y - tData.startY;
                    const dist = Math.hypot(dx, dy);

                    if (dist > FLICK_THRESHOLD_PX && !tData.flicked) {
                        tData.flicked = true;
                        handleFlickLane(tData.lane, dist);
                    }

                    tData.currentX = x;
                    tData.currentY = y;
                }
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            const touches = e.changedTouches;

            for (let i = 0; i < touches.length; i++) {
                const touch = touches[i];
                const tData = activeTouches.get(touch.identifier);
                
                if (tData !== undefined) {
                    if (!tData.flicked) {
                        handleReleaseLane(tData.lane);
                    }
                    activeTouches.delete(touch.identifier);
                }
            }
        }

        function startGame() {
            initAudio();
            score = 0;
            combo = 0;
            notes = [];
            hitEffects = [];
            particles = [];
            activeTouches.clear();
            laneOccupiedUntil.fill(0);
            isPlaying = true;
            updateHUD();
            document.getElementById('startOverlay').style.display = 'none';
        }

        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', resizeCanvas);
            resizeCanvas();

            document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
            
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
            canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', startGame);
            document.getElementById('titleFullscreenBtn').addEventListener('click', toggleFullscreen);

            requestAnimationFrame(gameLoop);
        }

        window.onload = init;
    </script>
</body>
</html>
