<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>8-Lane Landscape Rhythm Game</title>
    <style>
        :root {
            --bg-color: #060709;
            --accent-cyan: #00f2fe;
            --accent-magenta: #ff007f;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
            pointer-events: none;
        }

        .hud-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .hud-label {
            font-size: 0.7rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 1.4rem;
            font-weight: 900;
            font-family: monospace;
        }

        #score { color: var(--accent-cyan); }
        #combo { color: #fff; }

        .game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .controls {
            position: absolute;
            bottom: 6px;
            right: 12px;
            display: flex;
            gap: 8px;
            z-index: 15;
        }

        button {
            padding: 6px 12px;
            background: rgba(31, 40, 51, 0.7);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        button:active {
            background: rgba(102, 252, 241, 0.4);
        }

        .start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(6, 7, 9, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            gap: 16px;
        }

        .start-overlay h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .start-overlay p {
            font-size: 0.85rem;
            color: #aaa;
            max-width: 80%;
            text-align: center;
        }

        .title-btn-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-play {
            padding: 10px 28px;
            font-size: 1rem;
            background: var(--accent-cyan);
            color: #000;
            border: none;
            font-weight: 800;
            border-radius: 20px;
        }

        .btn-fullscreen-title {
            padding: 10px 20px;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid var(--accent-cyan);
            font-weight: 700;
            border-radius: 20px;
        }

        @media screen and (orientation: portrait) {
            .start-overlay::before {
                content: "⚠️ Please rotate device to Landscape";
                color: #ff3333;
                font-weight: bold;
                font-size: 1rem;
                padding: 6px 12px;
                border: 1px solid #ff3333;
                border-radius: 4px;
                background: rgba(255,0,0,0.1);
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="hud">
            <div class="hud-item">
                <span class="hud-label">Score</span>
                <span id="score" class="hud-value">000000</span>
            </div>
            <div class="hud-item">
                <span id="combo" class="hud-value">0 COMBO</span>
            </div>
        </div>

        <div class="game-container" id="gameContainer">
            <canvas id="gameCanvas"></canvas>
            
            <div id="startOverlay" class="start-overlay">
                <h1>BEAT STRIKE (8-LANES)</h1>
                <p>Tap tap notes or hold & release yellow long notes around the judgment line.</p>
                
                <div class="title-btn-group">
                    <button id="startBtn" class="btn-play">PLAY GAME</button>
                    <button id="titleFullscreenBtn" class="btn-fullscreen-title">Toggle Full Screen</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="restartBtn">Restart</button>
        </div>
    </div>

    <script>
        const LANES = 8;
        const LANE_COLORS = [
            '#00f2fe', '#00c3ff', '#0099ff', '#0066ff',
            '#ff00aa', '#ff007f', '#ff0055', '#ff2a2a'
        ];
        const HOLD_COLOR = '#ffcc00';

        const TYPE_TAP = 'TAP';
        const TYPE_HOLD = 'HOLD';

        // Hit Detection Window (+/- 45 pixels around the target line)
        const JUDGMENT_WINDOW_PX = 45;

        let canvas, ctx;
        let score = 0;
        let combo = 0;
        let isPlaying = false;
        let lastTime = 0;
        let audioCtx = null;

        let notes = [];
        let hitEffects = [];
        let activeTouches = new Map(); // TouchID -> Lane Index

        let spawnTimer = 0;
        const SPAWN_INTERVAL = 0.45; 
        
        // Consistent travel speed in Pixels Per Second
        let NOTE_SPEED_PX = 400; 

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTapSound(lane, freqShift = 0) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            
            const freq = 300 + (lane * 65) + freqShift;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.05);
            
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            // Scale velocity to screen height so visual timing stays natural
            NOTE_SPEED_PX = canvas.height * 0.75; 
        }

        function toggleFullscreen() {
            const container = document.body;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        function spawnNotes(dt) {
            spawnTimer += dt;
            if (spawnTimer >= SPAWN_INTERVAL) {
                spawnTimer = 0;
                
                const lane1 = Math.floor(Math.random() * LANES);
                const isHold = Math.random() < 0.25; // 25% chance for hold note

                if (isHold) {
                    const holdLength = 120 + Math.random() * 100; // Pixel length of hold tail
                    notes.push({
                        type: TYPE_HOLD,
                        lane: lane1,
                        y: 0,
                        length: holdLength,
                        isHolding: false,
                        hit: false
                    });
                } else {
                    notes.push({
                        type: TYPE_TAP,
                        lane: lane1,
                        y: 0,
                        hit: false
                    });
                }
            }
        }

        function update(dt) {
            if (!isPlaying) return;

            spawnNotes(dt);

            const judgeY = canvas.height * 0.82;

            for (let n of notes) {
                if (n.hit) continue;

                // Move at steady consistent speed using delta time
                n.y += NOTE_SPEED_PX * dt;

                if (n.type === TYPE_TAP) {
                    // Missed tap note
                    if (n.y > judgeY + JUDGMENT_WINDOW_PX) {
                        n.hit = true;
                        combo = 0;
                        updateHUD();
                        addHitEffect(n.lane, "MISS", "#ff3333");
                    }
                } else if (n.type === TYPE_HOLD) {
                    const tailY = n.y - n.length;

                    if (n.isHolding) {
                        // Check if player is still touching this lane
                        const laneStillTouched = Array.from(activeTouches.values()).includes(n.lane);

                        if (!laneStillTouched) {
                            // Released too early!
                            n.hit = true;
                            combo = 0;
                            updateHUD();
                            addHitEffect(n.lane, "MISS", "#ff3333");
                        } else if (tailY >= judgeY) {
                            // Hold completed successfully!
                            n.hit = true;
                            score += 1500;
                            combo++;
                            updateHUD();
                            playTapSound(n.lane, 200);
                            addHitEffect(n.lane, "HOLD CLEAR", HOLD_COLOR);
                        }
                    } else {
                        // Missed hold head initial hit
                        if (n.y > judgeY + JUDGMENT_WINDOW_PX) {
                            n.hit = true;
                            combo = 0;
                            updateHUD();
                            addHitEffect(n.lane, "MISS", "#ff3333");
                        }
                    }
                }
            }

            notes = notes.filter(n => !n.hit);
            for (let e of hitEffects) e.life -= dt;
            hitEffects = hitEffects.filter(e => e.life > 0);
        }

        function handleLanePress(laneIndex) {
            playTapSound(laneIndex);
            const judgeY = canvas.height * 0.82;
            let hitFound = false;

            for (let n of notes) {
                if (n.lane === laneIndex && !n.hit) {
                    if (n.type === TYPE_TAP) {
                        // Extended Collision Area: Check if within judgment Y range (+/- px)
                        const diff = Math.abs(n.y - judgeY);
                        if (diff <= JUDGMENT_WINDOW_PX) {
                            n.hit = true;
                            hitFound = true;

                            if (diff < JUDGMENT_WINDOW_PX * 0.35) {
                                score += 1000;
                                combo++;
                                addHitEffect(laneIndex, "PERFECT", "#00f2fe");
                            } else {
                                score += 500;
                                combo++;
                                addHitEffect(laneIndex, "GREAT", "#ff007f");
                            }
                            updateHUD();
                            break;
                        }
                    } else if (n.type === TYPE_HOLD && !n.isHolding) {
                        // Initial Hold Press Check
                        const diff = Math.abs(n.y - judgeY);
                        if (diff <= JUDGMENT_WINDOW_PX) {
                            n.isHolding = true;
                            hitFound = true;
                            score += 300;
                            updateHUD();
                            addHitEffect(laneIndex, "HOLDING...", HOLD_COLOR);
                            break;
                        }
                    }
                }
            }

            if (!hitFound) {
                addHitEffect(laneIndex, "", "rgba(255,255,255,0.15)");
            }
        }

        function addHitEffect(lane, text, color) {
            hitEffects.push({
                lane: lane,
                text: text,
                color: color,
                life: 0.25
            });
        }

        function updateHUD() {
            document.getElementById('score').textContent = score.toString().padStart(6, '0');
            document.getElementById('combo').textContent = `${combo} COMBO`;
        }

        function getXForLaneAndY(lane, y) {
            const topY = canvas.height * 0.15;
            const bottomY = canvas.height;
            const progress = Math.max(0, Math.min(1, (y - topY) / (bottomY - topY)));

            const topWidth = canvas.width * 0.35;
            const bottomWidth = canvas.width * 0.95;

            const currentTrackWidth = topWidth + (bottomWidth - topWidth) * progress;
            const trackLeft = (canvas.width - currentTrackWidth) / 2;
            const laneWidth = currentTrackWidth / LANES;

            return {
                x: trackLeft + laneWidth * lane,
                width: laneWidth
            };
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const topY = canvas.height * 0.15;
            const judgeY = canvas.height * 0.82;

            // Draw Perspective Lane Lines
            for (let i = 0; i <= LANES; i++) {
                const topTrackWidth = canvas.width * 0.35;
                const bottomTrackWidth = canvas.width * 0.95;

                const xTop = ((canvas.width - topTrackWidth) / 2) + (topTrackWidth / LANES) * i;
                const xBottom = ((canvas.width - bottomTrackWidth) / 2) + (bottomTrackWidth / LANES) * i;

                ctx.strokeStyle = i === 4 ? '#ffffff' : '#1f2833';
                ctx.lineWidth = i === 4 ? 2 : 1;
                ctx.beginPath();
                ctx.moveTo(xTop, topY);
                ctx.lineTo(xBottom, canvas.height);
                ctx.stroke();
            }

            // Draw Collision/Judgment Area Box (+/- 45px Around Line)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.fillRect(0, judgeY - JUDGMENT_WINDOW_PX, canvas.width, JUDGMENT_WINDOW_PX * 2);

            // Draw Target Judgment Line
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#66fcf1';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(0, judgeY);
            ctx.lineTo(canvas.width, judgeY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Render Notes
            for (let n of notes) {
                if (n.hit) continue;

                if (n.type === TYPE_TAP) {
                    const c = getXForLaneAndY(n.lane, n.y);
                    ctx.fillStyle = LANE_COLORS[n.lane];
                    ctx.shadowColor = LANE_COLORS[n.lane];
                    ctx.shadowBlur = 10;
                    ctx.fillRect(c.x + 2, n.y - 6, c.width - 4, 12);
                    ctx.shadowBlur = 0;
                } else if (n.type === TYPE_HOLD) {
                    const headY = n.y;
                    const tailY = n.y - n.length;

                    const headC = getXForLaneAndY(n.lane, headY);
                    const tailC = getXForLaneAndY(n.lane, tailY);

                    // Draw Hold Note Tail Body
                    ctx.fillStyle = 'rgba(255, 204, 0, 0.4)';
                    ctx.beginPath();
                    ctx.moveTo(headC.x + 4, headY);
                    ctx.lineTo(headC.x + headC.width - 4, headY);
                    ctx.lineTo(tailC.x + tailC.width - 4, tailY);
                    ctx.lineTo(tailC.x + 4, tailY);
                    ctx.closePath();
                    ctx.fill();

                    // Draw Head & Tail Bars
                    ctx.fillStyle = HOLD_COLOR;
                    ctx.shadowColor = HOLD_COLOR;
                    ctx.shadowBlur = 8;
                    ctx.fillRect(headC.x + 2, headY - 6, headC.width - 4, 12);
                    ctx.fillRect(tailC.x + 2, tailY - 4, tailC.width - 4, 8);
                    ctx.shadowBlur = 0;
                }
            }

            // Draw Hit Visual Effects
            for (let e of hitEffects) {
                const c = getXForLaneAndY(e.lane, judgeY);

                ctx.fillStyle = e.color;
                ctx.globalAlpha = (e.life / 0.25) * 0.5;
                ctx.fillRect(c.x, judgeY - JUDGMENT_WINDOW_PX, c.width, JUDGMENT_WINDOW_PX * 2);
                ctx.globalAlpha = 1.0;

                if (e.text) {
                    ctx.fillStyle = e.color;
                    ctx.font = 'bold 15px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(e.text, c.x + c.width / 2, judgeY - JUDGMENT_WINDOW_PX - 10);
                }
            }
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            // Cap max delta time to avoid huge leaps when tab is inactive
            update(Math.min(dt, 0.1));
            render();

            requestAnimationFrame(gameLoop);
        }

        function handleTouchEvents(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touches = e.touches;

            // Rebuild active touches map
            activeTouches.clear();

            for (let i = 0; i < touches.length; i++) {
                const touch = touches[i];
                const x = touch.clientX - rect.left;
                
                const topTrackWidth = canvas.width * 0.95;
                const trackLeft = (canvas.width - topTrackWidth) / 2;
                const laneWidth = topTrackWidth / LANES;
                const laneIndex = Math.floor((x - trackLeft) / laneWidth);

                if (laneIndex >= 0 && laneIndex < LANES) {
                    activeTouches.set(touch.identifier, laneIndex);

                    // If this is a newly registered touch start, trigger lane press
                    if (e.type === 'touchstart') {
                        const changed = e.changedTouches;
                        for (let j = 0; j < changed.length; j++) {
                            if (changed[j].identifier === touch.identifier) {
                                handleLanePress(laneIndex);
                            }
                        }
                    }
                }
            }
        }

        function startGame() {
            initAudio();
            score = 0;
            combo = 0;
            notes = [];
            hitEffects = [];
            isPlaying = true;
            updateHUD();
            document.getElementById('startOverlay').style.display = 'none';
        }

        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', resizeCanvas);
            resizeCanvas();

            document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
            
            // Touch handlers for holds and taps
            canvas.addEventListener('touchstart', handleTouchEvents, { passive: false });
            canvas.addEventListener('touchmove', handleTouchEvents, { passive: false });
            canvas.addEventListener('touchend', handleTouchEvents, { passive: false });
            canvas.addEventListener('touchcancel', handleTouchEvents, { passive: false });

            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', startGame);
            document.getElementById('titleFullscreenBtn').addEventListener('click', toggleFullscreen);

            requestAnimationFrame(gameLoop);
        }

        window.onload = init;
    </script>
</body>
</html>
