<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>8-Lane Landscape Rhythm Game</title>
    <style>
        :root {
            --bg-color: #060709;
            --accent-cyan: #00f2fe;
            --accent-magenta: #ff007f;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 10;
            pointer-events: none;
        }

        .hud-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .hud-label {
            font-size: 0.7rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 1.4rem;
            font-weight: 900;
            font-family: monospace;
        }

        #score { color: var(--accent-cyan); }
        #combo { color: #fff; }

        .game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .controls {
            position: absolute;
            bottom: 6px;
            right: 12px;
            display: flex;
            gap: 8px;
            z-index: 15;
        }

        button {
            padding: 6px 12px;
            background: rgba(31, 40, 51, 0.7);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        button:active {
            background: rgba(102, 252, 241, 0.4);
        }

        .start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(6, 7, 9, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            gap: 16px;
        }

        .start-overlay h1 {
            font-size: 2.2rem;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .start-overlay p {
            font-size: 0.85rem;
            color: #aaa;
            max-width: 80%;
            text-align: center;
        }

        .title-btn-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-play {
            padding: 10px 28px;
            font-size: 1rem;
            background: var(--accent-cyan);
            color: #000;
            border: none;
            font-weight: 800;
            border-radius: 20px;
        }

        .btn-fullscreen-title {
            padding: 10px 20px;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid var(--accent-cyan);
            font-weight: 700;
            border-radius: 20px;
        }

        @media screen and (orientation: portrait) {
            .start-overlay::before {
                content: "⚠️ Please rotate device to Landscape";
                color: #ff3333;
                font-weight: bold;
                font-size: 1rem;
                padding: 6px 12px;
                border: 1px solid #ff3333;
                border-radius: 4px;
                background: rgba(255,0,0,0.1);
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="hud">
            <div class="hud-item">
                <span class="hud-label">Score</span>
                <span id="score" class="hud-value">000000</span>
            </div>
            <div class="hud-item">
                <span id="combo" class="hud-value">0 COMBO</span>
            </div>
        </div>

        <div class="game-container" id="gameContainer">
            <canvas id="gameCanvas"></canvas>
            
            <div id="startOverlay" class="start-overlay">
                <h1>BEAT STRIKE (8-LANES)</h1>
                <p>Tap single notes or HOLD long notes along the tracks when they hit the line.</p>
                
                <div class="title-btn-group">
                    <button id="startBtn" class="btn-play">PLAY GAME</button>
                    <button id="titleFullscreenBtn" class="btn-fullscreen-title">Toggle Full Screen</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="restartBtn">Restart</button>
        </div>
    </div>

    <script>
        const LANES = 8;
        const LANE_COLORS = [
            '#00f2fe', '#00c3ff', '#0099ff', '#0066ff',
            '#ff00aa', '#ff007f', '#ff0055', '#ff2a2a'
        ];
        
        // Consistent Movement & Hit Settings
        const NOTE_SPEED_PX = 380; // Constant speed in pixels per second
        const HIT_WINDOW_PX = 65;   // Collision tolerance above/below judgment line
        
        let canvas, ctx;
        let score = 0;
        let combo = 0;
        let isPlaying = false;
        let lastTime = 0;
        let audioCtx = null;

        let notes = [];
        let hitEffects = [];

        // Active touches mapped by touch identifier to track held lanes
        let activeTouches = new Map(); // touchId -> laneIndex
        let laneHoldStatus = new Array(LANES).fill(false);

        let spawnTimer = 0;
        const SPAWN_INTERVAL = 0.4; 
        
        // Tracks occupied lanes and clearance time to prevent overlapping
        let laneOccupiedUntil = new Array(LANES).fill(0);

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTapSound(lane, pitchOffset = 0) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            
            const freq = 300 + (lane * 60) + pitchOffset;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.05);
            
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function toggleFullscreen() {
            const container = document.body;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        function spawnNotes(dt) {
            spawnTimer += dt;
            const now = performance.now();

            if (spawnTimer >= SPAWN_INTERVAL) {
                spawnTimer = 0;
                
                // Choose a lane that isn't currently occupied by a hold note
                let availableLanes = [];
                for (let i = 0; i < LANES; i++) {
                    if (now > laneOccupiedUntil[i]) {
                        availableLanes.push(i);
                    }
                }

                if (availableLanes.length === 0) return;

                const lane1 = availableLanes[Math.floor(Math.random() * availableLanes.length)];
                const isHold = Math.random() < 0.3; // 30% chance for a hold note

                if (isHold) {
                    const holdLengthPx = 180 + Math.random() * 120;
                    notes.push({
                        type: 'hold',
                        lane: lane1,
                        y: 0,                   // Tail position
                        headY: -holdLengthPx,   // Head starts higher up
                        length: holdLengthPx,
                        holding: false,
                        headHit: false,
                        missed: false
                    });
                    // Lock lane until the full note finishes passing
                    laneOccupiedUntil[lane1] = now + ((holdLengthPx + 200) / NOTE_SPEED_PX) * 1000;
                } else {
                    notes.push({
                        type: 'tap',
                        lane: lane1,
                        y: 0,
                        missed: false
                    });
                    laneOccupiedUntil[lane1] = now + (150 / NOTE_SPEED_PX) * 1000;
                }
            }
        }

        function update(dt) {
            if (!isPlaying) return;

            spawnNotes(dt);

            const judgeY = canvas.height * 0.85;

            // Update Active Lane Hold States from Multi-Touch Map
            laneHoldStatus.fill(false);
            for (let lane of activeTouches.values()) {
                if (lane >= 0 && lane < LANES) {
                    laneHoldStatus[lane] = true;
                }
            }

            for (let n of notes) {
                if (n.missed) continue;

                if (n.type === 'tap') {
                    n.y += NOTE_SPEED_PX * dt;

                    // Missed if passed hit window below judge line
                    if (n.y > judgeY + HIT_WINDOW_PX) {
                        n.missed = true;
                        combo = 0;
                        updateHUD();
                        addHitEffect(n.lane, judgeY, "MISS", "#ff3333");
                    }
                } else if (n.type === 'hold') {
                    n.y += NOTE_SPEED_PX * dt;
                    n.headY += NOTE_SPEED_PX * dt;

                    // Check hold state updates
                    if (n.holding) {
                        // Tick points while holding
                        score += Math.round(200 * dt);
                        updateHUD();

                        // Released too early check
                        if (!laneHoldStatus[n.lane] && n.y < judgeY - HIT_WINDOW_PX) {
                            n.holding = false;
                            n.missed = true;
                            combo = 0;
                            updateHUD();
                            addHitEffect(n.lane, judgeY, "DROP", "#ffaa00");
                        }
                    }

                    // Missed head completely
                    if (!n.headHit && n.headY > judgeY + HIT_WINDOW_PX) {
                        n.missed = true;
                        combo = 0;
                        updateHUD();
                        addHitEffect(n.lane, judgeY, "MISS", "#ff3333");
                    }

                    // Successfully completed hold release
                    if (n.headHit && n.y >= judgeY - HIT_WINDOW_PX) {
                        score += 800;
                        combo++;
                        updateHUD();
                        addHitEffect(n.lane, judgeY, "PERFECT", "#00f2fe");
                        n.missed = true; // Mark done
                    }
                }
            }

            // Cleanup missed or completed notes
            notes = notes.filter(n => !n.missed);
            for (let e of hitEffects) e.life -= dt;
            hitEffects = hitEffects.filter(e => e.life > 0);
        }

        function handlePressLane(laneIndex) {
            const judgeY = canvas.height * 0.85;
            let hitFound = false;

            for (let n of notes) {
                if (n.lane === laneIndex && !n.missed) {
                    if (n.type === 'tap') {
                        const diff = Math.abs(n.y - judgeY);
                        if (diff <= HIT_WINDOW_PX) {
                            n.missed = true;
                            hitFound = true;
                            playTapSound(laneIndex);

                            if (diff < HIT_WINDOW_PX * 0.4) {
                                score += 1000;
                                combo++;
                                addHitEffect(laneIndex, n.y, "PERFECT", "#00f2fe");
                            } else {
                                score += 500;
                                combo++;
                                addHitEffect(laneIndex, n.y, "GREAT", "#ff007f");
                            }
                            updateHUD();
                            break;
                        }
                    } else if (n.type === 'hold' && !n.headHit) {
                        const diff = Math.abs(n.headY - judgeY);
                        if (diff <= HIT_WINDOW_PX) {
                            n.headHit = true;
                            n.holding = true;
                            hitFound = true;
                            playTapSound(laneIndex, 100);

                            combo++;
                            addHitEffect(laneIndex, n.headY, "HOLD!", "#00f2fe");
                            updateHUD();
                            break;
                        }
                    }
                }
            }

            if (!hitFound) {
                addHitEffect(laneIndex, judgeY, "", "rgba(255,255,255,0.15)");
            }
        }

        function addHitEffect(lane, y, text, color) {
            hitEffects.push({
                lane: lane,
                y: y,
                text: text,
                color: color,
                life: 0.25
            });
        }

        function updateHUD() {
            document.getElementById('score').textContent = score.toString().padStart(6, '0');
            document.getElementById('combo').textContent = `${combo} COMBO`;
        }

        function getTrackCoords(lane, currentY) {
            const topY = canvas.height * 0.15;
            const bottomY = canvas.height * 0.95;

            // Normalized Y ratio along the playable length
            const progress = Math.max(0, Math.min(1, (currentY - topY) / (bottomY - topY)));

            const topTrackWidth = canvas.width * 0.35;
            const bottomTrackWidth = canvas.width * 0.95;

            const currentTrackWidth = topTrackWidth + (bottomTrackWidth - topTrackWidth) * progress;
            const trackLeft = (canvas.width - currentTrackWidth) / 2;

            const laneWidth = currentTrackWidth / LANES;
            const laneLeft = trackLeft + laneWidth * lane;

            return {
                x: laneLeft,
                y: currentY,
                width: laneWidth
            };
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const topY = canvas.height * 0.15;
            const judgeY = canvas.height * 0.85;

            // Draw Perspective Lane Dividers
            for (let i = 0; i <= LANES; i++) {
                const topTrackWidth = canvas.width * 0.35;
                const bottomTrackWidth = canvas.width * 0.95;

                const xTop = ((canvas.width - topTrackWidth) / 2) + (topTrackWidth / LANES) * i;
                const xBottom = ((canvas.width - bottomTrackWidth) / 2) + (bottomTrackWidth / LANES) * i;

                ctx.strokeStyle = i === 4 ? '#ffffff' : '#1f2833';
                ctx.lineWidth = i === 4 ? 2 : 1;
                ctx.beginPath();
                ctx.moveTo(xTop, topY);
                ctx.lineTo(xBottom, canvas.height);
                ctx.stroke();
            }

            // Draw Collision Hit Window Box Indicator
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.fillRect(0, judgeY - HIT_WINDOW_PX, canvas.width, HIT_WINDOW_PX * 2);

            // Draw Target Judgment Line
            const pLeft = getTrackCoords(0, judgeY);
            const pRight = getTrackCoords(7, judgeY);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#66fcf1';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(pLeft.x, judgeY);
            ctx.lineTo(pRight.x + pRight.width, judgeY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Draw Active Lane Highlights
            for (let i = 0; i < LANES; i++) {
                if (laneHoldStatus[i]) {
                    const cTop = getTrackCoords(i, topY);
                    const cBot = getTrackCoords(i, canvas.height);

                    ctx.fillStyle = LANE_COLORS[i] + '33';
                    ctx.beginPath();
                    ctx.moveTo(cTop.x, topY);
                    ctx.lineTo(cTop.x + cTop.width, topY);
                    ctx.lineTo(cBot.x + cBot.width, canvas.height);
                    ctx.lineTo(cBot.x, canvas.height);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            // Draw Falling Notes
            for (let n of notes) {
                if (n.missed) continue;

                if (n.type === 'tap') {
                    const c = getTrackCoords(n.lane, n.y);
                    const noteHeight = 14;

                    ctx.fillStyle = LANE_COLORS[n.lane];
                    ctx.shadowColor = LANE_COLORS[n.lane];
                    ctx.shadowBlur = 8;
                    ctx.fillRect(c.x + 2, c.y - noteHeight / 2, c.width - 4, noteHeight);
                    ctx.shadowBlur = 0;
                } else if (n.type === 'hold') {
                    const cHead = getTrackCoords(n.lane, n.headY);
                    const cTail = getTrackCoords(n.lane, n.y);

                    // Draw Hold Strip Body
                    ctx.fillStyle = LANE_COLORS[n.lane] + '77';
                    ctx.beginPath();
                    ctx.moveTo(cHead.x + 4, cHead.y);
                    ctx.lineTo(cHead.x + cHead.width - 4, cHead.y);
                    ctx.lineTo(cTail.x + cTail.width - 4, cTail.y);
                    ctx.lineTo(cTail.x + 4, cTail.y);
                    ctx.closePath();
                    ctx.fill();

                    // Draw Hold Head & Tail Bars
                    ctx.fillStyle = LANE_COLORS[n.lane];
                    ctx.fillRect(cHead.x + 2, cHead.y - 6, cHead.width - 4, 12);
                    ctx.fillRect(cTail.x + 2, cTail.y - 6, cTail.width - 4, 12);
                }
            }

            // Draw Hit Visual Effects
            for (let e of hitEffects) {
                const c = getTrackCoords(e.lane, e.y);

                ctx.fillStyle = e.color;
                ctx.globalAlpha = (e.life / 0.25) * 0.5;
                ctx.fillRect(c.x, c.y - 8, c.width, 16);
                ctx.globalAlpha = 1.0;

                if (e.text) {
                    ctx.fillStyle = e.color;
                    ctx.font = 'bold 15px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(e.text, c.x + c.width / 2, c.y - 18);
                }
            }
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        function handleTouchStart(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touches = e.changedTouches;

            for (let i = 0; i < touches.length; i++) {
                const touch = touches[i];
                const x = touch.clientX - rect.left;
                
                // Track lane mapping anywhere along track width
                const topTrackWidth = canvas.width * 0.95;
                const trackLeft = (canvas.width - topTrackWidth) / 2;
                const laneWidth = topTrackWidth / LANES;
                const laneIndex = Math.floor((x - trackLeft) / laneWidth);

                if (laneIndex >= 0 && laneIndex < LANES) {
                    activeTouches.set(touch.identifier, laneIndex);
                    handlePressLane(laneIndex);
                }
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            const touches = e.changedTouches;
            for (let i = 0; i < touches.length; i++) {
                activeTouches.delete(touches[i].identifier);
            }
        }

        function startGame() {
            initAudio();
            score = 0;
            combo = 0;
            notes = [];
            hitEffects = [];
            activeTouches.clear();
            laneOccupiedUntil.fill(0);
            isPlaying = true;
            updateHUD();
            document.getElementById('startOverlay').style.display = 'none';
        }

        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', resizeCanvas);
            resizeCanvas();

            document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
            
            // Full multi-touch listeners for hold support
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
            canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', startGame);
            document.getElementById('titleFullscreenBtn').addEventListener('click', toggleFullscreen);

            requestAnimationFrame(gameLoop);
        }

        window.onload = init;
    </script>
</body>
</html>
