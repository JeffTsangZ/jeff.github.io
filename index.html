<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catch & Dodge - Mobile Web Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a24;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px; /* Standard mobile width boundary on desktop */
            max-height: 850px;
            background: linear-gradient(180deg, #0f0c20 0%, #1b1638 100%);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Overlay Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 12, 32, 0.85);
            backdrop-filter: blur(4px);
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        p {
            font-size: 1rem;
            color: #a0a0c0;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .score-display {
            font-size: 1.2rem;
            color: #00f0ff;
            margin-bottom: 15px;
        }

        .btn {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Instructions list */
        .instructions {
            text-align: left;
            margin-bottom: 25px;
            font-size: 0.95rem;
            color: #d0d0f0;
        }

        .instructions div {
            margin: 8px 0;
            display: flex;
            align-items: center;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
        }

        .dot.green { background: #00ff66; box-shadow: 0 0 8px #00ff66; }
        .dot.red { background: #ff0055; box-shadow: 0 0 8px #ff0055; }
        .dot.blue { background: #00f0ff; box-shadow: 0 0 8px #00f0ff; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>CATCH & DODGE</h1>
            <p>Drag your paddle across the screen to play.</p>
            
            <div class="instructions">
                <div><span class="dot green"></span> Green: +10 Points</div>
                <div><span class="dot blue"></span> Blue: Power-up (Double Size)</div>
                <div><span class="dot red"></span> Red: Fatal Hazard</div>
            </div>

            <button class="btn" id="start-btn">PLAY</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen hidden">
            <h1>GAME OVER</h1>
            <div class="score-display">Score: <span id="final-score">0</span></div>
            <div class="score-display" style="font-size: 0.9rem; color: #8080a0;">High Score: <span id="high-score">0</span></div>
            <p id="game-over-msg">Watch out for the red orbs!</p>
            <button class="btn" id="restart-btn">TRY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreEl = document.getElementById('final-score');
        const highScoreEl = document.getElementById('high-score');

        // Game State Variables
        let isPlaying = false;
        let score = 0;
        let highScore = localStorage.getItem('cd_highscore') || 0;
        let animationFrameId;
        let spawnTimer = 0;
        let difficultyMultiplier = 1;

        // Dynamic Sizing
        let width, height;

        function resize() {
            const container = document.getElementById('game-container');
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Player Object
        const player = {
            x: 0,
            y: 0,
            baseWidth: 70,
            width: 70,
            height: 12,
            targetX: 0,
            color: '#00f0ff',
            powerTimer: 0,

            init() {
                this.width = this.baseWidth;
                this.x = width / 2 - this.width / 2;
                this.targetX = this.x;
                this.y = height - 60;
                this.powerTimer = 0;
            },

            update() {
                // Smooth movement towards touch position
                this.x += (this.targetX - this.x) * 0.25;

                // Clamp inside bounds
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > width) this.x = width - this.width;

                // Handle Power-up timers
                if (this.powerTimer > 0) {
                    this.powerTimer--;
                    if (this.powerTimer === 0) {
                        this.width = this.baseWidth;
                    }
                }
            },

            draw() {
                ctx.save();
                ctx.fillStyle = this.powerTimer > 0 ? '#00ff66' : this.color;
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 6);
                ctx.fill();
                ctx.restore();
            },

            expand() {
                this.width = this.baseWidth * 1.8;
                this.powerTimer = 300; // ~5 seconds at 60fps
            }
        };

        // Item/Entity Management
        let items = [];

        class Item {
            constructor() {
                this.radius = 10 + Math.random() * 4;
                this.x = this.radius + Math.random() * (width - this.radius * 2);
                this.y = -this.radius;
                this.speed = (2.5 + Math.random() * 2) * difficultyMultiplier;
                
                // Roll item type
                const rand = Math.random();
                if (rand < 0.65) {
                    this.type = 'point'; // 65% chance
                    this.color = '#00ff66';
                } else if (rand < 0.90) {
                    this.type = 'hazard'; // 25% chance
                    this.color = '#ff0055';
                } else {
                    this.type = 'powerup'; // 10% chance
                    this.color = '#00f0ff';
                }
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Particle Effects
        let particles = [];

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 4 + 1;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.alpha = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.03;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createBurst(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // Touch & Drag Controls
        function handleMove(e) {
            if (!isPlaying) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const rect = canvas.getBoundingClientRect();
            // Align target center to user finger/pointer position
            player.targetX = (clientX - rect.left) - player.width / 2;
        }

        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('touchmove', (e) => {
            handleMove(e);
            e.preventDefault();
        }, { passive: false });

        // Collision Logic
        function checkCollisions(item) {
            // Circle to AABB Collision
            const closestX = Math.max(player.x, Math.min(item.x, player.x + player.width));
            const closestY = Math.max(player.y, Math.min(item.y, player.y + player.height));

            const distX = item.x - closestX;
            const distY = item.y - closestY;
            const distance = Math.sqrt((distX * distX) + (distY * distY));

            return distance < item.radius;
        }

        // Game Loop
        function gameLoop() {
            if (!isPlaying) return;

            // Clear Screen
            ctx.clearRect(0, 0, width, height);

            // Progressive difficulty ramp
            difficultyMultiplier += 0.0003;

            // Spawn Entities
            spawnTimer++;
            if (spawnTimer > Math.max(20, 50 - Math.floor(difficultyMultiplier * 5))) {
                items.push(new Item());
                spawnTimer = 0;
            }

            // Update & Draw Player
            player.update();
            player.draw();

            // Handle Items
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.update();
                item.draw();

                // Check Paddle Collision
                if (checkCollisions(item)) {
                    createBurst(item.x, item.y, item.color);

                    if (item.type === 'point') {
                        score += 10;
                    } else if (item.type === 'powerup') {
                        player.expand();
                        score += 5;
                    } else if (item.type === 'hazard') {
                        gameOver();
                        return;
                    }
                    items.splice(i, 1);
                    continue;
                }

                // Remove out-of-bounds items
                if (item.y - item.radius > height) {
                    items.splice(i, 1);
                }
            }

            // Handle Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Draw HUD
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText(`Score: ${score}`, 20, 35);

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // Start / Reset Engine
        function startGame() {
            isPlaying = true;
            score = 0;
            difficultyMultiplier = 1;
            items = [];
            particles = [];
            player.init();

            startScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');

            cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function gameOver() {
            isPlaying = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('cd_highscore', highScore);
            }

            finalScoreEl.textContent = score;
            highScoreEl.textContent = highScore;
            gameoverScreen.classList.remove('hidden');
        }

        // Event Listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
