<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Pixel RPG</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0d0e15;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 800px;
            max-height: 600px;
            background: #111;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 2px solid #333;
        }

        /* Adjust dimensions when actual browser fullscreen is active */
        #game-wrapper:fullscreen {
            max-width: none;
            max-height: none;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        /* Fallback selector for vendor prefixes */
        #game-wrapper:-webkit-full-screen {
            max-width: none;
            max-height: none;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated; /* Sharp retro pixel graphics */
        }

        /* UI Overlays */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            z-index: 5;
        }

        .bar-container {
            width: 130px;
            height: 16px;
            background: #222;
            border: 2px solid #fff;
            margin-top: 4px;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.2s ease;
        }

        #hp-fill { background: #e74c3c; }
        #xp-fill { background: #f1c40f; }

        #save-status {
            font-size: 11px;
            color: #2ecc71;
            margin-top: 4px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .top-controls {
            position: absolute;
            top: 60px;
            left: 10px;
            display: flex;
            gap: 6px;
            z-index: 6;
            pointer-events: auto;
        }

        .ui-btn {
            background: rgba(40, 40, 60, 0.85);
            border: 1px solid #fff;
            color: #fff;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .ui-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }

        #reset-btn {
            background: rgba(231, 76, 60, 0.85);
        }

        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(16, 18, 27, 0.95);
            border: 3px solid #f1c40f;
            border-radius: 4px;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.4;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 5;
        }

        #dialogue-title {
            color: #f1c40f;
            font-weight: bold;
            margin-bottom: 4px;
        }

        /* Mobile Virtual Controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 5;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 45px);
            grid-template-rows: repeat(3, 45px);
            gap: 3px;
            pointer-events: auto;
        }

        .btn-ctrl {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            color: white;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        .btn-ctrl:active { background: rgba(255, 255, 255, 0.5); }

        #btn-attack {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(231, 76, 60, 0.6);
            border: 2px solid #fff;
            pointer-events: auto;
            font-size: 14px;
            font-weight: bold;
        }

        @media (pointer: coarse) {
            #mobile-controls { display: flex; }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas" width="400" height="300"></canvas>

        <div class="top-controls">
            <button id="fullscreen-btn" class="ui-btn">⛶ Fullscreen</button>
            <button id="reset-btn" class="ui-btn">Reset Save</button>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div>
                HP
                <div class="bar-container"><div id="hp-fill" class="bar-fill"></div></div>
            </div>
            <div>
                <div id="save-status">Game Saved</div>
            </div>
            <div style="text-align: right;">
                <span id="level-txt">LVL 1</span>
                <div class="bar-container"><div id="xp-fill" class="bar-fill" style="width: 0%;"></div></div>
            </div>
        </div>

        <!-- Dialogue UI -->
        <div id="dialogue-box">
            <div id="dialogue-title">Village Elder</div>
            <div id="dialogue-text">Welcome back, Hero! Clean up those slimes. Your progress is saved!</div>
        </div>

        <!-- Touch Controls -->
        <div id="mobile-controls">
            <div class="dpad">
                <div></div><div class="btn-ctrl" id="btn-up">▲</div><div></div>
                <div class="btn-ctrl" id="btn-left">◄</div><div></div><div class="btn-ctrl" id="btn-right">►</div>
                <div></div><div class="btn-ctrl" id="btn-down">▼</div><div></div>
            </div>
            <button class="btn-ctrl" id="btn-attack">ATTACK</button>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('game-wrapper');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- FULLSCREEN API HANDLER ---
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                // Request Fullscreen (Handles WebKit for Android Chrome)
                if (wrapper.requestFullscreen) {
                    wrapper.requestFullscreen();
                } else if (wrapper.webkitRequestFullscreen) {
                    wrapper.webkitRequestFullscreen();
                }
            } else {
                // Exit Fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);

        // Update button text when full screen changes
        document.addEventListener('fullscreenchange', updateFullscreenBtn);
        document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);

        function updateFullscreenBtn() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                fullscreenBtn.innerText = "✖ Exit Fullscreen";
            } else {
                fullscreenBtn.innerText = "⛶ Fullscreen";
            }
        }

        // --- GAME ENGINE LOGIC ---
        const keys = {};
        let dialogueTimeout;
        let saveTimeout;

        const player = {
            x: 180,
            y: 140,
            width: 12,
            height: 12,
            speed: 1.5,
            hp: 100,
            maxHp: 100,
            level: 1,
            xp: 0,
            nextXp: 50,
            facing: 'down',
            isAttacking: false,
            attackTimer: 0
        };

        const npc = { x: 200, y: 80, width: 12, height: 12, name: 'Village Elder' };
        
        let enemies = [
            { x: 60, y: 60, width: 10, height: 10, hp: 30, maxHp: 30, speed: 0.5, vx: 1, vy: 0 },
            { x: 300, y: 200, width: 10, height: 10, hp: 30, maxHp: 30, speed: 0.5, vx: 0, vy: -1 },
            { x: 100, y: 220, width: 10, height: 10, hp: 30, maxHp: 30, speed: 0.5, vx: -1, vy: 0 }
        ];

        let particles = [];

        function saveGame() {
            const data = {
                hp: player.hp,
                maxHp: player.maxHp,
                level: player.level,
                xp: player.xp,
                nextXp: player.nextXp,
                x: player.x,
                y: player.y
            };
            localStorage.setItem('rpg_save_data', JSON.stringify(data));

            const status = document.getElementById('save-status');
            status.style.opacity = '1';
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => { status.style.opacity = '0'; }, 1000);
        }

        function loadGame() {
            const data = localStorage.getItem('rpg_save_data');
            if (data) {
                const parsed = JSON.parse(data);
                player.hp = parsed.hp;
                player.maxHp = parsed.maxHp;
                player.level = parsed.level;
                player.xp = parsed.xp;
                player.nextXp = parsed.nextXp;
                player.x = parsed.x || 180;
                player.y = parsed.y || 140;
            }
        }

        function resetGame() {
            localStorage.removeItem('rpg_save_data');
            location.reload();
        }

        document.getElementById('reset-btn').addEventListener('click', resetGame);

        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.code === 'Space') attack();
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const bindTouch = (id, keyName) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
        };
        bindTouch('btn-up', 'w');
        bindTouch('btn-down', 's');
        bindTouch('btn-left', 'a');
        bindTouch('btn-right', 'd');
        document.getElementById('btn-attack').addEventListener('touchstart', (e) => {
            e.preventDefault();
            attack();
        });

        function showDialogue(title, text) {
            const box = document.getElementById('dialogue-box');
            document.getElementById('dialogue-title').innerText = title;
            document.getElementById('dialogue-text').innerText = text;
            box.style.display = 'block';
            clearTimeout(dialogueTimeout);
            dialogueTimeout = setTimeout(() => { box.style.display = 'none'; }, 4000);
        }

        function attack() {
            if (player.isAttacking) return;
            player.isAttacking = true;
            player.attackTimer = 15;

            const reach = 22; 
            const thickness = 26;
            
            let hitbox = { x: player.x, y: player.y, w: thickness, h: thickness };
            
            if (player.facing === 'up') {
                hitbox.x = player.x - 7;
                hitbox.y = player.y - reach;
                hitbox.w = thickness;
                hitbox.h = reach;
            } else if (player.facing === 'down') {
                hitbox.x = player.x - 7;
                hitbox.y = player.y + player.height;
                hitbox.w = thickness;
                hitbox.h = reach;
            } else if (player.facing === 'left') {
                hitbox.x = player.x - reach;
                hitbox.y = player.y - 7;
                hitbox.w = reach;
                hitbox.h = thickness;
            } else if (player.facing === 'right') {
                hitbox.x = player.x + player.width;
                hitbox.y = player.y - 7;
                hitbox.w = reach;
                hitbox.h = thickness;
            }

            enemies.forEach(e => {
                if (rectOverlap(hitbox.x, hitbox.y, hitbox.w, hitbox.h, e.x, e.y, e.width, e.height)) {
                    e.hp -= 15 + (player.level * 2);
                    createBurst(e.x + e.width/2, e.y + e.height/2, '#e74c3c');
                    if (e.hp <= 0) {
                        gainXp(25);
                    }
                }
            });
        }

        function gainXp(amount) {
            player.xp += amount;
            if (player.xp >= player.nextXp) {
                player.level++;
                player.xp -= player.nextXp;
                player.nextXp = Math.floor(player.nextXp * 1.5);
                player.maxHp += 20;
                player.hp = player.maxHp;
                showDialogue('LEVEL UP!', `You reached Level ${player.level}! Stats increased.`);
                createBurst(player.x, player.y, '#f1c40f');
            }
            updateHUD();
            saveGame();
        }

        function updateHUD() {
            document.getElementById('hp-fill').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
            document.getElementById('xp-fill').style.width = ((player.xp / player.nextXp) * 100) + '%';
            document.getElementById('level-txt').innerText = `LVL ${player.level}`;
        }

        function createBurst(x, y, color) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    color,
                    life: 10
                });
            }
        }

        function rectOverlap(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
        }

        function update() {
            let dx = 0, dy = 0;
            if (keys['w'] || keys['arrowup']) { dy -= 1; player.facing = 'up'; }
            if (keys['s'] || keys['arrowdown']) { dy += 1; player.facing = 'down'; }
            if (keys['a'] || keys['arrowleft']) { dx -= 1; player.facing = 'left'; }
            if (keys['d'] || keys['arrowright']) { dx += 1; player.facing = 'right'; }

            if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

            player.x += dx * player.speed;
            player.y += dy * player.speed;

            player.x = Math.max(10, Math.min(378, player.x));
            player.y = Math.max(10, Math.min(278, player.y));

            if (player.isAttacking) {
                player.attackTimer--;
                if (player.attackTimer <= 0) player.isAttacking = false;
            }

            const distToNpc = Math.hypot((player.x - npc.x), (player.y - npc.y));
            if (distToNpc < 20 && !document.getElementById('dialogue-box').style.display.includes('block')) {
                showDialogue(npc.name, "Hurry! Protect our village from those green slimes!");
            }

            enemies = enemies.filter(e => e.hp > 0);
            enemies.forEach(e => {
                e.x += e.vx * e.speed;
                e.y += e.vy * e.speed;

                if (e.x < 20 || e.x > 370) e.vx *= -1;
                if (e.y < 20 || e.y > 270) e.vy *= -1;

                if (rectOverlap(player.x, player.y, player.width, player.height, e.x, e.y, e.width, e.height)) {
                    player.hp -= 0.3;
                    updateHUD();
                    if (player.hp <= 0) {
                        player.hp = player.maxHp;
                        player.x = 180;
                        player.y = 140;
                        showDialogue('DEFEATED', 'You passed out and woke up back in town.');
                        updateHUD();
                        saveGame();
                    }
                }
            });

            if (enemies.length === 0) {
                const baseHp = 30 + (player.level * 5);
                enemies.push(
                    { x: 50, y: 50, width: 10, height: 10, hp: baseHp, maxHp: baseHp, speed: 0.6, vx: 1, vy: 1 },
                    { x: 320, y: 220, width: 10, height: 10, hp: baseHp, maxHp: baseHp, speed: 0.6, vx: -1, vy: 1 }
                );
                showDialogue('WARNING', 'More slimes have appeared!');
            }

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
            });
            particles = particles.filter(p => p.life > 0);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground
            ctx.fillStyle = '#2d5a27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#1e3f1b';
            ctx.fillRect(40, 40, 4, 4);
            ctx.fillRect(320, 80, 6, 6);
            ctx.fillRect(120, 240, 4, 4);

            // NPC
            ctx.fillStyle = '#3498db';
            ctx.fillRect(npc.x, npc.y, npc.width, npc.height);
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(npc.x + 2, npc.y - 3, 8, 4);

            // Enemies
            enemies.forEach(e => {
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(e.x, e.y, e.width, e.height);
                ctx.fillStyle = '#000';
                ctx.fillRect(e.x + 2, e.y + 3, 2, 2);
                ctx.fillRect(e.x + 6, e.y + 3, 2, 2);

                if (e.hp < e.maxHp) {
                    const barW = 14;
                    const barH = 3;
                    const bx = e.x + (e.width / 2) - (barW / 2);
                    const by = e.y - 6;

                    ctx.fillStyle = '#000000';
                    ctx.fillRect(bx - 1, by - 1, barW + 2, barH + 2);

                    const pct = Math.max(0, e.hp / e.maxHp);
                    ctx.fillStyle = '#e74c3c';
                    ctx.fillRect(bx, by, barW * pct, barH);
                }
            });

            // Player
            ctx.fillStyle = '#e67e22';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            if (player.isAttacking) {
                ctx.fillStyle = '#ecf0f1';
                let sx = player.x, sy = player.y;
                if (player.facing === 'up') {
                    ctx.fillRect(sx - 7, sy - 22, 26, 20);
                } else if (player.facing === 'down') {
                    ctx.fillRect(sx - 7, sy + player.height + 2, 26, 20);
                } else if (player.facing === 'left') {
                    ctx.fillRect(sx - 22, sy - 7, 20, 26);
                } else if (player.facing === 'right') {
                    ctx.fillRect(sx + player.width + 2, sy - 7, 20, 26);
                }
            }

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 2, 2);
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        setInterval(saveGame, 5000);
        loadGame();
        updateHUD();
        loop();
    </script>
</body>
</html>
