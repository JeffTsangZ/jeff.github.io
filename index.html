<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>maimai Mini Player - only my railgun</title>
    <style>
        :root {
            --bg-color: #0b0d17;
            --panel-bg: #16192b;
            --accent-color: #00f2fe;
            --text-color: #f0f3f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            /* Disables double-tap to zoom across mobile browsers */
            touch-action: manipulation;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            padding: 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 8px;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #7b849b;
        }

        .game-container {
            position: relative;
            width: 500px;
            height: 500px;
            max-width: 95vw;
            max-height: 95vw;
            margin: 0 auto;
        }

        canvas {
            width: 100%;
            height: 100%;
            background-color: #000;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.15), inset 0 0 15px rgba(0,0,0,0.8);
            display: block;
            touch-action: none; /* Prevents touch gestures from causing scroll/zoom on canvas */
        }

        .controls {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 500px;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--panel-bg);
            border: 1px solid #2d334d;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .speed-control input[type="range"] {
            width: 80px;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .speed-val {
            min-width: 28px;
            color: var(--accent-color);
        }

        select, button {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid #2d334d;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            font-size: 0.85rem;
        }

        select:hover, button:hover {
            border-color: var(--accent-color);
            background-color: #21263e;
        }

        button.primary {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
        }

        button.primary:hover {
            opacity: 0.9;
        }

        .key-hints {
            margin-top: 8px;
            font-size: 0.75rem;
            color: #636b83;
            text-align: center;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .game-container {
                /* Maximizes size on mobile screens */
                width: 98vw;
                height: 98vw;
                max-width: 98vw;
                max-height: 98vw;
            }

            .title {
                font-size: 1.2rem;
            }

            .controls {
                gap: 8px;
            }

            select, button, .speed-control {
                padding: 6px 10px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">only my railgun</div>
        <div class="subtitle">fripSide — BPM 143</div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>

    <div class="controls">
        <select id="diffSelect">
            <option value="2">BASIC (Lv.4)</option>
            <option value="3">ADVANCED (Lv.7)</option>
            <option value="4">EXPERT (Lv.10)</option>
            <option value="5" selected>MASTER (Lv.11)</option>
            <option value="6">Re:MASTER (Lv.12+)</option>
        </select>

        <div class="speed-control">
            <span>Speed:</span>
            <input type="range" id="speedSlider" min="1.0" max="10.0" step="0.5" value="5.0">
            <span id="speedVal" class="speed-val">5.0</span>
        </div>

        <button id="playBtn" class="primary">Play / Pause</button>
        <button id="resetBtn">Reset</button>
    </div>

    <div class="key-hints">
        Press keys <strong>1-8</strong> or tap sensors on screen!
    </div>

    </script>

    <script>
        const CANVAS_SIZE = 600;
        const CENTER = CANVAS_SIZE / 2;
        const SENSOR_RADIUS = 220;
        const INNER_RADIUS = 30;
        
        let noteSpeedSetting = 5.0;
        let canvas, ctx;
        let isPlaying = false;
        let currentTime = 0;
        let lastTimestamp = 0;
        let notes = [];
        let hitFeedback = [];

        function getTravelTime() {
            return 3.5 / noteSpeedSetting;
        }

        function parseMetadata(text) {
            const meta = {};
            const lines = text.split("\n");
            let key = null;
            for (let line of lines) {
                line = line.trim();
                if (line.startsWith("&")) {
                    const idx = line.indexOf("=");
                    key = line.substring(1, idx);
                    meta[key] = line.substring(idx + 1);
                } else if (key) {
                    meta[key] += "\n" + line;
                }
            }
            return meta;
        }

        const chartMetadata = parseMetadata(document.getElementById("chart-data").textContent);

        function parseInote(simaiStr, defaultBpm = 143) {
            const parsedNotes = [];
            let currentBpm = defaultBpm;
            let currentSubdivision = 4;
            let timeAccumulator = 0;

            const cleaned = simaiStr.replace(/[\r\n\t ]/g, '');
            const measures = cleaned.split(',');

            for (let m of measures) {
                if (!m || m === 'E') continue;

                const bpmMatch = m.match(/\((\d+(\.\d+)?)\)/);
                if (bpmMatch) {
                    currentBpm = parseFloat(bpmMatch[1]);
                    m = m.replace(bpmMatch[0], '');
                }

                const subMatch = m.match(/\{(\d+)\}/);
                if (subMatch) {
                    currentSubdivision = parseInt(subMatch[1]);
                    m = m.replace(subMatch[0], '');
                }

                const beatDuration = 60 / currentBpm;
                const noteDuration = (4 / currentSubdivision) * beatDuration;

                if (m.length > 0) {
                    const simultaneous = m.split('/');
                    for (let sim of simultaneous) {
                        const targetPos = parseInt(sim[0]);
                        if (!isNaN(targetPos) && targetPos >= 1 && targetPos <= 8) {
                            const isBreak = sim.includes('b');
                            const isHold = sim.includes('h');
                            parsedNotes.push({
                                pos: targetPos,
                                time: timeAccumulator,
                                isBreak,
                                isHold,
                                hit: false
                            });
                        }
                    }
                }
                timeAccumulator += noteDuration;
            }
            return parsedNotes;
        }

        function getSensorAngle(pos) {
            return ((pos - 1) * 45 - 67.5) * (Math.PI / 180);
        }

        function init() {
            canvas = document.getElementById("gameCanvas");
            ctx = canvas.getContext("2d");

            // Prevent double-click zoom programmatically on iOS/Safari
            document.addEventListener('dblclick', function(e) {
                e.preventDefault();
            }, { passive: false });

            const speedSlider = document.getElementById("speedSlider");
            const speedVal = document.getElementById("speedVal");

            speedSlider.addEventListener("input", (e) => {
                noteSpeedSetting = parseFloat(e.target.value);
                speedVal.textContent = noteSpeedSetting.toFixed(1);
            });

            document.getElementById("diffSelect").addEventListener("change", () => {
                resetGame();
            });

            document.getElementById("playBtn").addEventListener("click", () => {
                isPlaying = !isPlaying;
                if (isPlaying) lastTimestamp = performance.now();
            });

            document.getElementById("resetBtn").addEventListener("click", resetGame);

            window.addEventListener("keydown", (e) => {
                const key = parseInt(e.key);
                if (key >= 1 && key <= 8) {
                    checkHit(key);
                }
            });

            // Handles multi-touch and single taps without zoom lag
            const handleTouch = (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const touches = e.changedTouches ? e.changedTouches : [e];

                for (let i = 0; i < touches.length; i++) {
                    const x = (touches[i].clientX - rect.left) * (CANVAS_SIZE / rect.width) - CENTER;
                    const y = (touches[i].clientY - rect.top) * (CANVAS_SIZE / rect.height) - CENTER;

                    let angle = Math.atan2(y, x) * (180 / Math.PI) + 67.5;
                    if (angle < 0) angle += 360;
                    const pos = Math.floor(angle / 45) + 1;
                    if (pos >= 1 && pos <= 8) {
                        checkHit(pos);
                    }
                }
            };

            canvas.addEventListener("pointerdown", handleTouch, { passive: false });

            resetGame();
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            const diffKey = document.getElementById("diffSelect").value;
            const inote = chartMetadata[`inote_${diffKey}`] || "";
            const bpm = parseFloat(chartMetadata.wholebpm) || 143;
            notes = parseInote(inote, bpm);
            currentTime = -1.0;
            hitFeedback = [];
            isPlaying = false;
        }

        function checkHit(pos) {
            const windowTime = 0.15;
            for (let n of notes) {
                if (n.pos === pos && !n.hit && Math.abs(n.time - currentTime) < windowTime) {
                    n.hit = true;
                    hitFeedback.push({
                        pos: pos,
                        text: "PERFECT",
                        life: 0.4
                    });
                    return;
                }
            }
        }

        function update(dt) {
            if (!isPlaying) return;
            currentTime += dt;

            for (let n of notes) {
                if (!n.hit && currentTime - n.time > 0.2) {
                    n.hit = true;
                }
            }

            for (let f of hitFeedback) {
                f.life -= dt;
            }
            hitFeedback = hitFeedback.filter(f => f.life > 0);
        }

        function render() {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Outer Ring
            ctx.strokeStyle = "#2a2f4a";
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(CENTER, CENTER, SENSOR_RADIUS, 0, Math.PI * 2);
            ctx.stroke();

            // Inner Ring
            ctx.strokeStyle = "#1a1d2e";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(CENTER, CENTER, INNER_RADIUS, 0, Math.PI * 2);
            ctx.stroke();

            // Sensors
            for (let i = 1; i <= 8; i++) {
                const angle = getSensorAngle(i);
                const x = CENTER + Math.cos(angle) * SENSOR_RADIUS;
                const y = CENTER + Math.sin(angle) * SENSOR_RADIUS;

                ctx.fillStyle = "#1e2238";
                ctx.strokeStyle = "#00f2fe";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, y, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#8c93b0";
                ctx.font = "bold 14px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(i.toString(), x, y);
            }

            const travelTime = getTravelTime();

            // Notes
            for (let n of notes) {
                if (n.hit) continue;

                const timeUntilHit = n.time - currentTime;
                if (timeUntilHit <= travelTime && timeUntilHit >= -0.1) {
                    const progress = 1 - (timeUntilHit / travelTime);
                    const currentRadius = INNER_RADIUS + progress * (SENSOR_RADIUS - INNER_RADIUS);
                    const angle = getSensorAngle(n.pos);

                    const nx = CENTER + Math.cos(angle) * currentRadius;
                    const ny = CENTER + Math.sin(angle) * currentRadius;

                    ctx.beginPath();
                    ctx.arc(nx, ny, 16 * (0.4 + 0.6 * Math.max(0, progress)), 0, Math.PI * 2);
                    ctx.fillStyle = n.isBreak ? "#facc15" : (n.isHold ? "#22c55e" : "#ec4899");
                    ctx.fill();
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            }

            // Hit Feedback
            for (let f of hitFeedback) {
                const angle = getSensorAngle(f.pos);
                const fx = CENTER + Math.cos(angle) * (SENSOR_RADIUS - 40);
                const fy = CENTER + Math.sin(angle) * (SENSOR_RADIUS - 40);

                ctx.fillStyle = "#00f2fe";
                ctx.font = "bold 16px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(f.text, fx, fy);
            }
        }

        function gameLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const dt = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        window.onload = init;
    </script>
</body>
