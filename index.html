<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Games Hub</title>
    <style>
        /* Modern CSS Reset & Variable Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* Hub Card Container */
        .hub-container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            text-align: center;
        }

        /* Typography */
        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        /* Navigation & Grid */
        nav ul {
            list-style: none;
            display: grid;
            gap: 1.25rem;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        /* Game Link Cards */
        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: #0f172a;
            color: #e2e8f0;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            border-radius: 12px;
            border: 1px solid #334155;
            transition: all 0.25s ease-in-out;
        }

        /* Interactive Hover States */
        .game-card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
            box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.25);
            color: #ffffff;
            background: #1e293b;
        }

        /* Visual Tag Indicators */
        .game-card::after {
            content: "Play Now →";
            font-size: 0.8rem;
            margin-top: 0.5rem;
            color: #38bdf8;
            font-weight: 400;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <main class="hub-container">
        <h1>My GamesHub</h1>
        <p>Select an experience below to start playing</p>

        <nav>
            <ul>
                <li>
                    <a href="rpg.html" class="game-card">
                        ⚔️ RPG Quest
                    </a>
                </li>
                <li>
                    <a href="pjsk.html" class="game-card">
                        🎵 Project Sekai
                    </a>
                </li>
                <li>
                    <a href="chest.html" class="game-card">
                        📦 Chest
                    </a>
                </li>
            </ul>
        </nav>
    </main>

</body>
</html>
