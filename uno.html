<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web UNO Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col items-center justify-between p-6">

    <!-- Top Header / Status -->
    <div class="w-full max-w-4xl flex justify-between items-center bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
        <h1 class="text-xl font-bold tracking-wider text-yellow-400">UNO! Multiplayer</h1>
        <div id="game-status" class="text-sm font-semibold text-slate-300">Your Turn</div>
        <div class="flex items-center gap-3">
            <div id="deck-info" class="text-sm bg-slate-700 px-3 py-1.5 rounded-lg">Deck: 108</div>
            <button onclick="resetGame()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded-lg font-bold text-xs shadow transition cursor-pointer">
                Reset Game
            </button>
        </div>
    </div>

    <!-- Opponents Area -->
    <div class="w-full max-w-4xl grid grid-cols-3 gap-4 my-4">
        <div id="cpu-1" class="bg-slate-800 p-3 rounded-lg text-center border border-slate-700">
            <p class="font-bold text-sm text-red-400">CPU 1 (Left)</p>
            <p id="cpu-1-count" class="text-xs text-slate-400 mt-1">7 cards</p>
        </div>
        <div id="cpu-2" class="bg-slate-800 p-3 rounded-lg text-center border border-slate-700">
            <p class="font-bold text-sm text-yellow-400">CPU 2 (Top)</p>
            <p id="cpu-2-count" class="text-xs text-slate-400 mt-1">7 cards</p>
        </div>
        <div id="cpu-3" class="bg-slate-800 p-3 rounded-lg text-center border border-slate-700">
            <p class="font-bold text-sm text-blue-400">CPU 3 (Right)</p>
            <p id="cpu-3-count" class="text-xs text-slate-400 mt-1">7 cards</p>
        </div>
    </div>

    <!-- Center Table (Discard Pile & Controls) -->
    <div class="flex items-center justify-center gap-8 my-6 bg-slate-800/50 p-8 rounded-2xl border border-slate-700/50 w-full max-w-4xl">
        <!-- Draw Pile -->
        <div onclick="playerDraw()" class="w-24 h-36 bg-blue-600 rounded-xl border-4 border-white shadow-xl flex flex-col items-center justify-center cursor-pointer hover:bg-blue-500 transition transform hover:-translate-y-1">
            <span class="text-2xl font-black">UNO</span>
            <span class="text-xs mt-2">DRAW</span>
        </div>

        <!-- Discard Pile -->
        <div id="discard-pile" class="w-24 h-36 rounded-xl border-4 border-white shadow-xl flex flex-col items-center justify-center font-bold text-lg">
            <!-- Dynamic -->
        </div>
    </div>

    <!-- Player Hand Area -->
    <div class="w-full max-w-4xl bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-bold text-lg text-emerald-400">Your Hand</h2>
            <button onclick="callUno()" class="bg-red-600 hover:bg-red-500 px-4 py-1.5 rounded-lg font-bold text-xs shadow transition cursor-pointer">CALL UNO!</button>
        </div>
        <div id="player-hand" class="flex flex-wrap gap-3 min-h-[140px] items-center">
            <!-- Dynamic Cards -->
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const COLORS = ['Red', 'Yellow', 'Green', 'Blue'];
        
        let deck = [];
        let discardPile = [];
        let hands = [[], [], [], []]; // 0: Player, 1-3: CPUs
        let currentTurn = 0;
        let currentColor = '';
        let currentVal = '';
        let playDirection = 1;
        let unoCalled = false;
        let cpuTimer = null; // Track active CPU turn timeout

        function resetGame() {
            if (cpuTimer) {
                clearTimeout(cpuTimer);
                cpuTimer = null;
            }
            initGame();
        }

        function initGame() {
            // Reset all state variables
            deck = [];
            discardPile = [];
            hands = [[], [], [], []];
            currentTurn = 0;
            playDirection = 1;
            unoCalled = false;

            // Build 108-card deck
            COLORS.forEach(color => {
                deck.push({ color, value: '0' });
                for (let i = 1; i <= 9; i++) {
                    deck.push({ color, value: i.toString() });
                    deck.push({ color, value: i.toString() });
                }
                ['Skip', 'Reverse', '+2'].forEach(action => {
                    deck.push({ color, value: action });
                    deck.push({ color, value: action });
                });
            });
            for (let i = 0; i < 4; i++) {
                deck.push({ color: 'Wild', value: 'Wild' });
                deck.push({ color: 'Wild', value: '+4' });
            }

            // Shuffle
            deck.sort(() => Math.random() - 0.5);

            // Deal 7 cards each
            for (let i = 0; i < 7; i++) {
                for (let p = 0; p < 4; p++) {
                    hands[p].push(deck.pop());
                }
            }

            // Flip first card (must be a standard number card)
            let firstCard = deck.pop();
            while (firstCard.color === 'Wild' || isNaN(firstCard.value)) {
                deck.unshift(firstCard); // Put back at bottom of deck
                deck.sort(() => Math.random() - 0.5);
                firstCard = deck.pop();
            }
            discardPile.push(firstCard);

            currentColor = firstCard.color;
            currentVal = firstCard.value;
            render();
        }

        function getColorClass(color) {
            switch(color) {
                case 'Red': return 'bg-red-600 text-white';
                case 'Yellow': return 'bg-amber-400 text-slate-900';
                case 'Green': return 'bg-emerald-600 text-white';
                case 'Blue': return 'bg-blue-600 text-white';
                default: return 'bg-slate-900 text-white border-2 border-yellow-400';
            }
        }

        function render() {
            document.getElementById('deck-info').innerText = `Deck: ${deck.length}`;
            document.getElementById('cpu-1-count').innerText = `${hands[1].length} cards`;
            document.getElementById('cpu-2-count').innerText = `${hands[2].length} cards`;
            document.getElementById('cpu-3-count').innerText = `${hands[3].length} cards`;

            // Render Discard
            const topCard = discardPile[discardPile.length - 1];
            const discardEl = document.getElementById('discard-pile');
            discardEl.className = `w-24 h-36 rounded-xl border-4 border-white shadow-xl flex flex-col items-center justify-center font-bold text-lg ${getColorClass(currentColor)}`;
            discardEl.innerHTML = `<span class="text-xs uppercase">${topCard.color}</span><span class="text-2xl">${topCard.value}</span>`;

            // Render Player Hand
            const handEl = document.getElementById('player-hand');
            handEl.innerHTML = '';
            hands[0].forEach((card, idx) => {
                const playable = isPlayable(card);
                const cardDiv = document.createElement('div');
                cardDiv.className = `w-20 h-32 rounded-lg border-2 shadow-md flex flex-col justify-between p-2 cursor-pointer transition transform hover:-translate-y-2 ${getColorClass(card.color)} ${playable ? 'border-white ring-2 ring-emerald-400' : 'border-transparent opacity-70'}`;
                cardDiv.innerHTML = `
                    <span class="text-xs font-bold">${card.value}</span>
                    <span class="text-sm font-black text-center">${card.value}</span>
                    <span class="text-xs font-bold self-end">${card.value}</span>
                `;
                cardDiv.onclick = () => playCard(0, idx);
                handEl.appendChild(cardDiv);
            });

            document.getElementById('game-status').innerText = currentTurn === 0 ? "Your Turn" : `Waiting for CPU ${currentTurn}...`;
        }

        function isPlayable(card) {
            if (card.color === 'Wild') return true;
            if (card.color === currentColor || card.value === currentVal) return true;
            return false;
        }

        function playCard(playerIdx, cardIdx) {
            if (currentTurn !== 0 && playerIdx === 0) return;
            const card = hands[playerIdx][cardIdx];

            if (!isPlayable(card)) {
                alert("Invalid move! Must match color or value.");
                return;
            }

            if (playerIdx === 0 && hands[0].length === 2 && !unoCalled) {
                alert("Forgot UNO! Drawing 2 penalty cards.");
                hands[0].push(deck.pop(), deck.pop());
            }

            hands[0].splice(cardIdx, 1);
            discardPile.push(card);
            currentVal = card.value;

            if (card.color === 'Wild') {
                currentColor = prompt("Choose color (Red, Yellow, Green, Blue):", "Red") || "Red";
            } else {
                currentColor = card.color;
            }

            if (hands[playerIdx].length === 0) {
                alert(playerIdx === 0 ? "You Win!" : `CPU ${playerIdx} Wins!`);
                resetGame();
                return;
            }

            advanceTurn();
            render();

            if (currentTurn !== 0) {
                cpuTimer = setTimeout(runCPUTurn, 1000);
            }
        }

        function playerDraw() {
            if (currentTurn !== 0) return;
            const drawn = deck.pop();
            hands[0].push(drawn);
            render();
            if (isPlayable(drawn) && confirm(`Drew ${drawn.color} ${drawn.value}. Play it now?`)) {
                playCard(0, hands[0].length - 1);
            } else {
                advanceTurn();
                render();
                cpuTimer = setTimeout(runCPUTurn, 1000);
            }
        }

        function callUno() {
            if (hands[0].length <= 2) {
                unoCalled = true;
                alert("UNO Called!");
            }
        }

        function advanceTurn() {
            currentTurn = (currentTurn + playDirection + 4) % 4;
        }

        function runCPUTurn() {
            if (currentTurn === 0) return;
            let cpuIdx = currentTurn;
            let playedIdx = hands[cpuIdx].findIndex(c => isPlayable(c));

            if (playedIdx !== -1) {
                const card = hands[cpuIdx].splice(playedIdx, 1)[0];
                discardPile.push(card);
                currentVal = card.value;
                if (card.color === 'Wild') {
                    currentColor = COLORS[Math.floor(Math.random() * 4)];
                } else {
                    currentColor = card.color;
                }
                if (hands[cpuIdx].length === 1) alert(`CPU ${cpuIdx} shouts UNO!`);
                if (hands[cpuIdx].length === 0) {
                    alert(`CPU ${cpuIdx} Wins!`);
                    resetGame();
                    return;
                }
            } else {
                hands[cpuIdx].push(deck.pop());
            }

            advanceTurn();
            render();

            if (currentTurn !== 0) {
                cpuTimer = setTimeout(runCPUTurn, 1000);
            } else {
                unoCalled = false;
            }
        }

        initGame();
    </script>
</body>
</html>
