<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Pixel RPG</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0d0e15;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 800px;
            max-height: 600px;
            background: #111;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 2px solid #333;
        }

        #game-wrapper:fullscreen {
            max-width: none;
            max-height: none;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        #game-wrapper:-webkit-full-screen {
            max-width: none;
            max-height: none;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }

        /* UI Overlays */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            z-index: 5;
            font-size: 12px;
        }

        .bar-container {
            width: 120px;
            height: 12px;
            background: #222;
            border: 2px solid #fff;
            margin-top: 3px;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.2s ease;
        }

        #hp-fill { background: #e74c3c; }
        #xp-fill { background: #f1c40f; }

        #skills-list {
            position: absolute;
            top: 90px;
            left: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
            z-index: 5;
            font-size: 10px;
            text-shadow: 1px 1px 0px #000;
        }

        .skill-tag {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #3498db;
            color: #3498db;
            padding: 2px 6px;
            border-radius: 3px;
        }

        #save-status {
            font-size: 11px;
            color: #2ecc71;
            margin-top: 4px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .top-controls {
            position: absolute;
            top: 55px;
            left: 10px;
            display: flex;
            gap: 6px;
            z-index: 6;
            pointer-events: auto;
        }

        .ui-btn {
            background: rgba(40, 40, 60, 0.85);
            border: 1px solid #fff;
            color: #fff;
            padding: 5px 8px;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .ui-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }

        #reset-btn {
            background: rgba(231, 76, 60, 0.85);
        }

        /* Dialogue UI */
        #dialogue-box {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 500px;
            max-height: 150px;
            background: rgba(16, 18, 27, 0.95);
            border: 3px solid #f1c40f;
            border-radius: 4px;
            padding: 10px 14px;
            font-size: 12px;
            line-height: 1.3;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 20;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        #dialogue-title {
            color: #f1c40f;
            font-weight: bold;
            margin-bottom: 4px;
        }

        #dialogue-hint {
            font-size: 10px;
            color: #aaa;
            margin-top: 6px;
            text-align: right;
        }

        /* Skill Selection Modal Overlay */
        #skill-select-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.92);
            z-index: 30;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        #skill-select-title {
            font-size: 18px;
            color: #f1c40f;
            margin-bottom: 4px;
            text-shadow: 2px 2px 0px #000;
        }

        #skill-select-subtitle {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .skill-options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 420px;
        }

        .skill-card {
            background: #1a1d28;
            border: 2px solid #3498db;
            border-radius: 6px;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .skill-card:hover, .skill-card:active {
            border-color: #f1c40f;
            background: #252b3d;
            transform: scale(1.02);
        }

        .skill-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            background: #0d0e15;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #555;
            flex-shrink: 0;
        }

        .skill-info {
            flex-grow: 1;
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }

        .skill-name {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }

        .skill-lvl-badge {
            font-size: 10px;
            background: #e74c3c;
            color: #fff;
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: bold;
        }

        .skill-desc {
            font-size: 10px;
            color: #bbb;
            line-height: 1.2;
        }

        /* Mobile Virtual Controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 15;
        }

        #joystick-base {
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }

        #joystick-stick {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.35);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            top: 30px;
            left: 30px;
            pointer-events: none;
        }

        #btn-attack {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(231, 76, 60, 0.85);
            border: 2px solid #fff;
            pointer-events: auto;
            font-size: 12px;
            font-weight: bold;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        #btn-attack:active { background: rgba(231, 76, 60, 1); }

        @media (pointer: coarse), (max-width: 600px) {
            #mobile-controls { display: flex; }
            #dialogue-box {
                top: 15px;
                width: 90%;
                max-height: 120px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas" width="400" height="300"></canvas>

        <div class="top-controls">
            <button id="fullscreen-btn" class="ui-btn">⛶ Fullscreen</button>
            <button id="reset-btn" class="ui-btn">Reset Save</button>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div>
                HP: <span id="hp-txt">100/100</span>
                <div class="bar-container"><div id="hp-fill" class="bar-fill"></div></div>
            </div>
            <div>
                ATK: <span id="atk-txt">15</span> | RNG: <span id="rng-txt">22</span><br>
                <div id="save-status">Game Saved</div>
            </div>
            <div style="text-align: right;">
                <span id="level-txt">LVL 1</span>
                <div class="bar-container"><div id="xp-fill" class="bar-fill" style="width: 0%;"></div></div>
            </div>
        </div>

        <div id="skills-list"></div>

        <!-- Dialogue UI -->
        <div id="dialogue-box">
            <div id="dialogue-title">Village Elder</div>
            <div id="dialogue-text">Welcome back, Hero! Clean up those monsters. Your progress is saved!</div>
            <div id="dialogue-hint">[ Tap Attack or press Space to close ]</div>
        </div>

        <!-- Level Up Skill Selection Overlay -->
        <div id="skill-select-overlay">
            <div id="skill-select-title">LEVEL UP!</div>
            <div id="skill-select-subtitle">Choose a skill to unlock or upgrade</div>
            <div class="skill-options-container" id="skill-cards-container"></div>
        </div>

        <!-- Touch Controls -->
        <div id="mobile-controls">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
            <button id="btn-attack">ATTACK</button>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('game-wrapper');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (wrapper.requestFullscreen) wrapper.requestFullscreen();
                else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        document.addEventListener('fullscreenchange', updateFullscreenBtn);
        document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);
        function updateFullscreenBtn() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                fullscreenBtn.innerText = "✖ Exit";
            } else {
                fullscreenBtn.innerText = "⛶ Fullscreen";
            }
        }

        const keys = {};
        let saveTimeout;
        let isPaused = false;
        let pendingSkillChoices = 0;
        let npcCooldown = 0;

        // Base player definition
        const player = {
            x: 180,
            y: 140,
            width: 12,
            height: 12,
            speed: 1.5,
            hp: 100,
            maxHp: 100,
            baseAtk: 15,
            baseReach: 22,
            atk: 15,
            reach: 22,
            level: 1,
            xp: 0,
            nextXp: 50,
            facing: 'down',
            isAttacking: false,
            attackTimer: 0,
            invulnerableTimer: 0,
            autoRangedTimer: 0,
            orbitAngle: 0,
            laserTimer: 0,
            laserBeam: null
        };

        // --- SKILL MASTER DEFINITIONS (Levels 0 to 5) ---
        const SKILL_DEFINITIONS = [
            {
                id: 'autoRanged',
                name: 'Magic Darts',
                icon: '⚡',
                getDesc: (lvl) => {
                    if (lvl === 0) return "Fires 1 auto-targeting dart at the nearest enemy.";
                    if (lvl === 5) return "MAX LEVEL: Fast 3-dart barrage at closest foes!";
                    return `Lvl ${lvl+1}: Fires ${Math.min(3, lvl + 1)} darts faster and with higher damage.`;
                }
            },
            {
                id: 'spinningOrbit',
                name: 'Orbiting Shield',
                icon: '🌀',
                getDesc: (lvl) => {
                    if (lvl === 0) return "Summons 1 orb spinning around you.";
                    if (lvl === 5) return "MAX LEVEL: 5 fast-orbiting orbs causing massive contact damage!";
                    return `Lvl ${lvl+1}: Adds an orb (Total ${lvl+1}) and increases rotation speed.`;
                }
            },
            {
                id: 'vampirism',
                name: 'Vampiric Soul',
                icon: '🩸',
                getDesc: (lvl) => {
                    const chances = [0, 15, 22, 30, 38, 50];
                    const heals = [0, 10, 15, 20, 25, 30];
                    if (lvl === 0) return "15% chance to heal 10% Max HP on enemy kill.";
                    if (lvl === 5) return "MAX LEVEL: 50% chance to heal 30% Max HP on kill!";
                    return `Lvl ${lvl+1}: ${chances[lvl+1]}% chance to heal ${heals[lvl+1]}% Max HP on kill.`;
                }
            },
            {
                id: 'statBoost',
                name: 'Might & Reach',
                icon: '⚔️',
                getDesc: (lvl) => {
                    if (lvl === 0) return "Boosts Melee Attack Damage and Range.";
                    if (lvl === 5) return "MAX LEVEL: +30 Attack Damage & +20 Range!";
                    return `Lvl ${lvl+1}: Grants +${(lvl+1)*6} ATK and +${(lvl+1)*4} Range.`;
                }
            },
            {
                id: 'laserAttack',
                name: 'Death Laser',
                icon: '💥',
                getDesc: (lvl) => {
                    if (lvl === 0) return "Fires a destructive beam at the nearest enemy every 3.5s.";
                    if (lvl === 5) return "MAX LEVEL: Devastating laser beam every 1.2s!";
                    return `Lvl ${lvl+1}: Fires faster (cooldown reduced) with increased beam power.`;
                }
            }
        ];

        // Track level for each skill (0 = unlearned, 1..5 = upgrade levels)
        let playerSkills = {
            autoRanged: 0,
            spinningOrbit: 0,
            vampirism: 0,
            statBoost: 0,
            laserAttack: 0
        };

        const npc = { x: 200, y: 80, width: 12, height: 12, name: 'Village Elder' };

        let projectiles = [];
        let particles = [];

        // --- ENEMY SYSTEM ---
        const ENEMY_TYPES = [
            { name: 'Slime',    color: '#2ecc71', hpMult: 1.0, speed: 0.5, damage: 8,  xp: 20, minLevel: 1,  weightBase: 70, weightLevelScale: -5 },
            { name: 'Goblin',   color: '#e67e22', hpMult: 1.5, speed: 0.8, damage: 14, xp: 35, minLevel: 1,  weightBase: 30, weightLevelScale: 2 },
            { name: 'Skeleton', color: '#ecf0f1', hpMult: 2.2, speed: 1.1, damage: 22, xp: 60, minLevel: 3,  weightBase: 0,  weightLevelScale: 5 },
            { name: 'Demon',    color: '#9b59b6', hpMult: 3.5, speed: 0.7, damage: 32, xp: 100, minLevel: 5, weightBase: 0,  weightLevelScale: 6 }
        ];

        function getRandomEnemyType(playerLevel) {
            const candidates = ENEMY_TYPES.filter(type => playerLevel >= type.minLevel);
            const weights = candidates.map(type => {
                const calculated = type.weightBase + (type.weightLevelScale * (playerLevel - type.minLevel + 1));
                return Math.max(5, calculated);
            });

            const totalWeight = weights.reduce((sum, w) => sum + w, 0);
            let randomNum = Math.random() * totalWeight;

            for (let i = 0; i < candidates.length; i++) {
                if (randomNum < weights[i]) return candidates[i];
                randomNum -= weights[i];
            }
            return candidates[0];
        }

        function spawnEnemy(x, y, vx, vy) {
            const type = getRandomEnemyType(player.level);
            const baseHp = Math.floor((30 + (player.level * 6)) * type.hpMult);

            return {
                x, y,
                width: 10,
                height: 10,
                hp: baseHp,
                maxHp: baseHp,
                speed: type.speed,
                damage: type.damage,
                xpValue: type.xp,
                color: type.color,
                name: type.name,
                vx, vy
            };
        }

        let enemies = [
            spawnEnemy(60, 60, 1, 0),
            spawnEnemy(300, 200, 0, -1),
            spawnEnemy(100, 220, -1, 0)
        ];

        const joystick = { active: false, touchId: null, baseX: 0, baseY: 0, dx: 0, dy: 0 };
        const joystickBase = document.getElementById('joystick-base');
        const joystickStick = document.getElementById('joystick-stick');

        joystickBase.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!joystick.active) {
                const touch = e.changedTouches[0];
                joystick.active = true;
                joystick.touchId = touch.identifier;
                const rect = joystickBase.getBoundingClientRect();
                joystick.baseX = rect.left + rect.width / 2;
                joystick.baseY = rect.top + rect.height / 2;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!joystick.active) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystick.touchId) {
                    const maxDist = 40;
                    let deltaX = touch.clientX - joystick.baseX;
                    let deltaY = touch.clientY - joystick.baseY;
                    const dist = Math.hypot(deltaX, deltaY);

                    if (dist > maxDist) {
                        deltaX = (deltaX / dist) * maxDist;
                        deltaY = (deltaY / dist) * maxDist;
                    }

                    joystickStick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                    joystick.dx = deltaX / maxDist;
                    joystick.dy = deltaY / maxDist;
                }
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (!joystick.active) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystick.touchId) {
                    joystick.active = false;
                    joystick.touchId = null;
                    joystick.dx = 0;
                    joystick.dy = 0;
                    joystickStick.style.transform = `translate(0px, 0px)`;
                }
            }
        });

        function recalculatePlayerStats() {
            const boostLvl = playerSkills.statBoost;
            player.atk = player.baseAtk + (boostLvl * 6);
            player.reach = player.baseReach + (boostLvl * 4);
        }

        function saveGame() {
            const data = {
                hp: player.hp,
                maxHp: player.maxHp,
                baseAtk: player.baseAtk,
                baseReach: player.baseReach,
                level: player.level,
                xp: player.xp,
                nextXp: player.nextXp,
                x: player.x,
                y: player.y,
                skills: playerSkills
            };
            localStorage.setItem('rpg_save_data_v4', JSON.stringify(data));

            const status = document.getElementById('save-status');
            status.style.opacity = '1';
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => { status.style.opacity = '0'; }, 1000);
        }

        function loadGame() {
            const data = localStorage.getItem('rpg_save_data_v4');
            if (data) {
                const parsed = JSON.parse(data);
                player.hp = parsed.hp;
                player.maxHp = parsed.maxHp;
                player.baseAtk = parsed.baseAtk || 15;
                player.baseReach = parsed.baseReach || 22;
                player.level = parsed.level;
                player.xp = parsed.xp;
                player.nextXp = parsed.nextXp;
                player.x = parsed.x || 180;
                player.y = parsed.y || 140;
                if (parsed.skills) playerSkills = parsed.skills;
            }
            recalculatePlayerStats();
        }

        function resetGame() {
            localStorage.removeItem('rpg_save_data_v4');
            location.reload();
        }
        document.getElementById('reset-btn').addEventListener('click', resetGame);

        function showDialogue(title, text) {
            isPaused = true;
            const box = document.getElementById('dialogue-box');
            document.getElementById('dialogue-title').innerText = title;
            document.getElementById('dialogue-text').innerText = text;
            box.style.display = 'block';
        }

        function closeDialogue() {
            document.getElementById('dialogue-box').style.display = 'none';
            isPaused = false;
            npcCooldown = 60;
        }

        // --- SKILL SELECTION MENU LOGIC ---
        function triggerSkillSelectionScreen() {
            isPaused = true;
            
            // Available non-maxed skills
            let availableSkills = SKILL_DEFINITIONS.filter(sk => playerSkills[sk.id] < 5);

            if (availableSkills.length === 0) {
                // All skills maxed! Just give bonus stats instead.
                player.maxHp += 25;
                player.hp = player.maxHp;
                player.baseAtk += 5;
                recalculatePlayerStats();
                showDialogue('MAX LEVEL BONUS!', 'All skills are already MAX LEVEL!\n+25 Max HP & +5 ATK granted!');
                updateHUD();
                return;
            }

            // Shuffle available skills randomly
            availableSkills.sort(() => 0.5 - Math.random());
            
            // Pick up to 3 random options
            const chosenOptions = availableSkills.slice(0, 3);

            const cardsContainer = document.getElementById('skill-cards-container');
            cardsContainer.innerHTML = '';

            chosenOptions.forEach(sk => {
                const curLvl = playerSkills[sk.id];
                const card = document.createElement('div');
                card.className = 'skill-card';
                card.innerHTML = `
                    <div class="skill-icon">${sk.icon}</div>
                    <div class="skill-info">
                        <div class="skill-header">
                            <span class="skill-name">${sk.name}</span>
                            <span class="skill-lvl-badge">${curLvl === 0 ? 'NEW!' : 'LVL ' + (curLvl + 1)}</span>
                        </div>
                        <div class="skill-desc">${sk.getDesc(curLvl)}</div>
                    </div>
                `;
                card.addEventListener('click', () => selectSkillUpgrade(sk.id));
                cardsContainer.appendChild(card);
            });

            document.getElementById('skill-select-overlay').style.display = 'flex';
        }

        function selectSkillUpgrade(skillId) {
            playerSkills[skillId]++;
            document.getElementById('skill-select-overlay').style.display = 'none';
            
            recalculatePlayerStats();
            updateHUD();
            saveGame();

            pendingSkillChoices--;
            if (pendingSkillChoices > 0) {
                triggerSkillSelectionScreen();
            } else {
                isPaused = false;
            }
        }

        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.code === 'Space') handleAction();
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        document.getElementById('btn-attack').addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleAction();
        });
        document.getElementById('btn-attack').addEventListener('click', () => handleAction());

        function handleAction() {
            if (isPaused) {
                if (document.getElementById('dialogue-box').style.display === 'block') {
                    closeDialogue();
                }
                return;
            }
            attack();
        }

        function attack() {
            if (player.isAttacking || isPaused) return;
            player.isAttacking = true;
            player.attackTimer = 15;

            const reach = player.reach;
            const thickness = reach + 4;
            let hitbox = { x: player.x, y: player.y, w: thickness, h: thickness };
            
            if (player.facing === 'up') {
                hitbox.x = player.x - 7; hitbox.y = player.y - reach; hitbox.w = thickness; hitbox.h = reach;
            } else if (player.facing === 'down') {
                hitbox.x = player.x - 7; hitbox.y = player.y + player.height; hitbox.w = thickness; hitbox.h = reach;
            } else if (player.facing === 'left') {
                hitbox.x = player.x - reach; hitbox.y = player.y - 7; hitbox.w = reach; hitbox.h = thickness;
            } else if (player.facing === 'right') {
                hitbox.x = player.x + player.width; hitbox.y = player.y - 7; hitbox.w = reach; hitbox.h = thickness;
            }

            enemies.forEach(e => {
                if (rectOverlap(hitbox.x, hitbox.y, hitbox.w, hitbox.h, e.x, e.y, e.width, e.height)) {
                    damageEnemy(e, player.atk);
                }
            });
        }

        function getClosestEnemy() {
            let closest = null;
            let minDist = Infinity;
            const px = player.x + player.width / 2;
            const py = player.y + player.height / 2;

            enemies.forEach(e => {
                const ex = e.x + e.width / 2;
                const ey = e.y + e.height / 2;
                const dist = Math.hypot(ex - px, ey - py);
                if (dist < minDist) {
                    minDist = dist;
                    closest = e;
                }
            });
            return closest;
        }

        function damageEnemy(enemy, amount) {
            enemy.hp -= amount;
            createBurst(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.color);
            if (enemy.hp <= 0) {
                // Skill 3: Vampiric Soul Heal on Kill Scaling
                const vampLvl = playerSkills.vampirism;
                if (vampLvl > 0) {
                    const chances = [0, 0.15, 0.22, 0.30, 0.38, 0.50];
                    const heals = [0, 0.10, 0.15, 0.20, 0.25, 0.30];
                    if (Math.random() < chances[vampLvl]) {
                        const healAmt = Math.floor(player.maxHp * heals[vampLvl]);
                        player.hp = Math.min(player.maxHp, player.hp + healAmt);
                        createBurst(player.x + 6, player.y + 6, '#2ecc71');
                    }
                }
                gainXp(enemy.xpValue);
            }
        }

        function gainXp(amount) {
            player.xp += amount;
            if (player.xp >= player.nextXp) {
                player.level++;
                player.xp -= player.nextXp;
                player.nextXp = Math.floor(player.nextXp * 1.5);
                player.maxHp += 15;
                player.hp = player.maxHp;
                player.baseAtk += 2;
                recalculatePlayerStats();

                createBurst(player.x, player.y, '#f1c40f');
                pendingSkillChoices++;
                
                // Prompt Skill selection screen if not paused
                if (!isPaused) {
                    triggerSkillSelectionScreen();
                }
            }
            updateHUD();
            saveGame();
        }

        function updateHUD() {
            document.getElementById('hp-fill').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
            document.getElementById('xp-fill').style.width = ((player.xp / player.nextXp) * 100) + '%';
            document.getElementById('hp-txt').innerText = `${Math.max(0, Math.ceil(player.hp))}/${player.maxHp}`;
            document.getElementById('atk-txt').innerText = player.atk;
            document.getElementById('rng-txt').innerText = player.reach;
            document.getElementById('level-txt').innerText = `LVL ${player.level}`;

            // Render Skill status badges on HUD
            const skillsDiv = document.getElementById('skills-list');
            skillsDiv.innerHTML = '';
            
            SKILL_DEFINITIONS.forEach(sk => {
                const lvl = playerSkills[sk.id];
                if (lvl > 0) {
                    skillsDiv.innerHTML += `<div class="skill-tag">${sk.icon} ${sk.name} ${lvl === 5 ? 'MAX' : 'LV.' + lvl}</div>`;
                }
            });
        }

        function createBurst(x, y, color) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    color,
                    life: 10
                });
            }
        }

        function rectOverlap(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
        }

        function update() {
            if (isPaused) return;

            if (npcCooldown > 0) npcCooldown--;

            let dx = 0, dy = 0;

            if (keys['w'] || keys['arrowup']) { dy -= 1; player.facing = 'up'; }
            if (keys['s'] || keys['arrowdown']) { dy += 1; player.facing = 'down'; }
            if (keys['a'] || keys['arrowleft']) { dx -= 1; player.facing = 'left'; }
            if (keys['d'] || keys['arrowright']) { dx += 1; player.facing = 'right'; }

            if (joystick.active) {
                dx = joystick.dx;
                dy = joystick.dy;
                if (Math.abs(dx) > Math.abs(dy)) {
                    player.facing = dx > 0 ? 'right' : 'left';
                } else if (Math.abs(dy) > 0) {
                    player.facing = dy > 0 ? 'down' : 'up';
                }
            }

            if (dx !== 0 && dy !== 0 && !joystick.active) { 
                dx *= 0.7071; 
                dy *= 0.7071; 
            }

            player.x += dx * player.speed;
            player.y += dy * player.speed;

            player.x = Math.max(10, Math.min(378, player.x));
            player.y = Math.max(10, Math.min(278, player.y));

            if (player.isAttacking) {
                player.attackTimer--;
                if (player.attackTimer <= 0) player.isAttacking = false;
            }

            if (player.invulnerableTimer > 0) player.invulnerableTimer--;

            // --- SKILL 1: Auto Magic Darts (Level-scaled) ---
            const autoLvl = playerSkills.autoRanged;
            if (autoLvl > 0) {
                player.autoRangedTimer++;
                const cooldowns = [0, 80, 65, 50, 40, 25];
                if (player.autoRangedTimer >= cooldowns[autoLvl]) {
                    const target = getClosestEnemy();
                    if (target) {
                        const px = player.x + player.width / 2;
                        const py = player.y + player.height / 2;
                        const numDarts = Math.min(3, autoLvl);

                        for (let d = 0; d < numDarts; d++) {
                            const ex = target.x + target.width / 2;
                            const ey = target.y + target.height / 2;
                            let angle = Math.atan2(ey - py, ex - px);
                            // Spread multi-darts
                            if (numDarts > 1) angle += (d - (numDarts - 1) / 2) * 0.25;

                            projectiles.push({
                                x: px, y: py,
                                vx: Math.cos(angle) * (2.8 + autoLvl * 0.4),
                                vy: Math.sin(angle) * (2.8 + autoLvl * 0.4),
                                damage: Math.floor(player.atk * (0.5 + autoLvl * 0.15)),
                                life: 90
                            });
                        }
                        player.autoRangedTimer = 0;
                    }
                }
            }

            // --- SKILL 2: Orbiting Shields (Level-scaled) ---
            const orbitLvl = playerSkills.spinningOrbit;
            if (orbitLvl > 0) {
                player.orbitAngle += 0.04 + (orbitLvl * 0.015);
                const numOrbs = orbitLvl;
                const px = player.x + player.width / 2;
                const py = player.y + player.height / 2;

                for (let i = 0; i < numOrbs; i++) {
                    const currentAngle = player.orbitAngle + (i * (Math.PI * 2 / numOrbs));
                    const orbX = px + Math.cos(currentAngle) * (24 + orbitLvl * 2);
                    const orbY = py + Math.sin(currentAngle) * (24 + orbitLvl * 2);

                    enemies.forEach(e => {
                        if (rectOverlap(orbX - 4, orbY - 4, 8, 8, e.x, e.y, e.width, e.height)) {
                            damageEnemy(e, 1.5 + (orbitLvl * 0.8));
                        }
                    });
                }
            }

            // --- SKILL 5: Death Laser (Level-scaled) ---
            const laserLvl = playerSkills.laserAttack;
            if (laserLvl > 0) {
                player.laserTimer++;
                const laserCooldowns = [0, 210, 170, 130, 100, 70]; // Faster at higher levels
                if (player.laserTimer >= laserCooldowns[laserLvl]) {
                    const target = getClosestEnemy();
                    if (target) {
                        const px = player.x + player.width / 2;
                        const py = player.y + player.height / 2;
                        const ex = target.x + target.width / 2;
                        const ey = target.y + target.height / 2;

                        player.laserBeam = { x1: px, y1: py, x2: ex, y2: ey, life: 10 + laserLvl * 2, width: 2 + laserLvl };
                        damageEnemy(target, Math.floor(player.atk * (1.5 + laserLvl * 0.5)));
                    }
                    player.laserTimer = 0;
                }
            }

            if (player.laserBeam) {
                player.laserBeam.life--;
                if (player.laserBeam.life <= 0) player.laserBeam = null;
            }

            // Update Projectiles
            projectiles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                enemies.forEach(e => {
                    if (rectOverlap(p.x - 3, p.y - 3, 6, 6, e.x, e.y, e.width, e.height)) {
                        damageEnemy(e, p.damage);
                        p.life = 0;
                    }
                });
            });
            projectiles = projectiles.filter(p => p.life > 0);

            // NPC Interaction
            const distToNpc = Math.hypot((player.x - npc.x), (player.y - npc.y));
            if (distToNpc < 20 && npcCooldown === 0) {
                showDialogue(npc.name, "Choose your skills wisely when leveling up! Max out your favorite abilities to level 5!");
            }

            // Update Enemies
            enemies = enemies.filter(e => e.hp > 0);
            enemies.forEach(e => {
                e.x += e.vx * e.speed;
                e.y += e.vy * e.speed;

                if (e.x < 20 || e.x > 370) e.vx *= -1;
                if (e.y < 20 || e.y > 270) e.vy *= -1;

                if (rectOverlap(player.x, player.y, player.width, player.height, e.x, e.y, e.width, e.height)) {
                    if (player.invulnerableTimer === 0) {
                        player.hp -= e.damage;
                        player.invulnerableTimer = 45;
                        createBurst(player.x + 6, player.y + 6, '#e74c3c');
                        updateHUD();

                        if (player.hp <= 0) {
                            player.hp = player.maxHp;
                            player.x = 180;
                            player.y = 140;
                            showDialogue('DEFEATED', 'You passed out and woke up back in town.');
                            updateHUD();
                            saveGame();
                        }
                    }
                }
            });

            if (enemies.length === 0) {
                enemies.push(
                    spawnEnemy(50, 50, 1, 1),
                    spawnEnemy(320, 220, -1, 1),
                    spawnEnemy(200, 50, 1, -1)
                );
                showDialogue('WARNING', 'More enemies have appeared!');
            }

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
            });
            particles = particles.filter(p => p.life > 0);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ground
            ctx.fillStyle = '#2d5a27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background accents
            ctx.fillStyle = '#1e3f1b';
            ctx.fillRect(40, 40, 4, 4);
            ctx.fillRect(320, 80, 6, 6);
            ctx.fillRect(120, 240, 4, 4);

            // NPC
            ctx.fillStyle = '#3498db';
            ctx.fillRect(npc.x, npc.y, npc.width, npc.height);
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(npc.x + 2, npc.y - 3, 8, 4);

            // Enemies
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.width, e.height);
                ctx.fillStyle = '#000';
                ctx.fillRect(e.x + 2, e.y + 3, 2, 2);
                ctx.fillRect(e.x + 6, e.y + 3, 2, 2);

                if (e.hp < e.maxHp) {
                    const barW = 14;
                    const barH = 3;
                    const bx = e.x + (e.width / 2) - (barW / 2);
                    const by = e.y - 6;

                    ctx.fillStyle = '#000000';
                    ctx.fillRect(bx - 1, by - 1, barW + 2, barH + 2);

                    const pct = Math.max(0, e.hp / e.maxHp);
                    ctx.fillStyle = '#e74c3c';
                    ctx.fillRect(bx, by, barW * pct, barH);
                }
            });

            // Player
            if (player.invulnerableTimer === 0 || Math.floor(player.invulnerableTimer / 4) % 2 === 0) {
                ctx.fillStyle = '#e67e22';
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }

            // Skill 2: Orbiting Shields Drawing (Level-scaled number of orbs)
            const orbitLvl = playerSkills.spinningOrbit;
            if (orbitLvl > 0) {
                const px = player.x + player.width / 2;
                const py = player.y + player.height / 2;
                const numOrbs = orbitLvl;

                for (let i = 0; i < numOrbs; i++) {
                    const currentAngle = player.orbitAngle + (i * (Math.PI * 2 / numOrbs));
                    const orbX = px + Math.cos(currentAngle) * (24 + orbitLvl * 2);
                    const orbY = py + Math.sin(currentAngle) * (24 + orbitLvl * 2);

                    ctx.fillStyle = '#00ffff';
                    ctx.beginPath();
                    ctx.arc(orbX, orbY, 3 + Math.floor(orbitLvl * 0.5), 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Skill 1: Auto Darts Drawing
            projectiles.forEach(p => {
                ctx.fillStyle = '#f39c12';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Skill 5: Laser Beam Drawing
            if (player.laserBeam) {
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = player.laserBeam.width + 2;
                ctx.beginPath();
                ctx.moveTo(player.laserBeam.x1, player.laserBeam.y1);
                ctx.lineTo(player.laserBeam.x2, player.laserBeam.y2);
                ctx.stroke();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = Math.max(1, player.laserBeam.width - 2);
                ctx.beginPath();
                ctx.moveTo(player.laserBeam.x1, player.laserBeam.y1);
                ctx.lineTo(player.laserBeam.x2, player.laserBeam.y2);
                ctx.stroke();
            }

            // Standard Melee Attack Arc
            if (player.isAttacking) {
                ctx.fillStyle = '#ecf0f1';
                let sx = player.x, sy = player.y;
                let r = player.reach;
                if (player.facing === 'up') {
                    ctx.fillRect(sx - 7, sy - r, r + 4, r);
                } else if (player.facing === 'down') {
                    ctx.fillRect(sx - 7, sy + player.height + 2, r + 4, r);
                } else if (player.facing === 'left') {
                    ctx.fillRect(sx - r, sy - 7, r, r + 4);
                } else if (player.facing === 'right') {
                    ctx.fillRect(sx + player.width + 2, sy - 7, r, r + 4);
                }
            }

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 2, 2);
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        setInterval(saveGame, 5000);
        loadGame();
        updateHUD();
        loop();
    </script>
</body>
