<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Pixel RPG</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0d0e15;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 800px;
            max-height: 600px;
            background: #111;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 2px solid #333;
        }

        #game-wrapper:fullscreen, #game-wrapper:-webkit-full-screen {
            max-width: none;
            max-height: none;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
        }

        /* UI Overlays */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            z-index: 5;
            font-size: 12px;
        }

        .bar-container {
            width: 120px;
            height: 12px;
            background: #222;
            border: 2px solid #fff;
            margin-top: 3px;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.2s ease;
        }

        #hp-fill { background: #e74c3c; }
        #xp-fill { background: #f1c40f; }

        #boss-timer-display {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: bold;
            color: #ff4757;
            text-shadow: 2px 2px 0px #000;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #ff4757;
            pointer-events: none;
            z-index: 5;
        }

        #skills-list {
            position: absolute;
            top: 90px;
            left: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
            z-index: 5;
            font-size: 10px;
            text-shadow: 1px 1px 0px #000;
        }

        .skill-tag {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #3498db;
            color: #3498db;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .skill-tag.evolved {
            border-color: #f1c40f;
            color: #f1c40f;
        }

        #save-status {
            font-size: 11px;
            color: #2ecc71;
            margin-top: 4px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .top-controls {
            position: absolute;
            top: 55px;
            left: 10px;
            display: flex;
            gap: 6px;
            z-index: 6;
            pointer-events: auto;
        }

        .ui-btn {
            background: rgba(40, 40, 60, 0.85);
            border: 1px solid #fff;
            color: #fff;
            padding: 5px 8px;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .ui-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }

        #reset-btn {
            background: rgba(231, 76, 60, 0.85);
        }

        /* Dialogue UI */
        #dialogue-box {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 500px;
            max-height: 150px;
            background: rgba(16, 18, 27, 0.95);
            border: 3px solid #f1c40f;
            border-radius: 4px;
            padding: 10px 14px;
            font-size: 12px;
            line-height: 1.3;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 20;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        #dialogue-title {
            color: #f1c40f;
            font-weight: bold;
            margin-bottom: 4px;
        }

        #dialogue-hint {
            font-size: 10px;
            color: #aaa;
            margin-top: 6px;
            text-align: right;
        }

        /* Skill Selection Modal Overlay */
        #skill-select-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.92);
            z-index: 30;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        #skill-select-title {
            font-size: 18px;
            color: #f1c40f;
            margin-bottom: 4px;
            text-shadow: 2px 2px 0px #000;
        }

        #skill-select-subtitle {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .skill-options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 420px;
        }

        .skill-card {
            background: #1a1d28;
            border: 2px solid #3498db;
            border-radius: 6px;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .skill-card.evolve-card {
            border-color: #f1c40f;
            background: #2b2610;
        }

        .skill-card:hover, .skill-card:active {
            border-color: #f1c40f;
            background: #252b3d;
            transform: scale(1.02);
        }

        .skill-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            background: #0d0e15;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #555;
            flex-shrink: 0;
        }

        .skill-info {
            flex-grow: 1;
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }

        .skill-name {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }

        .skill-lvl-badge {
            font-size: 10px;
            background: #e74c3c;
            color: #fff;
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: bold;
        }

        .skill-lvl-badge.ev-badge {
            background: #f1c40f;
            color: #000;
        }

        .skill-desc {
            font-size: 10px;
            color: #bbb;
            line-height: 1.2;
        }

        /* Mobile Virtual Controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 15;
        }

        #joystick-base {
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }

        #joystick-stick {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.35);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            top: 30px;
            left: 30px;
            pointer-events: none;
        }

        #btn-attack {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(231, 76, 60, 0.85);
            border: 2px solid #fff;
            pointer-events: auto;
            font-size: 12px;
            font-weight: bold;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        #btn-attack:active { background: rgba(231, 76, 60, 1); }

        @media (pointer: coarse), (max-width: 600px) {
            #mobile-controls { display: flex; }
            #dialogue-box {
                top: 15px;
                width: 90%;
                max-height: 120px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas" width="400" height="300"></canvas>

        <div class="top-controls">
            <button id="fullscreen-btn" class="ui-btn">⛶ Fullscreen</button>
            <button id="reset-btn" class="ui-btn">Reset Save</button>
        </div>

        <div id="boss-timer-display">BOSS: 05:00</div>

        <!-- HUD -->
        <div id="hud">
            <div>
                HP: <span id="hp-txt">100/100</span>
                <div class="bar-container"><div id="hp-fill" class="bar-fill"></div></div>
            </div>
            <div>
                ATK: <span id="atk-txt">15</span> | RNG: <span id="rng-txt">25</span><br>
                <div id="save-status">Game Saved</div>
            </div>
            <div style="text-align: right;">
                <span id="level-txt">LVL 1</span>
                <div class="bar-container"><div id="xp-fill" class="bar-fill" style="width: 0%;"></div></div>
            </div>
        </div>

        <div id="skills-list"></div>

        <!-- Dialogue UI -->
        <div id="dialogue-box">
            <div id="dialogue-title">Village Elder</div>
            <div id="dialogue-text">Welcome back, Hero! Clean up those monsters. Your progress is saved!</div>
            <div id="dialogue-hint">[ Tap Attack or press Space to close ]</div>
        </div>

        <!-- Level Up / Boss Reward Overlay -->
        <div id="skill-select-overlay">
            <div id="skill-select-title">LEVEL UP!</div>
            <div id="skill-select-subtitle">Choose a skill to unlock or upgrade</div>
            <div class="skill-options-container" id="skill-cards-container"></div>
        </div>

        <!-- Touch Controls -->
        <div id="mobile-controls">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
            <button id="btn-attack">ATTACK</button>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('game-wrapper');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Map Tiling Config
        const MAP_WIDTH = 400;
        const MAP_HEIGHT = 300;

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (wrapper.requestFullscreen) wrapper.requestFullscreen();
                else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        document.addEventListener('fullscreenchange', updateFullscreenBtn);
        document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);
        function updateFullscreenBtn() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                fullscreenBtn.innerText = "✖ Exit";
            } else {
                fullscreenBtn.innerText = "⛶ Fullscreen";
            }
        }

        const keys = {};
        let saveTimeout;
        let isPaused = false;
        let pendingSkillChoices = 0;
        let isBossReward = false;
        let npcCooldown = 0;

        // Boss Timer Variables (5 minutes = 300 seconds)
        const BOSS_INTERVAL = 300;
        let bossTimer = BOSS_INTERVAL;
        let activeBoss = null;

        const player = {
            x: 200,
            y: 150,
            width: 12,
            height: 12,
            speed: 1.5,
            hp: 100,
            maxHp: 100,
            baseAtk: 15,
            baseReach: 25,
            atk: 15,
            reach: 25,
            level: 1,
            xp: 0,
            nextXp: 50,
            facingAngle: Math.PI / 2, // Default facing DOWN
            isAttacking: false,
            attackTimer: 0,
            invulnerableTimer: 0,
            autoRangedTimer: 0,
            orbitAngle: 0,
            laserTimer: 0,
            laserBeam: null
        };

        const SKILL_DEFINITIONS = [
            {
                id: 'autoRanged',
                name: 'Magic Darts',
                icon: '⚡',
                noEvolution: false,
                getDesc: (lvl, evolved) => {
                    if (evolved) return "EVOLVED: Chain Darts! Darts bounce to nearby enemies up to 2 times!";
                    if (lvl === 5) return "FINAL UPGRADE: Chain Bounce Darts (Bounces 2 times!)";
                    if (lvl === 0) return "Fires 1 auto-targeting dart at nearest enemy.";
                    return `Lvl ${lvl+1}: Fires ${Math.min(3, lvl + 1)} darts faster and with higher damage.`;
                }
            },
            {
                id: 'spinningOrbit',
                name: 'Orbiting Shield',
                icon: '🌀',
                noEvolution: false,
                getDesc: (lvl, evolved) => {
                    if (evolved) return "EVOLVED: Giant Barrier! Double orb radius and huge contact hitboxes.";
                    if (lvl === 5) return "FINAL UPGRADE: Massive Barrier Expansion!";
                    if (lvl === 0) return "Summons 1 orb spinning around you.";
                    return `Lvl ${lvl+1}: Adds an orb (Total ${lvl+1}) and increases rotation speed.`;
                }
            },
            {
                id: 'vampirism',
                name: 'Vampiric Soul',
                icon: '🩸',
                noEvolution: false,
                getDesc: (lvl, evolved) => {
                    if (evolved) return "EVOLVED: Blood Harvest! 100% chance to heal and gain temporary invulnerability!";
                    if (lvl === 5) return "FINAL UPGRADE: Blood Harvest (100% Heal & Protection)";
                    const chances = [0, 15, 22, 30, 38, 50];
                    const heals = [0, 10, 15, 20, 25, 30];
                    if (lvl === 0) return "15% chance to heal 10% Max HP on enemy kill.";
                    return `Lvl ${lvl+1}: ${chances[lvl+1]}% chance to heal ${heals[lvl+1]}% Max HP on kill.`;
                }
            },
            {
                id: 'statBoost',
                name: 'Might & Reach',
                icon: '⚔️',
                noEvolution: false,
                getDesc: (lvl, evolved) => {
                    if (evolved) return "EVOLVED: Titan Swing! Expands normal attack swing angle to 270 degrees!";
                    if (lvl === 5) return "FINAL UPGRADE: Titan Swing (270° Wide Cleave Arc)";
                    if (lvl === 0) return "Boosts Melee Damage, Range, and Sector Swing Angle.";
                    return `Lvl ${lvl+1}: Grants +${(lvl+1)*6} ATK and +${(lvl+1)*4} Range.`;
                }
            },
            {
                id: 'laserAttack',
                name: 'Death Laser',
                icon: '💥',
                noEvolution: false,
                getDesc: (lvl, evolved) => {
                    if (evolved) return "EVOLVED: Screen Penetration Beam! Pierces targeted enemy and continues off screen!";
                    if (lvl === 5) return "FINAL UPGRADE: Screen Penetration Laser";
                    if (lvl === 0) return "Fires a destructive beam at nearest target every 3.5s.";
                    return `Lvl ${lvl+1}: Fires faster with increased beam power.`;
                }
            },
            {
                id: 'xpMultiplier',
                name: "Scholar's Tome",
                icon: '📚',
                noEvolution: true, // Passive skill: max lvl 5, no evolution
                getDesc: (lvl) => {
                    const mults = [1, 1.5, 2, 4, 5, 8];
                    if (lvl === 5) return "MAX LEVEL: Gain 8x EXP from all killed enemies!";
                    return `Lvl ${lvl+1}: Increases earned EXP by ${mults[lvl+1]}x per kill!`;
                }
            }
        ];

        let playerSkills = {
            autoRanged: 0,
            spinningOrbit: 0,
            vampirism: 0,
            statBoost: 0,
            laserAttack: 0,
            xpMultiplier: 0
        };

        let skillEvolutions = {
            autoRanged: false,
            spinningOrbit: false,
            vampirism: false,
            statBoost: false,
            laserAttack: false
        };

        const npc = { x: 200, y: 80, width: 12, height: 12, name: 'Village Elder' };

        let projectiles = [];
        let particles = [];

        // --- ENEMY TYPES SYSTEM ---
        const ENEMY_TYPES = [
            { name: 'Slime',       color: '#2ecc71', hpMult: 1.0, speed: 0.5, damage: 6,   xp: 15,  minLevel: 1,  weightBase: 70 },
            { name: 'Goblin',      color: '#e67e22', hpMult: 1.4, speed: 0.8, damage: 10,  xp: 30,  minLevel: 1,  weightBase: 40 },
            { name: 'Skeleton',    color: '#ecf0f1', hpMult: 2.0, speed: 1.0, damage: 16,  xp: 55,  minLevel: 2,  weightBase: 35 },
            { name: 'Zombie',      color: '#16a085', hpMult: 2.8, speed: 0.4, damage: 22,  xp: 85,  minLevel: 3,  weightBase: 30 },
            { name: 'Orc',         color: '#27ae60', hpMult: 3.5, speed: 0.7, damage: 28,  xp: 125, minLevel: 4,  weightBase: 25 },
            { name: 'Demon',       color: '#9b59b6', hpMult: 4.5, speed: 0.9, damage: 36,  xp: 180, minLevel: 5,  weightBase: 20 },
            { name: 'Wraith',      color: '#8e44ad', hpMult: 5.5, speed: 1.2, damage: 45,  xp: 250, minLevel: 6,  weightBase: 15 },
            { name: 'Golem',       color: '#7f8c8d', hpMult: 7.5, speed: 0.3, damage: 58,  xp: 350, minLevel: 7,  weightBase: 12 },
            { name: 'Vampire',     color: '#c0392b', hpMult: 9.0, speed: 1.3, damage: 72,  xp: 500, minLevel: 8,  weightBase: 8  },
            { name: 'Shadow Lord', color: '#f39c12', hpMult: 12.0, speed: 0.8, damage: 95, xp: 750, minLevel: 10, weightBase: 5  }
        ];

        function getRandomEnemyType(playerLevel) {
            const candidates = ENEMY_TYPES.filter(type => playerLevel >= type.minLevel);
            const weights = candidates.map(type => {
                const diff = playerLevel - type.minLevel;
                return Math.max(5, type.weightBase + diff * 2);
            });

            const totalWeight = weights.reduce((sum, w) => sum + w, 0);
            let randomNum = Math.random() * totalWeight;

            for (let i = 0; i < candidates.length; i++) {
                if (randomNum < weights[i]) return candidates[i];
                randomNum -= weights[i];
            }
            return candidates[0];
        }

        function spawnEnemy(x, y) {
            const type = getRandomEnemyType(player.level);
            const baseHp = Math.floor((25 + (player.level * 8)) * type.hpMult);

            return {
                id: Math.random().toString(36).substr(2, 9),
                x, y,
                width: 10,
                height: 10,
                hp: baseHp,
                maxHp: baseHp,
                speed: type.speed,
                damage: type.damage,
                xpValue: type.xp,
                color: type.color,
                name: type.name,
                isBoss: false
            };
        }

        function spawnBoss() {
            if (activeBoss && activeBoss.hp > 0) return;

            // Buffed Boss HP drastically (Requirement #2)
            const bossHp = Math.floor(1200 + (player.level * 400));
            const bossSpeed = Math.max(0.5, player.speed * 0.65);

            activeBoss = {
                id: 'boss_' + Math.random().toString(36).substr(2, 9),
                x: player.x,
                y: player.y - 180,
                width: 24,
                height: 24,
                hp: bossHp,
                maxHp: bossHp,
                speed: bossSpeed,
                damage: 35 + player.level * 3,
                xpValue: (250 + player.level * 100) * 10,
                color: '#e74c3c',
                name: 'DUNGEON OVERLORD (BOSS)',
                isBoss: true
            };
            enemies.push(activeBoss);
            showDialogue("⚠️ BOSS WARNING ⚠️", "The Dungeon Overlord has arrived with massive HP! Slay him for legendary power!");
        }

        function spawnEnemyBatch() {
            const targetCount = Math.min(12, Math.max(4, 3 + Math.floor(player.level * 0.8)));
            const currentCount = enemies.length;
            const needed = targetCount - currentCount;

            for (let i = 0; i < needed; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 220 + Math.random() * 80;
                const sx = player.x + Math.cos(angle) * dist;
                const sy = player.y + Math.sin(angle) * dist;
                enemies.push(spawnEnemy(sx, sy));
            }
        }

        let enemies = [];
        spawnEnemyBatch();

        const joystick = { active: false, touchId: null, baseX: 0, baseY: 0, dx: 0, dy: 0 };
        const joystickBase = document.getElementById('joystick-base');
        const joystickStick = document.getElementById('joystick-stick');

        joystickBase.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!joystick.active) {
                const touch = e.changedTouches[0];
                joystick.active = true;
                joystick.touchId = touch.identifier;
                const rect = joystickBase.getBoundingClientRect();
                joystick.baseX = rect.left + rect.width / 2;
                joystick.baseY = rect.top + rect.height / 2;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!joystick.active) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystick.touchId) {
                    const maxDist = 40;
                    let deltaX = touch.clientX - joystick.baseX;
                    let deltaY = touch.clientY - joystick.baseY;
                    const dist = Math.hypot(deltaX, deltaY);

                    if (dist > maxDist) {
                        deltaX = (deltaX / dist) * maxDist;
                        deltaY = (deltaY / dist) * maxDist;
                    }

                    joystickStick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                    joystick.dx = deltaX / maxDist;
                    joystick.dy = deltaY / maxDist;
                }
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (!joystick.active) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystick.touchId) {
                    joystick.active = false;
                    joystick.touchId = null;
                    joystick.dx = 0;
                    joystick.dy = 0;
                    joystickStick.style.transform = `translate(0px, 0px)`;
                }
            }
        });

        function recalculatePlayerStats() {
            let boostLvl = playerSkills.statBoost;
            let extraAtk = boostLvl * 6;
            let extraReach = boostLvl * 4;

            if (skillEvolutions.statBoost) {
                extraAtk += 30;
                extraReach += 20;
            }

            player.atk = player.baseAtk + extraAtk;
            player.reach = player.baseReach + extraReach;
        }

        function saveGame() {
            const data = {
                hp: player.hp,
                maxHp: player.maxHp,
                baseAtk: player.baseAtk,
                baseReach: player.baseReach,
                level: player.level,
                xp: player.xp,
                nextXp: player.nextXp,
                x: player.x,
                y: player.y,
                skills: playerSkills,
                evolutions: skillEvolutions,
                bossTimer: bossTimer
            };
            localStorage.setItem('rpg_save_data_v7', JSON.stringify(data));

            const status = document.getElementById('save-status');
            status.style.opacity = '1';
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => { status.style.opacity = '0'; }, 1000);
        }

        function loadGame() {
            const data = localStorage.getItem('rpg_save_data_v7');
            if (data) {
                const parsed = JSON.parse(data);
                player.hp = parsed.hp;
                player.maxHp = parsed.maxHp;
                player.baseAtk = parsed.baseAtk || 15;
                player.baseReach = parsed.baseReach || 25;
                player.level = parsed.level;
                player.xp = parsed.xp;
                player.nextXp = parsed.nextXp;
                player.x = parsed.x || 200;
                player.y = parsed.y || 150;
                if (parsed.skills) playerSkills = parsed.skills;
                if (parsed.evolutions) skillEvolutions = parsed.evolutions;
                if (parsed.bossTimer) bossTimer = parsed.bossTimer;
            }
            recalculatePlayerStats();
        }

        function resetGame() {
            localStorage.removeItem('rpg_save_data_v7');
            location.reload();
        }
        document.getElementById('reset-btn').addEventListener('click', resetGame);

        function showDialogue(title, text) {
            isPaused = true;
            const box = document.getElementById('dialogue-box');
            document.getElementById('dialogue-title').innerText = title;
            document.getElementById('dialogue-text').innerText = text;
            box.style.display = 'block';
        }

        function closeDialogue() {
            document.getElementById('dialogue-box').style.display = 'none';
            isPaused = false;
            npcCooldown = 60;
        }

        function checkAllMaxedAndEvolved() {
            return SKILL_DEFINITIONS.every(sk => {
                if (sk.noEvolution) return playerSkills[sk.id] >= 5;
                return playerSkills[sk.id] >= 5 && skillEvolutions[sk.id];
            });
        }

        function applyDirectLevelBoost(levels = 5) {
            player.level += levels;
            player.maxHp += 15 * levels;
            player.hp = player.maxHp;
            player.baseAtk += 2 * levels;
            recalculatePlayerStats();
            updateHUD();
            saveGame();
        }

        function triggerSkillSelectionScreen(isBossDrop = false) {
            isPaused = true;
            isBossReward = isBossDrop;

            const titleEl = document.getElementById('skill-select-title');
            const subTitleEl = document.getElementById('skill-select-subtitle');

            if (isBossDrop) {
                titleEl.innerText = "BOSS VANQUISHED!";
                subTitleEl.innerText = "Choose your bonus skill reward";
            } else {
                titleEl.innerText = "LEVEL UP!";
                subTitleEl.innerText = "Choose a skill to upgrade";
            }

            if (checkAllMaxedAndEvolved()) {
                applyDirectLevelBoost(5);
                showDialogue("ULTIMATE OVERLOAD!", "All skills are FULLY MAXED!\n+5 Levels and stat scaling granted!");
                isPaused = false;
                document.getElementById('skill-select-overlay').style.display = 'none';
                return;
            }

            let options = [];
            const evolutionCandidates = SKILL_DEFINITIONS.filter(sk => !sk.noEvolution && playerSkills[sk.id] >= 5 && !skillEvolutions[sk.id]);
            const normalCandidates = SKILL_DEFINITIONS.filter(sk => playerSkills[sk.id] < 5);

            if (evolutionCandidates.length > 0) {
                evolutionCandidates.forEach(sk => options.push({ skill: sk, type: 'evolve' }));
            }

            normalCandidates.forEach(sk => options.push({ skill: sk, type: 'upgrade' }));

            options.sort(() => 0.5 - Math.random());
            const chosenOptions = options.slice(0, 3);

            const cardsContainer = document.getElementById('skill-cards-container');
            cardsContainer.innerHTML = '';

            chosenOptions.forEach(opt => {
                const sk = opt.skill;
                const curLvl = playerSkills[sk.id];
                const isEvolve = opt.type === 'evolve';

                const card = document.createElement('div');
                card.className = `skill-card ${isEvolve ? 'evolve-card' : ''}`;
                card.innerHTML = `
                    <div class="skill-icon">${sk.icon}</div>
                    <div class="skill-info">
                        <div class="skill-header">
                            <span class="skill-name">${sk.name}</span>
                            <span class="skill-lvl-badge ${isEvolve ? 'ev-badge' : ''}">
                                ${isEvolve ? 'FINAL UPGRADE' : (curLvl === 0 ? 'NEW!' : 'LVL ' + (curLvl + 1))}
                            </span>
                        </div>
                        <div class="skill-desc">${sk.getDesc(curLvl, isEvolve)}</div>
                    </div>
                `;
                card.addEventListener('click', () => selectSkillUpgrade(sk.id, isEvolve));
                cardsContainer.appendChild(card);
            });

            document.getElementById('skill-select-overlay').style.display = 'flex';
        }

        function selectSkillUpgrade(skillId, isEvolve) {
            if (isEvolve) {
                skillEvolutions[skillId] = true;
            } else {
                playerSkills[skillId]++;
            }

            document.getElementById('skill-select-overlay').style.display = 'none';
            recalculatePlayerStats();
            updateHUD();
            saveGame();

            if (!isBossReward) {
                pendingSkillChoices--;
            }

            if (pendingSkillChoices > 0) {
                triggerSkillSelectionScreen(false);
            } else {
                isPaused = false;
            }
        }

        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.code === 'Space') handleAction();
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        document.getElementById('btn-attack').addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleAction();
        });
        document.getElementById('btn-attack').addEventListener('click', () => handleAction());

        function handleAction() {
            if (isPaused) {
                if (document.getElementById('dialogue-box').style.display === 'block') {
                    closeDialogue();
                }
                return;
            }
            attack();
        }

        // --- SECTOR SWING ATTACK (135° -> 270°) ---
        function attack() {
            if (player.isAttacking || isPaused) return;
            player.isAttacking = true;
            player.attackTimer = 12;

            const px = player.x + player.width / 2;
            const py = player.y + player.height / 2;
            const radius = player.reach;
            
            const sweepAngleDeg = skillEvolutions.statBoost ? 270 : 135;
            const sweepAngleRad = (sweepAngleDeg * Math.PI) / 180;

            enemies.forEach(e => {
                const ex = e.x + e.width / 2;
                const ey = e.y + e.height / 2;
                const dist = Math.hypot(ex - px, ey - py);

                if (dist <= radius + Math.max(e.width, e.height) / 2) {
                    let enemyAngle = Math.atan2(ey - py, ex - px);
                    let diff = enemyAngle - player.facingAngle;
                    
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;

                    if (Math.abs(diff) <= sweepAngleRad / 2) {
                        damageEnemy(e, player.atk);
                    }
                }
            });
        }

        function getClosestEnemy(fromX, fromY, ignoreList = []) {
            let closest = null;
            let minDist = Infinity;

            enemies.forEach(e => {
                if (ignoreList.includes(e.id)) return;
                const ex = e.x + e.width / 2;
                const ey = e.y + e.height / 2;
                const dist = Math.hypot(ex - fromX, ey - fromY);
                if (dist < minDist) {
                    minDist = dist;
                    closest = e;
                }
            });
            return closest;
        }

        function damageEnemy(enemy, amount) {
            enemy.hp -= amount;
            createBurst(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, enemy.color);
            if (enemy.hp <= 0) {
                const vampLvl = playerSkills.vampirism;
                const vampEvol = skillEvolutions.vampirism;

                if (vampEvol) {
                    const healAmt = Math.floor(player.maxHp * 0.35);
                    player.hp = Math.min(player.maxHp, player.hp + healAmt);
                    player.invulnerableTimer = 60;
                    createBurst(player.x + 6, player.y + 6, '#f1c40f');
                } else if (vampLvl > 0) {
                    const chances = [0, 0.15, 0.22, 0.30, 0.38, 0.50];
                    const heals = [0, 0.10, 0.15, 0.20, 0.25, 0.30];
                    if (Math.random() < chances[vampLvl]) {
                        const healAmt = Math.floor(player.maxHp * heals[vampLvl]);
                        player.hp = Math.min(player.maxHp, player.hp + healAmt);
                        createBurst(player.x + 6, player.y + 6, '#2ecc71');
                    }
                }

                // Passive Skill #1: Scholar's Tome XP Multiplier
                const xpMultipliers = [1, 1.5, 2, 4, 5, 8];
                const xpLvl = playerSkills.xpMultiplier || 0;
                const finalXpGain = Math.floor(enemy.xpValue * xpMultipliers[xpLvl]);

                if (enemy.isBoss) {
                    activeBoss = null;
                    bossTimer = BOSS_INTERVAL;
                    gainXp(finalXpGain);
                    triggerSkillSelectionScreen(true);
                } else {
                    gainXp(finalXpGain);
                }
            }
        }

        function gainXp(amount) {
            player.xp += amount;
            while (player.xp >= player.nextXp) {
                player.level++;
                player.xp -= player.nextXp;
                player.nextXp = Math.floor(player.nextXp * 1.5);
                player.maxHp += 15;
                player.hp = player.maxHp;
                player.baseAtk += 2;
                recalculatePlayerStats();

                createBurst(player.x, player.y, '#f1c40f');
                pendingSkillChoices++;
            }

            if (pendingSkillChoices > 0 && !isPaused) {
                triggerSkillSelectionScreen(false);
            }

            updateHUD();
            saveGame();
        }

        function updateHUD() {
            document.getElementById('hp-fill').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
            document.getElementById('xp-fill').style.width = ((player.xp / player.nextXp) * 100) + '%';
            document.getElementById('hp-txt').innerText = `${Math.max(0, Math.ceil(player.hp))}/${player.maxHp}`;
            document.getElementById('atk-txt').innerText = player.atk;
            document.getElementById('rng-txt').innerText = player.reach;
            document.getElementById('level-txt').innerText = `LVL ${player.level}`;

            const skillsDiv = document.getElementById('skills-list');
            skillsDiv.innerHTML = '';
            
            SKILL_DEFINITIONS.forEach(sk => {
                const lvl = playerSkills[sk.id];
                const evolved = skillEvolutions[sk.id];
                if (lvl > 0 || evolved) {
                    const tagClass = evolved ? 'skill-tag evolved' : 'skill-tag';
                    const label = evolved ? 'EVOLVED' : (lvl === 5 ? 'MAX' : 'LV.' + lvl);
                    skillsDiv.innerHTML += `<div class="${tagClass}">${sk.icon} ${sk.name} [${label}]</div>`;
                }
            });

            const timerEl = document.getElementById('boss-timer-display');
            if (activeBoss && activeBoss.hp > 0) {
                timerEl.innerText = "⚠️ BOSS ENGAGED ⚠️";
            } else {
                const mins = Math.floor(bossTimer / 60);
                const secs = Math.floor(bossTimer % 60);
                timerEl.innerText = `BOSS: ${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
        }

        function createBurst(x, y, color) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    color,
                    life: 10
                });
            }
        }

        function rectOverlap(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
        }

        function distToSegment(px, py, x1, y1, x2, y2) {
            const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
            if (l2 === 0) return Math.hypot(px - x1, py - y1);
            let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
        }

        function update() {
            if (isPaused) return;

            // Boss Timer
            if (!activeBoss) {
                bossTimer -= 1 / 60;
                if (bossTimer <= 0) {
                    spawnBoss();
                }
            }

            if (npcCooldown > 0) npcCooldown--;

            let dx = 0, dy = 0;

            if (keys['w'] || keys['arrowup']) { dy -= 1; }
            if (keys['s'] || keys['arrowdown']) { dy += 1; }
            if (keys['a'] || keys['arrowleft']) { dx -= 1; }
            if (keys['d'] || keys['arrowright']) { dx += 1; }

            if (joystick.active) {
                dx = joystick.dx;
                dy = joystick.dy;
            }

            if (dx !== 0 || dy !== 0) {
                player.facingAngle = Math.atan2(dy, dx);
                if (dx !== 0 && dy !== 0 && !joystick.active) { 
                    dx *= 0.7071; 
                    dy *= 0.7071; 
                }
            }

            // Infinite Movement (Requirement #4)
            player.x += dx * player.speed;
            player.y += dy * player.speed;

            if (player.isAttacking) {
                player.attackTimer--;
                if (player.attackTimer <= 0) player.isAttacking = false;
            }

            if (player.invulnerableTimer > 0) player.invulnerableTimer--;

            // Skill 1: Auto Magic Darts
            const autoLvl = playerSkills.autoRanged;
            const autoEvol = skillEvolutions.autoRanged;
            if (autoLvl > 0 || autoEvol) {
                player.autoRangedTimer++;
                const cooldowns = [0, 80, 65, 50, 40, 25];
                const cd = autoEvol ? 18 : cooldowns[autoLvl];

                if (player.autoRangedTimer >= cd) {
                    const px = player.x + player.width / 2;
                    const py = player.y + player.height / 2;
                    const target = getClosestEnemy(px, py);
                    
                    if (target) {
                        const numDarts = autoEvol ? 3 : Math.min(3, autoLvl);

                        for (let d = 0; d < numDarts; d++) {
                            const ex = target.x + target.width / 2;
                            const ey = target.y + target.height / 2;
                            let angle = Math.atan2(ey - py, ex - px);
                            if (numDarts > 1) angle += (d - (numDarts - 1) / 2) * 0.25;

                            projectiles.push({
                                x: px, y: py,
                                vx: Math.cos(angle) * (3.0 + autoLvl * 0.4),
                                vy: Math.sin(angle) * (3.0 + autoLvl * 0.4),
                                damage: Math.floor(player.atk * (0.6 + autoLvl * 0.15)),
                                bouncesLeft: autoEvol ? 2 : 0,
                                hitEnemyIds: [],
                                life: 100
                            });
                        }
                        player.autoRangedTimer = 0;
                    }
                }
            }

            // Skill 2: Orbiting Shields
            const orbitLvl = playerSkills.spinningOrbit;
            const orbitEvol = skillEvolutions.spinningOrbit;
            if (orbitLvl > 0 || orbitEvol) {
                player.orbitAngle += 0.04 + (orbitLvl * 0.015);
                const numOrbs = orbitEvol ? 6 : orbitLvl;
                const radius = orbitEvol ? 42 : (24 + orbitLvl * 2);
                const orbSize = orbitEvol ? 7 : 3;

                const px = player.x + player.width / 2;
                const py = player.y + player.height / 2;

                for (let i = 0; i < numOrbs; i++) {
                    const currentAngle = player.orbitAngle + (i * (Math.PI * 2 / numOrbs));
                    const orbX = px + Math.cos(currentAngle) * radius;
                    const orbY = py + Math.sin(currentAngle) * radius;

                    enemies.forEach(e => {
                        if (rectOverlap(orbX - orbSize, orbY - orbSize, orbSize * 2, orbSize * 2, e.x, e.y, e.width, e.height)) {
                            damageEnemy(e, (1.5 + (orbitLvl * 0.8)) * (orbitEvol ? 2.0 : 1.0));
                        }
                    });
                }
            }

            // Skill 5: Death Laser
            const laserLvl = playerSkills.laserAttack;
            const laserEvol = skillEvolutions.laserAttack;
            if (laserLvl > 0 || laserEvol) {
                player.laserTimer++;
                const laserCooldowns = [0, 210, 170, 130, 100, 70];
                const cd = laserEvol ? 50 : laserCooldowns[laserLvl];

                if (player.laserTimer >= cd) {
                    const px = player.x + player.width / 2;
                    const py = player.y + player.height / 2;
                    const target = getClosestEnemy(px, py);

                    if (target) {
                        const ex = target.x + target.width / 2;
                        const ey = target.y + target.height / 2;
                        const angle = Math.atan2(ey - py, ex - px);

                        if (laserEvol) {
                            const endX = px + Math.cos(angle) * 1000;
                            const endY = py + Math.sin(angle) * 1000;

                            player.laserBeam = { 
                                x1: px, y1: py, x2: endX, y2: endY, 
                                life: 14, 
                                width: 6 
                            };

                            enemies.forEach(e => {
                                const eCenterX = e.x + e.width / 2;
                                const eCenterY = e.y + e.height / 2;
                                const dist = distToSegment(eCenterX, eCenterY, px, py, endX, endY);
                                if (dist <= 8 + Math.max(e.width, e.height) / 2) {
                                    damageEnemy(e, Math.floor(player.atk * 2.5));
                                }
                            });
                        } else {
                            player.laserBeam = { 
                                x1: px, y1: py, x2: ex, y2: ey, 
                                life: 12 + laserLvl * 2, 
                                width: 2 + laserLvl 
                            };
                            damageEnemy(target, Math.floor(player.atk * (1.5 + laserLvl * 0.5)));
                        }
                    }
                    player.laserTimer = 0;
                }
            }

            if (player.laserBeam) {
                player.laserBeam.life--;
                if (player.laserBeam.life <= 0) player.laserBeam = null;
            }

            // Update Projectiles
            projectiles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;

                enemies.forEach(e => {
                    if (!p.hitEnemyIds.includes(e.id) && rectOverlap(p.x - 3, p.y - 3, 6, 6, e.x, e.y, e.width, e.height)) {
                        damageEnemy(e, p.damage);
                        p.hitEnemyIds.push(e.id);

                        if (p.bouncesLeft > 0) {
                            p.bouncesLeft--;
                            const nextTarget = getClosestEnemy(p.x, p.y, p.hitEnemyIds);
                            if (nextTarget) {
                                const nex = nextTarget.x + nextTarget.width / 2;
                                const ney = nextTarget.y + nextTarget.height / 2;
                                const newAngle = Math.atan2(ney - p.y, nex - p.x);
                                const speed = Math.hypot(p.vx, p.vy);
                                p.vx = Math.cos(newAngle) * speed;
                                p.vy = Math.sin(newAngle) * speed;
                                createBurst(p.x, p.y, '#f1c40f');
                            } else {
                                p.life = 0;
                            }
                        } else {
                            p.life = 0;
                        }
                    }
                });
            });
            projectiles = projectiles.filter(p => p.life > 0);

            // NPC Interaction
            const distToNpc = Math.hypot((player.x - npc.x), (player.y - npc.y));
            if (distToNpc < 20 && npcCooldown === 0) {
                showDialogue(npc.name, "Beware! Every 5 minutes, a terrifying Boss spawns!\nSlay him to earn special skill drops!");
            }

            // ALL Enemies Chase Player (Requirement #3)
            enemies = enemies.filter(e => e.hp > 0);
            enemies.forEach(e => {
                const px = player.x + player.width / 2;
                const py = player.y + player.height / 2;
                const ex = e.x + e.width / 2;
                const ey = e.y + e.height / 2;

                const angle = Math.atan2(py - ey, px - ex);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                if (rectOverlap(player.x, player.y, player.width, player.height, e.x, e.y, e.width, e.height)) {
                    if (player.invulnerableTimer === 0) {
                        player.hp -= e.damage;
                        player.invulnerableTimer = 45;
                        createBurst(player.x + 6, player.y + 6, '#e74c3c');
                        updateHUD();

                        if (player.hp <= 0) {
                            player.hp = player.maxHp;
                            player.x = 200;
                            player.y = 150;
                            showDialogue('DEFEATED', 'You were defeated! Rest up at the village.');
                            updateHUD();
                            saveGame();
                        }
                    }
                }
            });

            if (enemies.length < Math.min(12, Math.max(4, Math.floor(player.level * 0.8)))) {
                spawnEnemyBatch();
            }

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
            });
            particles = particles.filter(p => p.life > 0);

            updateHUD();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Camera offset to keep player centered in infinity map
            const camX = player.x + player.width / 2 - canvas.width / 2;
            const camY = player.y + player.height / 2 - canvas.height / 2;

            // Render Repeating Infinite Map Grid Tiles (Requirement #4)
            const minTileX = Math.floor(camX / MAP_WIDTH) - 1;
            const maxTileX = Math.floor((camX + canvas.width) / MAP_WIDTH) + 1;
            const minTileY = Math.floor(camY / MAP_HEIGHT) - 1;
            const maxTileY = Math.floor((camY + canvas.height) / MAP_HEIGHT) + 1;

            for (let tx = minTileX; tx <= maxTileX; tx++) {
                for (let ty = minTileY; ty <= maxTileY; ty++) {
                    const screenTileX = (tx * MAP_WIDTH) - camX;
                    const screenTileY = (ty * MAP_HEIGHT) - camY;

                    // Tile Ground
                    ctx.fillStyle = (Math.abs(tx + ty) % 2 === 0) ? '#2d5a27' : '#275222';
                    ctx.fillRect(screenTileX, screenTileY, MAP_WIDTH, MAP_HEIGHT);

                    // Tile Accents
                    ctx.fillStyle = '#1e3f1b';
                    ctx.fillRect(screenTileX + 40, screenTileY + 40, 4, 4);
                    ctx.fillRect(screenTileX + 320, screenTileY + 80, 6, 6);
                    ctx.fillRect(screenTileX + 120, screenTileY + 240, 4, 4);
                    
                    // Grid Borders
                    ctx.strokeStyle = 'rgba(0,0,0,0.08)';
                    ctx.strokeRect(screenTileX, screenTileY, MAP_WIDTH, MAP_HEIGHT);
                }
            }

            // NPC Screen Position
            const npcScrX = npc.x - camX;
            const npcScrY = npc.y - camY;
            ctx.fillStyle = '#3498db';
            ctx.fillRect(npcScrX, npcScrY, npc.width, npc.height);
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(npcScrX + 2, npcScrY - 3, 8, 4);

            // Enemies & Boss
            enemies.forEach(e => {
                const scrX = e.x - camX;
                const scrY = e.y - camY;

                ctx.fillStyle = e.color;
                ctx.fillRect(scrX, scrY, e.width, e.height);
                ctx.fillStyle = '#000';
                
                if (e.isBoss) {
                    ctx.fillRect(scrX + 4, scrY + 6, 4, 4);
                    ctx.fillRect(scrX + 16, scrY + 6, 4, 4);
                } else {
                    ctx.fillRect(scrX + 2, scrY + 3, 2, 2);
                    ctx.fillRect(scrX + 6, scrY + 3, 2, 2);
                }

                if (e.hp < e.maxHp) {
                    const barW = e.isBoss ? 30 : 14;
                    const barH = e.isBoss ? 4 : 3;
                    const bx = scrX + (e.width / 2) - (barW / 2);
                    const by = scrY - (e.isBoss ? 8 : 6);

                    ctx.fillStyle = '#000000';
                    ctx.fillRect(bx - 1, by - 1, barW + 2, barH + 2);

                    const pct = Math.max(0, e.hp / e.maxHp);
                    ctx.fillStyle = e.isBoss ? '#ff4757' : '#e74c3c';
                    ctx.fillRect(bx, by, barW * pct, barH);
                }
            });

            // Player Screen Position
            const pScrX = player.x - camX;
            const pScrY = player.y - camY;

            if (player.invulnerableTimer === 0 || Math.floor(player.invulnerableTimer / 4) % 2 === 0) {
                ctx.fillStyle = '#e67e22';
                ctx.fillRect(pScrX, pScrY, player.width, player.height);
            }

            // Skill 2: Orbiting Shields
            const orbitLvl = playerSkills.spinningOrbit;
            const orbitEvol = skillEvolutions.spinningOrbit;
            if (orbitLvl > 0 || orbitEvol) {
                const px = pScrX + player.width / 2;
                const py = pScrY + player.height / 2;
                const numOrbs = orbitEvol ? 6 : orbitLvl;
                const radius = orbitEvol ? 42 : (24 + orbitLvl * 2);
                const orbSize = orbitEvol ? 6 : (3 + Math.floor(orbitLvl * 0.5));

                for (let i = 0; i < numOrbs; i++) {
                    const currentAngle = player.orbitAngle + (i * (Math.PI * 2 / numOrbs));
                    const orbX = px + Math.cos(currentAngle) * radius;
                    const orbY = py + Math.sin(currentAngle) * radius;

                    ctx.fillStyle = orbitEvol ? '#f1c40f' : '#00ffff';
                    ctx.beginPath();
                    ctx.arc(orbX, orbY, orbSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Skill 1: Auto Darts
            projectiles.forEach(p => {
                ctx.fillStyle = skillEvolutions.autoRanged ? '#f1c40f' : '#f39c12';
                ctx.beginPath();
                ctx.arc(p.x - camX, p.y - camY, skillEvolutions.autoRanged ? 4 : 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Skill 5: Laser Beam
            if (player.laserBeam) {
                ctx.strokeStyle = skillEvolutions.laserAttack ? '#f1c40f' : '#e74c3c';
                ctx.lineWidth = player.laserBeam.width + 2;
                ctx.beginPath();
                ctx.moveTo(player.laserBeam.x1 - camX, player.laserBeam.y1 - camY);
                ctx.lineTo(player.laserBeam.x2 - camX, player.laserBeam.y2 - camY);
                ctx.stroke();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = Math.max(1, player.laserBeam.width - 2);
                ctx.beginPath();
                ctx.moveTo(player.laserBeam.x1 - camX, player.laserBeam.y1 - camY);
                ctx.lineTo(player.laserBeam.x2 - camX, player.laserBeam.y2 - camY);
                ctx.stroke();
            }

            // Sector Swing Arc
            if (player.isAttacking) {
                const px = pScrX + player.width / 2;
                const py = pScrY + player.height / 2;
                const radius = player.reach;
                const sweepAngleDeg = skillEvolutions.statBoost ? 270 : 135;
                const sweepAngleRad = (sweepAngleDeg * Math.PI) / 180;

                const startAngle = player.facingAngle - (sweepAngleRad / 2);
                const endAngle = player.facingAngle + (sweepAngleRad / 2);

                ctx.fillStyle = skillEvolutions.statBoost ? 'rgba(241, 196, 15, 0.45)' : 'rgba(236, 240, 241, 0.35)';
                ctx.strokeStyle = skillEvolutions.statBoost ? '#f1c40f' : '#ffffff';
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.arc(px, py, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - camX, p.y - camY, 2, 2);
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        setInterval(saveGame, 5000);
        loadGame();
        updateHUD();
        loop();
    </script>
</body>
</html>
