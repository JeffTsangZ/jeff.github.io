        function isDragonBoss() {
            const a = boss.archetype || (boss.def && boss.def.archetype);
            return a === 'fire' || a === 'thunder';
        }
        // 龍類技能是否應起飛
        function dragonShouldFly(type) {
            return [
                'FIRE_BREATH', 'DOUBLE_BREATH', 'FIREBALL', 'WING_SLAM', 'AERIAL_DIVE',
                'ROAR_BLAST', 'METEOR_RAIN', 'FIRE_SPIN',
                'THUNDER_BOLT', 'STORM_SPHERE', 'STORM_BARRAGE', 'SKY_SPEAR',
                'OVERCHARGE', 'STATIC_NOVA', 'LIGHTNING_FIELD', 'STORM_DASH', 'FLASH_STEP', 'CHAIN_LIGHTNING'
            ].indexOf(type) >= 0;
        }
        function spawnBossCastVFX(type) {
            const col = ATTACK_COLORS[type] || 0xffffff;
            const origin = boss.pos.clone().add(new THREE.Vector3(0, isDragonBoss() ? 5.5 : 4.0, 0));
            const p2 = (boss.phase || 1) >= 2;
            createDirectionalSparks(origin, p2 ? 120 : 85, col, new THREE.Vector3(0, 1, 0), p2 ? 32 : 24);
            createImpactFlash(origin, col, p2 ? 7.5 : 5.5);
            createAOEShockwave(boss.pos.clone(), p2 ? 3.2 : 2.2, col, p2 ? 55 : 42);
            // 頭頂技能光環
            const halo = new THREE.Mesh(
                new THREE.TorusGeometry((boss.phase || 1) >= 2 ? 4.2 : 3.0, 0.32, 10, 32),
                new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 1.0, blending: THREE.AdditiveBlending })
            );
            halo.position.copy(origin); halo.rotation.x = Math.PI / 2;
            scene.add(halo);
            boss.projectiles.push({
                mesh: halo, velocity: new THREE.Vector3(), life: 0.9, damage: 0,
                type: 'CAST_HALO', expand: 1.8
            });
            // 地面第二層亮環
            createAOEShockwave(boss.pos.clone(), 1.4, col, 28);
        }
        function updateDragonFlight(dt, phase /* windup|attack */, progress) {
            if (!isDragonBoss() || !bossModel || !bossModel.group) return;
            const type = boss.attackType;
            const fly = dragonShouldFly(type);
            let targetY = 0;
            if (fly) {
                if (phase === 'windup') {
                    targetY = (type === 'AERIAL_DIVE' || type === 'METEOR_RAIN' || type === 'OVERCHARGE') ? 4.5 : 2.8;
                    targetY *= Math.min(1, progress * 1.4);
                } else {
                    if (type === 'AERIAL_DIVE') {
                        // 先高後砸
                        targetY = progress < 0.45 ? 5.0 * (1 - progress * 0.3) : Math.max(0, 5.0 * (1 - (progress - 0.2) * 1.6));
                    } else if (type === 'WING_SLAM' || type === 'STOMP_FIRE') {
                        targetY = progress < 0.4 ? 3.2 : Math.max(0, 3.2 - (progress - 0.4) * 8);
                    } else {
                        targetY = 2.6 + Math.sin(progress * Math.PI) * 0.8;
                    }
                }
            }
            bossModel.group.position.y = THREE.MathUtils.lerp(bossModel.group.position.y, targetY, 1 - Math.exp(-6 * dt));
            // 展翼
            if (bossModel.rightArmGroup && bossModel.leftArmGroup && fly) {
                const flap = 0.55 + Math.sin(performance.now() * 0.012) * 0.25;
                bossModel.rightArmGroup.rotation.z = THREE.MathUtils.lerp(bossModel.rightArmGroup.rotation.z, flap, 1 - Math.exp(-8 * dt));
                bossModel.leftArmGroup.rotation.z = THREE.MathUtils.lerp(bossModel.leftArmGroup.rotation.z, -flap, 1 - Math.exp(-8 * dt));
            }
            // 飛行時噴氣特效
            if (fly && Math.random() < 0.35) {
                const col = (boss.archetype === 'fire') ? 0xff6622 : 0x88ccff;
                createDirectionalSparks(
                    boss.pos.clone().add(new THREE.Vector3((Math.random()-0.5)*2, bossModel.group.position.y + 1, (Math.random()-0.5)*2)),
                    4, col, new THREE.Vector3(0, -1, 0), 10
                );
            }
        }
        function spawnSkillImpactVFX(type) {
            const col = ATTACK_COLORS[type] || 0xffaa00;
            const o = boss.pos.clone().add(new THREE.Vector3(0, 2, 0));
            createDirectionalSparks(o, 70, col, null, 22);
            createImpactFlash(o, col, 4.0);
            createAOEShockwave(boss.pos.clone(), 1.8, col, 36);
            triggerCameraShake(0.55);
            // 龍息／吐息額外錐形光柱
            if (type === 'FIRE_BREATH' || type === 'DOUBLE_BREATH' || type === 'ROAR_BLAST') {
                const dir = player.pos.clone().sub(boss.pos); dir.y = 0;
                if (dir.lengthSq() < 0.01) dir.set(0, 0, 1); else dir.normalize();
                const cone = new THREE.Mesh(
                    new THREE.ConeGeometry(5.5, 20, 18, 1, true),
                    new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.72, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false })
                );
                cone.position.copy(boss.pos).add(dir.clone().multiplyScalar(10));
                cone.position.y = 3.5 + (bossModel.group.position.y || 0);
                cone.lookAt(player.pos.clone().add(new THREE.Vector3(0, 2, 0)));
                cone.rotateX(Math.PI / 2);
                scene.add(cone);
                boss.projectiles.push({ mesh: cone, velocity: new THREE.Vector3(), life: 0.7, damage: 0, type: 'CAST_HALO' });
            }
            if (type === 'CHAIN_LIGHTNING' || type === 'THUNDER_BOLT' || type === 'STATIC_NOVA' || type === 'OVERCHARGE') {
                for (let i = 0; i < 5; i++) {
                    const bolt = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.08, 0.2, 6 + Math.random() * 4, 5),
                        new THREE.MeshBasicMaterial({ color: 0xaaddff, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending })
                    );
                    bolt.position.set(boss.pos.x + (Math.random()-0.5)*8, 4 + Math.random()*3, boss.pos.z + (Math.random()-0.5)*8);
                    bolt.rotation.z = (Math.random()-0.5) * 0.5;
                    scene.add(bolt);
                    boss.projectiles.push({ mesh: bolt, velocity: new THREE.Vector3(), life: 0.45, damage: 0, type: 'CAST_HALO' });
                }
            }
        }

        function showBossTelegraph(type) {
            clearBossTelegraph();
            const color = ATTACK_COLORS[type] || 0xffffff;
            const meta = ATTACK_META[type] || {};
            const isUB = !!meta.unblockable;
            const group = new THREE.Group();
            group.userData.isTelegraph = true;

            // 地面危險區底色（半透明扇形／圓）
            const dangerMat = new THREE.MeshBasicMaterial({
                color: isUB ? 0xff0000 : color,
                transparent: true, opacity: isUB ? 0.72 : 0.58,
                side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
            });
            const edgeMat = new THREE.MeshBasicMaterial({
                color: isUB ? 0xffaaaa : 0xffffff,
                transparent: true, opacity: 1.0,
                side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
            });

            if (type === 'DARK_SHOCKWAVE' || type === 'STOMP_AOE' || type === 'SPIN_ATTACK' || type === 'ABYSS_SPIKES' || type === 'GROUND_CRUSH' || type === 'HEAVEN_FALL' || type === 'WING_SLAM' || type === 'OVERCHARGE' || type === 'LAVA_POOL' || type === 'STATIC_NOVA' || type === 'ROAR_BLAST' || type === 'METEOR_RAIN' || type === 'LIGHTNING_FIELD') {
                const r = (type === 'HEAVEN_FALL' || type === 'OVERCHARGE' || type === 'METEOR_RAIN') ? 9 : (type === 'DARK_SHOCKWAVE' || type === 'GROUND_CRUSH' || type === 'WING_SLAM' || type === 'LAVA_POOL' || type === 'STATIC_NOVA' ? 7.5 : (type === 'SPIN_ATTACK' || type === 'LIGHTNING_FIELD' ? 6.5 : 5));
                const fill = new THREE.Mesh(new THREE.CircleGeometry(r, 48), dangerMat);
                fill.rotation.x = -Math.PI / 2; fill.position.y = 0.06; group.add(fill);
                const ring = new THREE.Mesh(new THREE.RingGeometry(r * 0.88, r, 48), edgeMat);
                ring.rotation.x = -Math.PI / 2; ring.position.y = 0.1; group.add(ring);
                // 內圈脈衝
                const inner = new THREE.Mesh(new THREE.RingGeometry(r * 0.25, r * 0.32, 32), edgeMat.clone());
                inner.material.opacity = 0.5; inner.rotation.x = -Math.PI / 2; inner.position.y = 0.11; group.add(inner);
            } else if (type === 'CHARGE_THRUST' || type === 'GRAB_RUSH' || type === 'STORM_DASH' || type === 'AERIAL_DIVE' || type === 'FLASH_STEP') {
                const path = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 24), dangerMat);
                path.rotation.x = -Math.PI / 2; path.position.y = 0.08;
                const dir = player.pos.clone().sub(boss.pos); dir.y = 0;
                if (dir.lengthSq() < 0.01) dir.set(0, 0, 1); else dir.normalize();
                path.position.copy(boss.pos).add(dir.clone().multiplyScalar(11));
                path.position.y = 0.08;
                const ang = Math.atan2(dir.x, dir.z);
                path.rotation.z = -ang;
                group.add(path);
                // 箭頭指示
                const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.9, 2.2, 4), edgeMat);
                arrow.position.copy(boss.pos).add(dir.clone().multiplyScalar(5));
                arrow.position.y = 0.5; arrow.rotation.x = Math.PI / 2; arrow.rotation.z = ang;
                group.add(arrow);
            } else if (type === 'DARK_ORB_BARRAGE' || type === 'VOID_RAIN' || type === 'FIREBALL' || type === 'STORM_SPHERE' || type === 'STORM_BARRAGE' || type === 'THUNDER_BOLT') {
                const aim = new THREE.Mesh(new THREE.RingGeometry(1.2, 2.0, 32), dangerMat);
                aim.position.set(0, 5, 0); group.add(aim);
                // 指向玩家的虛線柱
                const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.35, 12, 8), dangerMat);
                beam.position.set(0, 4, 0); group.add(beam);
            } else {
                // 近戰扇形：明確顯示揮砍範圍
                const fanR = (type === 'FIVE_COMBO' || type === 'FURY_BLADE') ? 11 : 10;
                const fan = new THREE.Mesh(
                    new THREE.RingGeometry(1.5, fanR, 40, 1, 0, Math.PI * 1.35),
                    dangerMat
                );
                fan.rotation.x = -Math.PI / 2; fan.position.y = 0.1;
                fan.rotation.z = bossGroup.rotation.y - Math.PI * 0.15;
                group.add(fan);
                const fanEdge = new THREE.Mesh(
                    new THREE.RingGeometry(fanR * 0.92, fanR, 40, 1, 0, Math.PI * 1.35),
                    edgeMat
                );
                fanEdge.rotation.x = -Math.PI / 2; fanEdge.position.y = 0.12;
                fanEdge.rotation.z = fan.rotation.z; group.add(fanEdge);
            }

            // 不可防警示文字環
            if (isUB) {
                const warn = new THREE.Mesh(
                    new THREE.RingGeometry(2.5, 2.9, 32),
                    new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.9, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })
                );
                warn.rotation.x = -Math.PI / 2; warn.position.y = 0.2; group.add(warn);
            }

            group.position.set(boss.pos.x, 0, boss.pos.z);
            scene.add(group);
            boss.telegraph = group;
            // 起手特效：更明顯的施法提示
            spawnBossCastVFX(type);

            // 技能名強制顯示（WINDUP～ATTACKING 期間）
            const label = document.getElementById('boss-atk-name');
            if (label) {
                const name = ATTACK_LABELS[type] || type;
                label.innerText = name;
                label.classList.toggle('unblock', !!(meta && meta.unblockable));
                label.style.color = (meta && meta.unblockable) ? '#ff5555' : '#ffe0a0';
                label.classList.add('show');
                label.style.opacity = '1';
            }
        }

        function keepBossAtkLabel() {
            if (boss.state === 'WINDUP' || boss.state === 'ATTACKING' || boss.state === 'RECOVERY') {
                const label = document.getElementById('boss-atk-name');
                if (label && boss.attackType) {
                    label.innerText = ATTACK_LABELS[boss.attackType] || boss.attackType;
                    label.classList.add('show');
                    label.style.opacity = '1';
                }
            }
        }


        function beginParry() {
            if (player.state === 'ROLL' || player.state === 'STAGGER' || player.state === 'DEAD' || player.state.startsWith('SKILL') || player.state === 'DRINK' || player.state === 'CHARGE' || player.state === 'SCOOP') return;
            if (player.parryTimer > 0) return;
            player.parryWindow = 0.34;
            player.parryTimer = 0.55;
            player.parrySuccess = false;
            player.isBlocking = true;
        }

        function beginGreatswordCharge() {
            if (player.state === 'ROLL' || player.state === 'STAGGER' || player.state === 'DEAD') return;
            if (player.state === 'ATTACK' || player.state === 'RECOVERY' || player.state.startsWith('SKILL') || player.state === 'CHARGE' || player.state === 'SCOOP') return;
            if (player.stamina < 18) return;
            player.charging = true;
            player.chargeLevel = 0;
            player.state = 'CHARGE';
            player.comboStep = 0;
            player.attackHitDone = false;
            slashArcMat.color.setHex(0xff6622);
            slashArc2Mat.color.setHex(0xffaa44);
            slashArcMat.opacity = 0.35;
            createDamageNumber('蓄力', player.pos.clone().add(new THREE.Vector3(0, 2.3, 0)), 'SKILL');
        }

        function releaseGreatswordCharge() {
            if (!player.charging && player.state !== 'CHARGE') return;
            player.charging = false;
            const lv = Math.min(3, 1 + Math.floor(player.chargeLevel / 0.7)); // 1~3
            // 消耗與等級
            const cost = 18 + lv * 10;
            if (player.stamina < cost * 0.5) { // 不夠則弱斬
                player.state = 'IDLE';
                slashArcMat.opacity = 0;
                return;
            }
            player.stamina = Math.max(0, player.stamina - cost);
            player.state = 'ATTACK';
            player.attackType = 'HEAVY';
            player.comboStep = lv; // 借用 comboStep 表示蓄力等級
            {
                const atkSet = getWeaponAtkSet();
                const baseH = (atkSet.timing && atkSet.timing.heavyDur) || 1.05;
                const sp = (selectedWeapon && selectedWeapon.speedMul) || 1;
                player.attackDuration = (baseH + (lv - 1) * 0.18) / sp;
            }
            player.attackTimer = player.attackDuration;
            player.attackHitDone = false;
            player.lastAttackTime = performance.now();
            slashArcMat.color.setHex(lv >= 3 ? 0xff2200 : (lv === 2 ? 0xff6600 : 0xffaa44));
            slashArc2Mat.color.setHex(0xff4400);
            slashArcMat.opacity = 1; slashArc2Mat.opacity = 0.85;
            targetFov = 52 - lv * 2;
            if (lv >= 2) createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1.8, 0)), 20 + lv * 15, 0xff6622, null, 14);
        }

        function stunBossBrief(seconds) {
            if (boss.state === 'STAGGERED' || boss.isBeingCrit) return;
            clearBossTelegraph();
            boss.state = 'STUNNED';
            boss.timer = seconds;
            createDamageNumber('擊暈!', boss.pos.clone().add(new THREE.Vector3(0, 5, 0)), 'CRIT');
            createImpactFlash(boss.pos.clone().add(new THREE.Vector3(0, 3.5, 0)), 0xffee88, 3.2);
            triggerCameraShake(0.5);
        }

        function isKatana() {
            return (selectedWeapon && selectedWeapon.skillStyle) === 'katana';
        }
        // 輕攻擊中取消 → 後撤納刀
        function katanaSheatheCancel() {
            if (!isKatana()) return false;
            if (player.state !== 'ATTACK' && player.state !== 'RECOVERY') return false;
            player.state = 'SHEATHE_BACK';
            // Longer, deeper backstep + stronger draw-in
            player.attackDuration = 0.55;
            player.attackTimer = 0.55;
            player.attackHitDone = true;
            const back = new THREE.Vector3(-Math.sin(playerGroup.rotation.y), 0, -Math.cos(playerGroup.rotation.y));
            player.moveVel.copy(back.multiplyScalar(22));
            player.vertVel = 3.5;
            setPlayerIframe(0.4);
            slashArcMat.opacity = 0; slashArc2Mat.opacity = 0;
            createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1.2, 0)), 28, 0xaaccff, back, 14);
            return true;
        }

        function spawnPlayerArrow(opts) {
            opts = opts || {};
            const lookDir = new THREE.Vector3(Math.sin(playerGroup.rotation.y), 0, Math.cos(playerGroup.rotation.y));
            const toBoss = boss.pos.clone().sub(player.pos); toBoss.y = 0;
            let dir = lookDir.clone();
            if (toBoss.lengthSq() > 0.01 && !opts.noAim) {
                toBoss.normalize();
                dir.lerp(toBoss, opts.aim != null ? opts.aim : 0.75).normalize();
            }
            const start = player.pos.clone().add(new THREE.Vector3(0, 1.55, 0)).add(dir.clone().multiplyScalar(1.2));
            // 更清晰的箭體
            const shaft = new THREE.Mesh(
                new THREE.CylinderGeometry(0.055, 0.055, 1.6, 8),
                new THREE.MeshStandardMaterial({ color: 0xe8c090, roughness: 0.45, metalness: 0.15, emissive: 0x331800, emissiveIntensity: 0.25 })
            );
            const tip = new THREE.Mesh(
                new THREE.ConeGeometry(0.11, 0.36, 8),
                new THREE.MeshStandardMaterial({ color: 0xffeecc, metalness: 0.95, roughness: 0.2, emissive: 0xffaa44, emissiveIntensity: 0.55 })
            );
            tip.position.y = 0.95;
            const f1 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.05, 0.28), new THREE.MeshBasicMaterial({ color: 0xff6644 }));
            f1.position.y = -0.7;
            const trail = new THREE.Mesh(
                new THREE.CylinderGeometry(0.04, 0.12, 1.2, 6),
                new THREE.MeshBasicMaterial({ color: 0xffcc66, transparent: true, opacity: 0.55, depthWrite: false })
            );
            trail.position.y = -1.1;
            trail.name = 'arrowTrail';
            const arrow = new THREE.Group(); arrow.add(shaft); arrow.add(tip); arrow.add(f1); arrow.add(trail);
            arrow.position.copy(start);
            arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
            scene.add(arrow);
            // 射線軌跡（地面／空中輔助線短時顯示）
            const pathLen = 28;
            const pathGeo = new THREE.BufferGeometry().setFromPoints([
                start.clone(),
                start.clone().add(dir.clone().multiplyScalar(pathLen))
            ]);
            const pathLine = new THREE.Line(pathGeo, new THREE.LineBasicMaterial({ color: 0xffdd88, transparent: true, opacity: 0.85 }));
            scene.add(pathLine);
            setTimeout(() => { scene.remove(pathLine); if (pathGeo) pathGeo.dispose(); }, 280);
            playerArrows.push({
                mesh: arrow, vel: dir.multiplyScalar(opts.speed || 42), life: opts.life || 2.8,
                damage: opts.damage || 55, posture: opts.posture || 12, hit: false
            });
            createDirectionalSparks(start, 10, 0xffcc88, dir, 10);
        }
        function spawnTrap() {
            const pos = player.pos.clone(); pos.y = 0.05;
            const ring = new THREE.Mesh(new THREE.RingGeometry(0.6, 1.35, 24), new THREE.MeshBasicMaterial({ color: 0x88ffaa, transparent: true, opacity: 0.75, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
            ring.rotation.x = -Math.PI / 2; ring.position.copy(pos);
            const core = new THREE.Mesh(new THREE.CircleGeometry(0.45, 16), new THREE.MeshBasicMaterial({ color: 0x44ff88, transparent: true, opacity: 0.45, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
            core.rotation.x = -Math.PI / 2; core.position.copy(pos); core.position.y = 0.06;
            scene.add(ring); scene.add(core);
            playerTraps.push({ ring, core, pos: pos.clone(), life: 18, armed: true, pulse: 0 });
            createDamageNumber('陷阱', pos.clone().add(new THREE.Vector3(0, 1.2, 0)), 'SKILL');
        }
        function updateArrowsAndTraps(dt) {
            for (let i = playerArrows.length - 1; i >= 0; i--) {
                const a = playerArrows[i];
                a.life -= dt;
                a.mesh.position.addScaledVector(a.vel, dt);
                if (!a.hit && boss.state !== 'DEAD') {
                    const dx = a.mesh.position.x - boss.pos.x, dz = a.mesh.position.z - boss.pos.z;
                    const dy = a.mesh.position.y - (boss.pos.y + 3.2);
                    if (Math.sqrt(dx*dx+dz*dz) < 2.9 && Math.abs(dy) < 4.5) {
                        a.hit = true;
                        applyBossDamage(a.damage, a.posture, a.damage >= 110 ? 'CRIT' : 'SKILL', a.mesh.position.clone());
                        createDirectionalSparks(a.mesh.position.clone(), 24, 0xffdd88, null, 12);
                        a.life = 0;
                    }
                }
                if (a.life <= 0) { scene.remove(a.mesh); playerArrows.splice(i, 1); }
            }
            for (let i = playerTraps.length - 1; i >= 0; i--) {
                const t = playerTraps[i];
                t.life -= dt; t.pulse += dt * 4;
                const op = 0.45 + Math.sin(t.pulse) * 0.25;
                if (t.ring.material) t.ring.material.opacity = op + 0.2;
                if (t.core.material) t.core.material.opacity = op;
                if (t.armed && boss.state !== 'DEAD' && boss.state !== 'STUNNED' && boss.state !== 'STAGGERED') {
                    const dx = boss.pos.x - t.pos.x, dz = boss.pos.z - t.pos.z;
                    if (Math.sqrt(dx*dx+dz*dz) < 2.5) {
                        t.armed = false; t.life = 0.3;
                        boss.stunTimer = 2.0; boss.state = 'STUNNED'; boss.timer = 2.0;
                        clearBossTelegraph();
                        createAOEShockwave(t.pos.clone(), 1.8, 0x66ffaa, 36);
                        createImpactFlash(t.pos.clone().add(new THREE.Vector3(0, 1, 0)), 0x88ffcc, 3.2);
                        createDamageNumber('陷阱擊暈!', boss.pos.clone().add(new THREE.Vector3(0, 5, 0)), 'CRIT');
                        triggerCameraShake(0.5);
                    }
                }
                if (t.life <= 0) { scene.remove(t.ring); scene.remove(t.core); playerTraps.splice(i, 1); }
            }
        }

        function onShiftTap() {
            if (!gameStarted || player.state === 'DEAD') return;
            const mode = (selectedWeapon && selectedWeapon.shiftMode) || 'shield';
            if (mode === 'shield') {
                beginParry();
                return;
            }
            if (mode === 'scoop') {
                // 大劍上撈斬：擊暈 1 秒
                if (player.shiftArtCd > 0) return;
                if (player.state === 'ROLL' || player.state === 'ATTACK' || player.state === 'CHARGE' || player.state.startsWith('SKILL') || player.state === 'DRINK') return;
                if (player.stamina < 28) return;
                player.stamina -= 28;
                player.shiftArtCd = player.shiftCdMax || 10.0;
                player.state = 'SCOOP';
                player.attackDuration = 0.95;
                player.attackTimer = 0.95;
                player.attackHitDone = false;
                slashArcMat.color.setHex(0xffcc66); slashArc2Mat.color.setHex(0xff8800);
                slashArcMat.opacity = 1; slashArc2Mat.opacity = 0.8;
                const fwd = new THREE.Vector3(Math.sin(playerGroup.rotation.y), 0, Math.cos(playerGroup.rotation.y));
                player.moveVel.copy(fwd.multiplyScalar(8));
                return;
            }
            if (mode === 'iai') {
                // 太刀 Shift：防反；可從輕攻擊取消並後撤納刀
                if (player.shiftArtCd > 0) return;
                if (player.state === 'ROLL' || player.state.startsWith('SKILL') || player.state === 'DRINK' || player.state === 'COUNTER' || player.state === 'SHEATHE_BACK') return;
                if (player.state === 'ATTACK' || player.state === 'RECOVERY') {
                    if (!katanaSheatheCancel()) return;
                } else if (player.state !== 'IDLE') {
                    return;
                }
                if (player.stamina < 20) return;
                player.stamina -= 20;
                player.shiftArtCd = player.shiftCdMax || 10.0;
                player.counterWindow = (selectedWeapon && selectedWeapon.counterSecs) || 0.7;
                player.counterType = 'iai';
                if (player.state !== 'SHEATHE_BACK') clearPlayerIframe();
                createDamageNumber('防反', player.pos.clone().add(new THREE.Vector3(0, 2.4, 0)), 'SKILL');
                slashArcMat.color.setHex(0xffe0a0); slashArcMat.opacity = 0.35;
                return;
            }
            if (mode === 'flash') {
                // 雷閃：可累積 3 次，用盡後進 CD 回滿
                if (player.shiftArtCd > 0) return;
                if ((player.flashCharges || 0) <= 0) return;
                if (player.state === 'ROLL' || player.state.startsWith('SKILL') || player.state === 'DRINK') return;
                if (player.stamina < 16) return;
                player.stamina -= 16;
                player.flashCharges = (player.flashCharges || 1) - 1;
                if (player.flashCharges <= 0) {
                    player.shiftArtCd = player.shiftCdMax || 6.0;
                    player.flashCharges = 0;
                }
                player.state = 'FLASH_DASH';
                player.attackDuration = 0.28;
                player.attackTimer = 0.28;
                player.attackHitDone = false;
                setPlayerIframe(0.32);
                const moveDir = getMovementVector();
                const forward = new THREE.Vector3(Math.sin(playerGroup.rotation.y), 0, Math.cos(playerGroup.rotation.y));
                const dir = moveDir.lengthSq() > 0.01 ? moveDir.clone().normalize() : forward;
                player.moveVel.copy(dir).multiplyScalar(48);
                playerGroup.rotation.y = Math.atan2(dir.x, dir.z);
                // 雷電特效
                const origin = player.pos.clone().add(new THREE.Vector3(0, 1.2, 0));
                createDirectionalSparks(origin, 55, 0x88eeff, dir, 28);
                createImpactFlash(origin, 0xaaddff, 2.2);
                for (let i = 0; i < 5; i++) {
                    const bolt = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.04, 0.02, 1.2 + Math.random(), 4),
                        new THREE.MeshBasicMaterial({ color: 0xccffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending })
                    );
                    bolt.position.copy(origin).add(dir.clone().multiplyScalar(i * 0.6));
                    bolt.position.y += Math.random() * 0.8;
                    bolt.rotation.z = (Math.random() - 0.5) * 1.2;
                    bolt.rotation.x = (Math.random() - 0.5);
                    scene.add(bolt);
                    boss.projectiles.push({ mesh: bolt, velocity: new THREE.Vector3(), life: 0.25, damage: 0, type: 'CAST_HALO' });
                }
                createDamageNumber('雷閃 ' + player.flashCharges + '/3', origin.clone().add(new THREE.Vector3(0, 1, 0)), 'SKILL');
                return;
            }
            
            if (mode === 'whirl' || mode === 'vault') {
                // Shift 多段旋風斬
                if (player.shiftArtCd > 0) return;
                if (player.state === 'ROLL' || player.state === 'DEAD' || player.state === 'IG_AIR' || player.state === 'IG_WHIRL' || player.state.startsWith('SKILL')) return;
                if (player.state === 'ATTACK') return;
                if (player.stamina < 22) return;
                player.stamina -= 22;
                player.shiftArtCd = (selectedWeapon && selectedWeapon.shiftCd) || 6;
                player.state = 'IG_WHIRL';
                player.attackTimer = 0.52;
                player.attackDuration = 0.52;
                player.igWhirlHits = 0;
                player.attackHitDone = false;
                const fwd = new THREE.Vector3(Math.sin(playerGroup.rotation.y), 0, Math.cos(playerGroup.rotation.y));
                const move = getMovementVector();
                const dir = move.lengthSq() > 0.01 ? move.normalize() : fwd;
                player.moveVel.copy(dir.multiplyScalar(14));
                setPlayerIframe(0.2);
                createDamageNumber('旋風斬', player.pos.clone().add(new THREE.Vector3(0, 2.3, 0)), 'SKILL');
                createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1.2, 0)), 30, 0x88ffaa, new THREE.Vector3(0, 1, 0), 14);
                slashArcMat.color.setHex(0x88ffcc);
                slashArc2Mat.color.setHex(0x44dd88);
                slashArcMat.opacity = 1;
                return;
            }
if (mode === 'trap') {
                if (player.shiftArtCd > 0) return;
                if (player.state === 'ROLL' || player.state.startsWith('SKILL') || player.state === 'DRINK' || player.state === 'ATTACK') return;
                if (player.stamina < 18) return;
                player.stamina -= 18;
                player.shiftArtCd = player.shiftCdMax || 12.0;
                spawnTrap();
                player.state = 'RECOVERY';
                player.recoveryFrom = 'SKILL';
                player.recoveryTimer = 0.28;
                return;
            }
        }

        function setPlayerIframe(duration) {
            player.iframe = true;
            player.iframeTimer = Math.max(player.iframeTimer || 0, duration);
        }
        function clearPlayerIframe() {
            player.iframe = false;
            player.iframeTimer = 0;
        }

        function tryCounterWindow() {
            if (player.counterWindow <= 0 || player.state === 'DEAD') return false;
            // 已在反擊中則不再重入，避免狀態卡死
            if (player.state === 'COUNTER') return true;
            const type = player.counterType || 'kenkiri';
            player.counterWindow = 0;
            player.counterType = type;

        function applyBossDamage(dmg, posture, hitType, hitPos) {
            // 破繭過場無敵
            if (boss.state === 'PHASE_TRANS') return;
            // 武器強化倍率
            const um = getUpgradeMul(selectedWeapon && selectedWeapon.id);
            dmg = Math.round(dmg * um);
            posture = Math.round((posture || 0) * um);
            boss.hp = Math.max(0, boss.hp - dmg);
            boss.posture = Math.min(boss.maxPosture, boss.posture + posture);
            const col = hitType === 'CRIT' ? 0xffee66 : (hitType === 'SKILL' ? 0x00e5ff : 0xffaa00);
            createDirectionalSparks(hitPos, hitType === 'CRIT' ? 75 : 50, col, null, hitType === 'CRIT' ? 22 : 16);
            createImpactFlash(hitPos, col, hitType === 'CRIT' ? 3.2 : 2.2);
            createDamageNumber(dmg, hitPos, hitType);
            // 打擊停頓 + 鏡頭回饋（魂系手感）
            if (hitType === 'CRIT') {
                hitstopTimer = Math.max(hitstopTimer, 0.13);
                triggerCameraShake(0.48);
                targetFov = Math.min(targetFov, 50);
            } else if (hitType === 'SKILL') {
                hitstopTimer = Math.max(hitstopTimer, 0.09);
                triggerCameraShake(0.32);
                targetFov = Math.min(targetFov, 52);
            } else {
                hitstopTimer = Math.max(hitstopTimer, 0.03);
                triggerCameraShake(0.12);
            }
            if (boss.posture >= boss.maxPosture && boss.state !== 'STAGGERED') {
                boss.state = 'STAGGERED'; boss.timer = 5.8; critMarker.visible = true;

        /* --- 6. 玩家動作與打擊判定（距離與流暢度大幅提升） --- */
        // --- Elden Ring style input buffer ---
        function queueInput(action, type) {
            player.inputBuf.action = action;
            player.inputBuf.type = type || null;
            player.inputBuf.t = 0.28; // ~280ms buffer window
        }
        function consumeInputBuffer() {
            if (!player.inputBuf.action || player.inputBuf.t <= 0) return false;
            const a = player.inputBuf.action;
            const t = player.inputBuf.type;
            player.inputBuf.action = null;
            player.inputBuf.type = null;
            player.inputBuf.t = 0;
            if (a === 'ATTACK') handlePlayerAttack(t || 'LIGHT');
            else if (a === 'ROLL') tryStartRoll(true);
            return true;
        }
        function tryStartRoll(fromBuffer) {
            if (player.state === 'DEAD' || player.state === 'ROLL' || player.state === 'DRINK') return false;
            if (player.state.startsWith('SKILL') && player.state !== 'RECOVERY') return false;
            // ER: can roll-cancel late recovery / late attack recovery
            if (player.state === 'ATTACK') {
                const prog = 1 - (player.attackTimer / Math.max(0.001, player.attackDuration));
                if (prog < 0.72) {
                    if (!fromBuffer) queueInput('ROLL');
                    return false;
                }
            }


            if (player.state === 'RECOVERY') {
                // allow anytime in recovery (souls feel)
            } else if (player.state === 'CHARGE' || player.state === 'SCOOP' || player.state === 'COUNTER' || player.state === 'FLASH_DASH' || player.state === 'SHEATHE_BACK') {
                if (!fromBuffer) queueInput('ROLL');
                return false;
            } else if (player.state !== 'IDLE' && player.state !== 'RECOVERY') {
                if (!fromBuffer) queueInput('ROLL');
                return false;
            }
            const cost = PHYS.rollStamina || 18;
            if (player.stamina < cost) return false;
            player.stamina -= cost;
            player.stamDelay = PHYS.stamRegenDelay || 0.42;
            player.state = 'ROLL';
            const rollM = (selectedWeapon && selectedWeapon.rollMul) || 1;
            // ER medium roll ~0.5s total
            player.rollMax = 0.52 / Math.max(0.85, Math.min(1.35, rollM));
            player.rollTimer = player.rollMax;
            // iframes cover mid travel (classic souls)
            setPlayerIframe(Math.min(0.38, player.rollMax * 0.72));
            player.grounded = false;
            player.vertVel = 4.2;
            const moveDir = getMovementVector();
            let dir = new THREE.Vector3();
            if (moveDir.lengthSq() > 0.01) {
                dir.copy(moveDir).normalize();
            } else if (Math.hypot(player.moveVel.x, player.moveVel.z) > 1.2) {
                dir.set(player.moveVel.x, 0, player.moveVel.z).normalize();
            } else {
                dir.set(Math.sin(playerGroup.rotation.y), 0, Math.cos(playerGroup.rotation.y));
            }
            player.moveVel.set(dir.x * PHYS.rollImpulse * rollM, 0, dir.z * PHYS.rollImpulse * rollM);
            player.velocity.copy(player.moveVel);
            playerGroup.rotation.y = Math.atan2(dir.x, dir.z);
            targetFov = 66;
            // clear partial attack pose
            slashArcMat.opacity = 0; slashArc2Mat.opacity = 0;
            return true;
        }

        
        function handleInsectAirAttack(type) {
            if ((selectedWeapon && selectedWeapon.skillStyle) !== 'insect') return;
            if (player._igDiving) return;
            if (player.attackTimer > 0.05) return;
            const cost = type === 'HEAVY' ? 18 : 9;
            if (player.stamina < cost) return;
            player.stamina -= cost;
            player.stamDelay = 0.3;
            const bonus = (typeof igDmgMul === 'function') ? igDmgMul() : 1;
            const allEx = typeof igAllThree === 'function' && igAllThree();

            if (type === 'HEAVY') {
                // 華麗空中下突
                player._igDiving = true;
                player.igDiveHits = 0;
                player.attackTimer = 1.05;
                player.attackDuration = 1.05;
                player.attackType = 'HEAVY';
                player.vertVel = -6;
                player._igEBonus = allEx ? 1.65 : 1.25;
                player._igSpin = 0;
                // 對準目標俯衝
                const toB = boss.pos.clone().sub(player.pos); toB.y = 0;
                if (toB.lengthSq() > 0.01) {
                    toB.normalize();
                    player._igDiveDir = toB;
                    playerGroup.rotation.y = Math.atan2(toB.x, toB.z);
                    player.moveVel.copy(toB.multiplyScalar(16));
                }
                createDamageNumber(allEx ? '覺醒・蟲能下突!!' : '蟲能下突!', player.pos.clone().add(new THREE.Vector3(0, 2.8, 0)), 'CRIT');
                createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 2, 0)), 50, 0xffee66, new THREE.Vector3(0, -1, 0), 20);
                if (typeof createImpactFlash === 'function') createImpactFlash(player.pos.clone().add(new THREE.Vector3(0, 2, 0)), 0xaaff66, 2.8);
                setPlayerIframe(0.45);
                slashArcMat.color.setHex(0xffee88);
                slashArc2Mat.color.setHex(0x88ff44);
                slashArcMat.opacity = 1;
                return;
            }

            // 空中迴旋斬（飛舞連段）
            player.igAirCombo = (player.igAirCombo || 0) + 1;
            const step = player.igAirCombo;
            // 第 4 段後立刻下突（MH）
            if (step >= 4) {
                createDamageNumber('迴旋斬4', player.pos.clone().add(new THREE.Vector3(0, 2.6, 0)), 'SKILL');
                player._igDiving = true;
                player.igDiveHits = 0;
                player.attackTimer = 1.05;
                player.attackDuration = 1.05;
                player.attackType = 'HEAVY';
                player.vertVel = -8;
                const allEx = typeof igAllThree === 'function' && igAllThree();
                player._igEBonus = allEx ? 1.65 : 1.25;
                const toB = boss.pos.clone().sub(player.pos); toB.y = 0;
                if (toB.lengthSq() > 0.01) {
                    toB.normalize();
                    player._igDiveDir = toB;
                    playerGroup.rotation.y = Math.atan2(toB.x, toB.z);
                    player.moveVel.copy(toB.multiplyScalar(14));
                }
                createDamageNumber(allEx ? '覺醒・蟲能下突!!' : '蟲能下突!', player.pos.clone().add(new THREE.Vector3(0, 3.0, 0)), 'CRIT');
                setPlayerIframe(0.4);
                slashArcMat.color.setHex(0xffee88);
                slashArc2Mat.color.setHex(0x88ff44);
                slashArcMat.opacity = 1;
                return;
            }
            player.attackTimer = 0.38 + step * 0.04;
            player.attackDuration = player.attackTimer;
            player.attackType = 'LIGHT';
            player.attackHitDone = false;
            player._igSpin = (player._igSpin || 0) + (step % 2 === 0 ? 1 : -1);
            player.vertVel = Math.max(player.vertVel || 0, 3.5 + step * 0.6);
            const fwd = player._igDiveDir || new THREE.Vector3(Math.sin(playerGroup.rotation.y), 0, Math.cos(playerGroup.rotation.y));
            const right = new THREE.Vector3(fwd.z, 0, -fwd.x);
            player.moveVel.addScaledVector(fwd, 4 + step);
            player.moveVel.addScaledVector(right, (step % 2 === 0 ? 1 : -1) * (5 + step));
            createDamageNumber('迴旋斬' + step, player.pos.clone().add(new THREE.Vector3(0, 2.6, 0)), 'SKILL');
            createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 2, 0)), 22, 0x88ffcc, null, 12);
            slashArcMat.color.setHex(step % 2 === 0 ? 0x88ffaa : 0xaaffff);
            slashArc2Mat.color.setHex(0x44cc88);
            slashArcMat.opacity = 1;
            if (slashArc2Mat) slashArc2Mat.opacity = 0.85;
        }

        function handlePlayerAttack(type) {
            if (player.state === 'ROLL' || player.state === 'STAGGER' || player.state === 'DEAD' || player.state === 'DRINK' || player.state === 'CHARGE' || player.state === 'SCOOP' || player.state === 'IG_WHIRL') return;
            if (player.state === 'IG_AIR') {
                handleInsectAirAttack(type);
                return;
            }
            if (player.state.startsWith('SKILL') && player.state !== 'RECOVERY') return;
            // ER-like: wider combo buffer on light recovery; queue if locked in early attack frames
            const canCombo = (
                type === 'LIGHT' &&
                player.state === 'RECOVERY' &&
                player.recoveryFrom === 'LIGHT' &&
                player.comboStep > 0 && player.comboStep < getMaxCombo() &&
                player.recoveryTimer <= 0.42
            );
            if (player.state === 'ATTACK') {
                const prog = 1 - (player.attackTimer / Math.max(0.001, player.attackDuration));
                // late active frames: allow buffer into next light
                if (type === 'LIGHT' && prog > 0.55 && player.attackType === 'LIGHT' && player.comboStep < getMaxCombo()) {
                    queueInput('ATTACK', 'LIGHT');
                } else if (!canCombo) {
                    queueInput('ATTACK', type);
                }
                if (!canCombo) return;
            }
            if (player.state === 'RECOVERY' && !canCombo) {
                // buffer heavies / lights that aren't valid combo
                if (!(type === 'LIGHT' && player.recoveryFrom === 'LIGHT' && player.comboStep > 0 && player.comboStep < getMaxCombo())) {
                    queueInput('ATTACK', type);
                    return;
                }
            }

            const now = performance.now();
            if (boss.state === 'STAGGERED' && player.pos.distanceTo(boss.pos) < 8.0 && !boss.isBeingCrit) {
                executeCriticalHit(); return;
            }

            if (type === 'LIGHT') {
                const maxC = getMaxCombo();
                if (canCombo || (now - player.lastAttackTime < 1200 && player.comboStep > 0 && player.comboStep < maxC && player.state === 'RECOVERY'))
                    player.comboStep = Math.min(maxC, player.comboStep + 1);
                else
                    player.comboStep = 1;
                const lightCost = PHYS.lightStamina || 12;
                if (player.stamina < lightCost) return; player.stamina -= lightCost;
                player.stamDelay = PHYS.stamRegenDelay || 0.42;

                player.state = 'ATTACK'; player.attackType = 'LIGHT';
                const sp = (selectedWeapon && selectedWeapon.speedMul) || 1;
                const atkSet = getWeaponAtkSet();
                const durs = (atkSet.timing && atkSet.timing.lightDur) || [0.58, 0.62, 0.88];
                const stepIdx = Math.max(0, ((player.comboStep || 1) - 1) % durs.length);
                let baseDur = durs[stepIdx];
                const stC = (selectedWeapon && selectedWeapon.skillStyle) || 'knight';
                if (stC === 'insect') baseDur *= (player.comboStep >= 5 ? 1.12 : 0.92);
                player.attackDuration = baseDur / sp;
                player.attackTimer = player.attackDuration; player.attackHitDone = false; player.lastAttackTime = now;

                const st = (selectedWeapon && selectedWeapon.skillStyle) || 'knight';
                if (st === 'bow') {
                    player.state = 'ATTACK';
                    player.attackType = 'LIGHT';
                    player.attackDuration = 0.36; // 拉弓→放箭，短後搖
                    player.attackTimer = player.attackDuration;
                    player.attackHitDone = false;
                    player.lastAttackTime = now;
                    player._bowShot = false;
                    slashArcMat.opacity = 0; slashArc2Mat.opacity = 0;
                    return;
                }
                if (st === 'katana') {
                    slashArcMat.color.setHex(0xb8d4ff); slashArc2Mat.color.setHex(0x88aaff);
                } else if (st === 'dagger') {
                    slashArcMat.color.setHex(0xff8899); slashArc2Mat.color.setHex(0xff4466);
                } else if (st === 'insect') {
                    slashArcMat.color.setHex(0x88ffaa); slashArc2Mat.color.setHex(0x44cc88);
                } else if (st === 'greatsword') {
                    slashArcMat.color.setHex(0xffaa55); slashArc2Mat.color.setHex(0xff6600);
                } else if (player.comboStep === 1) { slashArcMat.color.setHex(0xffffff); slashArc2Mat.color.setHex(0xccddff); }
                else if (player.comboStep === 2) { slashArcMat.color.setHex(0xddddff); slashArc2Mat.color.setHex(0xaabbff); }
                else { slashArcMat.color.setHex(0xffcc44); slashArc2Mat.color.setHex(0xffaa00); }
                // 近戰踏步（大幅減弱；操蟲棍不前衝）
                {
                    const fwd = new THREE.Vector3(Math.sin(playerGroup.rotation.y), 0, Math.cos(playerGroup.rotation.y));
                    const stL = (selectedWeapon && selectedWeapon.skillStyle) || 'knight';
                    if (stL === 'insect') {
                        // 原地棍術連段，不向前走
                        player.moveVel.x *= 0.3;
                        player.moveVel.z *= 0.3;
                    } else {
                        let lunge = player.comboStep === 1 ? 5 : (player.comboStep === 2 ? 4 : 7);
                        if (stL === 'dagger') lunge *= 1.1;
                        else if (stL === 'greatsword') lunge *= 0.6;
                        else if (stL === 'katana') lunge *= 0.9;
                        else if (stL === 'bow') lunge = 0;
                        player.moveVel.addScaledVector(fwd, lunge);
                    }
                }
            } else {
                // 大劍重擊改走蓄力系統
                if ((selectedWeapon && selectedWeapon.skillStyle) === 'greatsword') {
                    beginGreatswordCharge();
                    return;
                }
                if ((selectedWeapon && selectedWeapon.skillStyle) === 'bow') {
                    if (player.stamina < 22) return; player.stamina -= 22;
                    player.stamDelay = PHYS.stamRegenDelay || 0.42;
                    player.comboStep = 0;
                    player.state = 'ATTACK'; player.attackType = 'HEAVY';
                    player.attackDuration = 0.48; // 蓄力拉滿再放
                    player.attackTimer = 0.52;
                    player.attackHitDone = false; player.lastAttackTime = now;
                    player._bowShot = false;

        function spawnClonesAndShurikens() {
            // 清舊
            playerClones.forEach((c) => scene.remove(c));
            playerClones.length = 0;
            const base = player.pos.clone();
            const yaw = playerGroup.rotation.y;
            const offsets = [
                new THREE.Vector3(Math.sin(yaw + 1.2) * 2.2, 0, Math.cos(yaw + 1.2) * 2.2),
                new THREE.Vector3(Math.sin(yaw - 1.2) * 2.2, 0, Math.cos(yaw - 1.2) * 2.2)
            ];
            offsets.forEach((off, idx) => {
                const clone = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.35, 0.3, 1.8, 8),
                    new THREE.MeshBasicMaterial({ color: 0x8866aa, transparent: true, opacity: 0.45 })
                );
                clone.position.copy(base).add(off); clone.position.y = 1.2;
                scene.add(clone);
                playerClones.push(clone);
                // 各射 3 枚手裏劍
                for (let i = 0; i < 3; i++) {
                    const dir = boss.pos.clone().sub(clone.position); dir.y = 0;
                    if (dir.lengthSq() < 0.01) dir.set(0, 0, 1); else dir.normalize();
                    const spread = (i - 1) * 0.18;
                    const d2 = dir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), spread);
                    const star = new THREE.Mesh(
                        new THREE.OctahedronGeometry(0.22, 0),
                        new THREE.MeshBasicMaterial({ color: 0xddccff })
                    );
                    star.position.copy(clone.position);
                    scene.add(star);
                    playerShurikens.push({
                        mesh: star,
                        vel: d2.multiplyScalar(28),
                        life: 1.2,
                        damage: 48,
                        delay: 0.12 + idx * 0.08 + i * 0.06,
                        launched: false,
                        hit: false
                    });
                }
            });
            setTimeout(() => {
                playerClones.forEach((c) => scene.remove(c));
                playerClones.length = 0;
            }, 900);
        }

        function walkIntensitySafe() {
            return THREE.MathUtils.clamp((player.moveSpeed || 0) / (PHYS.maxSpeed || 7), 0, 1);
        }
        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
        function easeOutBack(t) { const c1 = 1.70158; const c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

        function updatePlayer(dt) {
            if (player.state === 'DEAD') return;

            if (player.qCooldown > 0) player.qCooldown = Math.max(0, player.qCooldown - dt);
            if (player.eCooldown > 0) player.eCooldown = Math.max(0, player.eCooldown - dt);
            if (player.parryTimer > 0) player.parryTimer = Math.max(0, player.parryTimer - dt);
            if (player.parryWindow > 0) player.parryWindow = Math.max(0, player.parryWindow - dt);
            if (player.speedBoostTimer > 0) {
                player.speedBoostTimer = Math.max(0, player.speedBoostTimer - dt);
            }
            // 無敵計時（防止永久 iframe）
            if (player.iframeTimer > 0) {
                player.iframeTimer -= dt;
                if (player.iframeTimer <= 0) {
                    player.iframeTimer = 0;
                    // 翻滾／反擊動畫中由各自狀態管理，這裡只清「超時保險」
                    if (player.state !== 'ROLL' && player.state !== 'COUNTER' && player.state !== 'FLASH_DASH') {
                        player.iframe = false;
                    }
                }
            }
            if (player.counterWindow > 0) {
                player.counterWindow = Math.max(0, player.counterWindow - dt);
                if (player.counterWindow <= 0) {
                    player.counterType = null;
                    slashArcMat.opacity = Math.min(slashArcMat.opacity, 0.05);
                    // 窗口結束且未觸發反擊：確保沒有殘留無敵
                    if (player.state !== 'COUNTER' && player.state !== 'ROLL') {
                        clearPlayerIframe();
                    }
                }
            }
            // 流血 DOT
            if (bossStatus.bleedTime > 0 && boss.state !== 'DEAD') {
                bossStatus.bleedTime -= dt;
                const bd = bossStatus.bleedDps * dt;
                boss.hp = Math.max(0, boss.hp - bd);
                if (Math.floor(bossStatus.bleedTime * 4) !== Math.floor((bossStatus.bleedTime + dt) * 4)) {
                    createDamageNumber(Math.round(bossStatus.bleedDps * 0.25), boss.pos.clone().add(new THREE.Vector3(0, 4.2, 0)), 'SKILL');
                }
                if (boss.hp <= 0) triggerVictory();
            }
            // 手裏劍
            for (let i = playerShurikens.length - 1; i >= 0; i--) {
                const s = playerShurikens[i];
                if (!s.launched) {
                    s.delay -= dt;
                    if (s.delay <= 0) s.launched = true;
                    continue;
                }
                s.life -= dt;
                s.mesh.position.addScaledVector(s.vel, dt);
                s.mesh.rotation.x += dt * 12; s.mesh.rotation.y += dt * 10;
                if (!s.hit && s.mesh.position.distanceTo(boss.pos.clone().setY(s.mesh.position.y)) < 3.2) {
                    s.hit = true;
                    applyBossDamage(s.damage, 8, 'SKILL', s.mesh.position.clone());
                    s.life = 0;
                }
                if (s.life <= 0) {
                    scene.remove(s.mesh);
                    playerShurikens.splice(i, 1);
                }
            }

            // Stamina delay after actions (ER-like)
            if (player.stamDelay > 0) player.stamDelay = Math.max(0, player.stamDelay - dt);
            if (player.inputBuf.t > 0) {
                player.inputBuf.t -= dt;
                if (player.inputBuf.t <= 0) { player.inputBuf.action = null; player.inputBuf.type = null; }
            }
            const blockingNow = !!(keys['ShiftLeft'] || keys['ShiftRight']) && ((selectedWeapon && selectedWeapon.shiftMode) || 'shield') === 'shield';
            if (player.stamDelay <= 0 && player.state !== 'ATTACK' && player.state !== 'ROLL' && !player.state.startsWith('SKILL') && player.state !== 'DRINK' && player.state !== 'CHARGE' && player.state !== 'SCOOP') {
                if (blockingNow || player.isBlocking) {
                    // slow regen while holding guard
                    player.stamina = Math.min(player.maxStamina, player.stamina + 8 * dt);
                } else if (player.state === 'RECOVERY') {
                    player.stamina = Math.min(player.maxStamina, player.stamina + (PHYS.stamRegenWalk || 32) * 0.55 * dt);
                } else {
                    const moving = getMovementVector().lengthSq() > 0.01;
                    const rate = moving ? (PHYS.stamRegenWalk || 32) : (PHYS.stamRegen || 48);
                    player.stamina = Math.min(player.maxStamina, player.stamina + rate * dt * ((selectedWeapon && selectedWeapon.skillStyle) === 'insect' && typeof igHas === 'function' && igHas('w') ? 1.35 : 1));
                }
            }
            // slight stamina drain while blocking
            if (player.isBlocking && player.state !== 'ROLL') {
                player.stamina = Math.max(0, player.stamina - 6 * dt);
            }

            if (player.shiftArtCd > 0) {
                player.shiftArtCd = Math.max(0, player.shiftArtCd - dt);
                if (player.shiftArtCd <= 0 && selectedWeapon && selectedWeapon.shiftMode === 'flash') {
                    player.flashCharges = selectedWeapon.flashChargesMax || 3;
                }
            }
            const shiftHeld = keys['ShiftLeft'] || keys['ShiftRight'];
            const mode = (selectedWeapon && selectedWeapon.shiftMode) || 'shield';
            player.hyperArmor = false;
            if (mode === 'shield') {
                player.isBlocking = shiftHeld && (player.state === 'IDLE' || player.state === 'RECOVERY' || player.parryTimer > 0) && player.stamina > 5;
                // block pose applied in locomotion section via bones
            } else {
                player.isBlocking = false;
                if (player.counterWindow > 0 && knightMesh.bones) {
                    applyPose(knightMesh.bones, {
                        rUpper: {x:-0.55,y:0.1,z:-0.2}, rElbow: {x:-0.7,y:0,z:0}, rFore: {x:0.1,y:0,z:0},
                        sword: {x:-0.25,y:0,z:-0.2}, spine: {x:0.05,y:0,z:0}
                    }, 1 - Math.exp(-10 * dt));
                }
            }

            // Space edge-trigger (ER: one roll per press)
            if (keys['Space'] && !player._spaceWasDown) {
                tryStartRoll(false);
            }
            player._spaceWasDown = !!keys['Space'];
            // Consume buffered inputs when free enough
            if (player.inputBuf.action && (player.state === 'IDLE' || player.state === 'RECOVERY')) {
                consumeInputBuffer();
            }

            // 登龍殘留：落地後可自由移動，約1秒後自動4段龍氣
            if (player.denryuBurstT != null && player.denryuBurstT >= 0) {
                player.denryuBurstT += dt;
                if (player.denryuBurstT < 1.0 && Math.random() < 0.35) {
                    const ang = Math.random() * Math.PI * 2;
                    const r = 1.0 + player.denryuBurstT * 1.2;
                    createDirectionalSparks(
                        player.pos.clone().add(new THREE.Vector3(Math.cos(ang) * r, 1.0 + Math.random() * 0.8, Math.sin(ang) * r)),
                        2, 0xffe088, new THREE.Vector3(0, 1, 0), 4
                    );
                }
                const hitAt = [1.0, 1.22, 1.44, 1.68];
                const hitDmgs = [150, 170, 190, 240];
                const hitPosts = [30, 34, 38, 52];
                if (player.denryuHits == null) player.denryuHits = 0;
                for (let hi = 0; hi < hitAt.length; hi++) {
                    if (player.denryuHits <= hi && player.denryuBurstT >= hitAt[hi]) {
                        player.denryuHits = hi + 1;
                        const dist = player.pos.distanceTo(boss.pos);
                        if (dist < 14) {
                            const label = hi === hitAt.length - 1 ? 'CRIT' : 'SKILL';
                            applyBossDamage(
                                hitDmgs[hi], hitPosts[hi], label,
                                boss.pos.clone().add(new THREE.Vector3(0, 3.0 + hi * 0.35, 0))
                            );
                        }
                        createAOEShockwave(player.pos.clone(), 1.0 + hi * 0.35, 0xffaa22, 28 + hi * 8);
                        createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1.6, 0)), 20, 0xffd700, new THREE.Vector3(0, 1, 0), 12);
                        if (hi === hitAt.length - 1) {
                            spawnDragonVFX(player.pos.clone());
                            createAOEShockwave(player.pos.clone(), 2.4, 0xff8800, 55);
                            triggerCameraShake(1.0);
                            hitstopTimer = Math.max(hitstopTimer, 0.14);
                            player.denryuBurstT = -2;
                        } else {
                            triggerCameraShake(0.2);
                            hitstopTimer = Math.max(hitstopTimer, 0.04);
                        }
                    }
                }
                if (player.denryuBurstT > 2.2) player.denryuBurstT = -2;
            }

            // 獵蟲飛行（Q）：飛向目標 → 命中吸取精華 → 返回
            if (knightMesh && knightMesh.kinsect && knightMesh._kinsectAtk) {
                knightMesh._kinsectT = (knightMesh._kinsectT || 0) + dt;
                const kt = knightMesh._kinsectT;
                const bug = knightMesh.kinsect;
                if (bug.children[1]) bug.children[1].rotation.z = Math.sin(kt * 48) * 0.55;
                if (bug.children[2]) bug.children[2].rotation.z = -Math.sin(kt * 48) * 0.55;
                if (kt < 0.48) {
                    const t = kt / 0.48;
                    bug.position.set(0.5 + t * 3.5, 2.0 + Math.sin(t * Math.PI) * 2.0, 0.4 + t * 4.5);
                } else if (!player._igHitBug) {
                    player._igHitBug = true;
                    if (player.pos.distanceTo(boss.pos) < 28) {
                        applyBossDamage(75, 24, 'SKILL', boss.pos.clone().add(new THREE.Vector3(0, 3.2, 0)));
                        createDirectionalSparks(boss.pos.clone().add(new THREE.Vector3(0, 3, 0)), 28, 0x88ffaa, null, 14);
                    }
                    if (!player.igExtract) player.igExtract = { r: false, w: false, o: false };
                    let gained = '精華已滿';
                    let kind = null;
                    if (!player.igExtract.r) {
                        player.igExtract.r = true; kind = 'r';
                        gained = '紅精華・攻擊強化';
                    } else if (!player.igExtract.w) {
                        player.igExtract.w = true; kind = 'w';
                        gained = '白精華・迅捷強化';
                    } else if (!player.igExtract.o) {
                        player.igExtract.o = true; kind = 'o';
                        gained = '橙精華・鐵壁強化';
                    }
                    createDamageNumber(gained, player.pos.clone().add(new THREE.Vector3(0, 2.6, 0)), 'SKILL');
                    if (kind && typeof igExtractVfx === 'function') igExtractVfx(kind);
                    if (player.igExtract.r && player.igExtract.w && player.igExtract.o) {
                        createDamageNumber('三色覺醒!', player.pos.clone().add(new THREE.Vector3(0, 3.2, 0)), 'CRIT');
                        createDamageNumber('攻速防全強化', player.pos.clone().add(new THREE.Vector3(0, 3.7, 0)), 'SKILL');
                        if (typeof igExtractVfx === 'function') igExtractVfx('all');
                    }
                } else if (kt < 0.95) {
                    const t = (kt - 0.48) / 0.47;
                    bug.position.set(4.0 - t * 3.5, 3.2 - t * 1.2, 4.9 - t * 4.5);
                } else {
                    knightMesh._kinsectAtk = false;
                    player._igHitBug = false;
                    bug.position.set(0.4, 2.2, 0.3);
                }
            }

            if (player.state === 'SHEATHE_BACK') {
                player.attackTimer -= dt;
                const p = 1 - (player.attackTimer / Math.max(0.001, player.attackDuration));
                // 大幅後撤 + 納刀至腰後（幅度加大）
                playerGroup.position.x += player.moveVel.x * dt;
                playerGroup.position.z += player.moveVel.z * dt;
                playerGroup.position.y = Math.max(0, playerGroup.position.y + (player.vertVel || 0) * dt);
                if (player.vertVel !== undefined) {
                    player.vertVel -= 28 * dt;
                    if (playerGroup.position.y <= 0) { playerGroup.position.y = 0; player.vertVel = 0; }
                }
                player.moveVel.multiplyScalar(Math.exp(-3.2 * dt));
                // 劍大幅收到身後腰側
                if (knightMesh.weaponRoot) {
                    knightMesh.weaponRoot.rotation.x = 0.2 + 1.1 * p;
                    knightMesh.weaponRoot.rotation.y = -0.9 * p;
                    knightMesh.weaponRoot.rotation.z = 0.6 * p;
                    knightMesh.weaponRoot.position.z = 0.8 - 1.1 * p;
                    knightMesh.weaponRoot.position.x = 0.0 - 0.35 * p;
                }
                knightMesh.body.rotation.y = -0.55 * Math.sin(p * Math.PI);
                knightMesh.body.rotation.x = 0.15 * p;
                if (player.attackTimer <= 0) {
                    player.state = 'IDLE';
                    if (knightMesh.weaponRoot) {
                        knightMesh.weaponRoot.position.set(0.0, 1.35, 0.8);
                        knightMesh.weaponRoot.rotation.set(0.15, 0, 0);
                    }
                }
                return;
            }

            if (player.state === 'ROLL') {
                player.rollTimer -= dt;
                const p = 1 - (player.rollTimer / Math.max(0.001, player.rollMax));
                // 位移
                player.moveVel.x *= Math.exp(-PHYS.rollFriction * dt);
                player.moveVel.z *= Math.exp(-PHYS.rollFriction * dt);
                playerGroup.position.x += player.moveVel.x * dt;
                playerGroup.position.z += player.moveVel.z * dt;
                if (typeof resolveArenaColliders === 'function') resolveArenaColliders();
                // 魂系翻滾：騰空曲線 + 前傾，禁止整圈旋轉鑽地
                const hop = Math.sin(Math.min(1, p) * Math.PI);
                // 全程最低離地，避免任何網格進地板
                playerGroup.position.y = 0.45 + hop * 0.55;
                const tuck = Math.sin(Math.min(1, p * 1.05) * Math.PI);
                if (knightMesh.group) {
                    // 最多前傾 ~50°，不翻轉
                    knightMesh.group.rotation.x = -tuck * 0.9;
                    knightMesh.group.rotation.z = Math.sin(p * Math.PI * 2) * 0.12;
                    knightMesh.group.position.y = 0.35;
                }
                if (knightMesh.bones) {
                    applyPose(knightMesh.bones, ATK_POSES.roll_tuck, Math.min(1, tuck * 1.1));
                } else {
                    knightMesh.legL.rotation.x = -0.9 * tuck;
                    knightMesh.legR.rotation.x = -0.85 * tuck;
                }
                // ER-like iframe window: mainly mid-roll (start slightly delayed, end before recovery)
                if (p < 0.12) {
                    player.iframe = true;
                } else if (p > 0.62) {
                    player.iframe = false;
                    player.iframeTimer = 0;
                } else {
                    player.iframe = true;
                }
                if (player.rollTimer <= 0) {
                    player.state = 'RECOVERY';
                    player.recoveryFrom = 'ROLL';
                    player.recoveryTimer = 0.12; // snappier stand-up
                    clearPlayerIframe();
                    player.grounded = true;
                    playerGroup.position.y = 0;
                    if (knightMesh.group) {
                        knightMesh.group.rotation.set(0, 0, 0);
                        knightMesh.group.position.y = 0;
                    }
                    knightMesh.body.rotation.set(0, 0, 0);
                    knightMesh.legL.rotation.x = 0;
                    knightMesh.legR.rotation.x = 0;
                    knightMesh.rightArm.rotation.set(0, 0, 0);
                    knightMesh.leftArm.rotation.set(0, 0, 0);
                    if (knightMesh.headGroup) knightMesh.headGroup.rotation.set(0, 0, 0);
                    targetFov = 58;
                }
                (function softArenaBound() {
                    const lim = PHYS.arenaLimit || 44;
                    const soft = PHYS.arenaSoft || 40;
                    const x = playerGroup.position.x, z = playerGroup.position.z;
                    const dist = Math.hypot(x, z);
                    if (dist > soft) {
                        const n = 1 / Math.max(dist, 0.001);
                        const nx = x * n, nz = z * n;
                        const t = Math.min(1, (dist - soft) / Math.max(0.001, lim - soft));
                        const push = t * t * 28 * dt;
                        playerGroup.position.x -= nx * push;
                        playerGroup.position.z -= nz * push;
                        if (player.moveVel) {
                            const outward = player.moveVel.x * nx + player.moveVel.z * nz;
                            if (outward > 0) {
                                player.moveVel.x -= nx * outward * (0.5 + t);
                                player.moveVel.z -= nz * outward * (0.5 + t);
                            }
                        }
                    }
                    if (dist > lim) {
                        const n = lim / dist;
                        playerGroup.position.x *= n;
                        playerGroup.position.z *= n;
                    }
                })();
                if (typeof resolveArenaColliders === 'function') resolveArenaColliders();
                return;
            }

            if (player.state === 'DRINK') {
                knightMesh.rightArm.rotation.x = THREE.MathUtils.lerp(knightMesh.rightArm.rotation.x, -Math.PI * 0.65, dt * 10);
                return;
            }

            if (player.state === 'SKILL_ART') {
                player.attackTimer -= dt;
                const progress = 1 - (player.attackTimer / player.attackDuration);
                const curve = easeOutCubic(progress);
                playerGroup.position.x += player.moveVel.x * dt;
                playerGroup.position.z += player.moveVel.z * dt;
                player.moveVel.multiplyScalar(Math.exp(-5 * dt));
                knightMesh.rightArm.rotation.x = -Math.PI * 1.05 * curve;
                knightMesh.swordGroup.rotation.z = -Math.PI * 1.6 * curve;
                knightMesh.body.rotation.x = -0.2 * Math.sin(curve * Math.PI);
                slashArc.rotation.set(Math.PI/2, 0, Math.PI * curve * 1.5);
                slashArcMat.opacity = Math.max(0, 1 - progress);
                if (!player.attackHitDone && progress > 0.45) {
                    player.attackHitDone = true;
                    // 地裂：範圍架勢傷害
                    const dist = player.pos.distanceTo(boss.pos);
                    if (dist < 12 * ((selectedWeapon && selectedWeapon.rangeMul) || 1)) {
                        const dmg = Math.round(220 * ((selectedWeapon && selectedWeapon.heavyMul) || 1));
                        boss.hp = Math.max(0, boss.hp - dmg);
                        boss.posture = Math.min(boss.maxPosture, boss.posture + 80);
                        createAOEShockwave(player.pos.clone(), 1.2, 0xff8800, 38);
                        createDamageNumber(dmg, boss.pos.clone().add(new THREE.Vector3(0, 3.5, 0)), 'CRIT');
                        triggerCameraShake(0.55); hitstopTimer = 0.1;
                        if (boss.posture >= boss.maxPosture && boss.state !== 'STAGGERED') {
                            boss.state = 'STAGGERED'; boss.timer = 5.8; critMarker.visible = true;
                        }
                    }
                }
                if (player.attackTimer <= 0) {
                    player.state = 'RECOVERY';
                    player.recoveryFrom = 'SKILL';
                    player.recoveryTimer = 0.4;
                    slashArcMat.opacity = 0;
                }
                return;
            }

            // 大劍蓄力中
            if (player.state === 'CHARGE') {
                if (!player.charging && !(keys['MouseRight'])) {
                    // 若意外沒有 mouseup
                }
                // 仍按住則累積
                const stillHeld = player.charging;
                if (stillHeld) {
                    player.chargeLevel = Math.min(player.chargeMax, player.chargeLevel + dt);
                    player.stamina = Math.max(0, player.stamina - 8 * dt);
                    const t = player.chargeLevel / player.chargeMax;
                    knightMesh.rightArm.rotation.x = -Math.PI * 0.35 - Math.PI * 0.55 * t;
                    knightMesh.swordGroup.rotation.z = -Math.PI * 0.15 * t;
                    knightMesh.body.rotation.x = -0.15 * t;
                    playerGroup.position.y = 0.15 * t;
                    slashArcMat.opacity = 0.25 + t * 0.5;
                    slashArc.rotation.set(Math.PI/2, 0, t * 0.5);
                    // 滿蓄特效
                    if (t >= 0.95 && Math.random() < 0.2) {
                        createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 2.2, 0)), 3, 0xff4400, new THREE.Vector3(0, 1, 0), 6);
                    }
                    if (player.stamina <= 0) releaseGreatswordCharge();
                }
                return;
            }

            if (player.state === 'SCOOP') {
                player.attackTimer -= dt;
                const progress = 1 - (player.attackTimer / player.attackDuration);
                const curve = easeOutCubic(progress);
                // 上撈：由下往上
                knightMesh.rightArm.rotation.x = Math.PI * 0.35 - Math.PI * 1.4 * curve;
                knightMesh.swordGroup.rotation.z = Math.PI * 0.3 - Math.PI * 1.6 * curve;
                knightMesh.body.rotation.x = 0.15 - 0.35 * curve;
                playerGroup.position.x += player.moveVel.x * dt * 0.6;
                playerGroup.position.z += player.moveVel.z * dt * 0.6;
                player.moveVel.multiplyScalar(Math.exp(-4 * dt));
                slashArc.rotation.set(-0.4 + curve, Math.PI/2, Math.PI * curve);
                slashArcMat.opacity = Math.max(0, 1 - progress);
                if (!player.attackHitDone && progress > 0.38) {
                    player.attackHitDone = true;
                    const dist = player.pos.distanceTo(boss.pos);
                    if (dist < 11) {
                        applyBossDamage(320, 110, 'CRIT', boss.pos.clone().add(new THREE.Vector3(0, 3.2, 0)));
                        stunBossBrief(2.0);
                        createAOEShockwave(player.pos.clone(), 1.1, 0xffcc55, 34);
                        spawnWeaponSlashVFX(0xffcc66, 2);
                    }
                }
                if (player.attackTimer <= 0) {
                    player.state = 'RECOVERY';
                    player.recoveryFrom = 'HEAVY';
                    player.recoveryTimer = 0.45;
                    slashArcMat.opacity = 0;
                }
                return;
            }

            if (player.state === 'FLASH_DASH') {
                player.attackTimer -= dt;
                playerGroup.position.x += player.moveVel.x * dt;
                playerGroup.position.z += player.moveVel.z * dt;
                player.moveVel.multiplyScalar(Math.exp(-3 * dt));
                knightMesh.body.rotation.x = -0.3;
                if (!player.attackHitDone) {
                    player.attackHitDone = true;
                    const dist = player.pos.distanceTo(boss.pos);
                    if (dist < 5.5) {
                        applyBossDamage(155, 28, 'SKILL', boss.pos.clone().add(new THREE.Vector3(0, 3, 0)));
                    }
                }
                if (player.attackTimer <= 0) {
                    player.state = 'RECOVERY'; player.recoveryTimer = 0.2; player.recoveryFrom = 'SKILL';
                    player.iframe = false; knightMesh.body.rotation.x = 0;
                }
                return;
            }

            if (player.state === 'COUNTER') {
                player.attackTimer -= dt;
                const progress = 1 - (player.attackTimer / player.attackDuration);
                const curve = easeOutCubic(progress);
                const isIai = player.counterType === 'iai';
                // 拔刀居合弧
                knightMesh.rightArm.rotation.x = -Math.PI * (isIai ? 1.2 : 1.0) * curve;
                knightMesh.swordGroup.rotation.z = -Math.PI * (isIai ? 2.0 : 1.6) * curve;
                knightMesh.body.rotation.y = (isIai ? 0.55 : 0.4) * Math.sin(curve * Math.PI);
                slashArc.rotation.set(Math.PI/2, 0.15, Math.PI * curve * 1.8);
                slashArc2.rotation.set(Math.PI/2, -0.1, Math.PI * curve * 1.5);
                slashArcMat.opacity = Math.max(0, 1 - progress * 0.9);
                slashArc2Mat.opacity = Math.max(0, 0.8 - progress);
                if (!player.attackHitDone && progress > 0.28) {
                    player.attackHitDone = true;
                    const dist = player.pos.distanceTo(boss.pos);
                    if (dist < 14) {
                        const dmg = isIai ? 420 : 360;
                        const post = isIai ? 95 : 80;
                        applyBossDamage(dmg, post, 'CRIT', boss.pos.clone().add(new THREE.Vector3(0, 3.5, 0)));
                        spawnWeaponSlashVFX(isIai ? 0xffdd66 : 0x88ccff, 2.5);
                        createAOEShockwave(boss.pos.clone(), 0.9, isIai ? 0xffcc44 : 0x88aaff, 36);
                    }
                    if (isIai) {
                        // 更長距離後跳（居合後撤幅度加大）
                        const back = new THREE.Vector3(-Math.sin(playerGroup.rotation.y), 0, -Math.cos(playerGroup.rotation.y));
                        player.moveVel.copy(back.multiplyScalar(48));
                        player.vertVel = 9.5;
                        createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1, 0)), 40, 0xffe0a0, back, 26);
                    }
                }
                // 居合後跳位移（更長更久）
                if (isIai && progress > 0.32) {
                    playerGroup.position.x += player.moveVel.x * dt;
                    playerGroup.position.z += player.moveVel.z * dt;
                    playerGroup.position.y = Math.max(0, playerGroup.position.y + player.vertVel * dt);
                    player.vertVel -= 22 * dt;
                    player.moveVel.multiplyScalar(Math.exp(-2.4 * dt));
                    if (playerGroup.position.y <= 0) { playerGroup.position.y = 0; player.vertVel = 0; }
                }
                if (player.attackTimer <= 0) {
                    player.state = 'RECOVERY'; player.recoveryTimer = 0.28; player.recoveryFrom = 'SKILL';
                    clearPlayerIframe();
                    player.counterType = null;
                    playerGroup.position.y = 0;
                    slashArcMat.opacity = 0; slashArc2Mat.opacity = 0;
                }
                return;
            }

            if (player.state.startsWith('SKILL')) {
                player.attackTimer -= dt;
                const progress = 1 - (player.attackTimer / player.attackDuration);
                const curve = easeOutCubic(progress);
                const style = (selectedWeapon && selectedWeapon.skillStyle) || 'knight';
                
                if (player.state === 'SKILL_Q') {
                    if (style === 'insect') {
                        // 引導獵蟲：側身、棍上舉
                        if (knightMesh.body) knightMesh.body.rotation.y = 0.2 * Math.sin(progress * Math.PI);
                        if (knightMesh.weaponRoot) knightMesh.weaponRoot.rotation.x = -0.5 - 0.25 * Math.sin(progress * Math.PI);
                        if (knightMesh.leftArm) knightMesh.leftArm.rotation.set(0.55, -0.25, 0.35);
                        if (knightMesh.rightArm) knightMesh.rightArm.rotation.set(0.45, 0.35, -0.25);
                    } else if (style === 'bow') {
                        const thresholds = [0.12, 0.38, 0.64];
                        player._bowVolley = player._bowVolley || 0;
                        while (player._bowVolley < thresholds.length && progress >= thresholds[player._bowVolley]) {
                            spawnPlayerArrow({ damage: 170, posture: 24, speed: 52, aim: 0.72 });
                            player._bowVolley++;
                        }
                        // 連續拉弓姿
                        const pulse = Math.sin(progress * Math.PI * 3);
                        knightMesh.leftArm.rotation.x = -1.1;
                        knightMesh.leftArm.rotation.y = 0.3;
                        knightMesh.rightArm.rotation.y = -0.7 - pulse * 0.35;
                        knightMesh.rightArm.rotation.z = 0.5;
                        knightMesh.swordGroup.rotation.y = 0.8;
                        knightMesh.swordGroup.rotation.z = -0.85;
                        knightMesh.body.rotation.y = 0.4;
                    } else if (style === 'greatsword') {
                        // Q 突刺
                        playerGroup.position.x += player.moveVel.x * dt;
                        playerGroup.position.z += player.moveVel.z * dt;
                        player.moveVel.multiplyScalar(Math.exp(-4.5 * dt));
                        const thrust = progress < 0.35 ? progress / 0.35 : Math.max(0, 1 - (progress - 0.35) / 0.65);
                        knightMesh.rightArm.rotation.x = -Math.PI * 0.35 - Math.PI * 0.55 * thrust;
                        knightMesh.swordGroup.rotation.x = -Math.PI * 0.9 * thrust;
                        knightMesh.swordGroup.rotation.z = 0;
                        knightMesh.body.rotation.x = 0.15 * thrust;
                        if (knightMesh.legR) {
                            knightMesh.legR.rotation.x = 0.5 * thrust;
                            knightMesh.legL.rotation.x = -0.25 * thrust;
                        }
                        slashArcMat.opacity = 0.45 * thrust;
                        if (!player.attackHitDone && progress > 0.32) {
                            player.attackHitDone = true;
                            const dist = player.pos.distanceTo(boss.pos);
                            if (dist < 11) {
                                applyBossDamage(380, 85, 'SKILL', boss.pos.clone().add(new THREE.Vector3(0, 3.2, 0)));
                                createDirectionalSparks(boss.pos.clone().add(new THREE.Vector3(0, 3, 0)), 40, 0xffaa44, null, 16);
                                triggerCameraShake(0.35);
                            }
                        }
                    } else if (style === 'dagger') {
                        playerGroup.position.x += player.moveVel.x * dt;
                        playerGroup.position.z += player.moveVel.z * dt;
