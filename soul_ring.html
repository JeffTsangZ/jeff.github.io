                        player.moveVel.multiplyScalar(Math.exp(-6 * dt));
                        knightMesh.rightArm.rotation.x = -Math.PI * 0.9 * curve;
                        knightMesh.swordGroup.rotation.z = -Math.PI * 1.4 * curve;
                        if (!player.attackHitDone && progress > 0.35) {
                            player.attackHitDone = true;
                            clearPlayerIframe();
                            const dist = player.pos.distanceTo(boss.pos);
                            if (dist < 6.5) {
                                applyBossDamage(95, 40, 'SKILL', boss.pos.clone().add(new THREE.Vector3(0, 3.2, 0)));
                                bossStatus.bleedTime = 5.0;
                                bossStatus.bleedDps = 42;
                                createDamageNumber('流血!', boss.pos.clone().add(new THREE.Vector3(0, 4.5, 0)), 'SKILL');
                            }
                        }
                    } else {
                        knightMesh.rightArm.rotation.x = -Math.PI * 0.7 * curve;
                        knightMesh.rightArm.rotation.z = -Math.PI * 0.2 * curve;
                        knightMesh.swordGroup.rotation.z = -Math.PI * 1.1 * curve;
                        knightMesh.body.rotation.y = 0.2 * Math.sin(curve * Math.PI);
                        slashArc.rotation.set(Math.PI/2, Math.PI/5, Math.PI * curve * 1.2);
                        slashArc2.rotation.set(Math.PI/2, Math.PI/7, Math.PI * curve);
                        if (!player.attackHitDone && progress > 0.42) {
                            player.attackHitDone = true;
                            fireSwordWave();
                        }
                    }
                } else if (player.state === 'SKILL_E') {
                    if (style === 'bow') {
                        playerGroup.position.x += player.moveVel.x * dt;
                        playerGroup.position.z += player.moveVel.z * dt;
                        player.moveVel.multiplyScalar(Math.exp(-2.8 * dt));
                        player.vertVel -= 32 * dt;
                        playerGroup.position.y += player.vertVel * dt;
                        if (playerGroup.position.y < 0) {
                            playerGroup.position.y = 0;
                            player.vertVel = 0;
                            player.grounded = true;
                        }
                        const flip = progress * Math.PI * 2;
                        if (knightMesh.group) knightMesh.group.rotation.x = -flip;
                        knightMesh.body.rotation.x = 0;
                        const draw = Math.min(1, progress / 0.45);
                        knightMesh.leftArm.rotation.x = -1.15 * draw;
                        knightMesh.leftArm.rotation.y = 0.3 * draw;
                        knightMesh.rightArm.rotation.y = -0.95 * draw;
                        knightMesh.rightArm.rotation.z = 0.6 * draw;
                        knightMesh.swordGroup.rotation.y = 0.9 * draw;
                        knightMesh.swordGroup.rotation.z = -0.85;
                        if (knightMesh.legL) {
                            knightMesh.legL.rotation.x = -0.9 * Math.sin(progress * Math.PI);
                            knightMesh.legR.rotation.x = 0.7 * Math.sin(progress * Math.PI);
                        }
                        if (!player._bowBackshot && progress > 0.38) {
                            player._bowBackshot = true;
                            spawnPlayerArrow({ damage: 310, posture: 48, speed: 58, aim: 0.92 });
                            createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, playerGroup.position.y + 1.2, 0)), 36, 0xffaa44, null, 16);
                        }
                        if (progress > 0.85 && player._bowFlipBoostPending) {
                            player._bowFlipBoostPending = false;
                            player.speedBoostTimer = 5.0;
                            playerGroup.position.y = 0;
                            if (knightMesh.group) knightMesh.group.rotation.x = 0;
                            createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 0.5, 0)), 30, 0x88ffcc, new THREE.Vector3(0, 1, 0), 12);
                            createDamageNumber('加速!', player.pos.clone().add(new THREE.Vector3(0, 2.2, 0)), 'SKILL');
                        }
                        if (player.attackTimer <= 0.01) {
                            if (knightMesh.group) knightMesh.group.rotation.x = 0;
                            playerGroup.position.y = 0;
                            if (player._bowFlipBoostPending) {
                                player._bowFlipBoostPending = false;
                                player.speedBoostTimer = 5.0;
                            }
                        }
                    } else if (style === 'greatsword') {
                        if (progress < 0.4) {
                            playerGroup.position.y = Math.max(playerGroup.position.y, 0) + player.vertVel * dt;
                            player.vertVel -= 14 * dt;
                            if (player.vertVel < 0 && progress < 0.28) player.vertVel = Math.max(player.vertVel, -2);
                            playerGroup.position.x += player.moveVel.x * dt * 0.5;
                            playerGroup.position.z += player.moveVel.z * dt * 0.5;
                            const up = progress / 0.4;
                            knightMesh.rightArm.rotation.x = -Math.PI * 1.35 * up;
                            knightMesh.swordGroup.rotation.z = -Math.PI * 0.4 * up;
                            knightMesh.body.rotation.x = -0.35 * up;
                            if (knightMesh.legL) {
                                knightMesh.legL.rotation.x = -0.5 * up;
                                knightMesh.legR.rotation.x = 0.4 * up;
                            }
                            if (Math.random() < 0.35) createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, playerGroup.position.y + 1, 0)), 4, 0xffcc66, new THREE.Vector3(0, 1, 0), 8);
                        } else {
                            const dive = (progress - 0.4) / 0.6;
                            player.vertVel = -40;
                            playerGroup.position.y = Math.max(0, playerGroup.position.y + player.vertVel * dt);
                            playerGroup.position.x += player.moveVel.x * dt * 0.9;
                            playerGroup.position.z += player.moveVel.z * dt * 0.9;
                            knightMesh.rightArm.rotation.x = -Math.PI * 1.35 + Math.PI * 2.0 * dive;
                            knightMesh.swordGroup.rotation.z = -Math.PI * 0.4 - Math.PI * 1.5 * dive;
                            knightMesh.body.rotation.x = -0.35 + 1.0 * dive;
                            slashArc.rotation.set(0.3, Math.PI/2, Math.PI * dive);
                            slashArcMat.opacity = 1 - dive * 0.3;
                            if (!player.attackHitDone && (dive > 0.45 || playerGroup.position.y <= 0.2)) {
                                player.attackHitDone = true;
                                playerGroup.position.y = 0;
                                player.grounded = true;
                                clearPlayerIframe();
                                const dist = player.pos.distanceTo(boss.pos);
                                if (dist < 14) applyBossDamage(480, 110, 'CRIT', boss.pos.clone().add(new THREE.Vector3(0, 3.5, 0)));
                                createAOEShockwave(player.pos.clone(), 2.4, 0xffaa22, 55);
                                createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1, 0)), 55, 0xffcc44, new THREE.Vector3(0, 1, 0), 20);
                                triggerCameraShake(0.85);
                                hitstopTimer = Math.max(hitstopTimer, 0.12);
                                targetFov = 58;
                            }
                        }
                    } else if (style === 'katana') {
                        // 登龍：只播跳躍+落地；落地後解鎖移動，多段由 denryuBurstT 處理
                        if (player.denryuHits == null) player.denryuHits = 0;
                        if (player.denryuBurstT == null) player.denryuBurstT = -1;
                        if (progress < 0.72) {
                            const up = progress / 0.72;
                            playerGroup.position.y = Math.max(0, playerGroup.position.y) + player.vertVel * dt;
                            player.vertVel -= 18 * dt;
                            if (player.vertVel < 0 && progress < 0.5) player.vertVel = Math.max(player.vertVel, -3);
                            if (knightMesh.weaponRoot) {
                                knightMesh.weaponRoot.rotation.x = -0.3 - 1.15 * up;
                                knightMesh.weaponRoot.rotation.z = 0.35 * Math.sin(up * Math.PI);
                            }
                            knightMesh.body.rotation.x = -0.3 * up;
                            knightMesh.legL.rotation.x = -0.65 * up;
                            knightMesh.legR.rotation.x = 0.4 * up;
                            playerGroup.position.x += player.moveVel.x * dt * 0.4;
                            playerGroup.position.z += player.moveVel.z * dt * 0.4;
                            player.moveVel.multiplyScalar(Math.exp(-1.5 * dt));
                            if (Math.random() < 0.3) {
                                createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, playerGroup.position.y + 1.5, 0)), 4, 0xffcc66, new THREE.Vector3(0, 1, 0), 7);
                            }
                        } else {
                            player.vertVel = -42;
                            playerGroup.position.y += player.vertVel * dt;
                            if (playerGroup.position.y <= 0 || progress > 0.92) {
                                playerGroup.position.y = 0;
                                player.vertVel = 0;
                                player.grounded = true;
                                player.moveVel.set(0, 0, 0);
                                if (player.denryuBurstT < 0) {
                                    player.denryuBurstT = 0;
                                    player.denryuHits = 0;
                                    createAOEShockwave(player.pos.clone(), 0.9, 0xffcc44, 28);
                                    triggerCameraShake(0.35);
                                    createDamageNumber('龍氣蓄勢', player.pos.clone().add(new THREE.Vector3(0, 2.4, 0)), 'SKILL');
                                }
                                player.attackTimer = 0;
                            }
                            if (knightMesh.weaponRoot) knightMesh.weaponRoot.rotation.x = -0.4;
                            knightMesh.body.rotation.x = 0;
                            knightMesh.legL.rotation.x = 0;
                            knightMesh.legR.rotation.x = 0;
                        }

                    } else if (style === 'insect') {
                        // E：起跳 / 滯空 / 下突多段
                        if (player.igDiveHits == null) player.igDiveHits = 0;
                        const dir = player._igDiveDir || new THREE.Vector3(0, 0, 1);
                        if (progress < 0.32) {
                            const up = progress / 0.32;
                            playerGroup.position.y = Math.max(0, playerGroup.position.y) + (player.vertVel || 0) * dt;
                            player.vertVel = (player.vertVel || 0) - 18 * dt;
                            if (player.vertVel < 0 && progress < 0.2) player.vertVel = Math.max(player.vertVel, -2);
                            playerGroup.position.x += dir.x * 5 * dt;
                            playerGroup.position.z += dir.z * 5 * dt;
                            if (knightMesh.weaponRoot) knightMesh.weaponRoot.rotation.set(-1.3 * up, 0.15, 0);
                            if (knightMesh.body) knightMesh.body.rotation.x = -0.35 * up;
                        } else if (progress < 0.52) {
                            player.vertVel = (player.vertVel || 0) * Math.exp(-2 * dt);
                            playerGroup.position.y = Math.max(playerGroup.position.y + (player.vertVel || 0) * dt, 1.1);
                            if (knightMesh.weaponRoot) knightMesh.weaponRoot.rotation.set(-1.45, 0, 0);
                            const toB = boss.pos.clone().sub(player.pos); toB.y = 0;
                            if (toB.lengthSq() > 0.01) {
                                playerGroup.rotation.y = Math.atan2(toB.x, toB.z);
                                player._igDiveDir = toB.normalize();
                            }
                        } else {
                            player.vertVel = -42;
                            playerGroup.position.y += player.vertVel * dt;
                            playerGroup.position.x += dir.x * 7 * dt;
                            playerGroup.position.z += dir.z * 7 * dt;
                            if (playerGroup.position.y <= 0) {
                                playerGroup.position.y = 0;
                                player.grounded = true;
                                player.vertVel = 0;
                            }
                            if (knightMesh.weaponRoot) knightMesh.weaponRoot.rotation.set(1.55, 0, 0.08);
                            if (knightMesh.body) knightMesh.body.rotation.x = 0.45;
                            const bonus = player._igEBonus || 1;
                            const marks = [0.55, 0.7, 0.85];
                            const dmgs = [Math.round(115 * bonus), Math.round(135 * bonus), Math.round(175 * bonus)];
                            for (let hi = 0; hi < marks.length; hi++) {
                                if (player.igDiveHits <= hi && progress >= marks[hi]) {
                                    player.igDiveHits = hi + 1;
                                    if (player.pos.distanceTo(boss.pos) < 12) {
                                        applyBossDamage(dmgs[hi], Math.round(30 * bonus), hi === 2 ? 'CRIT' : 'SKILL',
                                            boss.pos.clone().add(new THREE.Vector3(0, 3 + hi * 0.3, 0)));
                                    }
                                    createAOEShockwave(player.pos.clone(), 1.0 + hi * 0.3, 0x88ff66, 26);
                                    triggerCameraShake(0.22 + hi * 0.12);
                                }
                            }
                        }

            } else if (style === 'dagger') {
                        knightMesh.rightArm.rotation.y = Math.sin(progress * Math.PI * 4) * 0.5;
                        // 手裏劍已在施放時生成
                    } else {
                        if (progress > 0.28 && progress < 0.58) playerGroup.position.addScaledVector(player.velocity, dt * 2.1);
                        knightMesh.rightArm.rotation.x = -Math.PI * 0.55 * curve;
                        knightMesh.swordGroup.rotation.x = -Math.PI * 0.3 * curve;
                        knightMesh.body.rotation.x = -0.15 * Math.sin(curve * Math.PI);
                        slashArc.rotation.set(0, Math.PI/2, Math.PI * curve);
                        slashArc2.rotation.set(0.1, Math.PI/2, Math.PI * curve * 0.9);
                        if (!player.attackHitDone && progress > 0.36) checkPlayerHitbox();
                    }
                }

                if (style !== 'katana' || player.state !== 'SKILL_E') {
                    slashArcMat.opacity = Math.max(0, Math.min(slashArcMat.opacity, 1.0 - Math.pow(progress, 1.4)));
                    slashArc2Mat.opacity = Math.max(0, 0.7 - Math.pow(progress, 1.5));
                }

                if (player.attackTimer <= 0) {
                    const isDenryu = player.denryuBurstT != null && player.denryuBurstT >= 0;
                    player.state = isDenryu ? 'IDLE' : 'RECOVERY';
                    player.recoveryFrom = 'SKILL';
                    player.recoveryTimer = isDenryu ? 0 : 0.38;
                    clearPlayerIframe();
                    playerGroup.position.y = 0;
                    slashArcMat.opacity = 0; slashArc2Mat.opacity = 0;
                    targetFov = 58;
                }
                return;
            }

            if (player.state === 'IG_AIR') {
                player.igAirTime = (player.igAirTime || 0) + dt;
                player._igVaultPhase = (player._igVaultPhase || 0) + dt;
                // 空中漂移（弧線手感）
                const move = getMovementVector();
                if (move.lengthSq() > 0.01 && !player._igDiving) {
                    player.moveVel.x += move.x * 28 * dt;
                    player.moveVel.z += move.z * 28 * dt;
                    if (!player.lockOn) {
                        playerGroup.rotation.y = Math.atan2(move.x, move.z);
                    }
                }
                // 拋物線重力：跳不高、頂點長滯空
                let grav;
                if (player._igDiving) {
                    grav = 55;
                    player.vertVel = Math.min(player.vertVel, -10);
                } else if ((player.vertVel || 0) > 3) {
                    grav = 14; // 上升段（較快到達低高度）
                } else if ((player.vertVel || 0) > -1.5) {
                    grav = 3.5; // 長滯空
                } else {
                    grav = 16; // 緩降
                }
                player.vertVel = (player.vertVel || 0) - grav * dt;
                playerGroup.position.x += player.moveVel.x * dt;
                playerGroup.position.z += player.moveVel.z * dt;
                playerGroup.position.y += player.vertVel * dt;
                // 高度上限，避免跳出畫面
                if (playerGroup.position.y > 6.5) {
                    playerGroup.position.y = 6.5;
                    if (player.vertVel > 0) player.vertVel = 0;
                }
                const airDrag = player._igDiving ? 1.2 : 1.8;
                player.moveVel.x *= Math.exp(-airDrag * dt);
                player.moveVel.z *= Math.exp(-airDrag * dt);

                // 飛舞旋轉姿勢
                const spinDir = player._igSpin || 1;
                if (knightMesh.group) {
                    if (player._igDiving) {
                        knightMesh.group.rotation.x = 0.85;
                        knightMesh.group.rotation.z = 0;
                    } else if (player.attackTimer > 0) {
                        const ap = 1 - (player.attackTimer / Math.max(0.01, player.attackDuration || 0.4));
                        knightMesh.group.rotation.y += spinDir * 14 * dt;
                        knightMesh.group.rotation.x = -0.25 + Math.sin(ap * Math.PI) * 0.35;
                        knightMesh.group.rotation.z = Math.sin(ap * Math.PI * 2) * 0.25 * spinDir;
                    } else {
                        // 空中漂浮微旋
                        knightMesh.group.rotation.y += 1.2 * dt * spinDir;
                        knightMesh.group.rotation.x = -0.2 + Math.sin(player.igAirTime * 5) * 0.08;
                        knightMesh.group.rotation.z = Math.sin(player.igAirTime * 3) * 0.1;
                    }
                }
                if (knightMesh.weaponRoot) {
                    if (player._igDiving) {
                        knightMesh.weaponRoot.rotation.set(1.65, 0, 0.15);
                        if (knightMesh.body) knightMesh.body.rotation.x = 0.55;
                    } else if (player.attackTimer > 0) {
                        const ap = 1 - (player.attackTimer / Math.max(0.01, player.attackDuration || 0.4));
                        const swing = Math.sin(ap * Math.PI);
                        knightMesh.weaponRoot.rotation.set(-0.8 + swing * 2.4, spinDir * swing * 0.8, -0.3 + swing * 1.2 * spinDir);
                        if (knightMesh.body) knightMesh.body.rotation.y = spinDir * swing * 0.6;
                    } else {
                        knightMesh.weaponRoot.rotation.set(-1.0 + Math.sin(player.igAirTime * 6) * 0.2, 0.2, 0);
                        if (knightMesh.body) knightMesh.body.rotation.x = -0.2;
                    }
                }

                // 空中迴旋斬判定
                if (player.attackTimer > 0 && !player._igDiving) {
                    player.attackTimer -= dt;
                    const ap = 1 - (player.attackTimer / Math.max(0.01, player.attackDuration || 0.4));
                    if (!player.attackHitDone && ap >= 0.28 && ap <= 0.78) {
                        player.attackHitDone = true;
                        const dmgMul = (typeof igDmgMul === 'function') ? igDmgMul() : 1;
                        const dmg = Math.round((62 + (player.igAirCombo || 1) * 32) * dmgMul * ((selectedWeapon && selectedWeapon.dmgMul) || 1));
                        if (player.pos.distanceTo(boss.pos) < 12) {
                            applyBossDamage(dmg, Math.round(20 * dmgMul), 'SKILL', boss.pos.clone().add(new THREE.Vector3(0, 3.5, 0)));
                            createDirectionalSparks(boss.pos.clone().add(new THREE.Vector3(0, 3.2, 0)), 28, 0x88ffcc, null, 14);
                            if (typeof createImpactFlash === 'function') createImpactFlash(boss.pos.clone().add(new THREE.Vector3(0, 3, 0)), 0x88ffaa, 1.6);
                        }
                    }
                    if (slashArc) {
                        const fade = ap < 0.15 ? ap / 0.15 : (ap > 0.75 ? Math.max(0, 1 - (ap - 0.75) / 0.25) : 1);
                        slashArcMat.opacity = fade * 1.0;
                        if (slashArc2Mat) slashArc2Mat.opacity = fade * 0.75;
                        slashArc.rotation.z = spinDir * (-0.8 + ap * 3.5);
                        slashArc.rotation.y = spinDir * ap * 1.2;
                        slashArc.position.set(0, 1.6, 0.6);
                    }
                    // 斬擊軌跡粒子
                    if (ap > 0.3 && ap < 0.7 && Math.random() < 0.4) {
                        createDirectionalSparks(player.pos.clone().add(new THREE.Vector3((Math.random()-0.5)*2, 1.5+Math.random(), (Math.random()-0.5)*2)), 6, 0xaaffcc, null, 8);
                    }
                    if (player.attackTimer <= 0) {
                        player.attackHitDone = false;
                        if (slashArcMat) slashArcMat.opacity = 0;
                    }
                }

                // 華麗下突
                if (player._igDiving) {
                    player.attackTimer -= dt;
                    const ap = 1 - (player.attackTimer / Math.max(0.01, player.attackDuration || 1.05));
                    const diveBonus = player._igEBonus || 1.25;
                    // 俯衝加速
                    if (player._igDiveDir) {
                        player.moveVel.x += player._igDiveDir.x * 20 * dt;
                        player.moveVel.z += player._igDiveDir.z * 20 * dt;
                    }
                    // 下突拖尾
                    if (Math.random() < 0.55) {
                        createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1, 0)), 8, 0xffee66, new THREE.Vector3(0, 1, 0), 10);
                    }
                    if (slashArcMat) {
                        slashArcMat.opacity = 0.9;
                        slashArc.rotation.set(Math.PI / 2, 0, ap * 6);
                    }
                    const marks = [0.15, 0.35, 0.55, 0.75];
                    const dmgs = [
                        Math.round(140 * diveBonus),
                        Math.round(170 * diveBonus),
                        Math.round(200 * diveBonus),
                        Math.round(280 * diveBonus)
                    ];
                    if (player.igDiveHits == null) player.igDiveHits = 0;
                    for (let hi = 0; hi < marks.length; hi++) {
                        if (player.igDiveHits <= hi && ap >= marks[hi] && playerGroup.position.y < 5.5) {
                            player.igDiveHits = hi + 1;
                            if (player.pos.distanceTo(boss.pos) < 13) {
                                applyBossDamage(dmgs[hi], Math.round(8 * diveBonus), hi >= 3 ? 'CRIT' : 'SKILL',
                                    boss.pos.clone().add(new THREE.Vector3(0, 2.5 + hi * 0.35, 0)));
                            }
                            if (typeof createAOEShockwave === 'function') createAOEShockwave(player.pos.clone(), 1.2 + hi * 0.4, hi >= 3 ? 0xffee44 : 0x88ff66, 28);
                            if (typeof createImpactFlash === 'function') createImpactFlash(player.pos.clone().add(new THREE.Vector3(0, 1.5, 0)), hi >= 3 ? 0xffee44 : 0xaaff66, 2 + hi * 0.4);
                            triggerCameraShake(0.28 + hi * 0.14);
                        }
                    }
                }

                // 落地
                if (playerGroup.position.y <= 0) {
                    playerGroup.position.y = 0;
                    player.vertVel = 0;
                    player.grounded = true;
                    if (player._igDiving) {
                        // 落地大爆炸
                        if (typeof createAOEShockwave === 'function') {
                            createAOEShockwave(player.pos.clone(), 2.8, 0xffee66, 40);
                            createAOEShockwave(player.pos.clone(), 1.6, 0x88ff44, 28);
                        }
                        createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 0.5, 0)), 60, 0xffee88, new THREE.Vector3(0, 1, 0), 22);
                        if (typeof createImpactFlash === 'function') createImpactFlash(player.pos.clone().add(new THREE.Vector3(0, 1, 0)), 0xffee66, 4.0);
                        triggerCameraShake(0.65);
                        const landBonus = player._igEBonus || 1.25;
                        if (player.pos.distanceTo(boss.pos) < 14) {
                            applyBossDamage(Math.round(220 * landBonus), Math.round(12 * landBonus), 'CRIT',
                                boss.pos.clone().add(new THREE.Vector3(0, 2.5, 0)));
                        }
                        createDamageNumber('蟲能爆發!', player.pos.clone().add(new THREE.Vector3(0, 3, 0)), 'CRIT');
                    }
                    player._igDiving = false;
                    player.state = 'RECOVERY';
                    player.recoveryFrom = 'LIGHT';
                    player.recoveryTimer = 0.18;
                    player.igAirCombo = 0;
                    player.attackTimer = 0;
                    player._igSpin = 0;
                    if (knightMesh.group) knightMesh.group.rotation.set(0, 0, 0);
                    if (knightMesh.body) knightMesh.body.rotation.set(0, 0, 0);
                    if (slashArcMat) slashArcMat.opacity = 0;
                    if (slashArc2Mat) slashArc2Mat.opacity = 0;
                    clearPlayerIframe();
                }
                // 超時強制下墜
                if (player.igAirTime > 5.5 && !player._igDiving) {
                    player.vertVel = -35;
                    player._igDiving = true;
                    player.attackTimer = 0.6;
                    player.attackDuration = 0.6;
                    player.igDiveHits = 0;
                    player._igEBonus = 1.1;
                }
                player.pos.copy(playerGroup.position);
                return;
            }

            if (player.state === 'IG_WHIRL') {
                player.attackTimer -= dt;
                const progress = 1 - (player.attackTimer / Math.max(0.01, player.attackDuration || 0.52));
                // 向前推進同時旋轉
                const fwd = new THREE.Vector3(Math.sin(playerGroup.rotation.y), 0, Math.cos(playerGroup.rotation.y));
                playerGroup.position.x += player.moveVel.x * dt;
                playerGroup.position.z += player.moveVel.z * dt;
                player.moveVel.multiplyScalar(Math.exp(-1.5 * dt));
                playerGroup.position.y = 0;
                if (knightMesh.group) {
                    knightMesh.group.rotation.y += 42 * dt;
                    knightMesh.group.rotation.x = Math.sin(progress * Math.PI * 8) * 0.2;
                }
                if (knightMesh.weaponRoot) {
                    knightMesh.weaponRoot.rotation.set(-0.3 + Math.sin(progress * Math.PI * 12) * 1.8, progress * 16, 0.25);
                }
                if (slashArc) {
                    slashArcMat.opacity = 0.95;
                    slashArc.rotation.z = progress * 28;
                    slashArc.position.set(0, 1.4, 0.5);
                }
                if (slashArc2) {
                    slashArc2Mat.opacity = 0.7;
                    slashArc2.rotation.z = -progress * 24;
                }
                // 多段命中（5 段・極快）
                const marks = [0.08, 0.22, 0.38, 0.55, 0.75];
                const bonus = (typeof igDmgMul === 'function') ? igDmgMul() : 1;
                if (player.igWhirlHits == null) player.igWhirlHits = 0;
                for (let hi = 0; hi < marks.length; hi++) {
                    if (player.igWhirlHits <= hi && progress >= marks[hi]) {
                        player.igWhirlHits = hi + 1;
                        const dmg = Math.round((48 + hi * 22) * bonus * ((selectedWeapon && selectedWeapon.dmgMul) || 1));
                        if (player.pos.distanceTo(boss.pos) < 11) {
                            applyBossDamage(dmg, Math.round(14 * bonus), hi === 4 ? 'CRIT' : 'SKILL',
                                boss.pos.clone().add(new THREE.Vector3(0, 2.8 + hi * 0.2, 0)));
                        }
                        createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1.5, 0)), 18, 0x88ffaa, null, 10);
                        if (hi === 4 && typeof createAOEShockwave === 'function') {
                            createAOEShockwave(player.pos.clone(), 1.8, 0x88ff66, 26);
                            triggerCameraShake(0.35);
                        }
                    }
                }
                if (player.attackTimer <= 0) {
                    player.state = 'RECOVERY';
                    player.recoveryFrom = 'LIGHT';
                    player.recoveryTimer = 0.2;
                    if (knightMesh.group) knightMesh.group.rotation.set(0, 0, 0);
                    if (slashArcMat) slashArcMat.opacity = 0;
                    if (slashArc2Mat) slashArc2Mat.opacity = 0;
                    clearPlayerIframe();
                }
                player.pos.copy(playerGroup.position);
                return;
            }




            if (player.state === 'RECOVERY') {
                player.recoveryTimer -= dt;
                const blend = player.recoveryFrom === 'ROLL' ? 16 : 12;
                if (knightMesh.group) {
                    const k = 1 - Math.exp(-blend * dt);
                    knightMesh.group.rotation.x += (0 - knightMesh.group.rotation.x) * k;
                    knightMesh.group.position.y += (0 - knightMesh.group.position.y) * k;
                }
                if (knightMesh.bones) resetBonesTowardRest(knightMesh.bones, dt, blend);
                playerGroup.position.y += (0 - playerGroup.position.y) * (1 - Math.exp(-blend * dt));

                if (player.recoveryTimer <= 0) {
                    player.state = 'IDLE';
                    player.recoveryFrom = null;
                    clearPlayerIframe();
                }
                // Recovery: roll stand-up + light recovery allow early reposition (ER feel)
                if (player.recoveryFrom === 'ROLL' || player.recoveryFrom === 'LIGHT') {
                    const moveVecR = getMovementVector();
                    if (moveVecR.lengthSq() > 0) {
                        const spd = player.recoveryFrom === 'ROLL' ? 4.6 : 3.2;
                        playerGroup.position.addScaledVector(moveVecR, spd * dt);
                        if (!player.lockOn) {
                            const ang = Math.atan2(moveVecR.x, moveVecR.z);
                            playerGroup.rotation.y = THREE.MathUtils.lerp(playerGroup.rotation.y, ang, 1 - Math.exp(-7 * dt));
                        }
                    }
                }
                return;
            }

            if (player.state === 'ATTACK') {
                player.attackTimer -= dt;
                // 操蟲棍攻擊期間幾乎不位移
                if ((selectedWeapon && selectedWeapon.skillStyle) === 'insect') {
                    player.moveVel.x *= Math.exp(-10 * dt);
                    player.moveVel.z *= Math.exp(-10 * dt);
                }

                const progress = 1 - (player.attackTimer / player.attackDuration);

                // ===== 弓：專用拉弓／放箭模組（非近戰揮砍）=====
                if ((selectedWeapon && selectedWeapon.skillStyle) === 'bow') {
                    const isHeavy = player.attackType === 'HEAVY';
                    // 時間軸：拉弦(0~releaseAt) → 放箭瞬間 → 收弓
                    const releaseAt = isHeavy ? 0.58 : 0.48;
                    const draw = Math.min(1, progress / releaseAt);
                    const release = progress < releaseAt ? 0 : Math.min(1, (progress - releaseAt) / (1 - releaseAt));
                    const drawEase = draw * draw * (3 - 2 * draw); // smoothstep

                    // 面向 Boss
                    const toB = boss.pos.clone().sub(player.pos); toB.y = 0;
                    if (toB.lengthSq() > 0.01) {
                        const ang = Math.atan2(toB.x, toB.z);
                        playerGroup.rotation.y = THREE.MathUtils.lerp(playerGroup.rotation.y, ang, 1 - Math.exp(-10 * dt));
                    }

                    // 拉弓：左目標更遠（前伸），右目標移到臉側前方（+Z 仍 > 0）
                    if (knightMesh.body) {
                        knightMesh.body.rotation.set(0, 0.3 * drawEase * (1 - release * 0.5), 0);
                    }
                    if (knightMesh.group) { knightMesh.group.rotation.x = 0; knightMesh.group.rotation.z = 0; }
                    if (knightMesh.swordGroup) knightMesh.swordGroup.rotation.set(0, 0, 0);
                    if (knightMesh.weaponRoot) {
                        knightMesh.weaponRoot.position.set(-0.55 - 0.1 * drawEase, 1.55, 1.05 + 0.1 * drawEase);
                        knightMesh.weaponRoot.rotation.set(0.05, 0.45, 0.1);
                    }
                    // 左手：更遠的前方
                    orientArmToLocal(
                        knightMesh.leftArm, knightMesh.leftElbow, knightMesh.leftFore,
                        -0.55 - 0.1 * drawEase, 1.55, 1.15 + 0.15 * drawEase
                    );
                    // 右手：拉到臉旁但保持 z>0.25（面前），絕不背後
                    orientArmToLocal(
                        knightMesh.rightArm, knightMesh.rightElbow, knightMesh.rightFore,
                        0.25 + 0.15 * drawEase,
                        1.65 + 0.2 * drawEase,
                        0.55 - 0.2 * drawEase  // 最低仍約 0.35，在面前
                    );
                    // 拉弦：弦往自己方向（-Z）拉近
                    if (knightMesh.bowString) {
                        knightMesh.bowString.position.z = -0.15 - 0.35 * drawEase;
                        knightMesh.bowString.scale.set(1, 1 + 0.06 * drawEase, 1);
                    }
                    if (knightMesh.bowArrow) {
                        knightMesh.bowArrow.visible = true;
                        knightMesh.bowArrow.position.z = -0.05 - 0.25 * drawEase;
                        if (release > 0.15) knightMesh.bowArrow.visible = false;
                    }
                    if (knightMesh.bones) {
                        const b = knightMesh.bones;
                        if (b.thighL) b.thighL.rotation.x = 0.12 * drawEase - 0.15 * release;
                        if (b.thighR) b.thighR.rotation.x = 0.22 * drawEase + 0.08 * release;
                        if (b.kneeL) b.kneeL.rotation.x = 0.18 * drawEase;
                        if (b.kneeR) b.kneeR.rotation.x = 0.12 * drawEase;
                        if (b.head) b.head.rotation.y = 0.2 * drawEase * (1 - release);
                    }
                    playerGroup.position.y = -0.03 * drawEase - 0.05 * release;
                    // 拉弦中微抖
                    if (drawEase > 0.3 && release < 0.05 && Math.random() < 0.3) {
                        createDirectionalSparks(
                            player.pos.clone().add(new THREE.Vector3(Math.sin(playerGroup.rotation.y)*0.8, 1.6, Math.cos(playerGroup.rotation.y)*0.8)),
                            2, 0xffe0a0, null, 4
                        );
                    }
                    // 放箭
                    if (!player.attackHitDone && progress >= releaseAt) {
                        player.attackHitDone = true;
                        if (isHeavy) {
                            spawnPlayerArrow({ damage: 275, posture: 42, speed: 56, aim: 0.88 });
                            createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1.5, 0)), 35, 0xffaa44, null, 16);
                            triggerCameraShake(0.22);
                        } else {
                            spawnPlayerArrow({ damage: 115, posture: 18, speed: 50, aim: 0.7 });
                            createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1.5, 0)), 18, 0xffcc88, null, 12);
                        }
                        // 放弦回彈
                        knightMesh.rightArm.rotation.y = 0.1;
                        knightMesh.rightArm.rotation.z = 0.1;
                    }
                    // 收弓回正
                    if (release > 0.2) {
                        const k = 1 - Math.exp(-12 * dt);
                        knightMesh.rightArm.rotation.x += (0 - knightMesh.rightArm.rotation.x) * k;
                        knightMesh.rightArm.rotation.y += (0 - knightMesh.rightArm.rotation.y) * k;
                        knightMesh.rightArm.rotation.z += (0 - knightMesh.rightArm.rotation.z) * k;
                        knightMesh.leftArm.rotation.x += ((-0.25) - knightMesh.leftArm.rotation.x) * k;
                        knightMesh.body.rotation.y += (0 - knightMesh.body.rotation.y) * k;
                    }
                    slashArcMat.opacity = 0; slashArc2Mat.opacity = 0;

                    if (player.attackTimer <= 0) {
                        player.state = 'RECOVERY';
                        player.recoveryFrom = isHeavy ? 'HEAVY' : 'LIGHT';
                        // 弓後搖極短
                        player.recoveryTimer = isHeavy ? 0.18 : 0.1;
                        playerGroup.position.y = 0;
                        targetFov = 58;
                    }
                    return;
                }

                // Skeletal attack: multi-joint pose blend (shoulder→elbow→wrist→hips)
                const isHeavy = player.attackType === 'HEAVY';
                const swingT = progress < 0.22 ? 0 : Math.min(1, (progress - 0.22) / 0.36);
                const swingCurve = easeOutCubic(swingT);
                const visualOpacity = swingT > 0 ? Math.max(0, 1.0 - Math.pow(Math.max(0, progress - 0.35) / 0.65, 1.4)) : 0;

                // Locomotion during attack
                playerGroup.position.x += player.moveVel.x * dt;
                playerGroup.position.z += player.moveVel.z * dt;
                player.moveVel.multiplyScalar(Math.exp(-4.8 * dt));
                (function softArenaBound() {
                    const lim = PHYS.arenaLimit || 44;
                    const soft = PHYS.arenaSoft || 40;
                    const x = playerGroup.position.x, z = playerGroup.position.z;
                    const dist = Math.hypot(x, z);
                    if (dist > soft) {
                        const n = 1 / Math.max(dist, 0.001);
                        const nx = x * n, nz = z * n;
                        const t = Math.min(1, (dist - soft) / Math.max(0.001, lim - soft));
                        const push = t * t * 28 * dt;
                        playerGroup.position.x -= nx * push;
                        playerGroup.position.z -= nz * push;
                        if (player.moveVel) {
                            const outward = player.moveVel.x * nx + player.moveVel.z * nz;
                            if (outward > 0) {
                                player.moveVel.x -= nx * outward * (0.5 + t);
                                player.moveVel.z -= nz * outward * (0.5 + t);
                            }
                        }
                    }
                    if (dist > lim) {
                        const n = lim / dist;
                        playerGroup.position.x *= n;
                        playerGroup.position.z *= n;
                    }
                })();
                if (typeof resolveArenaColliders === 'function') resolveArenaColliders();
                if (player.lockOn && boss && boss.pos) {
                    const toB = Math.atan2(boss.pos.x - player.pos.x, boss.pos.z - player.pos.z);
                    const track = progress < 0.55 ? 5.5 : 2.2;
                    playerGroup.rotation.y = THREE.MathUtils.lerp(playerGroup.rotation.y, toB, 1 - Math.exp(-track * dt));
                }

                // Apply full-body bone pose
                if (knightMesh.bones) {
                    const pose = blendAttackPose(progress, player.comboStep || 1, isHeavy);
                    applyPose(knightMesh.bones, pose, 1);
                    // 斬擊特效跟隨武器揮動弧（不再固定大扇、和動作脫節）
                    {
                        const st = (selectedWeapon && selectedWeapon.skillStyle) || 'knight';
                        if (st !== 'bow' && knightMesh.weaponRoot) {
                            const wr = knightMesh.weaponRoot.rotation;
                            const swingT = Math.min(1, Math.max(0, (progress - 0.15) / 0.55));
                            const arcSpan = isHeavy ? 1.35 : (player.comboStep >= 3 ? 1.25 : 1.05);
                            slashArc.position.set(0, 1.55, 0.9);
                            slashArc.rotation.set(Math.PI / 2 + wr.x * 0.35, wr.y * 0.5, wr.z + (-0.4 + swingT * arcSpan * Math.PI));
                            slashArc2.position.set(0, 1.45, 0.85);
                            slashArc2.rotation.set(Math.PI / 2 + wr.x * 0.25, wr.y * 0.4, wr.z + (-0.35 + swingT * arcSpan * Math.PI * 0.9));
                            const fade = progress < 0.2 ? progress / 0.2 : (progress > 0.7 ? Math.max(0, 1 - (progress - 0.7) / 0.3) : 1);
                            slashArcMat.opacity = 0.85 * fade;
                            slashArc2Mat.opacity = 0.55 * fade;
                        }
                    }
                    // Weight transfer
                    {
                        const windEnd = isHeavy ? 0.42 : 0.28;
                        const hitEnd = isHeavy ? 0.72 : 0.62;
                        if (progress > windEnd && progress < hitEnd) {
                            const t = (progress - windEnd) / (hitEnd - windEnd);
                            playerGroup.position.y = -Math.sin(t * Math.PI) * (isHeavy ? 0.14 : 0.08);
                        } else {
                            playerGroup.position.y += (0 - playerGroup.position.y) * (1 - Math.exp(-10 * dt));
                        }
                    }
                    // slight vertical weight shift
                    const crouch = progress < 0.58 ? Math.sin(Math.min(1, progress / 0.58) * Math.PI) * 0.12 : 0.04 * (1 - progress);
                    playerGroup.position.y = crouch;
                    // step lunge on contact window
                    if (swingT > 0.1 && swingT < 0.85) {
                        const fwd = new THREE.Vector3(Math.sin(playerGroup.rotation.y), 0, Math.cos(playerGroup.rotation.y));
                        const step = isHeavy ? 9 : (player.comboStep === 3 ? 11 : 7);
                        playerGroup.position.addScaledVector(fwd, step * swingCurve * (1 - swingT) * dt * 3.2);
                    }
                } else {
                    // fallback if bones missing
                    knightMesh.rightArm.rotation.x = -Math.PI * 1.2 * swingCurve;
                    knightMesh.swordGroup.rotation.z = -Math.PI * 1.5 * swingCurve;
                }

                // Slash arc follows sword orientation
                const arcSwing = isHeavy ? swingCurve * 1.9 : swingCurve * (1.4 + (player.comboStep || 1) * 0.15);
                const side = (player.comboStep === 2 && !isHeavy) ? 1 : -1;
                slashArc.rotation.set(Math.PI / 2, side * 0.15 * swingCurve, side * Math.PI * arcSwing);
                slashArc2.rotation.set(Math.PI / 2, -side * 0.1, side * Math.PI * arcSwing * 0.85);
                slashArc.position.set(0, 1.5 + swingCurve * 0.3, 0.6);
                slashArc2.position.set(0, 1.35, 0.4);

                                slashArcMat.opacity = visualOpacity;
                slashArc2Mat.opacity = visualOpacity * 0.7;

                // ER-like: active frames open earlier so R1 feels responsive
                const hitGate = player.attackType === 'HEAVY' ? 0.42 : 0.30;
                if (!player.attackHitDone && progress > hitGate && progress < 0.78) {
                    if ((selectedWeapon && selectedWeapon.skillStyle) === 'bow') {
                        // 弓已在專用模組放箭，此處略過
                    } else {
                        checkPlayerHitbox();
                    }
                }

                if (player.attackTimer <= 0) {
                    player.state = 'RECOVERY';
                    player.recoveryFrom = player.attackType === 'HEAVY' ? 'HEAVY' : 'LIGHT';
                    const rMul = (selectedWeapon && selectedWeapon.recoveryMul) || 1;
                    // ER-like recoveries: light string stays fluid, finisher / heavy punish more
                    player.recoveryTimer = (player.attackType === 'HEAVY' ? 0.32 : (player.comboStep === 3 ? 0.28 : 0.18)) * rMul;
                    slashArcMat.opacity = 0; slashArc2Mat.opacity = 0;
                    playerGroup.position.y = 0;
                    targetFov = 60;
                    // Flush buffered input immediately when recovery starts
                    if (player.inputBuf.action) consumeInputBuffer();
                }
                return;
            }

            // —— 物理移動：加速度 + 摩擦（不再瞬間滑行）——
            const moveVec = getMovementVector();
            const boostMul = player.speedBoostTimer > 0 ? 1.55 : 1;
            const wMove = (selectedWeapon && selectedWeapon.moveMul) || 1;
            let maxSp = (player.isBlocking ? PHYS.maxSpeedBlock : PHYS.maxSpeed) * boostMul * wMove;
            if ((selectedWeapon && selectedWeapon.skillStyle) === 'insect' && typeof igSpeedMul === 'function') maxSp *= igSpeedMul();
            const accelMul = (player.speedBoostTimer > 0 ? 1.35 : 1) * (wMove > 1 ? 1.15 : 1);
            if (moveVec.lengthSq() > 0 && player.state !== 'ATTACK' && !player.state.startsWith('SKILL') && player.state !== 'DRINK') {
                player.moveVel.x += moveVec.x * PHYS.accel * accelMul * dt;
                player.moveVel.z += moveVec.z * PHYS.accel * accelMul * dt;
                if (!player.lockOn) {
                    const targetAngle = Math.atan2(moveVec.x, moveVec.z);
                    // 速度越快轉身略慢，更有重量感
                    const turnK = 1 - Math.exp(-(6.5 + walkIntensitySafe() * 2) * dt);
                    let dy = targetAngle - playerGroup.rotation.y;
                    while (dy > Math.PI) dy -= Math.PI * 2;
                    while (dy < -Math.PI) dy += Math.PI * 2;
                    playerGroup.rotation.y += dy * turnK;
                }
            } else {
                // 摩擦減速
                const fr = Math.exp(-PHYS.friction * dt);
                player.moveVel.x *= fr;
                player.moveVel.z *= fr;
            }
            // 限速
            const spd = Math.hypot(player.moveVel.x, player.moveVel.z);
            if (spd > maxSp) {
                player.moveVel.x *= maxSp / spd;
                player.moveVel.z *= maxSp / spd;
            }
            playerGroup.position.x += player.moveVel.x * dt;
            playerGroup.position.z += player.moveVel.z * dt;
            playerGroup.position.x = THREE.MathUtils.clamp(playerGroup.position.x, -PHYS.arenaLimit, PHYS.arenaLimit);
            playerGroup.position.z = THREE.MathUtils.clamp(playerGroup.position.z, -PHYS.arenaLimit, PHYS.arenaLimit);
            player.moveSpeed = Math.hypot(player.moveVel.x, player.moveVel.z);

            if (player.lockOn) {
                const lockAngle = Math.atan2(boss.pos.x - player.pos.x, boss.pos.z - player.pos.z);
                playerGroup.rotation.y = THREE.MathUtils.lerp(playerGroup.rotation.y, lockAngle, 1 - Math.exp(-12 * dt));
            }

            // —— 骨骼行走 / 待機 / 舉盾 ——
            const walkIntensity = THREE.MathUtils.clamp(player.moveSpeed / PHYS.maxSpeed, 0, 1);
            if (knightMesh.shield) {
                knightMesh.shield.visible = !!(player.isBlocking && selectedWeapon && selectedWeapon.hasShield);
            }
            if (player.isBlocking && knightMesh.bones) {
                applyPose(knightMesh.bones, ATK_POSES.block, 1 - Math.exp(-14 * dt));
            } else if (walkIntensity > 0.03 && knightMesh.bones &&
                (player.state === 'IDLE' || player.state === 'RECOVERY' || player.state === 'SHEATHE_BACK')) {
                player.walkPhase += dt * (8.5 + walkIntensity * 6.5);
                applyWalkBones(knightMesh.bones, player.walkPhase, walkIntensity, dt);
                const bob = Math.abs(Math.sin(player.walkPhase * 2)) * 0.06 * walkIntensity;
                playerGroup.position.y = bob;
            } else if (knightMesh.bones && player.state === 'IDLE') {
                player.walkPhase *= 0.88;
                resetBonesTowardRest(knightMesh.bones, dt, 11);
                playerGroup.position.y += (0 - playerGroup.position.y) * (1 - Math.exp(-10 * dt));
            } else {
                const kWalk = 1 - Math.exp(-12 * dt);
                knightMesh.legL.rotation.x += (0 - knightMesh.legL.rotation.x) * kWalk;
                knightMesh.legR.rotation.x += (0 - knightMesh.legR.rotation.x) * kWalk;
            }
            // Always track grips (except roll) so arms never stay behind the back
            if (player.state !== 'ROLL' && player.state !== 'DEAD') {
                updateTwoHandArms();
            }
        }

        function getMovementVector() {
            const moveDir = new THREE.Vector3();
            if (keys['KeyW']) moveDir.z -= 1; if (keys['KeyS']) moveDir.z += 1;
            if (keys['KeyA']) moveDir.x -= 1; if (keys['KeyD']) moveDir.x += 1;
            if (moveDir.lengthSq() === 0) return moveDir;
            moveDir.normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), camYaw);
            return moveDir;
        }

        function checkPlayerHitbox() {
            const dist = player.pos.distanceTo(boss.pos);
            const dirToBoss = boss.pos.clone().sub(player.pos).normalize();
            const lookDir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerGroup.rotation.y);
            
            // 攻擊距離加長（V6）
            const rangeMul = (selectedWeapon && selectedWeapon.rangeMul) || 1;
            let hitRange = 10.6 * rangeMul; 
            let angleReq = 0.12; 
            if (player.state === 'SKILL_E') { hitRange = 13.2 * rangeMul; angleReq = 0.05; }
            if (player.state === 'SKILL_Q') { hitRange = 0; }
            if (player.attackType === 'HEAVY') { hitRange = 11.4 * rangeMul; angleReq = 0.08; }

            if (dist < hitRange && lookDir.dot(dirToBoss) > angleReq) {
                player.attackHitDone = true;
                if (boss.state === 'STAGGERED' && !boss.isBeingCrit) { executeCriticalHit(); return; }

                let dmg = 0, postureDmg = 0, hitType = 'NORMAL';
                const wpn = selectedWeapon || WEAPONS.longsword;
                if (player.state === 'SKILL_Q') { dmg = Math.round(200 * wpn.dmgMul); postureDmg = Math.round(36 * wpn.postureMul); hitType = 'SKILL'; } 
                else if (player.state === 'SKILL_E') { dmg = Math.round(280 * wpn.dmgMul); postureDmg = Math.round(70 * wpn.postureMul); hitType = 'SKILL'; } 
                else if (player.attackType === 'HEAVY') {
                    const lv = (wpn.skillStyle === 'greatsword') ? Math.max(1, player.comboStep || 1) : 1;
                    const chargeMul = (wpn.skillStyle === 'greatsword') ? (0.9 + lv * 0.7) : 1;
                    dmg = Math.round(175 * wpn.heavyMul * chargeMul);
                    postureDmg = Math.round(55 * wpn.postureMul * (0.9 + lv * 0.3));
                    hitType = 'CRIT'; targetFov = 54;
                } 
                else {
                    let em = 1;
                    if (wpn.skillStyle === 'insect' && typeof igDmgMul === 'function') em = igDmgMul();
                    dmg = Math.round((48 + player.comboStep * 22) * wpn.dmgMul * em);
                    postureDmg = Math.round((14 + player.comboStep * 9) * wpn.postureMul * em);
                }

                boss.hp = Math.max(0, boss.hp - dmg);
                boss.posture = Math.min(boss.maxPosture, boss.posture + postureDmg);

                const hitPos = boss.pos.clone().add(new THREE.Vector3(0, 3.5, 0));
                const sprayDir = lookDir.clone().add(new THREE.Vector3(0, 0.4, 0));
                
                // 更豐富的命中特效
                createDirectionalSparks(hitPos, 55, hitType === 'SKILL' ? 0x00e5ff : (player.comboStep === 3 ? 0xffea00 : 0xffaa00), sprayDir, 20);
                createImpactFlash(hitPos, hitType === 'SKILL' ? 0x00ccff : 0xffcc00, player.comboStep === 3 ? 3.2 : 2.2);
                createDamageNumber(dmg, hitPos, hitType);
                
                const shakeLvl = hitType === 'SKILL' ? 0.5 : (player.comboStep === 3 ? 0.45 : 0.25);
                triggerCameraShake(shakeLvl); 
                hitstopTimer = (player.comboStep === 3 || hitType === 'CRIT') ? 0.13 : 0.07; 

                if (boss.posture >= boss.maxPosture && boss.state !== 'STAGGERED') {
                    boss.state = 'STAGGERED'; boss.timer = 5.8; critMarker.visible = true;
                }
            }
        }

        /* --- 7. Boss 動作與 AI（更多技能 + 更高攻擊頻率） --- */
        function enhanceBossPhase2Model() {
            if (!bossModel || !bossModel.group) return;
            const arch = boss.archetype || 'abyss';
            // 體型壓迫感
            const sc = arch === 'abyss' ? 1.28 : 1.35;
            bossModel.group.scale.multiplyScalar(sc);
            // 發光核心加強
            if (bossModel.coreMesh && bossModel.coreMesh.material) {
                bossModel.coreMesh.material.emissiveIntensity = 3.5;
                if (bossModel.coreMesh.material.emissive) {
                    if (arch === 'fire') bossModel.coreMesh.material.emissive.setHex(0xff2200);
                    else if (arch === 'thunder') bossModel.coreMesh.material.emissive.setHex(0x88aaff);
                    else bossModel.coreMesh.material.emissive.setHex(0xaa22ff);
                }
            }
            // 附加二階段外觀零件
            const auraCol = arch === 'fire' ? 0xff4400 : (arch === 'thunder' ? 0x66aaff : 0x8822ff);
            if (!bossModel.phase2Aura) {
                const aura = new THREE.Group();
                // 環繞混沌環
                for (let i = 0; i < 3; i++) {
                    const ring = new THREE.Mesh(
                        new THREE.TorusGeometry(4.5 + i * 0.8, 0.12, 8, 32),
                        new THREE.MeshBasicMaterial({ color: auraCol, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending })
                    );
                    ring.rotation.x = Math.PI / 2 + i * 0.4;
                    ring.rotation.y = i * 0.7;
                    aura.add(ring);
                }
                // 尖刺／能量碎片
                for (let i = 0; i < 10; i++) {
                    const a = (i / 10) * Math.PI * 2;
                    const spike = new THREE.Mesh(
                        new THREE.ConeGeometry(0.25, 1.8, 5),
                        new THREE.MeshStandardMaterial({ color: auraCol, emissive: auraCol, emissiveIntensity: 0.8, metalness: 0.5, roughness: 0.3 })
                    );
                    spike.position.set(Math.cos(a) * 3.8, 4 + Math.sin(a * 2) * 0.5, Math.sin(a) * 3.8);
                    spike.lookAt(0, 4, 0);
                    aura.add(spike);
                }
                // 頭頂冠
                const crown = new THREE.Mesh(
                    new THREE.ConeGeometry(1.2, 2.5, 6),
                    new THREE.MeshStandardMaterial({ color: auraCol, emissive: auraCol, emissiveIntensity: 1.2, metalness: 0.6, roughness: 0.25 })
                );
                crown.position.set(0, 9.5, 0);
                aura.add(crown);
                bossModel.group.add(aura);
                bossModel.phase2Aura = aura;
            }
            // 點光
            if (!bossModel.phase2Light) {
                const pl = new THREE.PointLight(auraCol, 4.5, 35);
                pl.position.set(0, 5, 0);
                bossModel.group.add(pl);
                bossModel.phase2Light = pl;
            }
        }

        function enterBossPhase2() {
            if (boss.phase >= 2 || boss.phaseAnnounced) return;
            boss.phaseAnnounced = true;
            // 進入破繭過場（不立即 phase=2 出招，等動畫結束）
            boss.state = 'PHASE_TRANS';
            boss.timer = 3.2;
            boss._phaseTransT = 0;
            boss._phaseTransDone = false;
            clearBossTelegraph();
            // 暫停對玩家傷害感：短暫給玩家呼吸
            setPlayerIframe(1.2);
            triggerCameraShake(0.8);
            createDamageNumber('二階段覺醒…', boss.pos.clone().add(new THREE.Vector3(0, 7, 0)), 'CRIT');

            // 混沌球繭
            const arch = boss.archetype || 'abyss';
            const col = arch === 'fire' ? 0xff3300 : (arch === 'thunder' ? 0x66aaff : 0x7722ff);
            const cocoon = new THREE.Mesh(
                new THREE.SphereGeometry(5.5, 24, 20),
                new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false })
            );
            cocoon.position.copy(boss.pos); cocoon.position.y = 4;
            scene.add(cocoon);
            const cocoonShell = new THREE.Mesh(
                new THREE.SphereGeometry(6.2, 20, 16),
                new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending, depthWrite: false, wireframe: true })
            );
            cocoon.add(cocoonShell);
            boss._cocoon = cocoon;
            // 隱藏本體於繭內感
            if (bossModel.group) bossModel.group.visible = false;
            createAOEShockwave(boss.pos.clone(), 2.5, col, 40);
            createDirectionalSparks(boss.pos.clone().add(new THREE.Vector3(0, 4, 0)), 80, col, new THREE.Vector3(0, 1, 0), 22);
        }

        function finishBossPhase2() {
            boss.phase = 2;
            boss.dmgMul = (boss.dmgMul || 1) * 1.25;
            boss.speedMul = (boss.speedMul || 1) * 1.28;
            boss.attackCdMul = Math.max(0.28, (boss.attackCdMul || 1) * 0.62);
            enhanceBossPhase2Model();
            if (bossModel.group) bossModel.group.visible = true;
            if (boss._cocoon) {
                scene.remove(boss._cocoon);
                boss._cocoon = null;
            }
            createDamageNumber('二階段！', boss.pos.clone().add(new THREE.Vector3(0, 7, 0)), 'CRIT');
            createAOEShockwave(boss.pos.clone(), 3.5, 0xff4400, 70);
            createDirectionalSparks(boss.pos.clone().add(new THREE.Vector3(0, 4, 0)), 120, 0xffee88, new THREE.Vector3(0, 1, 0), 30);
            triggerCameraShake(1.5);
            hitstopTimer = Math.max(hitstopTimer, 0.25);
            boss.state = 'IDLE';
            boss.timer = 0.9;
            clearBossTelegraph();
        }

            if (type === 'DARK_ORB') {

                scene.add(orb);
