<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyssal Sovereign — Souls Combat</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020305; font-family: 'Times New Roman', serif; }
        #game-container { width: 100%; height: 100%; position: absolute; }

        /* UI Layer */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 30px; }
        .boss-ui { width: 65%; margin: 0 auto; text-align: center; opacity: 1; transition: opacity 1s; }
        .boss-name { color: #e2c381; font-size: 28px; font-weight: bold; letter-spacing: 8px; text-transform: uppercase; text-shadow: 0 0 15px rgba(212, 175, 55, 0.9), 2px 2px 4px #000; margin-bottom: 6px; }
        .boss-atk-name { color: #ffe0a0; font-size: 22px; letter-spacing: 4px; min-height: 32px; margin-top: 12px; margin-bottom: 4px; opacity: 0; font-weight: bold; text-shadow: 0 0 16px rgba(255,120,40,0.95), 0 0 6px #000, 2px 2px 0 #000; transition: opacity 0.12s; pointer-events: none; }
        .boss-atk-name.show { opacity: 1; }
        .boss-atk-name.unblock { color: #ff5555; text-shadow: 0 0 18px rgba(255,40,40,1), 0 0 6px #000; }
        .skill-cd-ui { display: flex; gap: 8px; margin-left: 12px; }
        .skill-slot { width: 46px; height: 46px; border: 1px solid #d4af37; background: rgba(0,0,0,0.75); color: #d4af37; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-family: Arial, sans-serif; position: relative; overflow: hidden; }
        .skill-slot.ready { box-shadow: 0 0 10px rgba(212,175,55,0.55); }
        .skill-slot .cd-fill { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.72); transition: height 0.1s linear; pointer-events: none; }
        .skill-slot .sk-key { position: relative; z-index: 1; font-weight: bold; letter-spacing: 1px; }
        .skill-slot .sk-name { position: relative; z-index: 1; font-size: 9px; color: #9aa3b5; margin-top: 1px; }
        .skill-slot .sk-cd { position: absolute; z-index: 2; font-size: 14px; font-weight: bold; color: #fff; text-shadow: 0 0 4px #000; }
        .skill-slot.shift-slot { border-color: #88aaff; color: #aaccff; }
        .skill-slot.shift-slot.ready { box-shadow: 0 0 10px rgba(136,170,255,0.55); }
        .parry-flash { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, rgba(255,220,80,0.35), transparent 60%); opacity: 0; transition: opacity 0.15s; }
        .boss-hp-outer { width: 100%; height: 18px; background: rgba(10, 10, 10, 0.95); border: 1px solid #d4af37; box-shadow: 0 0 20px rgba(0, 0, 0, 0.9); position: relative; padding: 2px; }
        .boss-hp-inner { width: 100%; height: 100%; background: linear-gradient(90deg, #400000, #a00000, #ff2222); transition: width 0.1s linear; }
        .boss-posture-outer { width: 100%; height: 6px; background: rgba(10, 10, 10, 0.9); margin-top: 5px; border: 1px solid rgba(212,175,55,0.4); }
        .boss-posture-inner { width: 0%; height: 100%; background: #d4af37; transition: width 0.1s linear; }

        /* Player Stats & Flasks */
        .player-hud { display: flex; gap: 20px; align-items: flex-end; }
        .player-ui { width: 320px; display: flex; flex-direction: column; gap: 8px; }
        .stat-bar-container { height: 14px; background: rgba(0, 0, 0, 0.9); border: 1px solid rgba(255, 255, 255, 0.3); padding: 1px; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
        .stat-bar-hp { width: 100%; height: 100%; background: linear-gradient(90deg, #600000, #d32f2f); transition: width 0.1s linear; }
        .stat-bar-stamina { width: 100%; height: 100%; background: linear-gradient(90deg, #1b5e20, #4caf50); transition: width 0.1s linear; }
        
        .flask-ui { display: flex; gap: 10px; align-items: center; background: rgba(0,0,0,0.8); padding: 8px 15px; border: 1px solid #d4af37; box-shadow: 0 0 15px rgba(0,0,0,0.9); }
        .flask-icon { width: 24px; height: 32px; background: #00e5ff; clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%); box-shadow: 0 0 10px #00e5ff; }
        .flask-count { color: #fff; font-size: 22px; font-weight: bold; font-family: Arial, sans-serif; text-shadow: 0 0 8px #00e5ff; }

        /* Floating Damage Text */
        .dmg-num { position: absolute; color: #ffffff; font-weight: bold; font-size: 26px; font-family: Arial, sans-serif; text-shadow: 2px 2px 0px #000, -1px -1px 0 #000; pointer-events: none; animation: floatUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .dmg-crit { color: #ffea00 !important; font-size: 48px !important; text-shadow: 0 0 25px #ffaa00, 2px 2px 0 #000 !important; font-style: italic; }
        .dmg-skill { color: #00e5ff !important; font-size: 34px !important; text-shadow: 0 0 15px #00b0ff, 2px 2px 0 #000 !important; }
        @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0) scale(0.5); } 15% { transform: translate(-50%, -15px) scale(1.3); } 100% { opacity: 0; transform: translate(-50%, -55px) scale(0.9); } }

        /* Overlays */
        #instructions { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; text-align: center; background: rgba(8, 10, 15, 0.96); padding: 40px 60px; border: 1px solid #d4af37; cursor: pointer; pointer-events: auto; box-shadow: 0 0 60px rgba(212, 175, 55, 0.25); }
        #instructions h1 { color: #d4af37; margin-bottom: 15px; letter-spacing: 5px; font-size: 30px; text-shadow: 0 0 12px rgba(212,175,55,0.6); }
        #instructions p { margin: 10px 0; color: #d0d5e0; font-size: 14px; }
        #end-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 2s ease; }
        #end-screen.show { opacity: 1; pointer-events: auto; }
        .end-title { font-size: 78px; letter-spacing: 14px; text-shadow: 0 0 30px #000; }
        .died { color: #aa0000; text-shadow: 0 0 25px rgba(255, 0, 0, 0.9); }
        .felled { color: #e2c381; text-shadow: 0 0 30px rgba(212, 175, 55, 0.95); }
        #lock-on-marker { position: absolute; width: 30px; height: 30px; border: 2px solid #ffffff; transform: translate(-50%, -50%) rotate(45deg); display: none; pointer-events: none; box-shadow: 0 0 12px #ffffff; border-radius: 4px; opacity: 0.85; }
        #start-screen { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; background: radial-gradient(ellipse at center, rgba(20,24,36,0.92) 0%, rgba(5,6,10,0.97) 70%); pointer-events: auto; color: #e8e4d8; padding: 4vh 4vw; overflow: hidden; }
        #start-screen.hidden { display: none; }
        #start-screen h1 { color: #d4af37; letter-spacing: 0.35em; font-size: clamp(22px, 4vw, 36px); text-shadow: 0 0 24px rgba(212,175,55,0.5); margin-bottom: 8px; }
        #start-screen .sub { color: #9aa3b5; margin-bottom: 18px; font-size: 14px; }
        .menu-panel { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 900px; }
        .menu-panel.active { display: flex; }
        .boss-grid { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-bottom: 16px; }
        .boss-card { width: 240px; text-align: left; padding: 16px; border: 1px solid #555; background: rgba(12,14,20,0.92); color: #d0d5e0; cursor: pointer; font-family: inherit; transition: border-color 0.15s, box-shadow 0.15s; }
        .boss-card:hover:not(.locked) { border-color: #d4af37; }
        .boss-card.selected { border-color: #d4af37; box-shadow: 0 0 18px rgba(212,175,55,0.35); }
        .boss-card.locked { opacity: 0.45; cursor: not-allowed; filter: grayscale(0.6); }
        .boss-card .bname { color: #d4af37; font-size: 16px; letter-spacing: 2px; margin-bottom: 6px; }
        .boss-card .bdesc { font-size: 12px; color: #9aa3b5; line-height: 1.45; }
        .boss-card .block { font-size: 11px; color: #ff8866; margin-top: 8px; }
        .menu-nav { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
        .menu-btn { padding: 12px 28px; border: 1px solid #d4af37; background: rgba(212,175,55,0.12); color: #d4af37; font-size: 15px; letter-spacing: 3px; cursor: pointer; font-family: inherit; }
        .menu-btn:hover { background: rgba(212,175,55,0.28); }
        .menu-btn.secondary { border-color: #666; color: #aaa; background: transparent; }
        .eco-bar { display:flex; gap:18px; align-items:center; justify-content:center; margin:12px 0 6px; flex-wrap:wrap; font-size:13px; color:#d4af37; letter-spacing:1px; }
        .eco-bar span { background:rgba(0,0,0,0.45); border:1px solid rgba(212,175,55,0.35); padding:6px 14px; border-radius:4px; }
        .craft-grid, .upgrade-grid { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-width:820px; margin:12px 0; }
        .craft-card, .upgrade-card { min-width:200px; max-width:240px; padding:14px 16px; border:1px solid rgba(212,175,55,0.35); background:rgba(10,12,20,0.75); color:#c8d0e0; text-align:left; cursor:pointer; font-family:inherit; }
        .craft-card:hover, .upgrade-card:hover { border-color:#d4af37; background:rgba(30,28,18,0.85); }
        .craft-card.locked { opacity:0.45; cursor:not-allowed; }
        .craft-card .cname, .upgrade-card .uname { color:#d4af37; font-size:15px; letter-spacing:2px; margin-bottom:6px; }
        .craft-card .cdesc, .upgrade-card .udesc { font-size:12px; color:#8a93a8; line-height:1.5; }
        .title-ornament { width:180px; height:2px; background:linear-gradient(90deg, transparent, #d4af37, transparent); margin:8px auto 16px; }
        #start-screen {
            background:
                radial-gradient(ellipse 80% 60% at 70% 40%, rgba(80,40,20,0.35), transparent 55%),
                radial-gradient(ellipse 50% 80% at 20% 50%, rgba(20,30,50,0.5), transparent 50%),
                linear-gradient(105deg, rgba(4,6,10,0.94) 0%, rgba(4,6,10,0.6) 45%, rgba(8,10,16,0.4) 100%);
        }
        .menu-panel {
            align-items: flex-start !important;
            max-width: min(420px, 92vw) !important;
            width: auto !important;
            margin: 0 0 0 4vw !important;
            max-height: 92vh;
            overflow: hidden;
        }
        .menu-panel h1 {
            font-size: clamp(18px, 2.4vw, 26px) !important;
            letter-spacing: 6px !important;
            text-align: left !important;
            color: #e8d5a3;
            text-shadow: 0 2px 24px rgba(0,0,0,0.9);
            margin-bottom: 4px !important;
        }
        .title-ornament { margin: 6px 0 10px 0 !important; width: 100px !important; }
        .menu-panel .sub { text-align: left !important; margin-bottom: 8px !important; color: #8a909c; font-size: 12px !important; }
        .menu-nav {
            flex-direction: column !important;
            align-items: stretch !important;
            gap: 2px !important;
            margin-top: 4px;
        }
        .menu-btn {
            text-align: left !important;
            padding: 10px 18px !important;
            min-width: 240px;
            border: none !important;
            border-left: 3px solid transparent !important;
            background: transparent !important;
            color: #c4c8d0 !important;
            font-size: 15px !important;
            letter-spacing: 4px !important;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }
        .menu-btn:hover {
            color: #f0e0b0 !important;
            border-left-color: #d4af37 !important;
            background: linear-gradient(90deg, rgba(212,175,55,0.12), transparent) !important;
        }
        .menu-btn.secondary {
            color: #7a808c !important;
            font-size: 13px !important;
            letter-spacing: 3px !important;
            padding: 8px 18px !important;
        }
        .eco-bar {
            justify-content: flex-start !important;
            margin: 4px 0 8px !important;
            font-size: 12px !important;
            gap: 8px !important;
        }
        .eco-bar span { padding: 4px 10px !important; }
        .weapon-grid, .craft-grid, .upgrade-grid {
            display: flex;
            flex-direction: column !important;
            flex-wrap: nowrap !important;
            gap: 3px !important;
            max-width: 360px !important;
            max-height: 58vh;
            overflow-y: auto;
            margin: 4px 0 8px !important;
            align-items: stretch;
            padding-right: 4px;
        }
        .weapon-card, .craft-card, .upgrade-card {
            min-width: 0 !important;
            max-width: none !important;
            width: 100%;
            text-align: left !important;
            padding: 8px 12px !important;
            border: none !important;
            border-left: 3px solid rgba(212,175,55,0.25) !important;
            background: rgba(0,0,0,0.35) !important;
        }
        .weapon-card .wname, .craft-card .cname, .upgrade-card .uname { font-size: 13px !important; margin-bottom: 2px !important; }
        .weapon-card .wdesc, .craft-card .cdesc, .upgrade-card .udesc { font-size: 11px !important; line-height: 1.35 !important; }
        .weapon-card:hover, .craft-card:hover, .upgrade-card:hover,
        .weapon-card.selected {
            border-left-color: #d4af37 !important;
            background: linear-gradient(90deg, rgba(212,175,55,0.15), transparent) !important;
        }
        .boss-grid {
            display: flex !important;
            flex-direction: column !important;
            gap: 4px !important;
            max-width: 360px !important;
            max-height: 50vh;
            overflow-y: auto;
        }
        .series-tabs { display: flex; gap: 6px; margin: 6px 0 8px; }
        .series-tab {
            flex: 1; padding: 8px 10px; border: 1px solid rgba(212,175,55,0.35);
            background: rgba(0,0,0,0.4); color: #9aa3b5; font-family: inherit;
            font-size: 13px; letter-spacing: 2px; cursor: pointer;
        }
        .series-tab.active, .series-tab:hover {
            border-color: #d4af37; color: #d4af37;
            background: rgba(212,175,55,0.12);
        }
        .craft-grid {
            max-height: 48vh !important;
        }
        .weapon-card { width: 190px; text-align: left; padding: 14px 16px; border: 1px solid #555; background: rgba(12,14,20,0.9); color: #d0d5e0; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; font-family: inherit; }
        .weapon-card:hover { border-color: #d4af37; }
        .weapon-card.selected { border-color: #d4af37; box-shadow: 0 0 18px rgba(212,175,55,0.35); background: rgba(30,28,18,0.95); }
        .weapon-card .wname { color: #d4af37; font-size: 16px; letter-spacing: 2px; margin-bottom: 6px; }
        .weapon-card .wdesc { font-size: 12px; color: #9aa3b5; line-height: 1.45; }
        #btn-start { margin-top: 8px; padding: 12px 36px; border: 1px solid #d4af37; background: rgba(212,175,55,0.12); color: #d4af37; font-size: 16px; letter-spacing: 4px; cursor: pointer; font-family: inherit; }
        #btn-start:hover { background: rgba(212,175,55,0.25); }
        #controls-hint { margin-top: 16px; font-size: 12px; color: #7a8499; text-align: center; line-height: 1.6; max-width: 520px; }
        #touch-bar { position: absolute; right: 12px; bottom: 12px; display: none; gap: 8px; z-index: 20; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; max-width: 280px; }
        #touch-bar button { min-width: 48px; height: 48px; border: 1px solid rgba(212,175,55,0.7); background: rgba(0,0,0,0.7); color: #d4af37; font-family: 'Times New Roman', serif; font-size: 15px; pointer-events: auto; touch-action: none; }
        @media (max-width: 900px), (pointer: coarse) {
            #touch-bar { display: flex; }
            #instructions { padding: 28px 22px; width: min(92vw, 520px); }
            #instructions h1 { font-size: 22px; letter-spacing: 0.25em; }
            .boss-name { font-size: 18px; letter-spacing: 4px; }
            .player-ui { width: min(52vw, 280px); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="game-container"></div>
    <div id="ui-layer">
        <div class="boss-ui" id="boss-ui">
            <div class="boss-name">Atlas, The Abyssal Sovereign</div>
            <div class="boss-hp-outer"><div class="boss-hp-inner" id="boss-hp-bar"></div></div>
            <div class="boss-posture-outer"><div class="boss-posture-inner" id="boss-posture-bar"></div></div>
            <div class="boss-atk-name" id="boss-atk-name"></div>
        </div>
        <div class="player-hud">
            <div class="player-ui">
                <div class="stat-bar-container"><div class="stat-bar-hp" id="player-hp-bar"></div></div>
                <div class="stat-bar-container"><div class="stat-bar-stamina" id="player-stamina-bar"></div></div>
            </div>
            <div class="flask-ui">
                <div class="flask-icon"></div>
                <div class="flask-count" id="flask-count">5</div>
            </div>
            <div class="skill-cd-ui">
                <div class="skill-slot ready" id="q-slot">
                    <div class="sk-key">Q</div><div class="sk-name" id="q-slot-name">技能</div>
                    <div class="cd-fill" id="q-cd-fill" style="height:0%"></div>
                    <div class="sk-cd" id="q-cd-text"></div>
                </div>
                <div class="skill-slot ready" id="e-slot">
                    <div class="sk-key">E</div><div class="sk-name" id="e-slot-name">技能</div>
                    <div class="cd-fill" id="e-cd-fill" style="height:0%"></div>
                    <div class="sk-cd" id="e-cd-text"></div>
                </div>
                <div class="skill-slot shift-slot ready" id="shift-slot">
                    <div class="sk-key">⇧</div><div class="sk-name" id="shift-slot-name">戰技</div>
                    <div class="cd-fill" id="shift-cd-fill" style="height:0%"></div>
                    <div class="sk-cd" id="shift-cd-text"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="parry-flash" id="parry-flash"></div>
    <div id="lock-on-marker"></div>

    <div id="start-screen">
        <div class="menu-panel active" id="panel-title">
            <h1>ABYSSAL SOVEREIGN</h1>
            <div class="title-ornament"></div>
            <div class="sub">深淵王座・三連試煉</div>
            <div class="eco-bar" id="eco-bar-title">
                <span id="gold-display">金幣 0</span>
                <span id="mat-display">素材 —</span>
            </div>
            <div class="menu-nav">
                <button type="button" class="menu-btn" id="btn-to-weapon">開始調查</button>
                <button type="button" class="menu-btn" id="btn-to-upgrade">武器強化</button>
                <button type="button" class="menu-btn" id="btn-to-craft">武器製作</button>
            </div>
        </div>
        <div class="menu-panel" id="panel-upgrade">
            <h1>武器強化</h1>
            <div class="title-ornament"></div>
            <div class="sub">上限 +5　每級提升傷害（金幣消耗隨等級上升）</div>
            <div class="eco-bar"><span id="gold-display-up">金幣 0</span></div>
            <div class="upgrade-grid" id="upgrade-grid"></div>
            <div class="menu-nav">
                <button type="button" class="menu-btn secondary" id="btn-back-upgrade">返回</button>
            </div>
        </div>
        <div class="menu-panel" id="panel-craft">
            <h1>武器製作</h1>
            <div class="title-ornament"></div>
            <div class="sub">每個 Boss 素材對應一整套 5 把武器</div>
            <div class="eco-bar"><span id="mat-display-craft">素材 —</span></div>
            <div class="series-tabs" id="series-tabs">
                <button type="button" class="series-tab active" data-series="abyss">深淵</button>
                <button type="button" class="series-tab" data-series="fire">炎獄</button>
                <button type="button" class="series-tab" data-series="storm">雷霆</button>
            </div>
            <div class="craft-grid" id="craft-grid"></div>
            <div class="menu-nav">
                <button type="button" class="menu-btn secondary" id="btn-back-craft">返回</button>
            </div>
        </div>
        <div class="menu-panel" id="panel-weapon">
            <h1>選擇武器</h1>
            <div class="sub">防禦力：大劍 &gt; 騎士 &gt; 太刀 &gt; 弓 &gt; 匕首</div>
            <div class="weapon-grid" id="weapon-grid">
                <button type="button" class="weapon-card selected" data-weapon="longsword">
                    <div class="wname">騎士長劍</div>
                    <div class="wdesc">中高防禦・盾防彈反<br>均衡攻速與傷害</div>
                </button>
                <button type="button" class="weapon-card" data-weapon="katana">
                    <div class="wname">太刀</div>
                    <div class="wdesc">中等防禦・見切／登龍<br>中速狩人斬擊</div>
                </button>
                <button type="button" class="weapon-card" data-weapon="dagger">
                    <div class="wname">匕首</div>
                    <div class="wdesc">低防禦・極速連擊<br>流血／分身／雷閃</div>
                </button>
                <button type="button" class="weapon-card" data-weapon="greatsword">
                    <div class="wname">大劍</div>
                    <div class="wdesc">最高防禦・真蓄力<br>上撈斬擊暈</div>
                </button>
                <button type="button" class="weapon-card" data-weapon="bow">
                    <div class="wname">狩弓</div>
                    <div class="wdesc">遠程・低防禦<br>三連射／後空翻射／陷阱</div>
                </button>
                <button type="button" class="weapon-card" data-weapon="insect">
                    <div class="wname">操蟲棍</div>

    <script>
        /* --- 1. 3D 場景 & 哥德環境佈置 --- */
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060810);
        scene.fog = new THREE.FogExp2(0x0b1018, 0.011);

        const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 1000);
        let targetFov = 58;
        // 鏡頭平滑狀態
        const camSmooth = { pos: new THREE.Vector3(0, 8, 28), look: new THREE.Vector3(0, 1.8, 22) };

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.42;
        if (renderer.outputEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x3a4050, 1.2); scene.add(ambientLight);
        const hemiLight = new THREE.HemisphereLight(0x6a7a90, 0x121018, 0.95); scene.add(hemiLight);
        
        const moonLight = new THREE.DirectionalLight(0xc5d8f0, 3.8);
        moonLight.position.set(35, 80, -35); moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 2048; moonLight.shadow.mapSize.height = 2048;
        moonLight.shadow.camera.near = 0.5; moonLight.shadow.camera.far = 180;
        const d = 75; moonLight.shadow.camera.left = -d; moonLight.shadow.camera.right = d; moonLight.shadow.camera.top = d; moonLight.shadow.camera.bottom = -d;
        moonLight.shadow.bias = -0.0004;
        moonLight.shadow.radius = 2.5;
        scene.add(moonLight);

        const fillLight = new THREE.DirectionalLight(0xffc9a0, 1.15);
        fillLight.position.set(-45, 40, 30);
        scene.add(fillLight);
        // 底部微弱環境反光
        const groundBounce = new THREE.DirectionalLight(0x334466, 0.45);
        groundBounce.position.set(0, -20, 10);
        scene.add(groundBounce);

        /* --- Sky dome --- */
        (function buildSky() {
            const skyGeo = new THREE.SphereGeometry(420, 32, 16);
            const skyMat = new THREE.ShaderMaterial({
                side: THREE.BackSide, depthWrite: false,
                uniforms: {
                    topColor: { value: new THREE.Color(0x1a2840) },
                    midColor: { value: new THREE.Color(0x0c121c) },
                    bottomColor: { value: new THREE.Color(0x05070c) }
                },
                vertexShader: 'varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vW=normalize(w.xyz); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
                fragmentShader: 'uniform vec3 topColor,midColor,bottomColor; varying vec3 vW; void main(){ float h=clamp(vW.y*0.5+0.5,0.0,1.0); vec3 c=mix(bottomColor,midColor,smoothstep(0.0,0.45,h)); c=mix(c,topColor,smoothstep(0.45,1.0,h)); gl_FragColor=vec4(c,1.0); }'
            });
            scene.add(new THREE.Mesh(skyGeo, skyMat));
            const starGeo = new THREE.BufferGeometry();
            const starN = 600;
            const starPos = new Float32Array(starN * 3);
            for (let i = 0; i < starN; i++) {
                const r = 200 + Math.random() * 180;
                const th = Math.random() * Math.PI * 2;
                const ph = Math.acos(2 * Math.random() - 1) * 0.45;
                starPos[i*3] = r * Math.sin(ph) * Math.cos(th);
                starPos[i*3+1] = Math.abs(r * Math.cos(ph)) + 20;
                starPos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xaaccff, size: 1.2, sizeAttenuation: true, transparent: true, opacity: 0.85, depthWrite: false })));
        })();

        /* --- 2. 豐富的場景建築：斷柱、廢墟、王座與雜物 --- */
        const templeGroup = new THREE.Group(); scene.add(templeGroup);
        function makeWeaponTex(baseHex, edgeHex) {
            const cv = document.createElement('canvas'); cv.width = cv.height = 128;
            const ctx = cv.getContext('2d');
            const g = ctx.createLinearGradient(0, 0, 128, 128);
            g.addColorStop(0, edgeHex); g.addColorStop(0.45, baseHex); g.addColorStop(1, '#0a0a0c');
            ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
            for (let i = 0; i < 40; i++) {
                ctx.strokeStyle = 'rgba(255,255,255,' + (0.03 + Math.random() * 0.08) + ')';
                ctx.beginPath();
                ctx.moveTo(Math.random() * 128, 0);
                ctx.lineTo(Math.random() * 128, 128);
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(cv);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }
        function makeStoneTex(size, c1, c2, c3) {
            const cv = document.createElement('canvas'); cv.width = cv.height = size;
            const ctx = cv.getContext('2d');
            ctx.fillStyle = c1; ctx.fillRect(0, 0, size, size);
            for (let i = 0; i < 900; i++) {
                const x = Math.random() * size, y = Math.random() * size, s = 2 + Math.random() * 10;
                ctx.fillStyle = Math.random() > 0.5 ? c2 : c3;
                ctx.globalAlpha = 0.15 + Math.random() * 0.25;
                ctx.fillRect(x, y, s, s);
            }
            ctx.globalAlpha = 0.22;
            for (let y = 0; y < size; y += 32) for (let x = 0; x < size; x += 32) {
                ctx.strokeStyle = c3; ctx.strokeRect(x + 1, y + 1, 30, 30);
            }
            const tex = new THREE.CanvasTexture(cv);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(12, 14);
            return tex;
        }
        const floorTex = makeStoneTex(256, '#1a1e28', '#2a303c', '#0e1016');
        const floorGeo = new THREE.PlaneGeometry(180, 200, 48, 48);
        const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, color: 0x8899aa, roughness: 0.88, metalness: 0.1 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; templeGroup.add(floor);
        const daisTex = makeStoneTex(128, '#222836', '#3a4255', '#151820');
        daisTex.repeat.set(4, 4);
        const dais = new THREE.Mesh(
            new THREE.CylinderGeometry(26, 28, 0.45, 48),
            new THREE.MeshStandardMaterial({ map: daisTex, color: 0x99aacc, roughness: 0.78, metalness: 0.15 })
        );
        dais.position.y = 0.15; dais.receiveShadow = true; dais.castShadow = true; templeGroup.add(dais);
        // 多層魔法陣
        const arenaGlow = new THREE.Mesh(
            new THREE.RingGeometry(19.2, 20.5, 64),
            new THREE.MeshBasicMaterial({ color: 0x4488cc, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false })
        );
        arenaGlow.rotation.x = -Math.PI / 2; arenaGlow.position.y = 0.32; templeGroup.add(arenaGlow);
        const arenaGlow2 = new THREE.Mesh(
            new THREE.RingGeometry(14, 14.35, 64),
            new THREE.MeshBasicMaterial({ color: 0x88aadd, transparent: true, opacity: 0.15, side: THREE.DoubleSide, depthWrite: false })
        );
        arenaGlow2.rotation.x = -Math.PI / 2; arenaGlow2.position.y = 0.33; templeGroup.add(arenaGlow2);
        const arenaGlow3 = new THREE.Mesh(
            new THREE.RingGeometry(8.5, 8.7, 48),
            new THREE.MeshBasicMaterial({ color: 0xaaccff, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false })
        );
        arenaGlow3.rotation.x = -Math.PI / 2; arenaGlow3.position.y = 0.34; templeGroup.add(arenaGlow3);

        // —— 實體封閉競技場：中央開闊、邊緣全實心建築（不擋戰鬥視野）——
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x2a3140, roughness: 0.78, metalness: 0.18 });
        const stoneDark = new THREE.MeshStandardMaterial({ color: 0x151922, roughness: 0.88, metalness: 0.15 });
        const stoneGold = new THREE.MeshStandardMaterial({ color: 0x4a4030, roughness: 0.5, metalness: 0.5 });
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1f2c, roughness: 0.82, metalness: 0.12 });

                // 遠景牆：推到可活動區外，靠霧氣淡化，避免貼臉穿牆擋視野
        const farWallMat = wallMat.clone();
        farWallMat.color = new THREE.Color(0x12161f);
        farWallMat.roughness = 0.9;
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(160, 56, 8), farWallMat);
        backWall.position.set(0, 22, -78); backWall.castShadow = true; backWall.receiveShadow = true; templeGroup.add(backWall);
        const frontWall = new THREE.Mesh(new THREE.BoxGeometry(160, 40, 7), farWallMat);
        frontWall.position.set(0, 16, 78); frontWall.castShadow = true; frontWall.receiveShadow = true; templeGroup.add(frontWall);
        const sideWallL = new THREE.Mesh(new THREE.BoxGeometry(8, 50, 160), farWallMat);
        sideWallL.position.set(-78, 20, 0); sideWallL.castShadow = true; sideWallL.receiveShadow = true; templeGroup.add(sideWallL);
        const sideWallR = sideWallL.clone(); sideWallR.position.x = 78; templeGroup.add(sideWallR);
        const boundRing = new THREE.Mesh(
            new THREE.RingGeometry(43.5, 44.2, 96),
            new THREE.MeshBasicMaterial({ color: 0x335577, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false })
        );
        boundRing.rotation.x = -Math.PI / 2; boundRing.position.y = 0.5; templeGroup.add(boundRing);

// 牆面實體凸出結構（浮雕感，非空心）
        for (let z = -40; z <= 40; z += 20) {
            [-52, 52].forEach((x) => {
                const buttress = new THREE.Mesh(new THREE.BoxGeometry(4, 36, 5), stoneMat);
                buttress.position.set(x + (x > 0 ? -2 : 2), 18, z);
                buttress.castShadow = true; templeGroup.add(buttress);
            });
        }
        // 神柱：實心碰撞體（玩家無法穿入擋鏡頭）
        const arenaColliders = []; // {x,z,r} 圓柱碰撞
        function addPillar(x, z, radius, height, yBase) {
            const col = new THREE.Mesh(
                new THREE.CylinderGeometry(radius * 0.85, radius, height, 14),
                stoneMat
            );
            col.position.set(x, yBase + height * 0.5, z);
            col.castShadow = true; col.receiveShadow = true;
            templeGroup.add(col);
            const cap = new THREE.Mesh(new THREE.BoxGeometry(radius * 2.2, 1.2, radius * 2.2), stoneGold);
            cap.position.set(x, yBase + height + 0.5, z);
            templeGroup.add(cap);
            arenaColliders.push({ x: x, z: z, r: radius + 0.35 });
        }
        // 外圈神柱
        for (const x of [-40, 40]) {
            for (const z of [-40, -20, 0, 20, 40]) {
                addPillar(x, z, 2.4, 28, 0);
            }
        }
        // 內圈裝飾矮柱（也實心，避免穿模擋視）
        for (const x of [-22, 22]) {
            for (const z of [-22, 22]) {
                addPillar(x, z, 1.6, 10, 0);
            }
        }
        // 岩石實心
        [[-38, -38], [38, -38], [-38, 38], [38, 38]].forEach((p) => {
            arenaColliders.push({ x: p[0], z: p[1], r: 3.2 });
        });
        function resolveArenaColliders() {
            if (!arenaColliders.length) return;
            const px = playerGroup.position.x, pz = playerGroup.position.z;
            const pr = 0.85; // player radius
            for (let i = 0; i < arenaColliders.length; i++) {
                const c = arenaColliders[i];
                const dx = px - c.x, dz = pz - c.z;
                const dist = Math.hypot(dx, dz);
                const minD = c.r + pr;
                if (dist < minD && dist > 1e-4) {
                    const n = minD / dist;
                    playerGroup.position.x = c.x + dx * n;
                    playerGroup.position.z = c.z + dz * n;
                    if (player.moveVel) {
                        const nx = dx / dist, nz = dz / dist;
                        const outward = player.moveVel.x * nx + player.moveVel.z * nz;
                        if (outward < 0) {
                            player.moveVel.x -= nx * outward;
                            player.moveVel.z -= nz * outward;
                        }
                    }
                } else if (dist <= 1e-4) {
                    playerGroup.position.x = c.x + minD;
                }
            }
        }

        // 後牆王座（實心）
        const throneBase = new THREE.Mesh(new THREE.BoxGeometry(16, 5, 10), stoneDark);
        throneBase.position.set(0, 2.5, -52); throneBase.castShadow = true; templeGroup.add(throneBase);
        const throneBack = new THREE.Mesh(new THREE.BoxGeometry(14, 22, 4), stoneMat);
        throneBack.position.set(0, 14, -55); throneBack.castShadow = true; templeGroup.add(throneBack);
        for (let i = 0; i < 4; i++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(20 - i * 2, 0.6, 3.5), stoneGold);
            step.position.set(0, 0.3 + i * 0.6, -44 - i * 2);
            step.receiveShadow = true; templeGroup.add(step);
        }
        // 地面實體石環（不透明）
        const outerRing = new THREE.Mesh(
            new THREE.TorusGeometry(30, 0.55, 8, 64),
            new THREE.MeshStandardMaterial({ color: 0x3a4255, metalness: 0.35, roughness: 0.5 })
        );
        outerRing.rotation.x = -Math.PI / 2; outerRing.position.y = 0.4; templeGroup.add(outerRing);
        const midRing = new THREE.Mesh(
            new THREE.TorusGeometry(18, 0.35, 8, 48),
            new THREE.MeshStandardMaterial({ color: 0x4a5040, metalness: 0.4, roughness: 0.45 })
        );
        midRing.rotation.x = -Math.PI / 2; midRing.position.y = 0.35; templeGroup.add(midRing);
        // 中軸實體金紋
        const centerLine = new THREE.Mesh(
            new THREE.BoxGeometry(2.8, 0.12, 100),
            new THREE.MeshStandardMaterial({ color: 0x4a3a28, metalness: 0.55, roughness: 0.4 })
        );
        centerLine.position.set(0, 0.2, -5); templeGroup.add(centerLine);
        const rockMat = new THREE.MeshStandardMaterial({ color: 0x2a303c, roughness: 0.9, metalness: 0.1 });
        [[-38, -38], [38, -38], [-38, 38], [38, 38], [-42, 0], [42, 0]].forEach((p, idx) => {
            const rock = new THREE.Mesh(new THREE.BoxGeometry(3.5 + (idx % 3), 2.2 + (idx % 2), 3.2), rockMat);
            rock.position.set(p[0], 1.1, p[1]); rock.rotation.y = idx * 0.7;
            rock.castShadow = true; rock.receiveShadow = true; templeGroup.add(rock);
        });

        const torchLights = [];
        for (let z = -48; z <= 48; z += 24) {
            [-44, 44].forEach((x) => {
                const torchLight = new THREE.PointLight(0xff7744, 4.8, 42);
                torchLight.position.set(x + (x > 0 ? -3 : 3), 18, z);
                scene.add(torchLight); torchLights.push(torchLight);
                const flame = new THREE.Mesh(
                    new THREE.SphereGeometry(0.35, 8, 8),
                    new THREE.MeshBasicMaterial({ color: 0xff8833 })
                );
                flame.position.copy(torchLight.position); templeGroup.add(flame);
            });
        }

        // 動態戰場灰燼粒子
        const particleCount = 200;
        const particleGeo = new THREE.BufferGeometry();
        const pPositions = [];
        for(let i = 0; i < particleCount; i++) {
            pPositions.push((Math.random() - 0.5) * 100, Math.random() * 30, (Math.random() - 0.5) * 100);
        }
        particleGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPositions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0xffaa44, size: 0.35, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
        const battlefieldEmbers = new THREE.Points(particleGeo, particleMat);
        scene.add(battlefieldEmbers);
        // 大氣塵埃（遠景體積感）
        const dustCount = 120;
        const dustGeo = new THREE.BufferGeometry();
        const dustPos = [];
        for (let i = 0; i < dustCount; i++) {
            dustPos.push((Math.random() - 0.5) * 90, 1 + Math.random() * 18, (Math.random() - 0.5) * 90);
        }
        dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dustPos, 3));
        const dustPoints = new THREE.Points(dustGeo, new THREE.PointsMaterial({
            color: 0xaabbcc, size: 0.18, transparent: true, opacity: 0.35,
            blending: THREE.AdditiveBlending, depthWrite: false
        }));
        scene.add(dustPoints);

        /* --- 3. 魂系風格角色與 Boss 模型 --- */
        function createDetailedKnight() {
            // Two-hand centric rig: sword is the root of the grip; arms aim at the hilt
            const knightGroup = new THREE.Group();
            const steel = new THREE.MeshPhysicalMaterial({ color: 0x8a96a8, metalness: 0.95, roughness: 0.28, clearcoat: 0.55, clearcoatRoughness: 0.25 });
            const darkSteel = new THREE.MeshStandardMaterial({ color: 0x2a303c, metalness: 0.85, roughness: 0.4 });
            const gold = new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 1.0, roughness: 0.22 });
            const leather = new THREE.MeshStandardMaterial({ color: 0x3a2818, roughness: 0.9, metalness: 0.05 });
            const skinGlove = new THREE.MeshStandardMaterial({ color: 0x2a2220, roughness: 0.85, metalness: 0.1 });

            const body = new THREE.Group();
            knightGroup.add(body);

            // Head
            const headGroup = new THREE.Group();
            headGroup.position.y = 2.72;
            const helm = new THREE.Mesh(new THREE.SphereGeometry(0.42, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.72), steel);
            helm.scale.set(1, 1.15, 1.05); helm.castShadow = true; headGroup.add(helm);
            const helmJaw = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.28, 0.5), darkSteel);
            helmJaw.position.set(0, -0.28, 0.08); headGroup.add(helmJaw);
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.08, 0.42), gold);
            visor.position.set(0, 0.02, 0.28); headGroup.add(visor);
            const crest = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.55, 0.55), gold);
            crest.position.set(0, 0.55, -0.05); headGroup.add(crest);
            body.add(headGroup);

            // Torso
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.42, 1.15, 12), steel);
            torso.position.y = 1.72; torso.castShadow = true; body.add(torso);
            const breast = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.7, 0.38), steel);
            breast.position.set(0, 1.85, 0.18); body.add(breast);
            const belt = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.06, 8, 16), gold);
            belt.rotation.x = Math.PI / 2; belt.position.y = 1.15; body.add(belt);

            // Pauldrons fixed on body
            const padGeo = new THREE.SphereGeometry(0.34, 12, 10, 0, Math.PI * 2, 0, Math.PI / 1.8);
            const lPad = new THREE.Mesh(padGeo, gold); lPad.position.set(-0.7, 2.35, 0); lPad.rotation.z = 0.35; body.add(lPad);
            const rPad = new THREE.Mesh(padGeo, gold); rPad.position.set(0.7, 2.35, 0); rPad.rotation.z = -0.35; body.add(rPad);

            // ---- Weapon root (two-hand pivot in front of torso) ----
            const weaponRoot = new THREE.Group();
            weaponRoot.position.set(0.0, 1.35, 0.75); // middle-guard, in front of chest
            body.add(weaponRoot);

            // Sword on weapon root — clean steel longsword
            const swordGroup = new THREE.Group();
            const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.045, 0.55, 8), leather);
            grip.position.y = 0;
            const pommel = new THREE.Mesh(new THREE.SphereGeometry(0.075, 8, 8), gold);
            pommel.position.y = -0.32;
            const guard = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.07, 0.12), gold);
            guard.position.y = 0.28;
            const bladeMat = new THREE.MeshPhysicalMaterial({ color: 0xd8e0ec, metalness: 1, roughness: 0.12, clearcoat: 0.4 });
            const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.6, 0.035), bladeMat);
            blade.position.y = 1.6; blade.castShadow = true; blade.name = 'blade';
            const fuller = new THREE.Mesh(new THREE.BoxGeometry(0.028, 2.2, 0.04), darkSteel);
            fuller.position.y = 1.55; fuller.name = 'fuller';
            swordGroup.add(grip, pommel, guard, blade, fuller);
            // Blade points upward in middle guard
            swordGroup.rotation.x = 0.15;
            weaponRoot.add(swordGroup);

            // Grip markers (both hands sit on the hilt)
            const rightGrip = new THREE.Group(); // lower grip near pommel
            rightGrip.position.set(0, -0.12, 0);
            swordGroup.add(rightGrip);
            const leftGrip = new THREE.Group(); // upper grip near guard
            leftGrip.position.set(0, 0.18, 0);
            swordGroup.add(leftGrip);

            // Hand meshes parented to grips so they NEVER leave the hilt
            const rightHandMesh = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.12, 0.16), skinGlove);
            rightHandMesh.position.set(0.02, 0, 0.02);
            rightGrip.add(rightHandMesh);
            const leftHandMesh = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.12, 0.16), skinGlove);

                    new THREE.BoxGeometry(isFront ? 0.5 : 0.55, isFront ? 1.2 : 1.5, 0.5),

                shin.rotation.x = isFront ? 0.1 : 0.2; leg.add(shin);

                ankle.position.set(0, isFront ? -2.6 : -3.2, isFront ? 0.3 : 0.1); leg.add(ankle);
                // 爪掌
                const foot = new THREE.Mesh(new THREE.BoxGeometry(isFront ? 0.7 : 0.9, 0.3, isFront ? 1.1 : 1.4), clawM);
                foot.position.set(0, isFront ? -2.85 : -3.45, isFront ? 0.55 : 0.45); leg.add(foot);
                // 趾爪
                const toeN = isFront ? 3 : 4;
                for (let i = 0; i < toeN; i++) {
                    const ox = (i - (toeN - 1) / 2) * 0.22;
                    const c = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.55, 4), clawM);
                    c.position.set(ox, isFront ? -2.95 : -3.55, isFront ? 1.05 : 1.1);
                    c.rotation.x = 1.05; leg.add(c);
                }
                // 後踵刺（後肢）
                if (!isFront) {

                    spur.position.set(0, -3.2, -0.3); spur.rotation.x = -1.0; leg.add(spur);

            const legFL = makeLeg(-1, 1.5, true);

            const legL = makeLeg(-1, -2.4, false);
            const legR = makeLeg(1, -2.4, false);
            g.add(legFL); g.add(legFR); g.add(legL); g.add(legR);

            // ========== 長尾 ==========
            const tail = new THREE.Group(); tail.position.set(0, 3.2, -3.8);
            for (let i = 0; i < 11; i++) {

            tailBlade.position.set(0, -0.3, -9.5); tail.add(tailBlade);
            const tailTip = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1.2, 6), clawM);
            tailTip.position.set(0, -0.3, -10.5); tailTip.rotation.x = Math.PI / 2; tail.add(tailTip);
            for (const side of [-1, 1]) {
                const barb = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.8, 4), clawM);
                barb.position.set(side * 0.4, -0.25, -9.8); barb.rotation.z = side * 0.85; tail.add(barb);
            }
            g.add(tail);

            // 光
            const aura = new THREE.PointLight(0xff5500, 3.0, 32);
            aura.position.set(0, 4.2, 1.5); g.add(aura);
            const aura2 = new THREE.PointLight(0xff3300, 1.5, 20);
            aura2.position.set(0, 6.5, 5.0); g.add(aura2);

            g.scale.set(1.45, 1.45, 1.45);
            return {
                group: g, headGroup, rightArmGroup, leftArmGroup, coreMesh,
                weaponGroup: new THREE.Group(), legL, legR, tail, eyeMat, archetype: 'fire'
            };
        }

        function createThunderDragon() {

            for (let i = 0; i < 3; i++) {

            // 側雷紋
            for (let side of [-1, 1]) {

                    bolt.position.set(side * 1.85, 3.5, 1.5 - i * 0.7);

            const headGroup = new THREE.Group(); headGroup.position.set(0, 4.4, 4.4);
            for (let i = 0; i < 4; i++) {
                const n = new THREE.Mesh(new THREE.SphereGeometry(0.78 - i * 0.07, 12, 10), hide);
                n.position.set(0, 0.25 + i * 0.38, -1.7 + i * 0.85); headGroup.add(n);
            }
            const skull = new THREE.Mesh(new THREE.SphereGeometry(1.05, 14, 12), hideDark);
            skull.position.set(0, 1.5, 1.05); skull.scale.set(1.05, 0.95, 1.3); headGroup.add(skull);
            const crest = new THREE.Mesh(new THREE.ConeGeometry(0.5, 2.4, 8), bone);
            crest.position.set(0, 2.75, 0.25); headGroup.add(crest);

            for (let side of [-1, 1]) {

                socket.position.copy(eye.position); headGroup.add(socket);

            // 下顎電牙
            for (let i = -2; i <= 2; i++) {
                const t = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.35, 4), crystal);
                t.position.set(i * 0.15, 0.9, 2.9); t.rotation.x = Math.PI; headGroup.add(t);

                for (let i = 0; i < 4; i++) {

        function clearSwordGroup() {
            const g = knightMesh.swordGroup;
            if (!g) return;
            // Keep grip anchors (rightGrip / leftGrip) so two-hand hands stay on hilt
            const keep = [];
            for (let i = g.children.length - 1; i >= 0; i--) {
                const c = g.children[i];
                if (c === knightMesh.rightGrip || c === knightMesh.leftGrip) {
                    keep.push(c);
                    continue;
                }
                g.remove(c);
                if (c.geometry) c.geometry.dispose();
            }
            // ensure grips still present
            if (knightMesh.rightGrip && knightMesh.rightGrip.parent !== g) g.add(knightMesh.rightGrip);
            if (knightMesh.leftGrip && knightMesh.leftGrip.parent !== g) g.add(knightMesh.leftGrip);
        }

                knightMesh.leftGrip.add(lh);

                });

        /* --- 5. 視覺特效系統（大幅強化） --- */
        const particles = [], shockwaves = [], trails = [], impactFlashes = [];

        function createDirectionalSparks(pos, count = 45, color = 0xffbb00, dir = null, speed = 18) {
            const pGeo = new THREE.BufferGeometry(), positions = [], velocities = [];
            for (let i = 0; i < count; i++) {
                positions.push(pos.x, pos.y, pos.z); 
                let vx = (Math.random() - 0.5) * speed, vy = (Math.random() - 0.05) * speed * 1.2, vz = (Math.random() - 0.5) * speed;
                if (dir) { vx += dir.x * speed * 1.4; vy += dir.y * speed * 1.1; vz += dir.z * speed * 1.4; }
                velocities.push(vx, vy, vz);
            }
            pGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const pSystem = new THREE.Points(pGeo, new THREE.PointsMaterial({ 
                color, size: 0.48, transparent: true, opacity: 1, 
                blending: THREE.AdditiveBlending, depthWrite: false 
            }));
            scene.add(pSystem); particles.push({ system: pSystem, velocities, life: 0.55, maxLife: 0.55 });
        }

        function createAOEShockwave(pos, size = 1.0, color = 0xff2200, expandSpeed = 42) {
            const ringGeo = new THREE.RingGeometry(0.15, size, 48);
            const ringMat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending });
            const ring = new THREE.Mesh(ringGeo, ringMat); ring.rotation.x = -Math.PI / 2; ring.position.copy(pos); ring.position.y = 0.06;
            scene.add(ring); shockwaves.push({ mesh: ring, scale: 1, opacity: 0.95, expandSpeed });
        }

        function createImpactFlash(pos, color = 0xffaa00, scale = 2.5) {
            const flashGeo = new THREE.SphereGeometry(0.4, 12, 12);
            const flashMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            const flash = new THREE.Mesh(flashGeo, flashMat);
            flash.position.copy(pos);
            scene.add(flash);
            impactFlashes.push({ mesh: flash, life: 0.25, maxLife: 0.25, baseScale: scale });
        }
