                    new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.75, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })
                );
                ring.rotation.x = -Math.PI / 2; ring.position.copy(targetPos); ring.position.y = 0.1;
                scene.add(ring);
                boss.projectiles.push({
                    mesh: met, velocity: new THREE.Vector3(0, -36, 0), life: 1.0,
                    damage: 48, type: 'METEOR', ring, hitR: 4.0
                });
            } else if (type === 'THUNDER') {
                const targetPos = player.pos.clone(); targetPos.y = 0;
                const bolt = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.2, 0.45, 14, 6),
                    new THREE.MeshBasicMaterial({ color: 0xaaddff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending })
                );
                bolt.position.set(targetPos.x, 7, targetPos.z);
                scene.add(bolt);
                const ring = new THREE.Mesh(
                    new THREE.RingGeometry(1.0, 2.4, 24),
                    new THREE.MeshBasicMaterial({ color: 0x66aaff, transparent: true, opacity: 0.8, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })
                );
                ring.rotation.x = -Math.PI / 2; ring.position.copy(targetPos); ring.position.y = 0.12;
                scene.add(ring);
                boss.projectiles.push({
                    mesh: bolt, velocity: new THREE.Vector3(), life: 0.6, damage: 50,
                    type: 'THUNDER', hitDelay: 0.15, hitDone: false, ring, targetPos, hitR: 3.5
                });
                createAOEShockwave(targetPos, 2.0, 0x88ccff, 28);
            }
        }

        function updateBoss(dt) {
            // Training dummy: passive, faces player, regenerates HP, no attacks / no victory
            if ((boss.archetype === 'dummy') || (boss.def && boss.def.archetype === 'dummy')) {
                if (boss.hp < boss.maxHp) {
                    boss.hp = Math.min(boss.maxHp, boss.hp + boss.maxHp * 0.04 * dt);
                }
                if (boss.posture > 0) boss.posture = Math.max(0, boss.posture - 25 * dt);
                if (boss.state === 'STAGGERED') {
                    boss.timer -= dt;
                    if (bossModel && bossModel.group) {
                        bossModel.group.rotation.z = 0.35;
                        bossModel.group.position.y = -0.4;
                    }
                    if (boss.timer <= 0) {
                        boss.state = 'IDLE';
                        boss.posture = 0;
                        boss.isBeingCrit = false;
                        if (bossModel && bossModel.group) {
                            bossModel.group.rotation.z = 0;
                            bossModel.group.position.y = 0;
                        }
                        if (typeof critMarker !== 'undefined') critMarker.visible = false;
                    }
                } else {
                    boss.state = 'IDLE';
                    const ang = Math.atan2(player.pos.x - boss.pos.x, player.pos.z - boss.pos.z);
                    bossGroup.rotation.y = THREE.MathUtils.lerp(bossGroup.rotation.y, ang, 1 - Math.exp(-4 * dt));
                    if (bossModel && bossModel.group) {
                        bossModel.group.position.y = Math.sin(performance.now() * 0.002) * 0.03;
                    }
                }
                return;
            }
            if (boss.hp <= 0) { if (boss.state !== 'DEAD') triggerVictory(); return; }
            const now = performance.now() * 0.003;

            // 更新投射物
            for (let i = boss.projectiles.length - 1; i >= 0; i--) {
                const p = boss.projectiles[i];
                if (p.type === 'RING_WAVE') continue; // 由下方專用邏輯處理
                p.life -= dt;
                
                if (p.type === 'ORB') {
                    // 追蹤
                    if (p.homing) {
                        const toP = player.pos.clone().sub(p.mesh.position); toP.y = 0;
                        if (toP.lengthSq() > 0.01) {
                            toP.normalize();
                            const h = p.homing * 40 * dt;
                            p.velocity.x += toP.x * h;
                            p.velocity.z += toP.z * h;
                            const sp = Math.hypot(p.velocity.x, p.velocity.z);
                            const maxSp = 38;
                            if (sp > maxSp) { p.velocity.x *= maxSp / sp; p.velocity.z *= maxSp / sp; }
                        }
                    }
                    p.mesh.position.addScaledVector(p.velocity, dt);
                    p.mesh.rotation.x += dt * 5;
                    p.mesh.rotation.y += dt * 4;
                    // 拖尾
                    if (p.trail && Math.random() < 0.55) {
                        createDirectionalSparks(p.mesh.position.clone(), 3, p.trailColor || 0xff6600, p.velocity.clone().normalize().multiplyScalar(-1), 8);
                    }
                    const dx = p.mesh.position.x - player.pos.x;
                    const dz = p.mesh.position.z - player.pos.z;
                    const horiz = Math.sqrt(dx * dx + dz * dz);
                    const hitR = p.hitR || 2.5;
                    if (horiz < hitR && !player.iframe) {
                        if ((player.counterWindow > 0 && tryCounterWindow()) || (player.parryWindow > 0 && tryParrySuccess())) {
                            p.life = 0;
                        } else if (player.isBlocking || player.hyperArmor) {
                            player.stamina = Math.max(0, player.stamina - (player.hyperArmor ? 25 : 40));
                            const gd = player.hyperArmor ? Math.ceil(p.damage * 0.45) : 8;
                            hurtPlayer(gd, player.hyperArmor ? '堅韌 -0' : 'GUARD -0');
                            p.life = 0;
                        } else {
                            hurtPlayer(p.damage * (boss.dmgMul || 1));
                            createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1.2, 0)), 55, p.trailColor || 0x6622ff);
                            createImpactFlash(player.pos.clone().add(new THREE.Vector3(0, 1.4, 0)), p.trailColor || 0xff6600, 2.8);
                            createDamageNumber("-" + p.damage, player.pos.clone().add(new THREE.Vector3(0, 2.2, 0)));
                            triggerCameraShake(0.65);
                            if (player.hp <= 0) triggerGameOver();
                            p.life = 0;
                        }
                    }
                } else if (p.type === 'SPIKE') {
                    p.riseTimer -= dt;
                    if (p.riseTimer > 0) {
                        const riseProg = 1 - (p.riseTimer / p.maxRise);
                        p.mesh.position.y = -1.5 + easeOutCubic(riseProg) * 4.2;
                    } else {
                        // 尖刺已升起，進行命中
                        if (p.mesh.position.distanceTo(player.pos) < 2.2 && !player.iframe && !p.hitDone) {
                            p.hitDone = true;
                            if ((player.counterWindow > 0 && tryCounterWindow()) || (player.parryWindow > 0 && tryParrySuccess())) {
                                /* countered */
                            } else if (player.isBlocking) {
                                player.stamina = Math.max(0, player.stamina - 45);
                                hurtPlayer(10 * (boss.dmgMul || 1), 'GUARD -0');
                            } else {
                                hurtPlayer(p.damage * (boss.dmgMul || 1));
                                createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1.2, 0)), 50, 0x8800cc);
                                createDamageNumber("-" + p.damage, player.pos.clone().add(new THREE.Vector3(0, 2.2, 0)));
                                triggerCameraShake(0.7);
                                if (player.hp <= 0) triggerGameOver();
                            }
                        }
                        // 緩慢沉回
                        if (p.life < 0.5) p.mesh.position.y = THREE.MathUtils.lerp(p.mesh.position.y, -2, dt * 4);
                    }
                } else if (p.type === 'METEOR') {
                    p.mesh.position.addScaledVector(p.velocity, dt);
                    if (Math.random() < 0.5) createDirectionalSparks(p.mesh.position.clone(), 4, 0xff5500, new THREE.Vector3(0, -1, 0), 12);
                    if (p.mesh.position.y <= 0.5 && !p.hitDone) {
                        p.hitDone = true;
                        p.mesh.position.y = 0.5;
                        createAOEShockwave(p.mesh.position.clone(), 2.4, 0xff4400, 40);
                        createImpactFlash(p.mesh.position.clone(), 0xff6600, 4.5);
                        createDirectionalSparks(p.mesh.position.clone().add(new THREE.Vector3(0, 1, 0)), 60, 0xff4400, new THREE.Vector3(0, 1, 0), 20);
                        const dx = p.mesh.position.x - player.pos.x;
                        const dz = p.mesh.position.z - player.pos.z;
                        const hr = p.hitR || 4.0;
                        if (Math.sqrt(dx*dx+dz*dz) < hr && !player.iframe) {
                            hurtPlayer(p.damage * (boss.dmgMul || 1));
                            triggerCameraShake(0.9);
                        }
                        p.life = Math.min(p.life, 0.3);
                    }
                } else if (p.type === 'THUNDER') {
                    p.hitDelay = (p.hitDelay || 0) - dt;
                    if (p.hitDelay <= 0 && !p.hitDone) {
                        p.hitDone = true;
                        const dx = p.targetPos.x - player.pos.x;
                        const dz = p.targetPos.z - player.pos.z;
                        const hr = p.hitR || 3.5;
                        if (Math.sqrt(dx*dx+dz*dz) < hr && !player.iframe) {
                            hurtPlayer(p.damage * (boss.dmgMul || 1));
                            createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1.5, 0)), 55, 0x88ccff);
                            createImpactFlash(player.pos.clone().add(new THREE.Vector3(0, 1.5, 0)), 0xaaddff, 3.2);
                            triggerCameraShake(0.75);
                        }
                    }
                    if (p.mesh.material) p.mesh.material.opacity = Math.max(0, p.life * 2);
                } else if (p.type === 'CAST_HALO') {
                    if (p.expand) {
                        const s = 1 + (1 - Math.max(0, p.life)) * (p.expand || 1);
                        p.mesh.scale.set(s, s, s);
                    }
                    if (p.mesh.material) p.mesh.material.opacity = Math.max(0, p.life * 1.2);
                }
                
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    if (p.ring) scene.remove(p.ring);
                    boss.projectiles.splice(i, 1);
                }
            }

            // 傷害擴張環
            for (let i = boss.projectiles.length - 1; i >= 0; i--) {
                const p = boss.projectiles[i];
                if (p.type !== 'RING_WAVE') continue;
                p.life -= dt;
                p.radius += p.expandSpeed * dt;
                const s = p.radius;
                p.mesh.scale.set(s, s, s);
                p.mesh.material.opacity = Math.max(0, p.life / 1.6 * 0.9);
                const dx = player.pos.x - p.mesh.position.x;
                const dz = player.pos.z - p.mesh.position.z;
                const horiz = Math.sqrt(dx * dx + dz * dz);
                const band = Math.abs(horiz - p.radius * 0.85);
                if (band < 1.8 && !player.iframe && !p.hitPlayers.has('p')) {
                    p.hitPlayers.add('p');
                    if ((player.counterWindow > 0 && tryCounterWindow()) || (player.parryWindow > 0 && tryParrySuccess())) {
                        /* parried */
                    } else if (player.isBlocking) {
                        player.stamina = Math.max(0, player.stamina - 35);
                        hurtPlayer(6 * (boss.dmgMul || 1), 'GUARD -0');
                    } else {
                        hurtPlayer(p.damage * (boss.dmgMul || 1));
                        createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1.2, 0)), 45, 0x8844ff);
                        createDamageNumber('-' + p.damage, player.pos.clone().add(new THREE.Vector3(0, 2.2, 0)));
                        triggerCameraShake(0.6);
                        if (player.hp <= 0) triggerGameOver();
                    }
                }
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    boss.projectiles.splice(i, 1);
                }
            }

            // 玩家劍氣
            for (let i = boss.swordWaves.length - 1; i >= 0; i--) {
                const w = boss.swordWaves[i];
                w.life -= dt;
                w.mesh.position.addScaledVector(w.velocity, dt);
                w.mesh.material.opacity = Math.max(0, w.life / 0.85);
                w.mesh.scale.x = 1 + (1 - w.life / 0.85) * 0.6;
                if (!w.hit) {
                    const dx = w.mesh.position.x - boss.pos.x;
                    const dz = w.mesh.position.z - boss.pos.z;
                    const horiz = Math.sqrt(dx * dx + dz * dz);
                    if (horiz < 5.5 && Math.abs(w.mesh.position.y - 3.5) < 5) {
                        w.hit = true;
                        const dmg = w.damage;
                        boss.hp = Math.max(0, boss.hp - dmg);
                        boss.posture = Math.min(boss.maxPosture, boss.posture + 28);
                        const hitPos = boss.pos.clone().add(new THREE.Vector3(0, 3.5, 0));
                        createDirectionalSparks(hitPos, 60, 0x00e5ff, w.velocity.clone().normalize(), 18);
                        createImpactFlash(hitPos, 0x00ccff, 3.0);
                        createDamageNumber(dmg, hitPos, 'SKILL');
                        triggerCameraShake(0.45); hitstopTimer = 0.08;
                        if (boss.posture >= boss.maxPosture && boss.state !== 'STAGGERED') {
                            boss.state = 'STAGGERED'; boss.timer = 5.8; critMarker.visible = true;
                        }
                    }
                }
                if (w.life <= 0) {
                    scene.remove(w.mesh);
                    boss.swordWaves.splice(i, 1);
                }
            }

            // 待機微動
            if (boss.state !== 'STAGGERED' && boss.state !== 'ATTACKING' && boss.state !== 'WINDUP') {
                if (!(isDragonBoss() && (boss.state === 'WINDUP' || boss.state === 'ATTACKING')) && boss.state !== 'PHASE_TRANS') {
                    bossModel.group.position.y = THREE.MathUtils.lerp(bossModel.group.position.y, Math.sin(now * 2.2) * 0.22, 0.15);
                }
                if (bossModel.headGroup) bossModel.headGroup.rotation.y = Math.sin(now * 1.4) * 0.12;
                if (boss.phase >= 2 && bossModel.phase2Aura) {
                    bossModel.phase2Aura.rotation.y += dt * 1.2;
                    bossModel.phase2Aura.children.forEach((c, i) => {
                        if (c.geometry && c.geometry.type === 'TorusGeometry') c.rotation.z += dt * (0.8 + i * 0.3);
                    });
                }
            }
            if (boss.state !== 'PURSUE' && boss.state !== 'CIRCLING' && bossModel.legL) {
                bossModel.legL.rotation.x *= Math.exp(-6 * dt);
                bossModel.legR.rotation.x *= Math.exp(-6 * dt);
                bossPhys.moveVel.multiplyScalar(Math.exp(-8 * dt));
            }

            const dist = boss.pos.distanceTo(player.pos);
            const angleToPlayer = Math.atan2(player.pos.x - boss.pos.x, player.pos.z - boss.pos.z);
            if (boss.hp < boss.maxHp * 0.5 && boss.phase < 2) enterBossPhase2();

            switch (boss.state) {
                case 'PHASE_TRANS': {
                    boss.timer -= dt;
                    boss._phaseTransT = (boss._phaseTransT || 0) + dt;
                    const t = boss._phaseTransT;
                    const cocoon = boss._cocoon;
                    if (cocoon) {
                        cocoon.position.copy(boss.pos); cocoon.position.y = 4 + Math.sin(t * 4) * 0.3;
                        const pulse = 1 + Math.sin(t * 8) * 0.08 + t * 0.12;
                        cocoon.scale.set(pulse, pulse, pulse);
                        cocoon.rotation.y += dt * 2.5;
                        if (cocoon.material) cocoon.material.opacity = 0.35 + Math.sin(t * 6) * 0.25;
                        if (Math.random() < 0.5) {
                            const arch = boss.archetype || 'abyss';
                            const col = arch === 'fire' ? 0xff4400 : (arch === 'thunder' ? 0x88ccff : 0xaa44ff);
                            createDirectionalSparks(cocoon.position.clone(), 6, col, new THREE.Vector3(0, 1, 0), 12);
                        }
                        // 破繭爆發
                        if (t > 2.4 && !boss._phaseTransDone) {
                            boss._phaseTransDone = true;
                            // 碎片
                            for (let i = 0; i < 16; i++) {
                                const a = (i / 16) * Math.PI * 2;
                                const shard = new THREE.Mesh(
                                    new THREE.TetrahedronGeometry(0.6, 0),
                                    new THREE.MeshBasicMaterial({ color: 0xffeecc, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending })
                                );
                                shard.position.copy(cocoon.position);
                                scene.add(shard);
                                boss.projectiles.push({
                                    mesh: shard,
                                    velocity: new THREE.Vector3(Math.cos(a) * 18, 8 + Math.random() * 10, Math.sin(a) * 18),
                                    life: 1.2, damage: 0, type: 'CAST_HALO'
                                });
                            }
                        }
                    }
                    if (boss.timer <= 0) {
                        finishBossPhase2();
                    }
                    break;
                }
                case 'STUNNED':
                    boss.timer -= dt;
                    bossModel.group.rotation.z = Math.sin(now * 12) * 0.08;
                    bossModel.headGroup.rotation.x = 0.25;
                    if (boss.timer <= 0) {
                        boss.state = 'IDLE';
                        boss.timer = 0.4;
                        bossModel.group.rotation.z = 0;
                        bossModel.headGroup.rotation.x = 0;
                    }
                    break;
                case 'IDLE':
                    bossGroup.rotation.y = THREE.MathUtils.lerp(bossGroup.rotation.y, angleToPlayer, dt * 9);
                    boss.timer -= dt;
                    if (boss.timer <= 0) {
                        pickBossAction(dist);
                    }
                    break;

                case 'CIRCLING':
                    bossGroup.rotation.y = THREE.MathUtils.lerp(bossGroup.rotation.y, angleToPlayer, dt * 11); 
                    boss.timer -= dt;
                    {
                        const rightDir = new THREE.Vector3(-1, 0, 0).applyAxisAngle(new THREE.Vector3(0,1,0), bossGroup.rotation.y);
                        bossPhys.moveVel.x = rightDir.x * boss.circleDir * 4.0;
                        bossPhys.moveVel.z = rightDir.z * boss.circleDir * 4.0;
                        boss.pos.x += bossPhys.moveVel.x * dt;
                        boss.pos.z += bossPhys.moveVel.z * dt;
                        const pushDir = boss.pos.clone().sub(player.pos); pushDir.y = 0;
                        if (pushDir.lengthSq() > 0.01) {
                            pushDir.normalize();
                            const desired = player.pos.clone().add(pushDir.multiplyScalar(6.2));
                            boss.pos.x += (desired.x - boss.pos.x) * (1 - Math.exp(-3.2 * dt));
                            boss.pos.z += (desired.z - boss.pos.z) * (1 - Math.exp(-3.2 * dt));
                        }
                        bossPhys.walkPhase += dt * 6.5;
                        if (bossModel.legL) {
                            const sw = Math.sin(bossPhys.walkPhase) * 0.36;
                            const bk = 1 - Math.exp(-8 * dt);
                            bossModel.legL.rotation.x += (sw - bossModel.legL.rotation.x) * bk;
                            bossModel.legR.rotation.x += (-sw - bossModel.legR.rotation.x) * bk;
                        }
                    }

                    if (boss.timer <= 0) {
                        pickBossMelee();
                    }
                    break;

                case 'PURSUE':
                    bossGroup.rotation.y = THREE.MathUtils.lerp(bossGroup.rotation.y, angleToPlayer, dt * 9);
                    {
                        const toP = player.pos.clone().sub(boss.pos); toP.y = 0;
                        if (toP.lengthSq() > 0.01) toP.normalize();
                        // 加速追擊（物理感）
                        bossPhys.moveVel.x += toP.x * 22 * dt;
                        bossPhys.moveVel.z += toP.z * 22 * dt;
                        const bsp = Math.hypot(bossPhys.moveVel.x, bossPhys.moveVel.z);
                        const bmax = 6.4 * (boss.speedMul || 1);
                        if (bsp > bmax) { bossPhys.moveVel.x *= bmax / bsp; bossPhys.moveVel.z *= bmax / bsp; }
                        boss.pos.x += bossPhys.moveVel.x * dt;
                        boss.pos.z += bossPhys.moveVel.z * dt;
                        bossPhys.walkPhase += dt * 7.2;
                        if (bossModel.legL) {
                            const sw = Math.sin(bossPhys.walkPhase) * 0.42;
                            const bk = 1 - Math.exp(-8 * dt);
                            bossModel.legL.rotation.x += (sw - bossModel.legL.rotation.x) * bk;
                            bossModel.legR.rotation.x += (-sw - bossModel.legR.rotation.x) * bk;
                            bossModel.group.rotation.z += ((Math.sin(bossPhys.walkPhase) * 0.03) - bossModel.group.rotation.z) * bk;
                        }
                    }
                    if (dist <= 7.0) { 
                        boss.state = 'CIRCLING'; 
                        boss.timer = (0.3 + Math.random() * 0.6) * (boss.attackCdMul || 1); 
                        boss.circleDir = Math.random() < 0.5 ? 1 : -1; 
                    }
                    break;

                case 'WINDUP':
                    boss.timer -= dt;
                    // 蓄力時持續轉向玩家並微幅逼近
                    bossGroup.rotation.y = THREE.MathUtils.lerp(bossGroup.rotation.y, angleToPlayer, dt * 8);
                    {
                        const windProg = 1 - (boss.timer / Math.max(0.01, (boss._windupMax || 0.5)));
                        updateDragonFlight(dt, 'windup', Math.max(0, Math.min(1, windProg)));
                    }
                    {
                        const toP = player.pos.clone().sub(boss.pos); toP.y = 0;
                        if (toP.lengthSq() > 1) {
                            toP.normalize();
                            boss.pos.x += toP.x * 2.2 * dt * (boss.speedMul || 1);
                            boss.pos.z += toP.z * 2.2 * dt * (boss.speedMul || 1);
                        }
                    }
                    {
                        const t = boss.attackType;
                        const k = 1 - Math.exp(-10 * dt);
                        if (t === 'SWIPE') {
                            bossModel.rightArmGroup.rotation.x += (-Math.PI * 0.35 - bossModel.rightArmGroup.rotation.x) * k;
                            bossModel.rightArmGroup.rotation.z += (Math.PI * 0.55 - bossModel.rightArmGroup.rotation.z) * k;
                            bossModel.leftArmGroup.rotation.x += (0.2 - bossModel.leftArmGroup.rotation.x) * k;
                        } else if (t === 'MACE_SMASH') {
                            bossModel.rightArmGroup.rotation.x += (-Math.PI * 1.15 - bossModel.rightArmGroup.rotation.x) * k;
                            bossModel.rightArmGroup.rotation.z += (-0.2 - bossModel.rightArmGroup.rotation.z) * k;
                            bossModel.group.position.y = THREE.MathUtils.lerp(bossModel.group.position.y, 0.6, k);
                        } else if (t === 'THREE_COMBO') {
                            bossModel.rightArmGroup.rotation.x += (-Math.PI * 0.55 - bossModel.rightArmGroup.rotation.x) * k;
                            bossModel.leftArmGroup.rotation.x += (-Math.PI * 0.35 - bossModel.leftArmGroup.rotation.x) * k;
                        } else if (t === 'SPIN_ATTACK') {
                            bossModel.rightArmGroup.rotation.x += (-0.4 - bossModel.rightArmGroup.rotation.x) * k;
                            bossModel.leftArmGroup.rotation.x += (-0.4 - bossModel.leftArmGroup.rotation.x) * k;
                            bossModel.rightArmGroup.rotation.z += (0.9 - bossModel.rightArmGroup.rotation.z) * k;
                            bossModel.leftArmGroup.rotation.z += (-0.9 - bossModel.leftArmGroup.rotation.z) * k;
                        } else if (t === 'STOMP_AOE') {
                            bossModel.group.position.y = THREE.MathUtils.lerp(bossModel.group.position.y, 1.4, k);
                            bossModel.rightArmGroup.rotation.x += (0.4 - bossModel.rightArmGroup.rotation.x) * k;
                            bossModel.leftArmGroup.rotation.x += (0.4 - bossModel.leftArmGroup.rotation.x) * k;
                        } else if (t === 'UPPERCUT') {
                            bossModel.rightArmGroup.rotation.x += (Math.PI * 0.35 - bossModel.rightArmGroup.rotation.x) * k;
                            bossModel.rightArmGroup.rotation.z += (-0.55 - bossModel.rightArmGroup.rotation.z) * k;
                        } else if (t === 'CHARGE_THRUST') {
                            bossModel.rightArmGroup.rotation.x += (-Math.PI * 0.25 - bossModel.rightArmGroup.rotation.x) * k;
                            bossModel.rightArmGroup.rotation.z += (0.15 - bossModel.rightArmGroup.rotation.z) * k;
                            bossModel.group.position.y = THREE.MathUtils.lerp(bossModel.group.position.y, 0.25, k);
                        } else if (t === 'DARK_SHOCKWAVE') {
                            bossModel.leftArmGroup.rotation.x += (-Math.PI * 0.85 - bossModel.leftArmGroup.rotation.x) * k;
                            bossModel.rightArmGroup.rotation.x += (-Math.PI * 0.85 - bossModel.rightArmGroup.rotation.x) * k;
                            bossModel.coreMesh.material.emissiveIntensity = 0.9 + Math.sin(performance.now() * 0.025) * 0.7;
                        } else if (t === 'DARK_ORB_BARRAGE') {
                            bossModel.leftArmGroup.rotation.x += (-Math.PI * 0.75 - bossModel.leftArmGroup.rotation.x) * k;
                            bossModel.rightArmGroup.rotation.x += (-Math.PI * 0.35 - bossModel.rightArmGroup.rotation.x) * k;
                            bossModel.coreMesh.material.emissiveIntensity = 0.8 + Math.sin(performance.now() * 0.03) * 0.8;
                        } else if (t === 'ABYSS_SPIKES') {
                            bossModel.leftArmGroup.rotation.x += (Math.PI * 0.2 - bossModel.leftArmGroup.rotation.x) * k;
                            bossModel.rightArmGroup.rotation.x += (Math.PI * 0.2 - bossModel.rightArmGroup.rotation.x) * k;
                            bossModel.group.position.y = THREE.MathUtils.lerp(bossModel.group.position.y, -0.4, k);
                            bossModel.coreMesh.material.emissiveIntensity = 1.0 + Math.sin(performance.now() * 0.04) * 0.5;
                        } else {
                            bossModel.rightArmGroup.rotation.x += (-Math.PI * 0.95 - bossModel.rightArmGroup.rotation.x) * k;
                        }
                        if (boss.telegraph) {
                            const pulse = 0.55 + 0.45 * Math.abs(Math.sin(performance.now() * 0.01));
                            boss.telegraph.traverse((o) => {
                                if (o.material && o.material.opacity != null) {
                                    const base = o.material.userData && o.material.userData.baseOp;
                                    o.material.opacity = Math.min(1.0, pulse * 0.95);
                                }
                            });
                            boss.telegraph.position.x = boss.pos.x;
                            boss.telegraph.position.z = boss.pos.z;
                            // 扇形隨面向旋轉
                            if (boss.telegraph.children[0] && boss.telegraph.children[0].rotation) {
                                const fan = boss.telegraph.children[0];
                                if (fan.geometry && fan.geometry.type === 'RingGeometry' && fan.geometry.parameters && fan.geometry.parameters.thetaLength) {
                                    fan.rotation.z = bossGroup.rotation.y - Math.PI * 0.15;
                                    if (boss.telegraph.children[1]) boss.telegraph.children[1].rotation.z = fan.rotation.z;
                                }
                            }
                        }
                    }
                    if (boss.timer <= 0) { 
                        boss.state = 'ATTACKING'; 
                        boss.timer = boss.attackDuration; 
                        boss.hitDone = false; 
                        clearBossTelegraph();
                    }
                    break;

                case 'ATTACKING':
                    boss.timer -= dt;
                    const atkProg = 1 - (boss.timer / boss.attackDuration);
                    const attackCurve = easeOutCubic(atkProg);
                    updateDragonFlight(dt, 'attack', atkProg);
                    if (!boss._skillVfxDone && atkProg > 0.12) {
                        boss._skillVfxDone = true;
                        spawnSkillImpactVFX(boss.attackType);
                    }
                    // 攻擊中持續鎖面向（避免側身揮空）
                    if (boss.attackType !== 'SPIN_ATTACK') {
                        bossGroup.rotation.y = THREE.MathUtils.lerp(bossGroup.rotation.y, angleToPlayer, dt * 10);
                    }

                    // 每招打擊動作不同
                    {
                        const t = boss.attackType;
                        const k = 1 - Math.exp(-(12 + atkProg * 18) * dt);
                        if (t === 'SWIPE') {
                            bossModel.rightArmGroup.rotation.z += (-Math.PI * 1.1 - bossModel.rightArmGroup.rotation.z) * k;
                            bossModel.rightArmGroup.rotation.x += (-0.2 - bossModel.rightArmGroup.rotation.x) * k;
                            const step = new THREE.Vector3(Math.sin(bossGroup.rotation.y), 0, Math.cos(bossGroup.rotation.y));
                            boss.pos.addScaledVector(step, 6.5 * dt);
                        } else if (t === 'MACE_SMASH') {
                            bossModel.rightArmGroup.rotation.x += (Math.PI * 0.85 - bossModel.rightArmGroup.rotation.x) * k;
                            bossModel.group.position.y = THREE.MathUtils.lerp(bossModel.group.position.y, atkProg < 0.5 ? 1.1 : -0.35, k);
                        } else if (t === 'SPIN_ATTACK') {
                            bossGroup.rotation.y += Math.PI * 3.4 * dt;
                            bossModel.rightArmGroup.rotation.z = Math.sin(atkProg * Math.PI * 4) * 1.2;
                            bossModel.leftArmGroup.rotation.z = -Math.sin(atkProg * Math.PI * 4) * 1.2;
                        } else if (t === 'STOMP_AOE') {
                            bossModel.group.position.y = atkProg < 0.45 ? THREE.MathUtils.lerp(bossModel.group.position.y, 2.2, k) : THREE.MathUtils.lerp(bossModel.group.position.y, -0.5, k);
                        } else if (t === 'UPPERCUT') {
                            bossModel.rightArmGroup.rotation.x += (-Math.PI * 1.15 - bossModel.rightArmGroup.rotation.x) * k;
                            bossModel.rightArmGroup.rotation.z += (0.55 - bossModel.rightArmGroup.rotation.z) * k;
                            bossModel.group.position.y = Math.sin(Math.min(1, atkProg * 1.4) * Math.PI) * 0.8;
                        } else if (t === 'CHARGE_THRUST' || t === 'STORM_DASH' || t === 'FLASH_STEP' || t === 'AERIAL_DIVE') {
                            if (bossModel.rightArmGroup) bossModel.rightArmGroup.rotation.x += (-Math.PI * 0.15 - bossModel.rightArmGroup.rotation.x) * k;
                            const dir = player.pos.clone().sub(boss.pos); dir.y = 0;
                            if (dir.lengthSq() > 0.01) dir.normalize();
                            const spd = t === 'FLASH_STEP' ? 50 : (t === 'STORM_DASH' ? 42 : (t === 'AERIAL_DIVE' ? 38 : 32));
                            boss.pos.addScaledVector(dir, spd * dt * (boss.speedMul || 1));
                            if ((t === 'STORM_DASH' || t === 'FLASH_STEP') && Math.random() < 0.45) {
                                createDirectionalSparks(boss.pos.clone().add(new THREE.Vector3(0, 2, 0)), 6, 0x88ccff, dir, 14);
                            }
                            if (t === 'AERIAL_DIVE') {
                                bossModel.group.position.y = Math.sin(Math.min(1, atkProg) * Math.PI) * 2.2;
                            }
                        } else if (t === 'DARK_SHOCKWAVE') {
                            bossModel.leftArmGroup.rotation.x += (0.3 - bossModel.leftArmGroup.rotation.x) * k;
                            bossModel.rightArmGroup.rotation.x += (0.3 - bossModel.rightArmGroup.rotation.x) * k;
                            bossModel.group.position.y = THREE.MathUtils.lerp(bossModel.group.position.y, 0.5, k);
                        } else if (t === 'DARK_ORB_BARRAGE') {
                            bossModel.leftArmGroup.rotation.x = -Math.PI * 0.65 + Math.sin(atkProg * Math.PI * 4) * 0.35;
                        } else if (t === 'ABYSS_SPIKES') {
                            bossModel.group.position.y = THREE.MathUtils.lerp(bossModel.group.position.y, -0.2, k);
                            bossModel.leftArmGroup.rotation.x += (-0.5 - bossModel.leftArmGroup.rotation.x) * k;
                            bossModel.rightArmGroup.rotation.x += (-0.5 - bossModel.rightArmGroup.rotation.x) * k;
                        } else if (t === 'THREE_COMBO' || t === 'FIVE_COMBO' || t === 'FURY_BLADE' || t === 'SIX_COMBO' || t === 'SIDE_SWEEP_COMBO' || t === 'PIERCE_COMBO') {
                            const n = t === 'THREE_COMBO' || t === 'SIDE_SWEEP_COMBO' || t === 'PIERCE_COMBO' ? 3 : (t === 'SIX_COMBO' ? 6 : 5);
                            const phase = Math.floor(atkProg * n);
                            const local = (atkProg * n - phase);
                            const swing = Math.sin(local * Math.PI);
                            bossModel.rightArmGroup.rotation.x = -Math.PI * 0.3 + swing * (phase % 2 === 0 ? -1.4 : 1.1);
                            bossModel.leftArmGroup.rotation.x = phase % 2 === 1 ? -Math.PI * 0.8 : -0.2;
                            bossModel.body && (bossModel.group.rotation.y += (phase % 2 === 0 ? 1 : -1) * 1.8 * dt);
                            const step = new THREE.Vector3(Math.sin(bossGroup.rotation.y), 0, Math.cos(bossGroup.rotation.y));
                            boss.pos.addScaledVector(step, 5 * dt);
                        } else if (t === 'CROSS_SLASH' || t === 'DOUBLE_CROSS') {
                            const seg = t === 'DOUBLE_CROSS' ? 4 : 2;
                            const local = (atkProg * seg) % 1;
                            if (Math.floor(atkProg * seg) % 2 === 0) {
                                bossModel.rightArmGroup.rotation.z = -Math.PI * 1.3 * local;
                                bossModel.rightArmGroup.rotation.x = -0.35;
                            } else {
                                bossModel.leftArmGroup.rotation.z = Math.PI * 1.3 * local;
                                bossModel.leftArmGroup.rotation.x = -0.35;
                            }
                        } else if (t === 'LEAP_SLAM') {
                            const up = atkProg < 0.4;
                            bossModel.group.position.y = up ? atkProg / 0.4 * 2.5 : Math.max(-0.3, 2.5 - (atkProg - 0.4) / 0.3 * 3);
                            bossModel.rightArmGroup.rotation.x = up ? -Math.PI * 1.2 * (atkProg / 0.4) : Math.PI * 0.8;
                            bossModel.leftArmGroup.rotation.x = bossModel.rightArmGroup.rotation.x * 0.8;
                        } else if (t === 'GROUND_CRUSH' || t === 'HEAVEN_FALL') {
                            bossModel.rightArmGroup.rotation.x = atkProg < 0.45 ? -Math.PI * 1.3 * (atkProg / 0.45) : Math.PI * 0.9 * ((atkProg - 0.45) / 0.55);
                            bossModel.leftArmGroup.rotation.x = bossModel.rightArmGroup.rotation.x;
                            bossModel.group.position.y = atkProg < 0.45 ? 1.8 * (atkProg / 0.45) : Math.max(-0.4, 1.8 - 4 * (atkProg - 0.45));
                        } else if (t === 'GRAB_RUSH') {
                            bossModel.rightArmGroup.rotation.x = -0.4;
                            bossModel.leftArmGroup.rotation.x = -0.4;
                            const dir = player.pos.clone().sub(boss.pos); dir.y = 0;
                            if (dir.lengthSq() > 0.01) dir.normalize();
                            boss.pos.addScaledVector(dir, 28 * dt * (boss.speedMul || 1));
                        } else if (t === 'VOID_RAIN') {
                            bossModel.leftArmGroup.rotation.x = -Math.PI * 0.9;
                            bossModel.rightArmGroup.rotation.x = -Math.PI * 0.7 + Math.sin(atkProg * 20) * 0.3;
                            bossModel.coreMesh.material.emissiveIntensity = 1.5 + Math.sin(performance.now() * 0.04) * 0.8;
                        } else {
                            bossModel.rightArmGroup.rotation.x += (Math.PI * 0.95 - bossModel.rightArmGroup.rotation.x) * k;
                        }
                    }

                    // 連段／特殊招式命中
                    const meta = ATTACK_META[boss.attackType] || { hits: [0.45], dmg: 42 };
                    if (boss.attackType === 'DARK_ORB_BARRAGE' || boss.attackType === 'VOID_RAIN' || boss.attackType === 'FIREBALL' || boss.attackType === 'STORM_SPHERE' || boss.attackType === 'STORM_BARRAGE') {
                        const thresholds = boss.attackType === 'VOID_RAIN' || boss.attackType === 'STORM_BARRAGE' ? [0.2, 0.35, 0.5, 0.65, 0.8]
                            : (boss.attackType === 'FIREBALL') ? [0.18, 0.35, 0.52, 0.7, 0.88]
                            : (boss.attackType === 'STORM_SPHERE') ? [0.25, 0.45, 0.65, 0.85] : [0.25, 0.5, 0.75];
                        while (boss.hitCount < thresholds.length && atkProg > thresholds[boss.hitCount]) {
                            if (boss.attackType === 'FIREBALL') spawnBossProjectile('FIREBALL');
                            else if (boss.attackType === 'STORM_SPHERE' || boss.attackType === 'STORM_BARRAGE') spawnBossProjectile('STORM_ORB');
                            else {
                                spawnBossProjectile('DARK_ORB');
                                if (boss.attackType === 'VOID_RAIN') setTimeout(() => spawnBossProjectile('DARK_ORB'), 80);
                            }
                            boss.hitCount++;
                        }
                    } else if (boss.attackType === 'THUNDER_BOLT' || boss.attackType === 'METEOR_RAIN' || boss.attackType === 'SKY_SPEAR') {
                        const thresholds = boss.attackType === 'METEOR_RAIN' ? [0.25, 0.4, 0.55, 0.7, 0.85]
                            : (boss.attackType === 'SKY_SPEAR' ? [0.3, 0.55, 0.8] : [0.35, 0.6, 0.85]);
                        while (boss.hitCount < thresholds.length && atkProg > thresholds[boss.hitCount]) {
                            spawnBossProjectile(boss.attackType === 'METEOR_RAIN' ? 'METEOR' : 'THUNDER');
                            boss.hitCount++;
                        }
                    } else if (boss.attackType === 'ABYSS_SPIKES') {
                        if (boss.hitCount === 0 && atkProg > 0.35) {
                            spawnBossProjectile('ABYSS_SPIKE');
                            setTimeout(() => spawnBossProjectile('ABYSS_SPIKE'), 150);
                            setTimeout(() => spawnBossProjectile('ABYSS_SPIKE'), 300);
                            if (boss.phase >= 2) setTimeout(() => spawnBossProjectile('ABYSS_SPIKE'), 450);
                            boss.hitCount = 1;
                        }
                    } else if (boss.attackType === 'DARK_SHOCKWAVE') {
                        if (boss.hitCount === 0 && atkProg > 0.48) {
                            const ringGeo = new THREE.RingGeometry(0.4, 1.2, 48);
                            const ringMat = new THREE.MeshBasicMaterial({ color: 0x8844ff, side: THREE.DoubleSide, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
                            const ring = new THREE.Mesh(ringGeo, ringMat);
                            ring.rotation.x = -Math.PI / 2;
                            ring.position.copy(boss.pos); ring.position.y = 0.1;
                            scene.add(ring);
                            boss.projectiles.push({
                                mesh: ring, velocity: new THREE.Vector3(), life: 1.6, damage: 36 * (boss.dmgMul || 1),
                                type: 'RING_WAVE', radius: 1.2, expandSpeed: 24, hitPlayers: new Set()
                            });
                            createAOEShockwave(boss.pos, 3.0, 0x8844ff, 30);
                            triggerCameraShake(0.9);
                            boss.hitCount = 1;
                        }
                    } else {
                        // 多段近戰：每一段獨立判定（彈反只能擋其中一段）
                        const hits = meta.hits || [0.45];
                        while (boss.hitCount < hits.length && atkProg > hits[boss.hitCount]) {
                            if (meta.aoe || boss.attackType === 'STOMP_AOE' || boss.attackType === 'GROUND_CRUSH' || boss.attackType === 'HEAVEN_FALL' || boss.attackType === 'LEAP_SLAM' || boss.attackType === 'WING_SLAM' || boss.attackType === 'OVERCHARGE') {
                                const rad = boss.attackType === 'HEAVEN_FALL' || boss.attackType === 'OVERCHARGE' ? 14 : (boss.attackType === 'GROUND_CRUSH' || boss.attackType === 'LEAP_SLAM' || boss.attackType === 'WING_SLAM' ? 11 : 10);
                                const col = boss.attackType === 'HEAVEN_FALL' ? 0xffee88 : 0xff2200;
                                createAOEShockwave(boss.pos.clone(), rad / 8, col, 40 + rad);
                                triggerCameraShake(0.75);
                            }
                            if (boss.attackType === 'GRAB_RUSH') {
                                const dir = player.pos.clone().sub(boss.pos); dir.y = 0;
                                if (dir.lengthSq() > 0.01) dir.normalize();
                                boss.pos.addScaledVector(dir, 2.5);
                            }
                            checkBossHitbox();
                            boss.hitCount++;
                        }
                    }

                    if (boss.timer <= 0) { 
                        boss.state = 'RECOVERY'; 
                        // 恢復時間稍微縮短，提高攻擊節奏
                        boss.timer = (boss.attackType === 'THREE_COMBO' || boss.attackType === 'SPIN_ATTACK') ? 0.55 : 0.7; 
                    } 
                    break;

                case 'RECOVERY':
                    boss.timer -= dt;
                    bossModel.rightArmGroup.rotation.x = THREE.MathUtils.lerp(bossModel.rightArmGroup.rotation.x, 0, dt * 5);
                    bossModel.rightArmGroup.rotation.z = THREE.MathUtils.lerp(bossModel.rightArmGroup.rotation.z, 0, dt * 5);
                    bossModel.leftArmGroup.rotation.x = THREE.MathUtils.lerp(bossModel.leftArmGroup.rotation.x, 0, dt * 5);
                    bossModel.leftArmGroup.rotation.z = THREE.MathUtils.lerp(bossModel.leftArmGroup.rotation.z, 0, dt * 5);
                    bossModel.group.position.y = THREE.MathUtils.lerp(bossModel.group.position.y, 0, dt * 6);
                    bossModel.coreMesh.material.emissiveIntensity = THREE.MathUtils.lerp(bossModel.coreMesh.material.emissiveIntensity, 0.8, dt * 3);
                    if (boss.timer <= 0) { 
                        boss.state = 'IDLE'; 
                        // 更短的 idle，讓攻擊更頻繁
                        boss.timer = Math.random() * 0.25 + 0.18; 
                    }
                    break;

                case 'STAGGERED':
                    boss.timer -= dt;
                    bossModel.group.rotation.z = 0.55; 
                    bossModel.group.position.y = -1.3;
                    if (boss.timer <= 0) { 
                        boss.state = 'IDLE'; 
                        boss.posture = 0; 
                        boss.isBeingCrit = false;
                        bossModel.group.rotation.z = 0; 
                        bossModel.group.position.y = 0; 
                        critMarker.visible = false; 
                        boss.timer = 0.4;
                    }
                    break;
            }
            if (boss.state !== 'STAGGERED' && boss.posture > 0) boss.posture = Math.max(0, boss.posture - 7.0 * dt);
            if (boss.state === 'IDLE' || boss.state === 'DEAD' || boss.state === 'CIRCLING' || boss.state === 'PURSUE') {
                const label = document.getElementById('boss-atk-name');
                if (label && label.classList.contains('show')) {
                    label.classList.remove('show');
                    label.classList.remove('unblock');
                    label.innerText = '';
                    label.style.opacity = '';
                }
            } else {
                keepBossAtkLabel();
            }
        }

        function checkBossHitbox() {
            const dist = boss.pos.distanceTo(player.pos);
            const meta = ATTACK_META[boss.attackType] || { dmg: 42, unblockable: false };
            let hitRange = 9.8;
            let isAOE = !!meta.aoe;

            if (boss.attackType === 'STOMP_AOE' || boss.attackType === 'GROUND_CRUSH') { hitRange = 12.5; isAOE = true; }
            if (boss.attackType === 'HEAVEN_FALL') { hitRange = 15.0; isAOE = true; }
            if (boss.attackType === 'SPIN_ATTACK') { hitRange = 12.0; isAOE = true; }
            if (boss.attackType === 'DARK_SHOCKWAVE') { hitRange = 15.0; isAOE = true; }
            if (boss.attackType === 'UPPERCUT' || boss.attackType === 'MACE_SMASH') { hitRange = 10.5; }
            if (boss.attackType === 'CHARGE_THRUST' || boss.attackType === 'GRAB_RUSH') { hitRange = 11.5; }
            if (boss.attackType === 'SWIPE' || boss.attackType === 'CROSS_SLASH') { hitRange = 11.0; }
            if (boss.attackType === 'THREE_COMBO' || boss.attackType === 'FIVE_COMBO' || boss.attackType === 'FURY_BLADE' || boss.attackType === 'SIX_COMBO' || boss.attackType === 'SIDE_SWEEP_COMBO' || boss.attackType === 'PIERCE_COMBO' || boss.attackType === 'DOUBLE_CROSS') { hitRange = 10.8; }
            if (boss.attackType === 'LEAP_SLAM' || boss.attackType === 'WING_SLAM' || boss.attackType === 'OVERCHARGE') { hitRange = 12.5; isAOE = true; }
            if (boss.attackType === 'FIRE_BREATH' || boss.attackType === 'DOUBLE_BREATH') { hitRange = 18.0; }
            if (boss.attackType === 'ROAR_BLAST') { hitRange = 16.0; isAOE = true; }
            if (boss.attackType === 'TAIL_SWEEP' || boss.attackType === 'TAIL_WHIP') { hitRange = 11.5; isAOE = true; }
            if (boss.attackType === 'CLAW_FRENZY' || boss.attackType === 'CHAIN_LIGHTNING') { hitRange = 11.0; }
            if (boss.attackType === 'STORM_DASH' || boss.attackType === 'FLASH_STEP' || boss.attackType === 'AERIAL_DIVE') { hitRange = 12.0; }
            if (boss.attackType === 'ROAR_BLAST' || boss.attackType === 'STATIC_NOVA' || boss.attackType === 'LAVA_POOL' || boss.attackType === 'LIGHTNING_FIELD') { hitRange = 12.5; isAOE = true; }
            if (boss.attackType === 'FIRE_SPIN' || boss.attackType === 'THUNDER_CLAW' || boss.attackType === 'DOUBLE_BREATH') { hitRange = 11.5; }
            if (boss.attackType === 'STOMP_FIRE') { hitRange = 11.0; isAOE = true; }
            hitRange *= 1 + 0.08 * ((boss.def && boss.def.id) || 1);
            if (boss.phase >= 2) hitRange *= 1.06;

            const dirToPlayer = player.pos.clone().sub(boss.pos); dirToPlayer.y = 0;
            if (dirToPlayer.lengthSq() > 0.01) dirToPlayer.normalize();
            const bossLookDir = new THREE.Vector3(Math.sin(bossGroup.rotation.y), 0, Math.cos(bossGroup.rotation.y));
            
            if (dist < hitRange && (isAOE || bossLookDir.dot(dirToPlayer) > -0.15 || dist < 5.5)) {
                if (player.iframe) { 
                    createDamageNumber("DODGE!", player.pos.clone().add(new THREE.Vector3(0, 2, 0))); 
                    return; 
                }

                // 不可彈反／格擋招式（紅字警告）
                if (meta.unblockable) {
                    const dmg = Math.round((meta.dmg || 55) * (boss.dmgMul || 1));
                    hurtPlayer(dmg, '不可防 -' + dmg);
                    createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1.2, 0)), 70, 0xff0000, dirToPlayer, 20);
                    createImpactFlash(player.pos.clone().add(new THREE.Vector3(0, 1.5, 0)), 0xff2200, 3.2);
                    triggerCameraShake(1.0);
                    hitstopTimer = 0.12;
                    return;
                }

                // 彈反／防反：只能化解「當前這一段」
                if ((player.counterWindow > 0 && tryCounterWindow()) || (player.parryWindow > 0 && tryParrySuccess())) {
                    return;
                }
                if (player.isBlocking) {
                    player.stamina = Math.max(0, player.stamina - 52); 
                    hurtPlayer(Math.round(12 * (boss.dmgMul || 1)), 'GUARD -0');
                    createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1.2, 0)), 30, 0xffffff, dirToPlayer, 14);
                    triggerCameraShake(0.38); 
                    return;
                }

                const dmg = Math.round((meta.dmg || 42) * (boss.dmgMul || 1));
                hurtPlayer(dmg);
                createDirectionalSparks(player.pos.clone().add(new THREE.Vector3(0, 1.2, 0)), 60, 0xff2200, dirToPlayer, 18);
                createImpactFlash(player.pos.clone().add(new THREE.Vector3(0, 1.5, 0)), 0xff4400, 2.8);
                triggerCameraShake(0.85); 
                hitstopTimer = 0.1;
            }
        }

        /* --- 8. 相機與環境粒子更新 --- */
        // 鏡頭震動相位（平滑正弦，避免亂數抽搐）
        let camShakePhase = 0;
        let camShakeAmp = 0;

        function updateCamera(dt) {
            // 速度感 FOV + 平滑回彈（限制突變幅度）
            const spdFov = 58 + walkIntensitySafe() * 2.5 + (player.speedBoostTimer > 0 ? 3 : 0);
            targetFov += (58 - targetFov) * (1 - Math.exp(-2.2 * dt));
            // 限制 targetFov 範圍，避免技能狂踢 FOV
            targetFov = THREE.MathUtils.clamp(targetFov, 48, 68);
            const wantFov = player.state === 'ROLL' ? Math.max(targetFov, 64) : (player.lockOn ? targetFov : spdFov);
            camera.fov = THREE.MathUtils.lerp(camera.fov, wantFov, 1 - Math.exp(-4 * dt));
            camera.updateProjectionMatrix();

            const bossDist = player.pos.distanceTo(boss.pos);
            // Boss 貼臉時略為拉開鏡頭
            const proximityBoost = bossDist < 8 ? THREE.MathUtils.smoothstep(8 - bossDist, 0, 6) * 3.5 : 0;

            let desiredPos, desiredLook;
            if (player.lockOn) {
                // 穩定的水平方向：避免距離過近時 normalize 抖動
                let dir = player.pos.clone().sub(boss.pos); dir.y = 0;
                const dirLen = Math.sqrt(dir.x * dir.x + dir.z * dir.z);
                if (dirLen < 1.2) {
                    // 過近：沿用上一幀相機方位，不要翻轉
                    dir.set(Math.sin(camYaw), 0, Math.cos(camYaw));
                } else {
                    dir.multiplyScalar(1 / dirLen);
                }
                // 距離越近，鏡頭越遠、越高，避免塞進 Boss 模型
                const backDist = 10.2 + proximityBoost + (bossDist < 6 ? 2.5 : 0);
                const height = 5.0 + proximityBoost * 0.35;
                desiredPos = player.pos.clone().add(dir.clone().multiplyScalar(backDist)).add(new THREE.Vector3(0, height, 0));
                // 看點：偏向玩家，減少 Boss 衝刺時 midPoint 狂跳
                const lookBias = bossDist < 7 ? 0.72 : 0.5;
                desiredLook = player.pos.clone().multiplyScalar(lookBias).add(boss.pos.clone().multiplyScalar(1 - lookBias));
                desiredLook.y = 2.2 + Math.min(2.0, bossDist * 0.08);

                const lockUi = document.getElementById('lock-on-marker');
                lockUi.style.display = 'block';
                const screenPos = boss.pos.clone().add(new THREE.Vector3(0, 4.5, 0)).project(camera);
                lockUi.style.left = `${(screenPos.x * 0.5 + 0.5) * window.innerWidth}px`;
                lockUi.style.top = `${(-(screenPos.y * 0.5) + 0.5) * window.innerHeight}px`;
                camYaw = Math.atan2(desiredPos.x - player.pos.x, desiredPos.z - player.pos.z);
            } else {
                document.getElementById('lock-on-marker').style.display = 'none';
                const dist = camDistance + walkIntensitySafe() * 0.4 + proximityBoost;
                const cx = player.pos.x + dist * Math.sin(camYaw) * Math.cos(camPitch);
                const cy = player.pos.y + dist * Math.sin(camPitch) + 2.35 + proximityBoost * 0.2;
                const cz = player.pos.z + dist * Math.cos(camYaw) * Math.cos(camPitch);
                desiredPos = new THREE.Vector3(cx, cy, cz);
                desiredLook = player.pos.clone().add(new THREE.Vector3(0, 1.75 + walkIntensitySafe() * 0.1, 0));
            }

            // Boss 衝刺時降低跟隨速度，減少抽搐
            const bossCharging = boss.state === 'ATTACKING' && (
                boss.attackType === 'CHARGE_THRUST' || boss.attackType === 'GRAB_RUSH' ||
                boss.attackType === 'STORM_DASH' || boss.attackType === 'FLASH_STEP' ||
                boss.attackType === 'AERIAL_DIVE'
            );
            const baseFollow = player.lockOn ? 4.2 : 6.5;
            const followRate = bossCharging ? baseFollow * 0.55 : (bossDist < 6 ? baseFollow * 0.7 : baseFollow);
            const follow = 1 - Math.exp(-followRate * dt);
            camSmooth.pos.lerp(desiredPos, follow);
            camSmooth.look.lerp(desiredLook, follow * 0.95);

            // 防止鏡頭穿入 Boss
            {
                const toCam = camSmooth.pos.clone().sub(boss.pos);
                const minR = 4.5;
                const d = Math.sqrt(toCam.x * toCam.x + toCam.z * toCam.z);
                if (d < minR && d > 0.01) {
                    const push = (minR - d) / d;
                    camSmooth.pos.x += toCam.x * push;
                    camSmooth.pos.z += toCam.z * push;
                    camSmooth.pos.y = Math.max(camSmooth.pos.y, boss.pos.y + 3.5);
                }
            }

            camera.position.copy(camSmooth.pos);
            camera.lookAt(camSmooth.look);

            // 平滑震動：正弦波疊加，而非每幀亂數
            if (camShakeAmp > 0.001) {
                camShakePhase += dt * 28;
                const damp = Math.exp(-3.2 * dt);
                camShakeAmp *= damp;
                const sx = Math.sin(camShakePhase * 1.7) * camShakeAmp * 0.55;
                const sy = Math.cos(camShakePhase * 2.1) * camShakeAmp * 0.4;
                const sz = Math.sin(camShakePhase * 1.3 + 1.2) * camShakeAmp * 0.35;
                camera.position.x += sx;
                camera.position.y += sy;
                camera.position.z += sz;
            } else {
                camShakeAmp = 0;
            }
            cameraShakeIntensity = camShakeAmp; // 兼容舊讀取
        }
        function triggerCameraShake(intensity) {
            // 上限與疊加柔和，避免衝撞連擊把鏡頭打爆
            const capped = Math.min(0.55, intensity * 0.65);
            camShakeAmp = Math.min(0.7, Math.max(camShakeAmp, capped) + capped * 0.15);
        }
        
        function updateFX(dt) {
            torchLights.forEach((light, i) => { light.intensity = 5.5 + Math.sin(performance.now() * 0.008 + i) * 1.1; });
            if (typeof arenaGlow !== 'undefined') arenaGlow.rotation.z = performance.now() * 0.00015;
            if (typeof arenaGlow2 !== 'undefined') arenaGlow2.rotation.z = -performance.now() * 0.0001;
            
            const pPositions = battlefieldEmbers.geometry.attributes.position.array;
            for(let i = 0; i < particleCount; i++) {
                pPositions[i*3 + 1] -= dt * 2;
                pPositions[i*3] += Math.sin(performance.now() * 0.001 + i) * 0.05;
                if(pPositions[i*3 + 1] < 0) pPositions[i*3 + 1] = 30;
            }
            battlefieldEmbers.geometry.attributes.position.needsUpdate = true;

            // 粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; 
                p.life -= dt;
                if (p.life <= 0) { scene.remove(p.system); particles.splice(i, 1); continue; }
                const posArr = p.system.geometry.attributes.position.array;
                const lifeRatio = p.life / p.maxLife;
                p.system.material.opacity = lifeRatio;
                p.system.material.size = 0.48 * (0.4 + lifeRatio * 0.6);
                for (let j = 0; j < p.velocities.length / 3; j++) { 
                    posArr[j * 3] += p.velocities[j * 3] * dt; 
                    posArr[j * 3 + 1] += p.velocities[j * 3 + 1] * dt; 
                    posArr[j * 3 + 2] += p.velocities[j * 3 + 2] * dt; 
                    // 重力
                    p.velocities[j * 3 + 1] -= 28 * dt;
                }
                p.system.geometry.attributes.position.needsUpdate = true;
            }

            // 衝擊波
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const s = shockwaves[i]; 
                s.scale += dt * (s.expandSpeed || 40); 
                s.opacity -= dt * 1.9;
                s.mesh.scale.set(s.scale, s.scale, s.scale); 
                s.mesh.material.opacity = Math.max(0, s.opacity);
                if (s.opacity <= 0) { scene.remove(s.mesh); shockwaves.splice(i, 1); }
            }

            // 命中閃光
            for (let i = impactFlashes.length - 1; i >= 0; i--) {
                const f = impactFlashes[i];
                f.life -= dt;
                const t = f.life / f.maxLife;
                f.mesh.scale.setScalar(f.baseScale * (1.8 - t * 0.8));
                f.mesh.material.opacity = t * 0.9;
                if (f.life <= 0) { scene.remove(f.mesh); impactFlashes.splice(i, 1); }
            }

            // 刀光殘影
            for (let i = trails.length - 1; i >= 0; i--) {
                const t = trails[i];
                t.life -= dt;
                t.mesh.material.opacity = (t.life / t.maxLife) * 0.7;
                if (t.life <= 0) { scene.remove(t.mesh); trails.splice(i, 1); }
            }
        }

        function updateUI() {
            const fc = document.getElementById('flask-count');
            if (fc) fc.innerText = String(player.flasks);
            document.getElementById('player-hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
            document.getElementById('player-stamina-bar').style.width = `${(player.stamina / player.maxStamina) * 100}%`;
            document.getElementById('boss-hp-bar').style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;
            document.getElementById('boss-posture-bar').style.width = `${(boss.posture / boss.maxPosture) * 100}%`;
            const maxCd = player.skillCdMax || 5;
            const shiftMax = player.shiftCdMax || 5;
            const wpn = selectedWeapon || {};
            const qName = document.getElementById('q-slot-name');
            const eName = document.getElementById('e-slot-name');
            const sName = document.getElementById('shift-slot-name');
            if (qName) qName.textContent = wpn.skillStyle === 'insect' ? '獵蟲' : (wpn.skillStyle === 'katana' ? '見切' : (wpn.skillStyle === 'dagger' ? '割喉' : (wpn.skillStyle === 'greatsword' ? '突刺' : (wpn.skillStyle === 'bow' ? '三連射' : '劍氣'))));
            if (eName) eName.textContent = wpn.skillStyle === 'insect' ? '飛蟲躍起' : (wpn.skillStyle === 'katana' ? '登龍' : (wpn.skillStyle === 'dagger' ? '分身' : (wpn.skillStyle === 'greatsword' ? '跳斬' : (wpn.skillStyle === 'bow' ? '後空翻射' : '突進'))));
            if (sName) {
                if (wpn.shiftMode === 'flash') sName.textContent = '雷閃' + (player.flashCharges != null ? player.flashCharges : 3);
                else sName.textContent = (wpn.shiftMode === 'whirl' || wpn.shiftMode === 'vault') ? '旋風斬' : (wpn.shiftMode === 'iai' ? '防反' : (wpn.shiftMode === 'scoop' ? '上撈' : (wpn.shiftMode === 'trap' ? '陷阱' : '彈反')));
            }

            function setSlotCd(fillId, textId, slotId, cd, max) {
                const fill = document.getElementById(fillId);
                const txt = document.getElementById(textId);
                const slot = document.getElementById(slotId);
                if (!fill || !slot) return;
                const ratio = cd > 0 ? (cd / Math.max(0.001, max)) * 100 : 0;
                fill.style.height = ratio + '%';
                if (txt) txt.textContent = cd > 0.05 ? Math.ceil(cd) : '';
                if (cd <= 0) slot.classList.add('ready'); else slot.classList.remove('ready');
            }
            setSlotCd('q-cd-fill', 'q-cd-text', 'q-slot', player.qCooldown, maxCd);
            setSlotCd('e-cd-fill', 'e-cd-text', 'e-slot', player.eCooldown, maxCd);
            setSlotCd('shift-cd-fill', 'shift-cd-text', 'shift-slot', player.shiftArtCd, shiftMax);
        }

        function triggerGameOver() { 
            player.state = 'DEAD'; 
            const endScreen = document.getElementById('end-screen'), endTitle = document.getElementById('end-title'); 
            endTitle.innerText = "YOU DIED"; 
            endTitle.className = "end-title died"; 
            endScreen.classList.add('show'); 
            document.exitPointerLock(); 
            gameStarted = false;
        }
        function triggerVictory() { 
            boss.state = 'DEAD'; 
            critMarker.visible = false; 
            document.getElementById('boss-ui').style.opacity = '0'; 
            const endScreen = document.getElementById('end-screen'), endTitle = document.getElementById('end-title'); 
            endTitle.innerText = "GREAT ENEMY FELLED"; 
            endTitle.className = "end-title felled"; 
            endScreen.classList.add('show'); 
            document.exitPointerLock(); 
            // 解鎖下一關
            if (selectedBossId === unlockedBoss && selectedBossId < 3) {
                unlockedBoss = selectedBossId + 1;
                try {
                    localStorage.setItem('abyss_unlock_v3', String(unlockedBoss));
                    localStorage.setItem('abyss_unlock', String(unlockedBoss));
                } catch (e) {}
            }
            // 掉落金幣 + 素材
            const rewards = {
                1: { gold: 120, mat: 'abyss_shard', matN: 1, matName: '深淵碎片' },
                2: { gold: 200, mat: 'fire_scale', matN: 1, matName: '炎龍鱗' },
                3: { gold: 320, mat: 'storm_core', matN: 1, matName: '雷核' }
            };
            const rw = rewards[selectedBossId] || rewards[1];
            economy.gold += rw.gold;
            economy.mats[rw.mat] = (economy.mats[rw.mat] | 0) + rw.matN;
            saveEconomy();
            endTitle.innerText = "GREAT ENEMY FELLED";
            const dropInfo = document.createElement('div');
            dropInfo.style.cssText = 'color:#d4af37;font-size:16px;margin-top:12px;letter-spacing:2px;';
            dropInfo.textContent = '獲得 金幣 +' + rw.gold + '　' + rw.matName + ' ×' + rw.matN;
            endTitle.parentNode.insertBefore(dropInfo, endTitle.nextSibling);
            setTimeout(() => { try { dropInfo.remove(); } catch(e){} }, 8000);
            gameStarted = false;
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate); 
            let dt = Math.min(clock.getDelta(), 0.1);
            if (hitstopTimer > 0) { 
                hitstopTimer -= dt; 
                renderer.render(scene, camera); 
                return; 
            }
            if (gameStarted) {
                updatePlayer(dt);
                if (typeof updateIgAura === 'function') updateIgAura(dt);
                updateBoss(dt);
                updateArrowsAndTraps(dt);
            }
            updateFX(dt); 
            updateCamera(dt); 
            updateUI();
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
        });
        animate();
    </script>
